name: SDMC NKp-v3 stability-edge confirmation

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  confirm-v3-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy numpy pandas

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py

      - name: Expose exact native cs2 diagnostics
        run: python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build hi_class
        run: make -j2 class

      - name: Generate formal NKp-v3 edge point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math, textwrap

          As=math.exp(3.076)/1e10
          Path('output').mkdir(exist_ok=True)
          Path('output/nkp_v3_edge.ini').write_text(textwrap.dedent(f'''\
          H0 = 70.8514
          omega_b = 0.02239952
          omega_cdm = 0.12444227328918850
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = {As:.14e}
          n_s = 0.964
          tau_reio = 0.0544
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_native_noslip
          parameters_smg = 0.072, 5.0, 1.45, 0.1, 0.0001
          expansion_model = sdmc_full
          expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          output_background_smg = 3
          output = tCl,pCl,lCl,mPk
          modes = s
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 6.0
          z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10
          write thermodynamics = yes
          write background = yes
          root = output/nkp_v3_edge_
          format = class
          write parameters = yes
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          lensing_verbose = 0
          output_verbose = 0
          '''))
          PY

      - name: Run formal NKp-v3 edge point
        run: ./class output/nkp_v3_edge.ini

      - name: Generate matched LCDM profile reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          As=math.exp(3.044)/1e10
          p=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {As:.14e}',p)
          p=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',p)
          p=re.sub(r'(?m)^\s*root\s*=.*$','root = output/lcdm_v3_edge_reference_',p)
          Path('output/lcdm_v3_edge_reference.ini').write_text(p)
          PY
          ./class output/lcdm_v3_edge_reference.ini

      - name: Install native Planck 2018 Plik-lite data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          ok=TTTEEE_lite_native.install(path='planck_packages',no_progress_bars=True)
          if not ok:
              raise SystemExit('Planck Plik-lite install failed')
          PY

      - name: Evaluate formal NKp-v3 edge Plik-lite
        run: |
          python3 sdmc/evaluate_planck_pliklite.py \
            --packages planck_packages \
            --output output/nkp_v3_edge_pliklite.csv \
            LCDM_profile_reference=output/lcdm_v3_edge_reference_00_cl_lensed.dat \
            NKp_v3_stability_edge=output/nkp_v3_edge_00_cl_lensed.dat

      - name: Summarize stability and growth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np, pandas as pd, re, math

          def parse_table(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1:',l)][-1].lstrip('#').strip()
              marks=list(re.finditer(r'(\d+)\s*:\s*',hdr)); cols=[]
              for i,m in enumerate(marks):
                  end=marks[i+1].start() if i+1<len(marks) else len(hdr)
                  cols.append(hdr[m.end():end].strip())
              return pd.DataFrame(np.loadtxt(path),columns=cols)

          def sigmaR(path,R=8.0):
              a=np.loadtxt(path); k=a[:,0]; P=a[:,1]; x=k*R
              W=np.ones_like(x); q=x!=0
              W[q]=3*(np.sin(x[q])-x[q]*np.cos(x[q]))/x[q]**3
              integ=k**3*P*W**2/(2*np.pi**2)
              return math.sqrt(np.trapezoid(integ,x=np.log(k)))

          bg=parse_table('output/nkp_v3_edge_00_background.dat').sort_values('z')
          def interp(col,z): return float(np.interp(z,bg.z,bg[col]))
          sub=bg[bg.z<=100]
          zlist=[0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10]
          growth=[]
          for i,z in enumerate(zlist,1):
              s8=sigmaR(f'output/nkp_v3_edge_00_z{i}_pk.dat')
              f=interp('gr.fac. f',z)
              growth.append([z,s8,f,f*s8])
          g=pd.DataFrame(growth,columns=['z','sigma8','f','fsigma8'])
          g.to_csv('output/nkp_v3_edge_growth.csv',index=False)

          summary=pd.DataFrame([{
              'A_F':0.072,'z_c':5.0,'width':1.45,
              'min_cs2num_z100':float(sub.cs2num.min()),
              'min_D_z100':float(sub['kin (D)'].min()),
              'min_cs2_z100':float((sub.cs2num/sub['kin (D)']).min()),
              'F0':interp('M*^2_smg',0),
              'alphaM0':interp('M2_running_smg',0),
              'max_abs_noslip_z100':float(np.max(np.abs(sub.braiding_smg+2*sub.M2_running_smg))),
              'Omega_m0':interp('Omega_m(z)',0),
              'sigma8_0':float(g.loc[g.z==0,'sigma8'].iloc[0]),
              'S8_0':float(g.loc[g.z==0,'sigma8'].iloc[0])*math.sqrt(interp('Omega_m(z)',0)/0.3),
              'fsigma8_0':float(g.loc[g.z==0,'fsigma8'].iloc[0]),
              'fsigma8_05':float(g.loc[g.z==0.5,'fsigma8'].iloc[0]),
              'fsigma8_1':float(g.loc[g.z==1,'fsigma8'].iloc[0])
          }])
          summary.to_csv('output/nkp_v3_edge_summary.csv',index=False)
          print(summary.to_string(index=False))
          print(g.to_string(index=False))
          PY

      - name: Preserve formal NKp-v3 edge outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-nkp-v3-stability-edge-confirmation
          path: |
            output/nkp_v3_edge.ini
            output/nkp_v3_edge_00_*
            output/nkp_v3_edge_pliklite.csv
            output/nkp_v3_edge_growth.csv
            output/nkp_v3_edge_summary.csv
            output/lcdm_v3_edge_reference_00_cl_lensed.dat
          if-no-files-found: warn
