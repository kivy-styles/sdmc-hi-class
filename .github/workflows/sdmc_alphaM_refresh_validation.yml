name: SDMC alphaM refresh validation

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  validate-alphaM-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Apply SDMC runtime patches and alphaM refresh fix
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py

      - name: Build hi_class
        run: make -j2 class

      - name: Run background diagnostics
        run: |
          ./class sdmc/config/kp_split_sector_background_diagnostic.ini
          ./class sdmc/config/nkp_v2_split_sector_background_diagnostic.ini

      - name: Run full Kp split sector
        continue-on-error: true
        run: ./class sdmc/config/kp_core_split_sector.ini > output/sdmc_kp_core_split_sector_refresh.log 2>&1

      - name: Run full NKp-v2 split sector
        continue-on-error: true
        run: ./class sdmc/config/nkp_v2_split_sector.ini > output/sdmc_nkp_v2_split_sector_refresh.log 2>&1

      - name: Audit native cs2 closure and stability
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, math, re

          OUT=Path('output')
          cases=[
              ('Kp_core', OUT/'sdmc_kp_split_bvp_diag_00_background.dat'),
              ('NKp_v2', OUT/'sdmc_nkp_v2_split_bvp_diag_00_background.dat'),
          ]

          def read_bg(path):
              lines=path.read_text().splitlines()
              hdr=[x for x in lines if x.startswith('#') and '1:z' in x][-1].lstrip('#').strip()
              marks=list(re.finditer(r'(\d+)\s*:\s*',hdr))
              names=[]
              for i,m in enumerate(marks):
                  end=marks[i+1].start() if i+1<len(marks) else len(hdr)
                  names.append(hdr[m.end():end].strip())
              rows=[]
              for line in lines:
                  if line.strip() and not line.startswith('#'):
                      vals=[float(v) for v in line.split()]
                      rows.append(dict(zip(names,vals)))
              return rows

          summary=[]
          detailed=[]
          for name,path in cases:
              if not path.exists():
                  summary.append({'case':name,'status':'MISSING_BACKGROUND'})
                  continue
              rows=read_bg(path)
              max_closure=0.0
              minrow=None
              max_noslip=0.0
              for r in rows:
                  z=r['z']; a=1.0/(1.0+z); H=r['H [1/Mpc]']
                  F=r['M*^2_smg']; b=r['braiding_smg']; am=r['M2_running_smg']
                  rs=r['(.)rho_smg']; ps=r['(.)p_smg']
                  rho_wo=r['(.)rho_tot']-rs
                  p_wo=r['(.)p_tot']-ps
                  bp=r['braiding_prime_smg']
                  t1=0.5*(2.0-b)*(b+2.0*am)
                  t2=1.5*(2.0-b)*(rs+ps)/(H*H)
                  t3=-1.5*(2.0-2.0*F+b*F)/F*(rho_wo+p_wo)/(H*H)
                  t4=bp/(a*H)
                  calc=t1+t2+t3+t4
                  err=calc-r['cs2num']
                  max_closure=max(max_closure,abs(err))
                  max_noslip=max(max_noslip,abs(b+2.0*am))
                  rec={
                      'case':name,'z':z,'a':a,'cs2num':r['cs2num'],'D':r['kin (D)'],
                      'cs2':r['c_s^2'],'term_mix':t1,'term_smg_rhop':t2,
                      'term_non_smg':t3,'term_bra_prime':t4,'sum_terms':calc,
                      'closure_error':err,'F':F,'alphaM':am,'alphaB':b,
                      'noslip_residual':b+2.0*am,
                  }
                  detailed.append(rec)
                  if z <= 100.0 and (minrow is None or r['cs2num'] < minrow['cs2num']):
                      minrow=rec
              summary.append({
                  'case':name,'status':'OK','min_cs2num_zlt100':minrow['cs2num'],
                  'z_at_min':minrow['z'],'cs2_at_min':minrow['cs2'],
                  'D_at_min':minrow['D'],'max_abs_closure_error':max_closure,
                  'max_abs_noslip_residual':max_noslip,
              })

          sfields=['case','status','min_cs2num_zlt100','z_at_min','cs2_at_min','D_at_min','max_abs_closure_error','max_abs_noslip_residual']
          with (OUT/'sdmc_alphaM_refresh_summary.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=sfields); w.writeheader()
              for row in summary: w.writerow({k:row.get(k,'') for k in sfields})
          dfields=['case','z','a','cs2num','D','cs2','term_mix','term_smg_rhop','term_non_smg','term_bra_prime','sum_terms','closure_error','F','alphaM','alphaB','noslip_residual']
          with (OUT/'sdmc_alphaM_refresh_terms.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=dfields); w.writeheader(); w.writerows(detailed)

          print('ALPHAM_REFRESH_SUMMARY')
          for row in summary:
              print(row)
          PY

      - name: Preserve alphaM refresh validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-alphaM-refresh-validation
          path: |
            output/sdmc_alphaM_refresh_summary.csv
            output/sdmc_alphaM_refresh_terms.csv
            output/sdmc_kp_split_bvp_diag_*
            output/sdmc_nkp_v2_split_bvp_diag_*
            output/sdmc_kp_core_split_sector_*
            output/sdmc_nkp_v2_split_sector_*
            output/sdmc_kp_core_split_sector_refresh.log
            output/sdmc_nkp_v2_split_sector_refresh.log
          if-no-files-found: warn
