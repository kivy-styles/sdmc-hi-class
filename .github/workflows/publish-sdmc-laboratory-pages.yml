name: Publish SDMC Cosmology Laboratory

on:
  push:
    branches: [master]
    paths:
      - 'docs/SDMC_Late300_Comprehensive_Cosmology_Laboratory.html'
      - '.github/workflows/publish-sdmc-laboratory-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'sdmc-laboratory-pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare standalone application
        shell: bash
        run: |
          mkdir -p public
          cp docs/SDMC_Late300_Comprehensive_Cosmology_Laboratory.html public/index.html
          cp docs/SDMC_Late300_Comprehensive_Cosmology_Laboratory.html public/SDMC_Late300_Comprehensive_Cosmology_Laboratory.html
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy public laboratory
        id: deployment
        uses: actions/deploy-pages@v4
