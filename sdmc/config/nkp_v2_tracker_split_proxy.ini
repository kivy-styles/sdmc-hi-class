# SDMC NKp-v2 two-asymptote tracker background proxy
#
# Background/HyRec diagnostic only.  The lambda_e=20 tracker has
# Omega_phi -> 0.0100 in radiation domination and -> 0.0075 in matter
# domination.  To reproduce that time dependence without yet modifying the
# hi_class background core, represent its homogeneous density by
#   rho_phi ~= [0.0075/(1-0.0075)] rho_m
#            + [0.0100/(1-0.0100)] rho_r.
# The matter-like part is added to omega_cdm and the radiation-like part to
# N_ur.  These are bookkeeping carriers only; no perturbation spectra are
# requested, so this does NOT identify the tracker with CDM or neutrinos.
# YHe is held at the coordinate-control value so the bookkeeping N_ur shift
# changes only the expansion history rather than silently invoking a different
# BBN helium abundance.

H0 = 70.8514
omega_b = 0.02239952
omega_cdm = 0.12555190900673904
N_ncdm = 0
N_ur = 3.121244491539984
T_cmb = 2.7255
YHe = 0.2453

write background = yes
write thermodynamics = yes
root = output/sdmc_nkp_v2_tracker_split_proxy_
format = class
write parameters = yes
input_verbose = 1
background_verbose = 1
thermodynamics_verbose = 1
output_verbose = 1
