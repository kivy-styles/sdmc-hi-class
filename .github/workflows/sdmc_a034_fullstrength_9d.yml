name: SDMC a034 fixed-background full-strength 9D search

on:
  push:
    branches:
      - sdmc-a034-fullstrength-9d
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya
      - name: Planck native-lite
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path="planck_packages",no_progress_bars=True): raise SystemExit(2)
          PY
      - name: Build full SDMC
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean >/dev/null && make -j2 class >/dev/null
      - name: Search
        run: python3 sdmc/run_a034_fullstrength_9d.py
      - name: Print
        if: always()
        run: |
          cat output/a034_fullstrength_9d/a034_9d_summary.json || true
          cat output/a034_fullstrength_9d/a034_9d_promote.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmc-a034-fullstrength-9d
          path: |
            output/a034_fullstrength_9d/a034_9d_scan.csv
            output/a034_fullstrength_9d/a034_9d_promote.csv
            output/a034_fullstrength_9d/a034_9d_pareto.csv
            output/a034_fullstrength_9d/a034_9d_summary.json
          if-no-files-found: warn

      - name: Commit compact result back to analysis branch
        if: success()
        run: |
          mkdir -p sdmc/results/a034_fullstrength_9d
          cp output/a034_fullstrength_9d/a034_9d_summary.json sdmc/results/a034_fullstrength_9d/
          cp output/a034_fullstrength_9d/a034_9d_promote.csv sdmc/results/a034_fullstrength_9d/
          cp output/a034_fullstrength_9d/a034_9d_pareto.csv sdmc/results/a034_fullstrength_9d/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdmc/results/a034_fullstrength_9d
          git commit -m "Store a034 9D search result [skip ci]" || exit 0
          git push origin HEAD:sdmc-a034-fullstrength-9d
