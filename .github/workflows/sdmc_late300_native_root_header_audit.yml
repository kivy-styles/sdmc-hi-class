name: SDMC late300 native root header-aware audit

on:
  push:
    branches: [sdmc-late300-native-root-compare]
    paths:
      - '.github/workflows/sdmc_late300_native_root_header_audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install numpy >/dev/null
      - name: Download successful root artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ep in 1 2; do
            mkdir -p recovered/fast${ep} recovered/slow${ep}
            gh run download 37686831812 --repo "${{ github.repository }}" --name "native-convergence-fast-n${ep}" --dir "recovered/fast${ep}"
            gh run download 37686831812 --repo "${{ github.repository }}" --name "native-convergence-slow-n${ep}" --dir "recovered/slow${ep}"
          done
          mkdir -p output
      - name: Header-aware perturbation comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          import numpy as np

          def parse_header(path):
              lines=Path(path).read_text(errors="replace").splitlines()
              comments=[x for x in lines if x.startswith("#")]
              head=" ".join(comments[-4:])
              ms=list(re.finditer(r"(\d+)\s*:\s*",head))
              names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(head)
                  names.append(re.sub(r"\s+"," ",head[m.end():e].strip(" #")))
              return names,comments[-4:]

          def arr(path):
              a=np.loadtxt(path)
              return a[None,:] if a.ndim==1 else a

          def interp_column(xa, xb, yb):
              # sort because CLASS time coordinates need not be ascending in every output
              o=np.argsort(xb)
              return np.interp(xa,xb[o],yb[o])

          summary={"status":"header-aware fast-vs-slow C3 perturbation comparison","source_run":37686831812,"endpoints":{}}
          for ep in [1,2]:
              fa=sorted(Path(f"recovered/fast{ep}").rglob("*perturbations_k*_s.dat"))
              sl=sorted(Path(f"recovered/slow{ep}").rglob("*perturbations_k*_s.dat"))
              erec={"files":[]}
              for pf,ps in zip(fa,sl):
                  nf,hf=parse_header(pf); ns,hs=parse_header(ps)
                  A=arr(pf); B=arr(ps)
                  xA=A[:,0]; xB=B[:,0]
                  n=min(A.shape[1],B.shape[1],len(nf),len(ns))
                  cols=[]
                  for j in range(1,n):
                      name=nf[j] if nf[j]==ns[j] else f"fast:{nf[j]} | slow:{ns[j]}"
                      aa=A[:,j]; bb=interp_column(xA,xB,B[:,j])
                      peak=max(float(np.max(np.abs(aa))),float(np.max(np.abs(bb))),1e-300)
                      norm=float(np.max(np.abs(aa-bb))/peak)
                      rms=float(np.sqrt(np.mean((aa-bb)**2))/peak)
                      cols.append({"index":j+1,"name":name,"max_norm_abs":norm,"rms_norm":rms})
                  top=sorted(cols,key=lambda x:x["max_norm_abs"],reverse=True)[:15]
                  phys=[x for x in cols if re.search(r"phi|psi|delta|theta|smg|weyl|metric|matter|cdm|bary|rho|velocity|shear",x["name"],re.I)]
                  top_phys=sorted(phys,key=lambda x:x["max_norm_abs"],reverse=True)[:20]
                  erec["files"].append({
                    "file":pf.name,"shape_fast":list(A.shape),"shape_slow":list(B.shape),
                    "headers_match":nf[:n]==ns[:n],"header_tail_fast":hf,
                    "top_all":top,"top_physical":top_phys
                  })
              summary["endpoints"][str(ep)]=erec
          Path("output/native_root_header_audit.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("NATIVE_ROOT_HEADER_AUDIT",json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-root-header-audit
          path: output/native_root_header_audit.json
