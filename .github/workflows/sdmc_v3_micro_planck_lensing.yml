name: SDMC NKp-v3 micro Planck+lensing optimum

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  micro-planck-lensing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy numpy pandas

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build hi_class
        run: make -j2 class

      - name: Install Planck native likelihood data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              ok=cls.install(path='planck_packages',no_progress_bars=True)
              if not ok:
                  raise SystemExit(f'Planck install failed: {cls}')
          PY

      - name: Resolve micro optimum across native stability wall
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, math, re, subprocess, textwrap
          import numpy as np
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          TCMB=2.7255
          CAL_SIGMA=0.0025
          LN_AS=3.076
          AS=math.exp(LN_AS)/1e10
          NS=0.964
          OUT=Path('output/v3_micro_planck_lensing')
          OUT.mkdir(parents=True,exist_ok=True)

          high=TTTEEE_lite_native(packages_path='planck_packages')
          lowT=TT(packages_path='planck_packages')
          lowE=EE(packages_path='planck_packages')
          lens=LensingNative(packages_path='planck_packages')

          ZCS=[4.84,4.86,4.88,4.90,4.92,4.94,4.96]
          A_OFF=[-0.00010,0.0,0.00010,0.00020]
          WIDTHS=[1.426,1.428,1.430,1.432,1.434]
          candidates=[]
          for zc in ZCS:
              Acenter=0.0768-0.0008*zc
              for da in A_OFF:
                  for w in WIDTHS:
                      candidates.append((Acenter+da,zc,w))

          def ini_text(A,zc,w,root,full=False):
              outputs=(
                  'output = tCl,pCl,lCl,mPk\n'
                  'P_k_max_h/Mpc = 6.0\n'
                  'z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10\n'
                  'write background = yes\n'
                  'write thermodynamics = yes\n'
                  'write parameters = yes\n'
                  if full else
                  'output = tCl,pCl,lCl\n'
                  'write background = yes\n'
                  'write thermodynamics = no\n'
                  'write parameters = no\n'
              )
              return textwrap.dedent(f'''\
              H0 = 70.8514
              omega_b = 0.02239952
              omega_cdm = 0.12444227328918850
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = {AS:.14e}
              n_s = {NS:.9f}
              tau_reio = 0.0544
              Omega_Lambda = 0
              Omega_fld = 3.1443554e-8
              fluid_equation_of_state = SDMC_TRACKER
              cs2_fld = 0.003
              use_ppf = no
              Omega_smg = -1
              gravity_model = sdmc_v3_native_noslip
              parameters_smg = {A:.12g}, {zc:.12g}, {w:.12g}, 0.1, 0.0001
              expansion_model = sdmc_full
              expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
              pert_initial_conditions_smg = zero
              method_qs_smg = fully_dynamic
              output_background_smg = 3
              modes = s
              lensing = yes
              l_max_scalars = 3000
              {outputs}root = {root}
              format = class
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          def load(path):
              a=np.loadtxt(path)
              ell=a[:,0].astype(int); n=int(ell.max())+1
              conv=(TCMB*1e6)**2
              tt=np.zeros(n); ee=np.zeros(n); te=np.zeros(n); pp=np.zeros(n)
              tt[ell]=a[:,1]*conv
              ee[ell]=a[:,2]*conv
              te[ell]=a[:,3]*conv
              L=ell.astype(float)
              pp[ell]=a[:,5]*L*(L+1.0)
              harr=np.column_stack([ell,tt[ell],te[ell],ee[ell]])
              return harr,{'tt':tt,'te':te,'ee':ee,'pp':pp}

          def score(path):
              harr,dls=load(path)
              def comp(A):
                  A=float(A)
                  ch=float(high.chi_squared(harr,A_planck=A))
                  ct=float(-2.0*lowT.log_likelihood(dls['tt'],calib=A))
                  ce=float(-2.0*lowE.log_likelihood(dls['ee'],calib=A))
                  lp={lens.calibration_param:A} if getattr(lens,'calibration_param',None) else {}
                  cl=float(-2.0*lens.log_likelihood(dls,**lp))
                  cp=((A-1.0)/CAL_SIGMA)**2
                  return ch,ct,ce,cl,cp,ch+ct+ce+cl+cp
              opt=minimize_scalar(lambda A:comp(A)[-1],bounds=(0.97,1.03),
                                  method='bounded',options={'xatol':1e-10})
              A=float(opt.x)
              return A,*comp(A)

          def bg_diag(path):
              lines=Path(path).read_text().splitlines()
              hdr=[x for x in lines if x.startswith('#') and re.search(r'1\s*:',x)][-1].lstrip('#').strip()
              marks=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(marks):
                  end=marks[i+1].start() if i+1<len(marks) else len(hdr)
                  names.append(hdr[m.end():end].strip())
              a=np.loadtxt(path); d={name:a[:,i] for i,name in enumerate(names)}
              sub=d['z']<=100
              return (float(np.min(d['cs2num'][sub])),
                      float(np.min(d['kin (D)'][sub])),
                      float(np.max(np.abs(d['braiding_smg'][sub]+2*d['M2_running_smg'][sub]))))

          fields=['A_F','z_c','width','ln10As','n_s','status','A_planck',
                  'chi2_high','chi2_lowT','chi2_lowE','chi2_lensing',
                  'chi2_cal_prior','chi2_total','min_cs2num_z100',
                  'min_D_z100','max_abs_noslip_z100','error']
          rows=[]; best=None
          for i,(A,zc,w) in enumerate(candidates,1):
              stem=f'micro_{i:03d}'; root=str(OUT/(stem+'_')); ini=OUT/(stem+'.ini')
              ini.write_text(ini_text(A,zc,w,root,False))
              cp=subprocess.run(['./class',str(ini)],stdout=subprocess.PIPE,
                                stderr=subprocess.STDOUT,text=True,timeout=180)
              cl=Path(root+'00_cl_lensed.dat'); bg=Path(root+'00_background.dat')
              row={'A_F':A,'z_c':zc,'width':w,'ln10As':LN_AS,'n_s':NS,
                   'status':'FAIL','A_planck':'','chi2_high':'','chi2_lowT':'',
                   'chi2_lowE':'','chi2_lensing':'','chi2_cal_prior':'',
                   'chi2_total':'','min_cs2num_z100':'','min_D_z100':'',
                   'max_abs_noslip_z100':'','error':cp.stdout[-1000:]}
              if cp.returncode==0 and cl.exists() and bg.exists():
                  Acal,ch,ct,ce,clens,cpr,total=score(cl)
                  nmin,dmin,nos=bg_diag(bg)
                  row.update({'status':'OK','A_planck':Acal,'chi2_high':ch,
                              'chi2_lowT':ct,'chi2_lowE':ce,'chi2_lensing':clens,
                              'chi2_cal_prior':cpr,'chi2_total':total,
                              'min_cs2num_z100':nmin,'min_D_z100':dmin,
                              'max_abs_noslip_z100':nos,'error':''})
                  print(f'MICRO A={A:.6f} zc={zc:.2f} w={w:.3f} total={total:.6f} '
                        f'high={ch:.3f} lowT={ct:.3f} lens={clens:.3f} nmin={nmin:.3e}',flush=True)
                  if best is None or total<best['chi2_total']:
                      best=dict(row)
              else:
                  print(f'MICRO_FAIL A={A:.6f} zc={zc:.2f} w={w:.3f}',flush=True)
              rows.append(row)
              for p in OUT.glob(stem+'_00_*'):
                  try:p.unlink()
                  except OSError:pass
              try:ini.unlink()
              except OSError:pass

          with (OUT/'sdmc_v3_micro_planck_lensing_scan.csv').open('w',newline='') as f:
              wr=csv.DictWriter(f,fieldnames=fields); wr.writeheader(); wr.writerows(rows)
          if best is None:
              raise SystemExit('No successful micro candidates')
          with (OUT/'sdmc_v3_micro_planck_lensing_best.csv').open('w',newline='') as f:
              wr=csv.DictWriter(f,fieldnames=fields); wr.writeheader(); wr.writerow(best)
          print('BEST_MICRO_PLANCK_LENS',best,flush=True)

          fullroot='output/sdmc_v3_micro_planck_lensing_best_'
          Path('output/sdmc_v3_micro_planck_lensing_best.ini').write_text(
              ini_text(best['A_F'],best['z_c'],best['width'],fullroot,True))
          cp=subprocess.run(['./class','output/sdmc_v3_micro_planck_lensing_best.ini'],
                            stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=300)
          Path('output/sdmc_v3_micro_planck_lensing_best.log').write_text(cp.stdout)
          print('MICRO_FULL_RETURNCODE',cp.returncode,flush=True)
          if cp.returncode: raise SystemExit(cp.returncode)
          PY

      - name: Generate LCDM control and final comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          p=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {math.exp(3.044)/1e10:.14e}',p)
          p=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',p)
          p=re.sub(r'(?m)^\s*root\s*=.*$','root = output/lcdm_micro_planck_lensing_',p)
          Path('output/lcdm_micro_planck_lensing.ini').write_text(p)
          PY
          ./class output/lcdm_micro_planck_lensing.ini
          python3 sdmc/evaluate_planck_native_components.py \
            --packages planck_packages \
            --output output/sdmc_v3_micro_planck_lensing_final.csv \
            LCDM=output/lcdm_micro_planck_lensing_00_cl_lensed.dat \
            NKp_v3_micro_best=output/sdmc_v3_micro_planck_lensing_best_00_cl_lensed.dat

      - name: Preserve micro refinement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-nkp-v3-micro-planck-lensing
          path: |
            output/v3_micro_planck_lensing/*.csv
            output/sdmc_v3_micro_planck_lensing_best.ini
            output/sdmc_v3_micro_planck_lensing_best.log
            output/sdmc_v3_micro_planck_lensing_best_*
            output/lcdm_micro_planck_lensing_00_cl_lensed.dat
            output/sdmc_v3_micro_planck_lensing_final.csv
          if-no-files-found: warn
