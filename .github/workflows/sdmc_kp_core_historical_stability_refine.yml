name: SDMC historical Kp core stability refine

on:
  push:
    branches:
      - sdmc-kp-core-historical-stability-refine
  workflow_dispatch:

jobs:
  kp-historical-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya

      - name: Apply SDMC patches and build
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make -j2 class

      - name: Install Planck native likelihood data
        run: |
          ok=0
          for attempt in 1 2 3 4
          do
            echo "Planck install attempt $attempt"
            rm -rf planck_packages
            if python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(2)
          PY
            then
              ok=1
              break
            fi
            sleep $((attempt*6))
          done
          test "$ok" -eq 1

      - name: Run historical Kp stabilization and structural refinement
        run: python3 sdmc/run_kp_core_historical_stability_refine.py

      - name: Print summary
        if: always()
        run: |
          test ! -f output/kp_core_historical_stability/kp_core_historical_stability_summary.json || cat output/kp_core_historical_stability/kp_core_historical_stability_summary.json
          test ! -f output/kp_core_historical_stability/kp_core_historical_stability_refine.csv || head -20 output/kp_core_historical_stability/kp_core_historical_stability_refine.csv

      - name: Preserve historical Kp refinement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-kp-core-historical-stability-refine
          path: |
            output/kp_core_historical_stability/*.csv
            output/kp_core_historical_stability/*.json
          if-no-files-found: warn
