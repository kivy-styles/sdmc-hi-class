name: SDMC r032 SN-close066 exact three-SN final

on:
  push:
    branches:
      - sdmc-r032-snclose066-sn-final
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-sn-final:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git gh
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas

      - name: Wait for exact Planck and DESI promotions
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh run watch 35786672924 --repo "\${{ github.repository }}" --exit-status
          gh run watch 35786672906 --repo "\${{ github.repository }}" --exit-status

      - name: Download exact promotion artifacts
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          rm -rf input_full input_desi
          mkdir -p input_full input_desi
          gh run download 35786672924 --repo "\${{ github.repository }}" \
            --name sdmc-r032-snclose066-covariant-full-plik-profile --dir input_full
          gh run download 35786672906 --repo "\${{ github.repository }}" \
            --name sdmc-r032-snclose066-exact --dir input_desi
          test -f input_full/fast_fullplik_delta.txt
          test -f input_desi/desi_dr1_fs_summary.csv
          test -f input_desi/desi_cov_00_background.dat

      - name: Install SN covariance products
        run: |
          rm -rf sn_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data

      - name: Score exact candidate and build fair ledger
        run: |
          mkdir -p output/snclose066_sn_final
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          import numpy as np,pandas as pd
          from scipy.linalg import cho_factor,cho_solve

          OUT=Path("output/snclose066_sn_final")
          DATA=Path("sn_data")
          LOCAL_PLANCK=-22.557091181603937
          LOCAL_DESI=-8.59514105435187
          LOCAL_SN={"pantheonplus":1406.2147033223882,
                    "union3":28.783140002196888,
                    "desy5":1650.6353947147727}

          def table(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              return pd.DataFrame(np.loadtxt(path),columns=names).sort_values('z')

          def read_cov(path,n):
              a=np.asarray(np.loadtxt(path),float).reshape(-1)
              if len(a)==n*n+1 and int(round(a[0]))==n:a=a[1:]
              if len(a)!=n*n:raise RuntimeError(f"covariance mismatch {path}")
              return a.reshape(n,n)

          def setup(C):
              cf=cho_factor(C,lower=True,check_finite=False)
              one=np.ones(C.shape[0]); u=cho_solve(cf,one,check_finite=False)
              return cf,one,float(one.dot(u))
          def chi(pack,r):
              cf,one,den=pack; y=cho_solve(cf,r,check_finite=False)
              return float(r.dot(y)-(one.dot(y))**2/den)
          def mu(bg,z,zh):
              DM=np.interp(z,bg.z,bg['comov. dist.']); DA=DM/(1+z)
              return 5*np.log10((1+zh)*(1+z)*DA)

          pp=pd.read_csv(DATA/'PantheonPlus/Pantheon+SH0ES.dat',sep=r'\s+',header=0,engine='python')
          ppm=pp['m_b_corr'].to_numpy(float); ppz=pp['zHD'].to_numpy(float); ppzh=pp['zHEL'].to_numpy(float)
          C=read_cov(DATA/'PantheonPlus/Pantheon+SH0ES_STAT+SYS.cov',len(ppm))
          m=ppz>0.01; ppm,ppz,ppzh,C=ppm[m],ppz[m],ppzh[m],C[np.ix_(m,m)]
          ppp=setup(C)

          p=DATA/'Union3/lcparam_full.txt'
          cols=p.read_text().splitlines()[0].removeprefix('#').split()
          un=pd.read_csv(p,sep=r'\s+',comment='#',names=cols,engine='python')
          cm={c.lower():c for c in un.columns}
          unm=un[cm['mb']].to_numpy(float); unz=un[cm['zcmb']].to_numpy(float)
          unp=setup(read_cov(DATA/'Union3/mag_covmat.txt',len(unm)))

          de=pd.read_csv(DATA/'DESY5/DES-SN5YR_HD.csv'); cm={c.lower():c for c in de.columns}
          dem=de[cm['mu']].to_numpy(float); dez=de[cm['zhd']].to_numpy(float); dezh=de[cm['zhel']].to_numpy(float)
          derr=de[cm['muerr_final']].to_numpy(float)
          dep=setup(read_cov(DATA/'DESY5/covsys_000.txt',len(dem))+np.diag(derr*derr))

          bg=table("input_desi/desi_cov_00_background.dat")
          sn={
            "pantheonplus":chi(ppp,ppm-mu(bg,ppz,ppzh)),
            "union3":chi(unp,unm-mu(bg,unz,unz)),
            "desy5":chi(dep,dem-mu(bg,dez,dezh)),
          }
          planck=float(Path("input_full/fast_fullplik_delta.txt").read_text().strip())
          ds=pd.read_csv("input_desi/desi_dr1_fs_summary.csv")
          desi=float(ds["delta_chi2_cov_minus_lcdm"].iloc[0])
          pd_fair=(planck-LOCAL_PLANCK)+(desi-LOCAL_DESI)
          ledger={
            "candidate":"SN-close066",
            "delta_planck_vs_fixed_reference":planck,
            "delta_desi_vs_fixed_reference":desi,
            "fair_planck_vs_local021":planck-LOCAL_PLANCK,
            "fair_desi_vs_local021":desi-LOCAL_DESI,
            "fair_planck_plus_desi_vs_local021":pd_fair,
            "sn_absolute_chi2":sn,
          }
          for k,v in sn.items():
              ledger[f"fair_sn_{k}_vs_local021"]=v-LOCAL_SN[k]
              ledger[f"fair_pd_plus_{k}_vs_local021"]=pd_fair+v-LOCAL_SN[k]
          joints=[ledger["fair_pd_plus_pantheonplus_vs_local021"],
                  ledger["fair_pd_plus_union3_vs_local021"],
                  ledger["fair_pd_plus_desy5_vs_local021"]]
          ledger["n_sn_joint_closures"]=int(sum(x<0 for x in joints))
          ledger["goal_pass"]=bool(pd_fair<0 and sum(x<0 for x in joints)>=2)
          print("SNCLOSE066_EXACT_FINAL",json.dumps(ledger,sort_keys=True),flush=True)
          (OUT/"snclose066_exact_final.json").write_text(json.dumps(ledger,indent=2))
          pd.DataFrame([ledger]).to_csv(OUT/"snclose066_exact_final.csv",index=False)
          PY

      - name: Preserve exact SN-final ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-snclose066-sn-final
          path: output/snclose066_sn_final/*
          if-no-files-found: warn
