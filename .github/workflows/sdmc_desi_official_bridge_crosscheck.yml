name: SDMC DESI official likelihood bridge cross-check

on:
  push:
    branches:
      - sdmc-desi-dr1-fullshape-crosscheck
  workflow_dispatch:

jobs:
  bridge-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download successful raw-DESI artifact
        uses: actions/download-artifact@v4
        with:
          name: sdmc-desi-dr1-fullshape-gate
          path: previous
          github-token: ${{ github.token }}
          run-id: 35444073670
          repository: ${{ github.repository }}

      - name: Install official DESI stack
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas h5py requests beautifulsoup4 pyyaml camb pyfftw
          python3 -m pip install git+https://github.com/cosmodesi/cosmoprimo.git
          python3 -m pip install git+https://github.com/adematti/lsstypes.git
          python3 -m pip install git+https://github.com/sfschen/velocileptors.git
          git clone --depth 1 https://github.com/cosmodesi/desi-kp-cosmological-likelihoods.git
          mkdir -p desi_likelihood
          python3 - <<'PY'
          import requests
          from pathlib import Path
          base='https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood/'
          names=[
          'likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_BGS_BRIGHT-21.5_GCcomb_z0.1-0.4_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.4-0.6_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.6-0.8_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.8-1.1_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_ELG_LOPnotqso_GCcomb_z1.1-1.6_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_QSO_GCcomb_z0.8-2.1_thetacut0.05.h5',
          ]
          out=Path('desi_likelihood')
          for n in names:
              r=requests.get(base+n,timeout=120); r.raise_for_status()
              (out/n).write_bytes(r.content)
          PY

      - name: Evaluate official likelihood with hi_class bridges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          import sys,re,json
          import numpy as np
          import pandas as pd
          from scipy.interpolate import interp1d
          sys.path.insert(0,'desi-kp-cosmological-likelihoods/dr1/cobaya')
          import lsstypes as types
          from cosmoprimo import PowerSpectrumInterpolator1D,PowerSpectrumBAOFilter,Cosmology
          from cosmoprimo.fiducial import DESI
          from velocileptors.EPT.ept_fullresum_varyDz_nu_fftw import REPT
          from desi_fs_bao_all import (desi_fs_bao_all,list_zrange,dataset_fn,
                                        get_tracer_label)

          OUT=Path('previous')
          C=299792.458
          records=json.loads((OUT/'desi_zeff.json').read_text())
          zvals=[0.0]+sorted({float(r['zeff']) for r in records})
          z_to_i={round(z,8):i+1 for i,z in enumerate(zvals)}

          def tab(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              return pd.DataFrame(np.loadtxt(path),columns=names)

          def rd_from(prefix,bg):
              th=tab(OUT/f'{prefix}_00_thermodynamics.dat').sort_values('z')
              zz=th.z.to_numpy(); kb=th.kappa_b.to_numpy()
              cross=[]
              for i in range(len(zz)-1):
                  if (kb[i]-1.)*(kb[i+1]-1.)<=0 and kb[i]!=kb[i+1]:
                      q=(1.-kb[i])/(kb[i+1]-kb[i])
                      cross.append(zz[i]+q*(zz[i+1]-zz[i]))
              zd=float(cross[0])
              return float(np.interp(zd,bg.z,bg['comov.snd.hrz.']))

          def model_data(prefix,H0,ob,oc,ns):
              h=H0/100.; fb=ob/(ob+oc); fc=1.-fb
              bg=tab(OUT/f'{prefix}_00_background.dat').sort_values('z')
              rd=rd_from(prefix,bg); series={}
              for z in zvals:
                  ii=z_to_i[round(z,8)]
                  pk=np.loadtxt(OUT/f'{prefix}_00_z{ii}_pk.dat')
                  tk=tab(OUT/f'{prefix}_00_z{ii}_tk.dat')
                  kh=tk['k (h/Mpc)'].to_numpy()
                  dm=tk['d_m'].to_numpy(); tb=tk['t_b'].to_numpy()
                  hp=tk['h_prime'].to_numpy(); ep=tk['eta_prime'].to_numpy()
                  shift=.5*(hp+6.*ep)
                  a=1./(1.+z); H=float(np.interp(z,bg.z,bg['H [1/Mpc]'])); Hc=a*H
                  theta_b=tb+shift; theta_c=shift
                  vcb=fb*(-theta_b/Hc)+fc*(-theta_c/Hc)
                  rv=np.divide(vcb,dm,out=np.zeros_like(vcb),where=np.abs(dm)>1e-300)
                  kpk=pk[:,0]; Pdd=pk[:,1]
                  Ptt=Pdd*np.interp(kpk,kh,rv)**2
                  series[z]=(kpk,Pdd,Ptt)
              return dict(H0=H0,h=h,ob=ob,oc=oc,ns=ns,bg=bg,rd=rd,series=series)

          cov=model_data('desi_cov',70.8514,0.02239952,0.12444227328918850,0.964)
          lcdm=model_data('desi_lcdm',67.36,0.02237,0.1200,0.9649)

          zbins=[]; flatdata=[]; windows=[]; precision=[]; shotnoise=[]; blocks=[]
          for tracer,iz,zrange in list_zrange:
              if 'lya' in tracer.lower(): continue
              name=f'{get_tracer_label(tracer)}_z{iz}'
              fn=dataset_fn('desi_likelihood',tracer,zrange,observable_name='spectrum-poles-rotated')
              d=types.read(fn)
              sp=d.observable.get('spectrum')
              theory=d.window.theory.get('spectrum')
              kin=np.asarray(theory.get(0).coords('k'),float)
              win=d.window.at.observable.get('spectrum').at.theory.get('spectrum').value()
              zbins.append((tracer,zrange,name)); flatdata.append(sp.value())
              windows.append(win); precision.append(np.linalg.inv(d.covariance.value()))
              shotnoise.append(float(np.mean(sp.get(0).values('shotnoise'))))
              blocks.append(dict(tracer=tracer,namespace=name,zeff=float(sp.attrs['zeff']),kin=kin))
          kobs=blocks[0]['kin']
          fid=DESI(engine='camb')

          def prepare(m):
              kin=np.geomspace(min(5e-4,kobs[0]/2),max(1.0,kobs[-1]*2),500)
              zs=np.array([b['zeff'] for b in blocks],float)
              Pdd=np.stack([np.interp(kin,m['series'][z][0],m['series'][z][1]) for z in zs],axis=-1)
              Ptt=np.stack([np.interp(kin,m['series'][z][0],m['series'][z][2]) for z in zs],axis=-1)
              pki=PowerSpectrumInterpolator1D(kin,Pdd)
              cosmo=Cosmology(n_s=m['ns'],Omega_b=m['ob']/m['h']**2,
                              Omega_cdm=m['oc']/m['h']**2,Omega_ncdm=0.,H0=m['H0'])
              cosmo.rs_drag=m['rd']*m['h']
              pkfid=fid.get_fourier().pk_interpolator(of='delta_cb').to_1d(z=zs)
              filt=PowerSpectrumBAOFilter(pkfid,engine='peakaverage',cosmo=fid,cosmo_fid=fid)
              filt(pki,cosmo=cosmo)
              Pnw=filt.smooth_pk_interpolator()(kin)
              sig8=np.asarray(pki.sigma8())
              ptti=PowerSpectrumInterpolator1D(kin,Ptt); fs8=np.asarray(ptti.sigma8())
              pt=REPT(kin,Pdd[:,0],pnw=Pnw[:,0],kmin=kobs[0],kmax=kobs[-1],
                      nk=200,rbao=110,sbao=None,beyond_gauss=True,one_loop=True,
                      shear=True,cutoff=20,jn=5,N=4000,threads=2,
                      extrap_min=-4,extrap_max=3,import_wisdom=False)
              extk=np.append(pt.kv,1.)
              def li(a):
                  return 10**interp1d(np.log10(kin),np.log10(np.maximum(a,1e-300)),
                                     kind='cubic',fill_value='extrapolate',axis=0,
                                     assume_sorted=True)(np.log10(extk))
              pcb,pnw,ptt=li(Pdd),li(Pnw),li(Ptt)
              tables={}
              for iz,b in enumerate(blocks):
                  z=b['zeff']
                  Hkms=float(np.interp(z,m['bg'].z,m['bg']['H [1/Mpc]']))*C
                  DA=float(np.interp(z,m['bg'].z,m['bg']['comov. dist.']))/(1.+z)
                  qpar=float(fid.efunc(z)/(Hkms/(100.*m['h'])))
                  qper=float(DA*m['h']/fid.angular_diameter_distance(z))
                  Dz=float(np.sqrt(pcb[-1,iz]/pcb[-1,0]))
                  fk=np.sqrt(np.maximum(ptt[:-1,iz]/pcb[:-1,iz],0.))
                  pks=pt.compute_redshift_space_power_multipoles_tables(
                      fk,apar=qpar,aperp=qper,ngauss=4,
                      pcb=pcb[:-1,iz],pcb_nw=pnw[:-1,iz],Dz=Dz)[1:]
                  basis=np.stack([interp1d(pt.kv,pks[j],kind='cubic',fill_value='extrapolate',
                                           axis=0,assume_sorted=True)(kobs) for j in range(3)])
                  tables[round(z,8)]=dict(basis=basis,sigma8=float(sig8[iz]),fsigma8=float(fs8[iz]))
              return tables

          class Provider:
              def __init__(self,tables): self.tables=tables
              def get_pkpoles(self,params,z=None,sigv=15.,fsat=.1,sn=1e4,return_gradient=False):
                  info=self.tables[round(float(z),8)]
                  pktable=info['basis']; sigma8=info['sigma8']; f=info['fsigma8']/sigma8
                  b1L=params['b1p']/sigma8-1.; b2L=params['b2p']/sigma8**2
                  bsL=params['bsp']/sigma8**2; b3L=params['b3p']/sigma8**3
                  b1=1+b1L; b2=8/21*b1L+b2L; bs=bsL-2/7*b1L; b3=3*b3L+b1L
                  grad=np.zeros((7,7))
                  grad[0,0]=b1*b1; grad[1,0]=grad[1,1]=f*b1
                  grad[2,1]=f*f; grad[2,2]=f*b1; grad[3,2]=f*f
                  for jj,pole in enumerate([0,2,4]):
                      grad[jj-3,jj-3]=sn*(fsat if pole>0 else 1.)*sigv**pole
                  pars=[1,b1,b1*b1,b2,b1*b2,b2*b2,bs,b1*bs,b2*bs,bs*bs,b3,b1*b3]
                  pars=np.concatenate([pars,grad.dot(np.zeros(7))])
                  poles=np.sum(pktable*pars,axis=-1)
                  if return_gradient: return poles,pktable[...,-7:].dot(grad)
                  return poles

          profiles=pd.read_csv(OUT/'desi_dr1_fs_profile.csv')
          def official_eval(label,m):
              like=SimpleNamespace(zbins=zbins,flatdata=flatdata,window=windows,
                                   precision=precision,shotnoise=shotnoise,
                                   observable_name='spectrum-poles-rotated',solve='marg',
                                   provider=Provider(prepare(m)))
              params={}
              sub=profiles[profiles.model==label]
              for _,r in sub.iterrows():
                  ns=r['namespace']
                  params[f'pre_{ns}.b1p']=float(r.b1p)
                  params[f'pre_{ns}.b2p']=float(r.b2p)
                  params[f'pre_{ns}.bsp']=float(r.bsp)
                  params[f'pre_{ns}.b3p']=0.
              logp=float(desi_fs_bao_all.logp(like,**params))
              prior=sum((params[f'pre_{r.namespace}.b2p']/5.)**2+
                        (params[f'pre_{r.namespace}.bsp']/5.)**2 for _,r in sub.iterrows())
              obj=-2*logp+prior
              standalone=float(sub.chi2_profile.sum())
              return dict(model=label,official_logp=logp,bias_prior_chi2=prior,
                          official_objective=obj,standalone_objective=standalone,
                          difference=obj-standalone)
          out=[official_eval('COVARIANT',cov),official_eval('LCDM',lcdm)]
          delta=out[0]['official_objective']-out[1]['official_objective']
          print('DESI_OFFICIAL_BRIDGE_RESULTS',out,flush=True)
          print('DESI_OFFICIAL_BRIDGE_DELTA_CHI2_COV_MINUS_LCDM',delta,flush=True)
          Path('desi_official_bridge_crosscheck.json').write_text(json.dumps({'results':out,'delta':delta},indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desi-official-bridge-crosscheck
          path: desi_official_bridge_crosscheck.json
          if-no-files-found: warn
