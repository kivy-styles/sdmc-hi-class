name: SDMC late300 nonlinear Weyl screening bracket

on:
  push:
    branches:
      - sdmc-late300-weyl-screening-bracket
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bracket:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy
      - name: Download validated Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}" \
            --name late300-desy3-native-weyl-tomography --dir output
          test -d output/weyl_spectra
      - name: Download public DES-Y3 data
        run: |
          rm -rf des_y3_data
          git clone --depth 1 https://github.com/handley-lab/des_y3_data.git
          cd des_y3_data
          git lfs pull || true
          cd ..
          test -s des_y3_data/likelihood/des-y3/2pt_NG_final_2ptunblind_02_24_21_wnz_covupdate.v2.fits
      - name: Run nonlinear screening-response bracket
        run: |
          python3 sdmc/run_late300_weyl_screening_bracket.py | tee output/weyl_screening_bracket.log
          cat output/weyl_screening_bracket/late300_weyl_screening_bracket.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late300-weyl-screening-bracket
          path: |
            output/weyl_screening_bracket/*
            output/weyl_screening_bracket.log
          if-no-files-found: warn
