name: SDMC full Plik nuisance refinement

on:
  push:
    branches:
      - sdmc-fullplik-refine
  workflow_dispatch:

jobs:
  refine-full-plik:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install optimization and Planck dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas iminuit cobaya

      - name: Download validated spectra artifact
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          mkdir -p previous
          gh run download 35442100439 \
            --repo "$GITHUB_REPOSITORY" \
            --name sdmc-covariant-observable-gate \
            --dir previous
          find previous -maxdepth 3 -type f | sort | head -100

      - name: Install Planck likelihoods
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE import TTTEEE
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          assert TTTEEE.install(path='planck_full',no_progress_bars=True)
          for cls in (TT,EE,LensingNative):
              assert cls.install(path='planck_packages',no_progress_bars=True)
          PY

      - name: Refine full Plik nuisance profiles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv
          import numpy as np
          import pandas as pd
          from scipy.optimize import minimize
          from iminuit import Minuit
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE import TTTEEE
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          TCMB=2.7255
          high=TTTEEE(packages_path='planck_full')
          lowT=TT(packages_path='planck_packages')
          lowE=EE(packages_path='planck_packages')
          lens=LensingNative(packages_path='planck_packages')

          def locate(name):
              hits=list(Path('previous').rglob(name))
              if len(hits)!=1:
                  raise RuntimeError(f'{name}: found {hits}')
              return hits[0]

          cov_path=locate('covariant_observable_00_cl_lensed.dat')
          lcdm_path=locate('fullplik_lcdm_00_cl_lensed.dat')
          starts=pd.read_csv(locate('fullplik_profile.csv')).set_index('model')

          fixed={
            'cib_index':-1.3,'galf_TE_index':-2.4,'galf_EE_index':-2.4,
            'A_sbpx_100_100_TT':1.0,'A_sbpx_143_143_TT':1.0,
            'A_sbpx_143_217_TT':1.0,'A_sbpx_217_217_TT':1.0,
            'galf_EE_A_100':0.055,'galf_EE_A_100_143':0.040,
            'galf_EE_A_100_217':0.094,'galf_EE_A_143':0.086,
            'galf_EE_A_143_217':0.21,'galf_EE_A_217':0.70,
            'A_cnoise_e2e_100_100_EE':1.0,'A_cnoise_e2e_143_143_EE':1.0,
            'A_cnoise_e2e_217_217_EE':1.0,
            'A_sbpx_100_100_EE':1.0,'A_sbpx_100_143_EE':1.0,
            'A_sbpx_100_217_EE':1.0,'A_sbpx_143_143_EE':1.0,
            'A_sbpx_143_217_EE':1.0,'A_sbpx_217_217_EE':1.0,
            'A_pol':1.0,'calib_100P':1.021,'calib_143P':0.966,'calib_217P':1.040,
          }
          names=[
            'A_planck','calib_100T','calib_217T','A_cib_217','xi_sz_cib',
            'A_sz','ksz_norm','gal545_A_100','gal545_A_143',
            'gal545_A_143_217','gal545_A_217','ps_A_100_100',
            'ps_A_143_143','ps_A_143_217','ps_A_217_217',
            'galf_TE_A_100','galf_TE_A_100_143','galf_TE_A_100_217',
            'galf_TE_A_143','galf_TE_A_143_217','galf_TE_A_217'
          ]
          bounds=[
            (.97,1.03),(1.0002-8*.0007,1.0002+8*.0007),
            (.99805-8*.00065,.99805+8*.00065),(0,200),(0,1),(0,10),(0,10),
            (8.6-16,8.6+16),(10.6-16,10.6+16),(23.5-68,23.5+68),
            (91.9-160,91.9+160),(0,400),(0,400),(0,400),(0,400),
            (.130-8*.042,.130+8*.042),(.130-8*.036,.130+8*.036),
            (.46-8*.09,.46+8*.09),(.207-8*.072,.207+8*.072),
            (.69-8*.09,.69+8*.09),(1.938-8*.54,1.938+8*.54)
          ]
          gauss={
            'A_planck':(1.,.0025),'calib_100T':(1.0002,.0007),
            'calib_217T':(.99805,.00065),'gal545_A_100':(8.6,2.),
            'gal545_A_143':(10.6,2.),'gal545_A_143_217':(23.5,8.5),
            'gal545_A_217':(91.9,20.),'galf_TE_A_100':(.130,.042),
            'galf_TE_A_100_143':(.130,.036),'galf_TE_A_100_217':(.46,.09),
            'galf_TE_A_143':(.207,.072),'galf_TE_A_143_217':(.69,.09),
            'galf_TE_A_217':(1.938,.54)
          }
          if set(high.expected_params)!=(set(fixed)|set(names)):
              raise RuntimeError('full Plik nuisance parameter set changed')

          def load(path):
              a=np.loadtxt(path); ell=a[:,0].astype(int); n=int(ell.max())+1
              conv=(TCMB*1e6)**2
              dl={k:np.zeros(n) for k in ['tt','ee','bb','te','pp','tp','ep']}
              dl['tt'][ell]=a[:,1]*conv; dl['ee'][ell]=a[:,2]*conv
              dl['te'][ell]=a[:,3]*conv; dl['bb'][ell]=a[:,4]*conv
              ll=ell.astype(float)*(ell.astype(float)+1.)
              dl['pp'][ell]=a[:,5]*ll
              dl['tp'][ell]=a[:,6]*np.sqrt(ll)*(TCMB*1e6)
              dl['ep'][ell]=a[:,7]*np.sqrt(ll)*(TCMB*1e6)
              cl={k:np.zeros(n) for k in ['tt','ee','bb','te']}
              q=ell>=2; fac=np.zeros_like(ll); fac[q]=2*np.pi/ll[q]
              for k in cl: cl[k][ell]=dl[k][ell]*fac
              return cl,dl

          def prior_chi2(p):
              ans=sum(((p[k]-mu)/sig)**2 for k,(mu,sig) in gauss.items())
              ans+=((p['ksz_norm']+1.6*p['A_sz']-9.5)/3.)**2
              return float(ans)

          def make_objective(path):
              cl,dl=load(path); counter=[0]
              def obj(x):
                  p=dict(fixed); p.update({k:float(v) for k,v in zip(names,x)})
                  counter[0]+=1
                  lh=float(high.log_likelihood(cl,**p))
                  if not np.isfinite(lh): return 1e30
                  A=p['A_planck']
                  lt=float(lowT.log_likelihood(dl['tt'],calib=A))
                  le=float(lowE.log_likelihood(dl['ee'],calib=A))
                  lp={lens.calibration_param:A} if getattr(lens,'calibration_param',None) else {}
                  ll=float(lens.log_likelihood(dl,**lp))
                  if not all(np.isfinite([lt,le,ll])): return 1e30
                  return float(-2*(lh+lt+le+ll)+prior_chi2(p))
              return obj,cl,dl,counter

          def components(x,cl,dl,label,method,valid):
              p=dict(fixed); p.update({k:float(v) for k,v in zip(names,x)})
              lh=float(high.log_likelihood(cl,**p)); A=p['A_planck']
              lt=float(lowT.log_likelihood(dl['tt'],calib=A))
              le=float(lowE.log_likelihood(dl['ee'],calib=A))
              lp={lens.calibration_param:A} if getattr(lens,'calibration_param',None) else {}
              ll=float(lens.log_likelihood(dl,**lp))
              row={'model':label,'method':method,'optimizer_valid':bool(valid),
                   'chi2_profile_total':float(-2*(lh+lt+le+ll)+prior_chi2(p)),
                   'chi2_high_full':-2*lh,'chi2_lowT':-2*lt,'chi2_lowE':-2*le,
                   'chi2_lensing':-2*ll,'chi2_nuisance_priors':prior_chi2(p)}
              row.update({n:p[n] for n in names})
              return row

          def refine(label,path):
              obj,cl,dl,counter=make_objective(path)
              x0=np.array([float(starts.loc[label,n]) for n in names])
              candidates=[('previous',x0,float(obj(x0)),True)]

              lb=minimize(obj,x0,method='L-BFGS-B',bounds=bounds,
                          options={'maxiter':1000,'ftol':1e-12,'gtol':3e-6,'maxls':50})
              print('REFINE_LBFGS',label,lb.fun,lb.success,lb.message,lb.nfev,flush=True)
              candidates.append(('lbfgs',np.asarray(lb.x),float(lb.fun),bool(lb.success)))

              seed=min(candidates,key=lambda x:x[2])[1]
              def fcn(*args): return obj(np.asarray(args,float))
              m=Minuit(fcn,*seed,name=tuple(names))
              m.errordef=1.0; m.strategy=1
              for n,b in zip(names,bounds): m.limits[n]=b
              for n in names: m.errors[n]=max(abs(float(m.values[n]))*1e-3,1e-4)
              for n in ['A_planck','calib_100T','calib_217T']: m.errors[n]=2e-4
              m.migrad(ncall=50000,iterate=7)
              xm=np.array([m.values[n] for n in names],float); fm=float(obj(xm))
              print('REFINE_MINUIT',label,fm,m.valid,'nfcn',m.nfcn,flush=True)
              candidates.append(('minuit',xm,fm,bool(m.valid)))

              method,xbest,fbest,valid=min(candidates,key=lambda x:x[2])
              row=components(xbest,cl,dl,label,method,valid)
              row['objective_check']=fbest; row['evals_total']=counter[0]
              print('REFINED_FULL_PLIK_RESULT',row,flush=True)
              return row

          cov=refine('COVARIANT',cov_path)
          lcdm=refine('LCDM',lcdm_path)
          delta=cov['chi2_profile_total']-lcdm['chi2_profile_total']
          print('REFINED_FULL_PLIK_DELTA_CHI2_COV_MINUS_LCDM',delta,flush=True)
          rows=[cov,lcdm]; fields=list(rows[0].keys())
          with Path('refined_fullplik_profile.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          Path('refined_fullplik_delta.txt').write_text(f'{delta:.12g}\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-full-plik-profile
          path: |
            refined_fullplik_profile.csv
            refined_fullplik_delta.txt
