name: SDMC HSC local021 TATT warm-start refinement

on:
  push:
    branches: [sdmc-hsc-tatt-refine2-local021]
    paths:
      - 'sdmc/run_late300_hsc_tatt_warmstart.py'
      - '.github/workflows/sdmc_late300_hsc_tatt_warmstart.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  warm-refit:
    strategy:
      fail-fast: false
      matrix:
        model: [local021]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy sacc
          python3 -m pip install "git+https://github.com/joezuntz/FAST-PT/"
      - name: Recover exact linear Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}" --name late300-desy3-native-weyl-tomography --dir output
          test -d output/weyl_spectra
      - name: Recover corrected ReACT bracket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/react_dense
          gh run download 37604828408 --repo "${{ github.repository }}" --name late300-react-exact-bracket --dir output/react_dense
          test -s output/react_dense/react_late300/late300_react_target_spectrum.npz
      - name: Recover completed NLA and conditional-TATT optima
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p warm_inputs/nla/${{ matrix.model }} warm_inputs/conditional/${{ matrix.model }}
          if [ "${{ matrix.model }}" = "late300" ]; then
            gh run download 37631035746 --repo "${{ github.repository }}" --name hsc-react-full-late300-us_native-retry --dir warm_inputs/nla/late300
          else
            gh run download 37615217739 --repo "${{ github.repository }}" --name hsc-react-full-local021-us_native --dir warm_inputs/nla/local021
          fi
          gh run download 37645312182 --repo "${{ github.repository }}" --name hsc-tatt-conditional-${{ matrix.model }} --dir warm_inputs/conditional/${{ matrix.model }}
          find warm_inputs -type f -maxdepth 6 -print
      - name: Download HSC-Y3 public products
        run: |
          rm -rf cosmosis-standard-library
          git clone --depth 1 https://github.com/cosmosis-developers/cosmosis-standard-library.git
          cd cosmosis-standard-library && git lfs pull || true
          cd ..
      - name: Run warm-start full TATT refinement
        run: |
          python3 sdmc/run_late300_hsc_tatt_warmstart.py "${{ matrix.model }}" | tee "output/hsc_tatt_warm_${{ matrix.model }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsc-tatt-warm-${{ matrix.model }}
          path: |
            output/hsc_tatt_warm/*
            output/hsc_tatt_warm_${{ matrix.model }}.log
          if-no-files-found: warn
