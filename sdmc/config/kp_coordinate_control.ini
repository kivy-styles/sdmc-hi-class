# SDMC Kp coordinate-control Boltzmann run
# Purpose: isolate the exact CLASS TT/TE/EE response of the frozen Kp
# physical matter coordinate before adding the SDMC tracker, No-Slip sector,
# or terminal reciprocal-acoustic operator.

H0 = 70.8514
omega_b = 0.02239952
omega_cdm = 0.12000047526014168
N_ncdm = 0
N_ur = 3.046
T_cmb = 2.7255
YHe = BBN

A_s = 2.10e-9
n_s = 0.965
tau_reio = 0.0544

output = tCl,pCl,lCl
modes = s
lensing = yes
l_max_scalars = 3000

root = output/sdmc_kp_coordinate_
format = class
write parameters = yes
input_verbose = 1
background_verbose = 1
thermodynamics_verbose = 0
perturbations_verbose = 0
spectra_verbose = 0
lensing_verbose = 0
output_verbose = 1
