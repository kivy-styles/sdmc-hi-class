name: SDMC v2 native primordial profile

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  profile-v2-native-primordial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy

      - name: Apply frozen SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py

      - name: Reuse native-exact No-Slip experimental patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          lines=Path('.github/workflows/sdmc_v2_native_noslip_scan.yml').read_text().splitlines()
          marker='- name: Add native-exact No-Slip profile family'
          i=next(i for i,x in enumerate(lines) if marker in x)
          h=next(i for i in range(i+1,len(lines)) if "python3 - <<'PY'" in lines[i])
          j=next(i for i in range(h+1,len(lines)) if lines[i].strip()=='PY')
          code=textwrap.dedent('\n'.join(lines[h+1:j]))
          exec(compile(code,'native_patch','exec'),{})
          PY

      - name: Build hi_class
        run: make -j2 class

      - name: Install native Planck 2018 Plik-lite data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          ok=TTTEEE_lite_native.install(path='planck_packages',no_progress_bars=True)
          if not ok:
              raise SystemExit('Planck Plik-lite install failed')
          PY

      - name: Profile primordial amplitude and tilt on native-stable v2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, math, os, subprocess, textwrap
          import numpy as np
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native

          TCMB=2.7255
          CAL_SIGMA=0.0025
          OUT=Path('output/v2_native_primordial')
          OUT.mkdir(parents=True,exist_ok=True)
          LN_AS=[3.052,3.058,3.064,3.070,3.076,3.082,3.088]
          NS=[0.970,0.974,0.978,0.982,0.986,0.990,0.994]
          lik=TTTEEE_lite_native(packages_path='planck_packages')

          def ini_text(As,ns,root,full=False):
              outputs=('output = tCl,pCl,lCl,mPk\nP_k_max_h/Mpc = 2.0\nz_pk = 0,0.5,1,2,3,5,10\nwrite background = yes\nwrite thermodynamics = yes\nwrite parameters = yes\n' if full else 'output = tCl,pCl,lCl\nwrite background = no\nwrite thermodynamics = no\nwrite parameters = no\n')
              return textwrap.dedent(f'''\
              H0 = 70.8514
              omega_b = 0.02239952
              omega_cdm = 0.12444227328918850
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = {As:.14e}
              n_s = {ns:.9f}
              tau_reio = 0.0544
              Omega_Lambda = 0
              Omega_fld = 3.1443554e-8
              fluid_equation_of_state = SDMC_TRACKER
              cs2_fld = 0.003
              use_ppf = no
              Omega_smg = -1
              gravity_model = sdmc_v2_native_noslip
              parameters_smg = 0.068, 10.0, 1.6, 0.1, 0.0001
              expansion_model = sdmc_full
              expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
              pert_initial_conditions_smg = zero
              method_qs_smg = fully_dynamic
              output_background_smg = 1
              modes = s
              lensing = yes
              l_max_scalars = 3000
              {outputs}root = {root}
              format = class
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          def load_cl(path):
              a=np.loadtxt(path)
              conv=(TCMB*1e6)**2
              return np.column_stack([a[:,0],a[:,1]*conv,a[:,3]*conv,a[:,2]*conv])

          def score(cl):
              def like(A):
                  return float(lik.chi_squared(cl,A_planck=float(A)))
              def total(A):
                  A=float(A)
                  return like(A)+((A-1.0)/CAL_SIGMA)**2
              opt=minimize_scalar(total,bounds=(0.96,1.04),method='bounded',options={'xatol':1e-10})
              A=float(opt.x); c_like=like(A); c_prior=((A-1.0)/CAL_SIGMA)**2
              return A,c_like,c_prior,c_like+c_prior

          rows=[]; best=None; counter=0
          for lnAs in LN_AS:
              As=math.exp(lnAs)/1e10
              for ns in NS:
                  counter+=1
                  stem=f'v2p_{counter:03d}'
                  root=str(OUT/(stem+'_'))
                  ini=OUT/(stem+'.ini')
                  ini.write_text(ini_text(As,ns,root,False))
                  cp=subprocess.run(['./class',str(ini)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
                  cl=Path(root+'00_cl_lensed.dat')
                  if cp.returncode!=0 or not cl.exists():
                      rows.append({'ln10As':lnAs,'A_s':As,'n_s':ns,'status':'FAIL','A_planck':'','chi2_like':'','chi2_cal_prior':'','chi2_total':'','error':cp.stdout[-1200:]})
                      print('FAIL',lnAs,ns,cp.returncode,flush=True)
                  else:
                      Acal,clike,cprior,ctot=score(load_cl(cl))
                      row={'ln10As':lnAs,'A_s':As,'n_s':ns,'status':'OK','A_planck':Acal,'chi2_like':clike,'chi2_cal_prior':cprior,'chi2_total':ctot,'error':''}
                      rows.append(row)
                      print(f'V2_PRIM ln10As={lnAs:.3f} ns={ns:.3f} chi2={ctot:.6f} Acal={Acal:.8f}',flush=True)
                      if best is None or ctot<best['chi2_total']:
                          best=dict(row)
                          (OUT/'best_grid_cl_lensed.dat').write_bytes(cl.read_bytes())
                  for p in OUT.glob(stem+'_00_*'):
                      try: p.unlink()
                      except OSError: pass
                  try: ini.unlink()
                  except OSError: pass

          fields=['ln10As','A_s','n_s','status','A_planck','chi2_like','chi2_cal_prior','chi2_total','error']
          with (OUT/'sdmc_v2_native_primordial_grid.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          if best is None:
              raise SystemExit('No successful primordial grid point')
          with (OUT/'sdmc_v2_native_primordial_best.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerow(best)

          best_root='output/sdmc_v2_native_primordial_best_'
          Path('output/sdmc_v2_native_primordial_best.ini').write_text(ini_text(float(best['A_s']),float(best['n_s']),best_root,True))
          cp=subprocess.run(['./class','output/sdmc_v2_native_primordial_best.ini'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=240)
          Path('output/sdmc_v2_native_primordial_best.log').write_text(cp.stdout)
          if cp.returncode:
              raise SystemExit(cp.returncode)
          print('BEST_V2_NATIVE_PRIMORDIAL',best,flush=True)
          PY

      - name: Generate matched LCDM primordial-profile reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          As=math.exp(3.044)/1e10
          p=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {As:.14e}',p)
          p=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',p)
          p=re.sub(r'(?m)^\s*root\s*=.*$','root = output/sdmc_planck_lcdm_profile_reference_',p)
          Path('output/sdmc_planck_lcdm_profile_reference.ini').write_text(p)
          PY
          ./class output/sdmc_planck_lcdm_profile_reference.ini

      - name: Evaluate final high-l TTTEEE comparison
        run: |
          python3 sdmc/evaluate_planck_pliklite.py \
            --packages planck_packages \
            --output output/sdmc_v2_native_primordial_pliklite.csv \
            LCDM_profile_reference=output/sdmc_planck_lcdm_profile_reference_00_cl_lensed.dat \
            V2_native_primordial_best=output/sdmc_v2_native_primordial_best_00_cl_lensed.dat

      - name: Preserve primordial profile outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-v2-native-primordial-profile
          path: |
            output/v2_native_primordial/sdmc_v2_native_primordial_grid.csv
            output/v2_native_primordial/sdmc_v2_native_primordial_best.csv
            output/v2_native_primordial/best_grid_cl_lensed.dat
            output/sdmc_v2_native_primordial_best.ini
            output/sdmc_v2_native_primordial_best.log
            output/sdmc_v2_native_primordial_best_*
            output/sdmc_planck_lcdm_profile_reference_00_cl_lensed.dat
            output/sdmc_v2_native_primordial_pliklite.csv
          if-no-files-found: warn
