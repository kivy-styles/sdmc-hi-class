name: SDMC Planck primordial profile

on:
  push:
    branches:
      - sdmc-boltzmann

jobs:
  planck-primordial-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy

      - name: Install native Planck Plik-lite data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          ok = TTTEEE_lite_native.install(path="planck_packages", no_progress_bars=True)
          if not ok:
              raise SystemExit("Planck Plik-lite data installation failed")
          PY

      - name: Apply exact tracker source patch
        run: python3 sdmc/apply_sdmc_tracker_patch.py

      - name: Build hi_class
        run: make -j2 class

      - name: Profile primordial amplitude and tilt
        run: |
          python3 sdmc/profile_planck_primordial_grid.py \
            --packages planck_packages \
            --output output/sdmc_planck_primordial_grid.csv \
            --best-output output/sdmc_planck_primordial_best.csv \
            LCDM_control=sdmc/config/planck_lcdm_control.ini \
            Kp_tracker_clustered=sdmc/config/kp_tracker_clustered_cs0003.ini \
            NKp_v2_tracker_clustered=sdmc/config/nkp_v2_tracker_clustered_cs0003.ini

      - name: Preserve profile outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-planck-primordial-profile
          path: |
            output/sdmc_planck_primordial_grid.csv
            output/sdmc_planck_primordial_best.csv
            output/planck_primordial_grid/best_*_cl_lensed.dat
          if-no-files-found: warn
