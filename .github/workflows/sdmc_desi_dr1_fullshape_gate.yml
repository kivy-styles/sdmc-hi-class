name: SDMC r032 direct covariant DESI full-shape gate

on:
  push:
    branches:
      - sdmc-r032-l18p25-z19p2-covariant-desi
  workflow_dispatch:

jobs:
  covariant-independent-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya

      - name: Apply SDMC parameterized patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build target parameterized hi_class
        run: make -j2 class

      - name: Generate the fixed NKp-v3 target background
        run: |
          mkdir -p output
          cat > output/covariant_target.ini <<'EOF'
          H0 = 70.8514
          omega_b = 0.02239952
          omega_cdm = 0.12444227328918850
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_native_noslip
          parameters_smg = 0.0715, 5.00, 1.426, 0.1, 0.0001
          expansion_model = sdmc_full
          expansion_smg = 0.7073985893, 18.25, 19.2, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
          output_background_smg = 3
          skip_stability_tests_smg = yes
          write background = yes
          write thermodynamics = no
          root = output/covariant_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          output_verbose = 0
          EOF
          ./class output/covariant_target.ini

      - name: Reconstruct regular covariant target table
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np, re
          from scipy.interpolate import CubicSpline

          src=Path('output/covariant_target_00_background.dat')
          lines=src.read_text().splitlines()
          hdr=[l for l in lines if l.startswith('#') and '1:z' in l][-1].lstrip('#').strip()
          marks=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
          for i,m in enumerate(marks):
              e=marks[i+1].start() if i+1<len(marks) else len(hdr)
              names.append(hdr[m.end():e].strip())
          a=np.loadtxt(src)
          d={n:a[:,i] for i,n in enumerate(names)}
          N=-np.log1p(d['z'])
          order=np.argsort(N)
          N=N[order]
          def vv(name): return np.asarray(d[name])[order]

          Hraw=vv('H [1/Mpc]')
          rhoraw=vv('(.)rho_smg')
          praw=vv('(.)p_smg')
          H2raw=Hraw*Hraw

          # Work with smooth dimensionless target ratios to avoid enormous
          # dynamic ranges in the radiation era.
          lnHsp=CubicSpline(N,np.log(Hraw))
          rrsp=CubicSpline(N,rhoraw/H2raw)
          ppsp=CubicSpline(N,praw/H2raw)

          ph=N.copy()
          H=np.exp(lnHsp(ph))
          h=lnHsp(ph,1)
          rho=rrsp(ph)*H*H
          pre=ppsp(ph)*H*H
          Hpa=H*H*h
          X=0.5*H*H

          AF=0.0715; zc=5.00; width=1.426
          Nc=-np.log1p(zc)
          xx=(ph-Nc)/(2.*width)
          S=.5*(1.+np.tanh(xx))
          F=np.exp(AF*S)
          Fsp=CubicSpline(ph,F)
          F1=Fsp(ph,1)
          F2=Fsp(ph,2)
          F3=Fsp(ph,3)

          # Exact No-Slip on the target trajectory:
          # X G3_X = -G4_phi = -F_phi/2.
          g=-F1/(H*H)
          gsp=CubicSpline(ph,g)
          g1=gsp(ph,1)

          # Independently prescribed, subluminal kinetic sector.
          # This is NOT obtained from cs2num or from a target c_s^2:
          # D(N)=1e-4+0.40*S(N), alpha_K=D-3/2 alpha_B^2.
          Dtarget=1.e-4+0.40*S
          alphaM=F1/F
          alphaB=-2.*alphaM
          alphaK_target=Dtarget-1.5*alphaB*alphaB

          # Exact hi_class background identities specialized to
          # G4=F/2, G3=g(phi) X, G2=k1 X+k2 X^2-V, phi=N.
          R=3.*rho + 2.*g1*X*X + 6.*F1*H*H + 3.*(F-1.)*H*H
          P=3.*pre + 2.*g1*X*X - 2.*X*F2 \
             - 3.*(F-1.)*H*H - 2.*(F-1.)*Hpa \
             - 2.*F1*(H*H+Hpa)
          C=(R+P)/(2.*X)

          # Covariant alpha_K equation:
          # F alpha_K = k1 + 6 k2 X - 4 g_phi X + 6 g H^2,
          # together with C=k1+2 k2 X from the background equations.
          k2=(F*alphaK_target-C+4.*g1*X-6.*g*H*H)/(4.*X)
          k1=C-2.*k2*X
          V=.5*(R-P)-k2*X*X

          spl={}
          for name,y in [('g',g),('k1',k1),('k2',k2),('V',V)]:
              sp=CubicSpline(ph,y)
              spl[name]=(y,sp(ph,1),sp(ph,2),sp(ph,3))

          # On-background prediction of alpha_K and sound speed.
          alphaK=(k1+6.*k2*X-4.*spl['g'][1]*X+6.*g*H*H)/F
          D=alphaK+1.5*alphaB*alphaB

          # Interpolate the independently computed native numerator only for
          # the reconstruction audit; it does not enter G2/G3/G4.
          nssp=CubicSpline(N,vv('cs2num'))
          Ns=nssp(ph)
          cs2=Ns/D
          mask=ph>=-np.log(101.)
          print('COV_TARGET_AUDIT',
                'Dmin_z100=',float(D[mask].min()),
                'Dmax_z100=',float(D[mask].max()),
                'cs2min_z100=',float(cs2[mask].min()),
                'cs2max_z100=',float(cs2[mask].max()),
                'Dmin_all=',float(D.min()),
                'cs2min_all=',float(cs2.min()))

          splines={}
          for name,y in [('g',g),('k1',k1),('k2',k2),('V',V),('lnH',np.log(H))]:
              splines[name]=CubicSpline(ph,y)

          def carr(x):
              return ','.join(f'{v:.17e}' for v in np.asarray(x).ravel())

          hp=Path('gravity_smg/sdmc_covariant_replay_table.h')
          with hp.open('w') as f:
              f.write('#ifndef SDMC_COVARIANT_REPLAY_TABLE_H\n#define SDMC_COVARIANT_REPLAY_TABLE_H\n')
              f.write(f'#define SDMC_COV_N {len(ph)}\n')
              f.write('#define SDMC_COV_AF 0.0715\n')
              f.write('#define SDMC_COV_ZC 5.00\n')
              f.write('#define SDMC_COV_WIDTH 1.426\n')
              f.write('static const double sdmc_cov_x[SDMC_COV_N] = {'+carr(ph)+'};\n')
              for name,sp in splines.items():
                  coeff=np.asarray(sp.c.T).reshape(-1)
                  f.write(f'static const double sdmc_cov_{name}[4*(SDMC_COV_N-1)] = '+'{'+carr(coeff)+'};\n')
              f.write(r'''
          static int sdmc_cov_idx(double x){
            int lo=0,hi=SDMC_COV_N-1;
            if(x<=sdmc_cov_x[0]) return 0;
            if(x>=sdmc_cov_x[SDMC_COV_N-1]) return SDMC_COV_N-2;
            while(hi-lo>1){int m=(lo+hi)/2; if(sdmc_cov_x[m]<=x) lo=m; else hi=m;}
            return lo;
          }
          static void sdmc_cov_eval(const double *coef,double x,
                                    double *y,double *yp,double *ypp,double *yppp){
            int i=sdmc_cov_idx(x);
            double dx=x-sdmc_cov_x[i];
            const double *cc=coef+4*i;
            *y=((cc[0]*dx+cc[1])*dx+cc[2])*dx+cc[3];
            *yp=(3.*cc[0]*dx+2.*cc[1])*dx+cc[2];
            *ypp=6.*cc[0]*dx+2.*cc[1];
            *yppp=6.*cc[0];
          }
          #endif
          ''')
          print('WROTE',hp)
          PY

      - name: Install full covariant replay model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The split tracker helper normally reads expansion_smg parameters.
          # A real covariant model uses parameters_smg for the Lagrangian, so
          # freeze the already-established tracker/background constants here.
          p=Path('source/background.c'); s=p.read_text()
          old='''  double Ox = pba->parameters_smg[0];
            double lambda_e = pba->parameters_smg[1];
            double zt = pba->parameters_smg[2];
            double dNt = pba->parameters_smg[3];
            double A = pba->parameters_smg[4];
            double tauA = pba->parameters_smg[5];
            double B = pba->parameters_smg[6];
            double tauB = pba->parameters_smg[7];'''
          new='''  double Ox = 0.7073985893;
            double lambda_e = 18.25;
            double zt = 19.2;
            double dNt = 0.5;
            double A = 0.01105624999;
            double tauA = 0.25;
            double B = 0.01951933685;
            double tauB = 1.5;'''
          if old not in s: raise RuntimeError('split tracker constant anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('include/background.h'); s=p.read_text()
          old='    constant_alphas, sdmc_early_cs, sdmc_v2_noslip, sdmc_v2_late_noslip, sdmc_kp_late_noslip, sdmc_v3_native_noslip,\n'
          new='    constant_alphas, sdmc_early_cs, sdmc_v2_noslip, sdmc_v2_late_noslip, sdmc_kp_late_noslip, sdmc_v3_native_noslip, sdmc_covariant_replay,\n'
          if old not in s: raise RuntimeError('enum anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('gravity_smg/gravity_models_smg.c'); s=p.read_text()
          s=s.replace('#include "gravity_models_smg.h"\n',
                      '#include "gravity_models_smg.h"\n#include "sdmc_covariant_replay_table.h"\n',1)

          anchor='''  if (strcmp(string1,"eft_alphas_power_law") == 0) {'''
          parser='''  if (strcmp(string1,"sdmc_covariant_replay") == 0) {
             pba->gravity_model_smg = sdmc_covariant_replay;
             pba->field_evolution_smg = _TRUE_;
             pba->M2_evolution_smg = _FALSE_;
             flag2=_TRUE_;
             pba->parameters_size_smg = 1;
             class_read_list_of_doubles("parameters_smg",pba->parameters_smg,pba->parameters_size_smg);
             if (has_tuning_index_smg == _FALSE_) {
               pba->tuning_index_smg = 0;
               pba->tuning_dxdy_guess_smg = 1.;
             }
           }

          if (strcmp(string1,"eft_alphas_power_law") == 0) {'''
          if s.count(anchor)!=1: raise RuntimeError('parser anchor count '+str(s.count(anchor)))
          s=s.replace(anchor,parser,1)

          ganchor='''  else if(pba->gravity_model_smg == galileon){'''
          gcode=r'''  else if (pba->gravity_model_smg == sdmc_covariant_replay) {
            double Nc=-log(1.+SDMC_COV_ZC);
            double xx=(phi-Nc)/(2.*SDMC_COV_WIDTH);
            double tt=tanh(xx);
            double uu=1.-tt*tt;
            double w=SDMC_COV_WIDTH;
            double S=.5*(1.+tt);
            double S1=uu/(4.*w);
            double S2=-tt*uu/(4.*w*w);
            double S3=-uu*(1.-3.*tt*tt)/(8.*w*w*w);
            double A=SDMC_COV_AF;
            double F=exp(A*S);
            double F1=F*(A*S1);
            double F2=F*(A*A*S1*S1+A*S2);
            double F3=F*(A*A*A*S1*S1*S1+3.*A*A*S1*S2+A*S3);

            double g,g1,g2,g3;
            double k1,k1p,k1pp,k1ppp;
            double k2,k2p,k2pp,k2ppp;
            double V,Vp,Vpp,Vppp;
            sdmc_cov_eval(sdmc_cov_g,phi,&g,&g1,&g2,&g3);
            sdmc_cov_eval(sdmc_cov_k1,phi,&k1,&k1p,&k1pp,&k1ppp);
            sdmc_cov_eval(sdmc_cov_k2,phi,&k2,&k2p,&k2pp,&k2ppp);
            sdmc_cov_eval(sdmc_cov_V,phi,&V,&Vp,&Vpp,&Vppp);
            V += 3.*pba->H0*pba->H0*pba->parameters_smg[0];

            pgf->G2 = k1*X+k2*X*X-V;
            pgf->G2_X = k1+2.*k2*X;
            pgf->G2_XX = 2.*k2;
            pgf->G2_phi = k1p*X+k2p*X*X-Vp;
            pgf->G2_Xphi = k1p+2.*k2p*X;
            pgf->G2_XXphi = 2.*k2p;
            pgf->G2_phiphi = k1pp*X+k2pp*X*X-Vpp;
            pgf->G2_Xphiphi = k1pp+2.*k2pp*X;

            pgf->G3_X = g;
            pgf->G3_phi = g1*X;
            pgf->G3_Xphi = g1;
            pgf->G3_phiphi = g2*X;
            pgf->G3_Xphiphi = g2;
            pgf->G3_phiphiphi = g3*X;

            pgf->DG4 = (F-1.)/2.;
            pgf->G4 = F/2.;
            pgf->G4_phi = F1/2.;
            pgf->G4_phiphi = F2/2.;
            pgf->G4_phiphiphi = F3/2.;
          }

          else if(pba->gravity_model_smg == galileon){'''
          if s.count(ganchor)!=1: raise RuntimeError('G anchor count '+str(s.count(ganchor)))
          s=s.replace(ganchor,gcode,1)

          start=s.index('int gravity_models_initial_conditions_smg(')
          pos=s.index('case propto_omega:',start)
          ic='''case sdmc_covariant_replay:
            {
              double ph=log(a);
              double lnh,lnhp,lnhpp,lnhppp;
              sdmc_cov_eval(sdmc_cov_lnH,ph,&lnh,&lnhp,&lnhpp,&lnhppp);
              pvecback_integration[pba->index_bi_phi_smg]=ph;
              pvecback_integration[pba->index_bi_phi_prime_smg]=a*exp(lnh);
            }
            break;

          '''
          s=s[:pos]+ic+s[pos:]
          p.write_text(s)
          print('installed full covariant replay model')
          PY

      - name: Rebuild with covariant model
        run: make clean && make -j2 class

      - name: Run native covariant background evolution
        run: |
          cat > output/covariant_replay.ini <<'EOF'
          H0 = 70.8514
          omega_b = 0.02239952
          omega_cdm = 0.12444227328918850
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453

          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1

          gravity_model = sdmc_covariant_replay
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic

          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8

          output_background_smg = 3
          write background = yes
          write thermodynamics = no
          write parameters = yes
          root = output/covariant_replay_
          format = class
          input_verbose = 1
          background_verbose = 1
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          set +e
          ./class output/covariant_replay.ini > output/covariant_replay.log 2>&1
          rc=$?
          set -e
          echo "COVARIANT_REPLAY_RETURNCODE=$rc"
          tail -120 output/covariant_replay.log
          test "$rc" -eq 0

      - name: Compare evolved covariant solution to target
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np,re,csv

          def read(path):
              p=Path(path)
              if not p.exists(): return None
              lines=p.read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and '1:z' in l][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              a=np.loadtxt(p)
              return {n:a[:,i] for i,n in enumerate(names)}

          t=read('output/covariant_target_00_background.dat')
          c=read('output/covariant_replay_00_background.dat')
          if c is None:
              print('COVARIANT_COMPARISON unavailable: replay background missing')
              raise SystemExit(0)

          zc=c['z']; Nt=-np.log1p(t['z']); Nc=-np.log1p(zc)
          order=np.argsort(Nt); Nt=Nt[order]
          def ti(name):
              y=t[name][order]
              return np.interp(Nc,Nt,y)

          Ht=ti('H [1/Mpc]')
          Ft=ti('M*^2_smg')
          Hrel=np.abs(c['H [1/Mpc]']/Ht-1.)
          Frel=np.abs(c['M*^2_smg']/Ft-1.)
          mask100=zc<=100
          mask1e4=zc<=1.e4
          noslip=np.abs(c['braiding_smg']+2.*c['M2_running_smg'])

          # field columns exist only for the true covariant model
          phi=c.get('phi_smg',None)
          if phi is None:
              for k in c:
                  if k.lower().startswith('phi') and 'prime' not in k.lower():
                      phi=c[k]; break
          phierr=np.nan
          if phi is not None: phierr=float(np.max(np.abs(phi-Nc)))

          out={
            'max_abs_dH_H_z100':float(Hrel[mask100].max()),
            'max_abs_dH_H_z1e4':float(Hrel[mask1e4].max()),
            'max_abs_dF_F_z100':float(Frel[mask100].max()),
            'min_D_z100':float(c['kin (D)'][mask100].min()),
            'min_cs2_z100':float(c['c_s^2'][mask100].min()),
            'max_cs2_z100':float(c['c_s^2'][mask100].max()),
            'min_D_all':float(c['kin (D)'].min()),
            'min_cs2_all':float(c['c_s^2'].min()),
            'max_abs_noslip_z100':float(noslip[mask100].max()),
            'max_abs_phi_minus_lna':phierr,
            'F0':float(c['M*^2_smg'][np.argmin(np.abs(zc))]),
            'alphaM0':float(c['M2_running_smg'][np.argmin(np.abs(zc))]),
          }
          print('COVARIANT_REPLAY_COMPARISON',out)
          with open('output/covariant_replay_comparison.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=out.keys()); w.writeheader(); w.writerow(out)
          PY


      - name: Install official DESI DR1 full-shape dependencies
        run: |
          python3 -m pip install numpy scipy pandas h5py requests beautifulsoup4 pyyaml camb pyfftw
          python3 -m pip install git+https://github.com/cosmodesi/cosmoprimo.git
          python3 -m pip install git+https://github.com/adematti/lsstypes.git
          python3 -m pip install git+https://github.com/sfschen/velocileptors.git
          rm -rf desi-kp-cosmological-likelihoods
          git clone --depth 1 https://github.com/cosmodesi/desi-kp-cosmological-likelihoods.git
          mkdir -p desi_likelihood
          BASE_PRIMARY=https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          BASE_MIRROR=https://webdav-hdfs.pic.es/data/public/DESI/DR1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          for FN in \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_BGS_BRIGHT-21.5_GCcomb_z0.1-0.4_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.4-0.6_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.6-0.8_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.8-1.1_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_ELG_LOPnotqso_GCcomb_z1.1-1.6_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_QSO_GCcomb_z0.8-2.1_thetacut0.05.h5
          do
            ok=0
            for BASE in "$BASE_MIRROR" "$BASE_PRIMARY"
            do
              echo "Trying $BASE/$FN"
              if curl -4 -L --fail --connect-timeout 20 --max-time 240 \
                   --retry 5 --retry-delay 4 --retry-all-errors -C - \
                   -o "desi_likelihood/$FN" "$BASE/$FN"; then
                ok=1
                break
              fi
            done
            test "$ok" -eq 1
          done
          ls -lh desi_likelihood

      - name: Read official DESI effective redshifts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys,json
          sys.path.insert(0,'desi-kp-cosmological-likelihoods/dr1/cobaya')
          import lsstypes as types
          from desi_fs_bao_all import list_zrange,dataset_fn,get_tracer_label
          records=[]
          for tracer,iz,zrange in list_zrange:
              if 'lya' in tracer.lower(): continue
              fn=dataset_fn('desi_likelihood',tracer,zrange,observable_name='spectrum-poles-rotated')
              d=types.read(fn)
              sp=d.observable.get('spectrum')
              records.append(dict(tracer=tracer,iz=iz,zrange=list(zrange),
                                  namespace=f"{get_tracer_label(tracer)}_z{iz}",
                                  zeff=float(sp.attrs['zeff']),
                                  file=str(fn)))
          print('DESI_FS_ZEFF',records,flush=True)
          Path('output/desi_zeff.json').write_text(json.dumps(records,indent=2))
          zs=[0.0]+sorted({r['zeff'] for r in records})
          Path('output/desi_zpk.txt').write_text(','.join(f'{z:.10g}' for z in zs))
          print('DESI_ZPK',zs,flush=True)
          PY

      - name: Run covariant DESI density velocity transfers
        run: |
          ZPK=$(cat output/desi_zpk.txt)
          cat > output/desi_covariant_transfer.ini <<EOF
          H0 = 70.8514
