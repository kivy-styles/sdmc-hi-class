name: SDMC r032 joint physical best exact SN

on:
  push:
    branches:
      - sdmc-r032-joint-physical-best-exact-sn
  workflow_dispatch:

jobs:
  exact-sn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py

      - name: Build target solver
        run: make -j2 class

      - name: Generate exact target
        run: |
          mkdir -p output
          cat > output/covariant_target.ini <<'EOF'
          H0 = 70.66173072
          omega_b = 0.02224
          omega_cdm = 0.12444227328918850
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1628242850934083e-9
          n_s = 0.964
          tau_reio = 0.061

          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_native_noslip
          parameters_smg = 0.0525, 4.60, 0.680590909090909, 0.1, 0.0001
          expansion_model = sdmc_full
          expansion_smg = 0.7061451696512845,17.925,17.775,0.5,0.01105624999,0.25,0.01951933685,1.5
          output_background_smg = 3
          skip_stability_tests_smg = yes
          write background = yes
          root = output/covariant_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          output_verbose = 0
          EOF
          ./class output/covariant_target.ini
          test -f output/covariant_target_00_background.dat

      - name: Reconstruct and install exact covariant replay
        run: |
          python3 sdmc/reconstruct_covariant_target.py             --background output/covariant_target_00_background.dat             --header-out gravity_smg/sdmc_covariant_replay_table.h             --audit-out output/covariant_target_reconstruction_audit.json             --AF 0.0525 --zc 4.6 --width 0.680590909090909             --Dfloor 0.045 --D0 0.34231919445927034
          python3 sdmc/install_covariant_replay_candidate.py             --OmegaX 0.7061451696512845 --lambda-e 17.925 --z-t 17.775
          make clean
          make -j2 class

      - name: Generate exact SDMC and LCDM backgrounds
        run: |
          cat > output/exact_sdmc.ini <<'EOF'
          H0 = 70.66173072
          omega_b = 0.02224
          omega_cdm = 0.12444227328918850
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1628242850934083e-9
          n_s = 0.964
          tau_reio = 0.061
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_covariant_replay
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          write background = yes
          root = output/exact_sdmc_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          output_verbose = 0
          EOF
          ./class output/exact_sdmc.ini

          cat > output/lcdm.ini <<'EOF'
          H0 = 67.36
          omega_b = 0.02237
          omega_cdm = 0.1200
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.10e-9
          n_s = 0.9649
          tau_reio = 0.0544
          write background = yes
          root = output/lcdm_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          output_verbose = 0
          EOF
          ./class output/lcdm.ini

      - name: Install SN data
        run: |
          rm -rf sn_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data

      - name: Score SN compilations separately
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          import numpy as np
          import pandas as pd
          from scipy.linalg import cho_factor, cho_solve

          DATA=Path('sn_data')
          OUT=Path('output')

          def table(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              return pd.DataFrame(np.loadtxt(path),columns=names).sort_values('z')

          def read_cov(path,n):
              a=np.asarray(np.loadtxt(path),float).reshape(-1)
              if len(a)==n*n+1 and int(round(a[0]))==n: a=a[1:]
              if len(a)!=n*n: raise RuntimeError(f'covariance size mismatch {path}')
              return a.reshape(n,n)

          def setup(C):
              cf=cho_factor(C,lower=True,check_finite=False)
              one=np.ones(C.shape[0]); u=cho_solve(cf,one,check_finite=False)
              return cf,one,float(one.dot(u))

          def chi(pack,r):
              cf,one,den=pack
              y=cho_solve(cf,r,check_finite=False)
              return float(r.dot(y)-(one.dot(y))**2/den)

          def mu(bg,z,zh):
              DM=np.interp(z,bg.z,bg['comov. dist.'])
              DA=DM/(1.+z)
              return 5*np.log10((1.+zh)*(1.+z)*DA)

          pp=pd.read_csv(DATA/'PantheonPlus/Pantheon+SH0ES.dat',sep=r'\s+',header=0,engine='python')
          ppm=pp['m_b_corr'].to_numpy(float); ppz=pp['zHD'].to_numpy(float); ppzh=pp['zHEL'].to_numpy(float)
          C=read_cov(DATA/'PantheonPlus/Pantheon+SH0ES_STAT+SYS.cov',len(ppm))
          m=ppz>0.01
          ppm,ppz,ppzh,C=ppm[m],ppz[m],ppzh[m],C[np.ix_(m,m)]
          ppp=setup(C)

          p=DATA/'Union3/lcparam_full.txt'
          cols=p.read_text().splitlines()[0].removeprefix('#').split()
          un=pd.read_csv(p,sep=r'\s+',comment='#',names=cols,engine='python')
          cm={c.lower():c for c in un.columns}
          unm=un[cm['mb']].to_numpy(float); unz=un[cm['zcmb']].to_numpy(float)
          unp=setup(read_cov(DATA/'Union3/mag_covmat.txt',len(unm)))

          de=pd.read_csv(DATA/'DESY5/DES-SN5YR_HD.csv')
          cm={c.lower():c for c in de.columns}
          dem=de[cm['mu']].to_numpy(float); dez=de[cm['zhd']].to_numpy(float); dezh=de[cm['zhel']].to_numpy(float)
          derr=de[cm['muerr_final']].to_numpy(float)
          dep=setup(read_cov(DATA/'DESY5/covsys_000.txt',len(dem))+np.diag(derr*derr))

          def scores(bg):
              return {
                'pantheonplus':chi(ppp,ppm-mu(bg,ppz,ppzh)),
                'union3':chi(unp,unm-mu(bg,unz,unz)),
                'desy5':chi(dep,dem-mu(bg,dez,dezh)),
              }

          s=table(OUT/'exact_sdmc_00_background.dat')
          l=table(OUT/'lcdm_00_background.dat')
          ss=scores(s); ll=scores(l)
          out={k:{'sdmc':ss[k],'lcdm':ll[k],'delta':ss[k]-ll[k]} for k in ss}
          print('EXACT_PHYSICAL_SN',json.dumps(out,sort_keys=True),flush=True)
          pd.DataFrame([dict(compilation=k,sdmc_chi2=v['sdmc'],lcdm_chi2=v['lcdm'],delta_chi2=v['delta']) for k,v in out.items()]).to_csv(OUT/'exact_physical_sn.csv',index=False)
          PY

      - name: Preserve exact SN result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-joint-physical-best-exact-sn
          path: |
            output/exact_physical_sn.csv
            output/covariant_target_reconstruction_audit.json
            output/exact_sdmc_00_background.dat
          if-no-files-found: warn
