name: SDMC Mass-Stretch Necessary Structural Clock & Flux Closure

on:
  workflow_dispatch:
  push:
    branches:
      - sdmc-structural-mass-required-clock-20261013
    paths:
      - '.github/workflows/sdmc_structural_mass_required_clock.yml'
      - 'sdmc/run_structural_mass_required_clock.py'
      - 'sdmc/reports/structural_mass_required_clock_and_flux_2026-10-13.md'

permissions:
  contents: read

jobs:
  source-to-S-inversion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible integrators
        run: python -m pip install numpy scipy matplotlib
      - name: Derive distinct clock histories and physical mass-flux conservation
        run: |
          python sdmc/run_structural_mass_required_clock.py \
            --out output/structural_mass_required_clock.json \
            --plots output/structural_mass_required_clock_plots
      - name: Inspect source-normalization and flux gates
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          x=json.loads(Path('output/structural_mass_required_clock.json').read_text())
          assert x['status'].startswith('PASS')
          assert 1.62 < x['kappa_to_identify_rhoG_with_matter_plus_radiation_today'] < 1.65
          assert 5.4 < x['kappa_to_identify_rhoG_with_FULL_Jordan_today'] < 5.8
          assert 3.2 < x['kappa_J_to_kappa_mr_ratio'] < 3.6
          rows=x['rows']
          a=lambda z:next(t for t in rows if abs(t['z']-z)<.0001)
          assert 2.6<a(20)['mr_required_lapse_N']<2.9
          assert 2.8<a(1090)['mr_required_lapse_N']<3.2
          assert 4.7<a(0)['mr_required_lapse_N']<5.2
          assert 1.2<a(0)['full_Jordan_required_lapse_N']<1.9
          assert abs(a(20)['mr_required_R_over_chrono']-.805)<.015
          assert abs(a(1090)['mr_required_R_over_chrono']-.899)<.02
          assert a(20)['mr_kappa_if_chrono']>2.4
          assert a(1090)['mr_kappa_if_chrono']>2
          assert all(abs(t['matter_plus_radiation_energy_dlnM_dln_a_required_mr']-
                 t['mr_required_p'])<1e-11 for t in rows)
          for f in ('required_structural_exponents.png','required_structural_lapse.png',
                    'required_radius_vs_historical.png'):
              assert Path('output/structural_mass_required_clock_plots',f).exists()
          print('PASS full era clock inverse, source decomposition, radiation PdV and dust mass-flux tests')
          print('WARNING: INVERTING rho(S) from rho(z) IS NOT deriving new dynamics')
          print('WARNING: NO NEW H0, PHOTON-TO-BARYON RATIO OR INITIAL PLANCK BOUNDARY ASSERTED')
          PY
      - name: Archive verified derivations and three figures
        uses: actions/upload-artifact@v4
        with:
          name: SDMC-Mass-Stretch-Required-Clock-and-Flux-Test
          path: |
            output/structural_mass_required_clock.json
            output/structural_mass_required_clock_plots/*.png
            sdmc/reports/structural_mass_required_clock_and_flux_2026-10-13.md
          if-no-files-found: warn
