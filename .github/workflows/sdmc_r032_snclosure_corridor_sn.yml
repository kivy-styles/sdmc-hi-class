name: SDMC r032 SN-closure corridor SN covariance scan

on:
  push:
    branches:
      - sdmc-r032-snclosure-corridor-sn-screen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corridor-sn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas
      - name: Apply SDMC patches and build
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make -j2 class
      - name: Install SN covariance products
        run: |
          rm -rf sn_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data
      - name: Run corridor SN scan
        run: python3 sdmc/run_r032_snclosure_corridor_sn.py
      - name: Print results
        if: always()
        run: cat output/snclosure_corridor_sn/corridor_sn.csv || true
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-snclosure-corridor-sn-screen
          path: output/snclosure_corridor_sn/*
          if-no-files-found: warn
