name: SDMC bridge95 JWST likelihood-equivalent audit

on:
  push:
    branches:
      - sdmc-bridge95-downstream
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jwst:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          python3 -m pip install -q numpy pandas
      - name: Download exact baseline and A034 transfer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/d044 inputs/bridge95
          gh run download 36167249409 --repo "${{ github.repository }}" \
            --name sdmc-discussion-s117-g073-d044p045-exact-desi --dir inputs/d044
          gh run download 37472532106 --repo "${{ github.repository }}" \
            --name sdmc-bridge95-desi --dir inputs/bridge95
          test -f inputs/d044/desi_cov_00_z1_pk.dat
          test -f inputs/bridge95/desi_cov_00_z1_pk.dat
      - name: Run candidate-specific JWST stress test
        run: |
          python3 sdmc/run_bridge95_jwst_likelihood_equivalent.py
          cat output/bridge95_jwst/bridge95_jwst_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmc-bridge95-jwst-likelihood-equivalent
          path: output/bridge95_jwst/*
          if-no-files-found: warn
