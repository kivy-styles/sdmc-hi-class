name: SDMC r032 promoted full Plik validation

on:
  push:
    branches:
      - sdmc-r032-promoted-fullplik
  workflow_dispatch:

jobs:
  promoted-fullplik:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya iminuit

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          python3 sdmc/install_sdmc_v3_lens_braiding.py

      - name: Build hi_class
        run: make -j2 class

      - name: Install Planck likelihood data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE import TTTEEE
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          if not TTTEEE.install(path='planck_full',no_progress_bars=True):
              raise SystemExit('full Planck TTTEEE install failed')
          for cls in (TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(f'Planck install failed: {cls}')
          print('PROMOTED_PLANCK_INSTALL_OK')
          PY

      - name: Run promoted full Plik profile
        run: python3 sdmc/run_r032_promoted_fullplik.py

      - name: Print promoted summary
        if: always()
        run: |
          if [ -f output/promoted_fullplik/promoted_fullplik_summary.json ]; then
            cat output/promoted_fullplik/promoted_fullplik_summary.json
          fi
          if [ -f output/promoted_fullplik/promoted_fullplik_profile.csv ]; then
            echo "===== FULL PROFILE ====="
            cat output/promoted_fullplik/promoted_fullplik_profile.csv
          fi

      - name: Preserve promoted full Plik outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-promoted-fullplik
          path: |
            output/promoted_fullplik/promoted_fullplik_summary.json
            output/promoted_fullplik/promoted_fullplik_profile.csv
            output/promoted_fullplik/*.ini
            output/promoted_fullplik/*_00_background.dat
            output/promoted_fullplik/*_00_cl_lensed.dat
          if-no-files-found: warn
