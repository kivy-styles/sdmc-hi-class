name: LCDM local021 exact SN covariance validation

on:
  push:
    branches:
      - lcdm-local021-exact-sn
  workflow_dispatch:

jobs:
  exact-sn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and build CLASS
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas
          make -j2 class
          rm -rf sn_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data
          mkdir -p output

      - name: Generate exact local021 and reference backgrounds
        run: |
          cat > output/lcdm_local021_sn.ini <<'EOF'
          H0 = 68.56858744695782
          omega_b = 0.022406369378007947
          omega_cdm = 0.11824151052483357
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.05109266435559e-9
          n_s = 0.9649593164240942
          tau_reio = 0.044985382026527077
          write background = yes
          root = output/lcdm_local021_sn_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          output_verbose = 0
          EOF
          cat > output/lcdm_reference_sn.ini <<'EOF'
          H0 = 67.36
          omega_b = 0.02237
          omega_cdm = 0.1200
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.10e-9
          n_s = 0.9649
          tau_reio = 0.0544
          write background = yes
          root = output/lcdm_reference_sn_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          output_verbose = 0
          EOF
          ./class output/lcdm_local021_sn.ini
          ./class output/lcdm_reference_sn.ini

      - name: Score exact SN covariance likelihoods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,numpy as np,pandas as pd
          from scipy.linalg import cho_factor,cho_solve
          DATA=Path('sn_data'); OUT=Path('output')
          def table(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              return pd.DataFrame(np.loadtxt(path),columns=names).sort_values('z')
          def read_cov(path,n):
              a=np.asarray(np.loadtxt(path),float).reshape(-1)
              if len(a)==n*n+1 and int(round(a[0]))==n:a=a[1:]
              if len(a)!=n*n:raise RuntimeError(f'covariance size mismatch {path}')
              return a.reshape(n,n)
          def setup(C):
              cf=cho_factor(C,lower=True,check_finite=False); one=np.ones(C.shape[0]); u=cho_solve(cf,one,check_finite=False)
              return cf,one,float(one.dot(u))
          def chi(pack,r):
              cf,one,den=pack;y=cho_solve(cf,r,check_finite=False)
              return float(r.dot(y)-(one.dot(y))**2/den)
          def mu(bg,z,zh):
              DM=np.interp(z,bg.z,bg['comov. dist.']);DA=DM/(1.+z)
              return 5*np.log10((1.+zh)*(1.+z)*DA)
          pp=pd.read_csv(DATA/'PantheonPlus/Pantheon+SH0ES.dat',sep='\\s+',header=0,engine='python')
          ppm=pp['m_b_corr'].to_numpy(float);ppz=pp['zHD'].to_numpy(float);ppzh=pp['zHEL'].to_numpy(float)
          C=read_cov(DATA/'PantheonPlus/Pantheon+SH0ES_STAT+SYS.cov',len(ppm));m=ppz>0.01
          ppm,ppz,ppzh,C=ppm[m],ppz[m],ppzh[m],C[np.ix_(m,m)];ppp=setup(C)
          p=DATA/'Union3/lcparam_full.txt';cols=p.read_text().splitlines()[0].removeprefix('#').split()
          un=pd.read_csv(p,sep='\\s+',comment='#',names=cols,engine='python');cm={c.lower():c for c in un.columns}
          unm=un[cm['mb']].to_numpy(float);unz=un[cm['zcmb']].to_numpy(float);unp=setup(read_cov(DATA/'Union3/mag_covmat.txt',len(unm)))
          de=pd.read_csv(DATA/'DESY5/DES-SN5YR_HD.csv');cm={c.lower():c for c in de.columns}
          dem=de[cm['mu']].to_numpy(float);dez=de[cm['zhd']].to_numpy(float);dezh=de[cm['zhel']].to_numpy(float)
          derr=de[cm['muerr_final']].to_numpy(float);dep=setup(read_cov(DATA/'DESY5/covsys_000.txt',len(dem))+np.diag(derr*derr))
          def scores(bg):
              return {'pantheonplus':chi(ppp,ppm-mu(bg,ppz,ppzh)),
                      'union3':chi(unp,unm-mu(bg,unz,unz)),
                      'desy5':chi(dep,dem-mu(bg,dez,dezh))}
          local=scores(table(OUT/'lcdm_local021_sn_00_background.dat'))
          ref=scores(table(OUT/'lcdm_reference_sn_00_background.dat'))
          out={k:{'local021':local[k],'reference':ref[k],'delta_local021_minus_reference':local[k]-ref[k]} for k in local}
          print('LCDM_LOCAL021_EXACT_SN',json.dumps(out,sort_keys=True),flush=True)
          pd.DataFrame([dict(compilation=k,**v) for k,v in out.items()]).to_csv(OUT/'lcdm_local021_exact_sn.csv',index=False)
          PY

      - name: Preserve exact SN result
        uses: actions/upload-artifact@v4
        with:
          name: lcdm-local021-exact-sn
          path: |
            output/lcdm_local021_exact_sn.csv
            output/lcdm_local021_sn_00_background.dat
            output/lcdm_reference_sn_00_background.dat
