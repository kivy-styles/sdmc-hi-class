name: SDMC late300 fine physical negative-phi basin boundary

on:
  push:
    branches: [sdmc-late300-action-basin-physical-boundary-fine]
    paths:
      - '.github/workflows/sdmc_late300_action_basin_physical_boundary_fine.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  physical-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy

      - name: Apply SDMC parameterized-model patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean
          make -j2 class

      - name: Recover canonical accepted-action inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovered output
          gh run download 37581925240 --repo "${{ github.repository }}" --name late300-linear-g3-covariant-audit --dir recovered
          cp recovered/linear_cov_target.ini output/linear_cov_target.ini
          cp recovered/linear_cov_free.ini output/linear_cov_free.ini

      - name: Extend target reconstruction domain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("output/linear_cov_target.ini")
          s=p.read_text()
          for key,val in [
              ("a_ini_over_a_today_default","1.e-10"),
              ("a_ini_test_qs_smg","1.e-10"),
              ("a_min_stability_test_smg","1.e-10"),
              ("pert_ic_ini_z_ref_smg","1.e9"),
              ("root","output/linear_cov_target_"),
          ]:
              pat=rf"(?m)^\s*{re.escape(key)}\s*=.*$"
              s=re.sub(pat,f"{key} = {val}",s) if re.search(pat,s) else s+f"\n{key} = {val}\n"
          p.write_text(s)
          PY
          ./class output/linear_cov_target.ini
          python3 sdmc/run_late300_linear_covariant.py
          python3 sdmc/run_late300_action_basin_audit.py patch
          make clean
          make -j2 class

      - name: Prepare physical-boundary scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path("output/linear_cov_free.ini").read_text()
          vals=[-0.750,-0.755,-0.760,-0.765,-0.770,-0.775,-0.780,-0.785,-0.790,-0.795,-0.800]
          for v in vals:
              tag=f"m{int(round(abs(v)*1000)):04d}"
              s=base
              s=re.sub(r"(?m)^\s*parameters_smg\s*=.*$",f"parameters_smg = 0.0, {v:.17g}, 0.0",s)
              s=re.sub(r"(?m)^\s*root\s*=.*$",f"root = output/physneg_{tag}_",s)
              s=re.sub(r"(?m)^\s*a_ini_over_a_today_default\s*=.*$","a_ini_over_a_today_default = 1.e-8",s)
              s=re.sub(r"(?m)^\s*a_ini_test_qs_smg\s*=.*$","a_ini_test_qs_smg = 1.e-8",s)
              s=re.sub(r"(?m)^\s*a_min_stability_test_smg\s*=.*$","a_min_stability_test_smg = 1.e-8",s)
              s="\n".join(line for line in s.splitlines() if not re.match(r"^\s*output\s*=",line))
              s=re.sub(r"(?m)^\s*lensing\s*=.*$","lensing = no",s)
              s=re.sub(r"(?m)^\s*write_thermodynamics\s*=.*$","write_thermodynamics = no",s)
              Path(f"output/physneg_{tag}.ini").write_text(s+"\n")
          PY

      - name: Free-evolve boundary scan
        run: |
          set +e
          for ini in output/physneg_*.ini; do
            tag=$(basename "$ini" .ini)
            ./class "$ini" > "output/${tag}.log" 2>&1
            rc=$?
            echo "$rc" > "output/${tag}.rc"
            echo "PHYSNEG_RUN ${tag} rc=${rc}"
          done
          set -e

      - name: Analyze physical boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,numpy as np
          def read(path):
              lines=Path(path).read_text().splitlines()
              hdr=[x for x in lines if x.startswith("#") and re.search(r"1\s*:",x)][-1].lstrip("#").strip()
              ms=list(re.finditer(r"(\d+)\s*:\s*",hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              a=np.loadtxt(path)
              return {n:a[:,i] for i,n in enumerate(names)}
          rows=[]
          for rcf in sorted(Path("output").glob("physneg_*.rc")):
              tag=rcf.stem
              dphi=-int(tag.split("_m")[-1])/1000.0
              rc=int(rcf.read_text())
              log=(Path("output")/f"{tag}.log").read_text(errors="replace")
              row={"tag":tag,"delta_phi":dphi,"returncode":rc,"success":rc==0}
              if rc==0:
                  bg=read(Path("output")/f"{tag}_00_background.dat")
                  z=bg["z"]; m=z<=100
                  row.update({
                    "min_D_z100":float(np.min(bg["kin (D)"][m])),
                    "min_cs2_z100":float(np.min(bg["c_s^2"][m])),
                    "max_cs2_z100":float(np.max(bg["c_s^2"][m])),
                  })
              else:
                  mg=re.search(r"Gradient instability.*minimum c_s\^2=([^ ]+) at a=([^\s]+)",log)
                  ghost=re.search(r"Ghost instability.*minimum D=([^ ]+) at a=([^\s]+)",log)
                  if mg:
                      aa=float(mg.group(2))
                      row.update({"failure_kind":"gradient_instability",
                                  "min_cs2_reported":float(mg.group(1)),
                                  "a_failure":aa,
                                  "z_failure":1.0/aa-1.0})
                  elif ghost:
                      aa=float(ghost.group(2))
                      row.update({"failure_kind":"ghost_instability",
                                  "min_D_reported":float(ghost.group(1)),
                                  "a_failure":aa,
                                  "z_failure":1.0/aa-1.0})
                  elif "Step size too small" in log:
                      row["failure_kind"]="integrator_step_floor"
                  elif "is not a number" in log:
                      row["failure_kind"]="nan_constraint"
                  else:
                      row["failure_kind"]="other"
                  row["failure_tail"]="\n".join(log.splitlines()[-10:])
              rows.append(row)
          good=[r["delta_phi"] for r in rows if r["success"]]
          bad=[r["delta_phi"] for r in rows if not r["success"]]
          out={
            "status":"fine extended-domain physical negative-phi basin boundary scan",
            "rows":rows,
            "most_negative_success":min(good) if good else None,
            "least_negative_failure":max(bad) if bad else None,
            "note":"The accepted action is reconstructed to a=1e-10, but all free runs still start at canonical a=1e-8. Thus these failures are not caused by the original spline lower edge."
          }
          Path("output/late300_action_basin_physical_boundary_fine.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("LATE300_ACTION_BASIN_PHYSICAL_BOUNDARY",json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late300-action-basin-physical-boundary-fine
          path: |
            output/late300_action_basin_physical_boundary.json
            output/physneg_*.rc
            output/physneg_*.log
          if-no-files-found: warn
