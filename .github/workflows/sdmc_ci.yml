name: SDMC Boltzmann CI

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip

      - name: Build hi_class executable
        run: make -j2 class

      - name: Baseline LCDM smoke test
        run: ./class explanatory.ini

      - name: Preserve baseline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-baseline-smoke-output
          path: |
            output/
            *.log
          if-no-files-found: ignore
