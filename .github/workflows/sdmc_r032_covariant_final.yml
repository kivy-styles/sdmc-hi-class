      - name: Reconstruct CAMB-compatible Newtonian velocity transfers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, math
          import numpy as np
          import pandas as pd

          OUT=Path('output')
          H0=70.8514
          h=H0/100.
          ob=0.02239952
          oc=0.12444227328918850
          fb=ob/(ob+oc)
          fc=1.-fb
          zs=[0.295,0.510,0.706,0.919,1.317,1.491]

          def tab(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and '1:' in l][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              return pd.DataFrame(np.loadtxt(path),columns=names)

          bg=tab(OUT/'covariant_transfer_00_background.dat').sort_values('z')
          def biv(col,z): return float(np.interp(z,bg.z,bg[col]))

          rows=[]
          curves=[]
          for iz,z in enumerate(zs,1):
              tk=tab(OUT/f'covariant_transfer_00_z{iz}_tk.dat')
              k_h=tk['k (h/Mpc)'].to_numpy()
              k=k_h*h
              db=tk['d_b'].to_numpy()
              dc=tk['d_cdm'].to_numpy()
              tb=tk['t_b'].to_numpy()
              hp=tk['h_prime'].to_numpy()
              ep=tk['eta_prime'].to_numpy()

              # CLASS synchronous -> Newtonian:
              # k^2 alpha = (h' + 6 eta')/2.
              shift=.5*(hp+6.*ep)
              thetaNc=shift
              thetaNb=tb+shift
              a=1./(1.+z)
              H=biv('H [1/Mpc]',z)
              Hconf=a*H
              vNc=-thetaNc/Hconf
              vNb=-thetaNb/Hconf

              dcb=fb*db+fc*dc
              vcb=fb*vNb+fc*vNc
              ratio=vcb/dcb
              fbg=biv('gr.fac. f',z)

              # DESI pivot is 0.03 h/Mpc in fiducial coordinates; use same
              # physical k/h location for this normalization audit.
              piv=float(np.interp(0.03,k_h,ratio))
              for kval in [0.01,0.03,0.05,0.10,0.20]:
                  rv=float(np.interp(kval,k_h,ratio))
                  rows.append({
                    'z':z,'k_hMpc':kval,'vnewt_cb_over_delta_cb':rv,
                    'f_background':fbg,'ratio_over_f':rv/fbg
                  })
              km=(k_h>=0.01)&(k_h<=0.20)&np.isfinite(ratio)
              curves.append({
                'z':z,'f_background':fbg,'pivot_ratio':piv,
                'pivot_over_f':piv/fbg,
                'min_ratio_over_f_0p01_0p2':float(np.min(ratio[km]/fbg)),
                'max_ratio_over_f_0p01_0p2':float(np.max(ratio[km]/fbg)),
                'max_abs_baryon_cdm_velocity_split_over_cb':float(
                    np.max(np.abs((vNb[km]-vNc[km])/np.maximum(np.abs(vcb[km]),1e-300))))
              })

          pd.DataFrame(rows).to_csv(OUT/'covariant_transfer_velocity_samples.csv',index=False)
          pd.DataFrame(curves).to_csv(OUT/'covariant_transfer_velocity_audit.csv',index=False)
          print('COVARIANT_TRANSFER_VELOCITY_AUDIT')
          print(pd.DataFrame(curves).to_string(index=False),flush=True)
          print('COVARIANT_TRANSFER_VELOCITY_SAMPLES')
          print(pd.DataFrame(rows).to_string(index=False),flush=True)
          PY

