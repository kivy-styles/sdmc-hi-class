name: SDMC NKp-v3 joint Planck optimization

on:
  push:
    branches:
      - sdmc-planck-joint-opt-arm
  workflow_dispatch:

jobs:
  joint-planck-opt:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy numpy pandas

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py

      - name: Expose exact native cs2 diagnostics
        run: python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build hi_class
        run: make -j2 class

      - name: Install native Planck likelihood data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in [TTTEEE_lite_native,TT,EE,LensingNative]:
              ok=cls.install(path='planck_packages',no_progress_bars=True)
              if not ok:
                  raise SystemExit(f'Planck data install failed for {cls}')
          PY

      - name: Scan native-stable corridor with common Planck plus lensing score
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, glob, math, os, re, subprocess, textwrap
          import numpy as np
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          TCMB=2.7255
          CAL_SIGMA=0.0025
          OUT=Path('output/v3_joint_planck')
          OUT.mkdir(parents=True,exist_ok=True)

          # Broad corridor connecting the native-stable base to the old edge.
          AMPS=[0.068,0.069,0.070,0.071,0.072]
          ZCS=[5.0,6.0,7.0,8.0,9.0,10.0]
          WIDTHS=[1.45,1.50,1.55,1.60]
          BASE_LNAS=3.076
          BASE_NS=0.964
          BASE_AS=math.exp(BASE_LNAS)/1e10

          high=TTTEEE_lite_native(packages_path='planck_packages')
          lowt=TT(packages_path='planck_packages')
          lowe=EE(packages_path='planck_packages')
          lens=LensingNative(packages_path='planck_packages')

          def ini_text(A,zc,w,As,ns,root,full=False):
              outputs=(
                  'output = tCl,pCl,lCl,mPk\n'
                  'P_k_max_h/Mpc = 6.0\n'
                  'z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10\n'
                  'write background = yes\nwrite thermodynamics = yes\nwrite parameters = yes\n'
                  if full else
                  'output = tCl,pCl,lCl\nwrite background = yes\nwrite thermodynamics = no\nwrite parameters = no\n'
              )
              return textwrap.dedent(f'''\
              H0 = 70.8514
              omega_b = 0.02239952
              omega_cdm = 0.12444227328918850
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = {As:.14e}
              n_s = {ns:.9f}
              tau_reio = 0.0544
              Omega_Lambda = 0
              Omega_fld = 3.1443554e-8
              fluid_equation_of_state = SDMC_TRACKER
              cs2_fld = 0.003
              use_ppf = no
              Omega_smg = -1
              gravity_model = sdmc_v3_native_noslip
              parameters_smg = {A:.12g}, {zc:.12g}, {w:.12g}, 0.1, 0.0001
              expansion_model = sdmc_full
              expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
              pert_initial_conditions_smg = zero
              method_qs_smg = fully_dynamic
              output_background_smg = 3
              modes = s
              lensing = yes
              l_max_scalars = 3000
              {outputs}root = {root}
              format = class
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          def load(path):
              a=np.loadtxt(path)
              ell=a[:,0].astype(int)
              lmax=int(ell.max())
              conv=(TCMB*1e6)**2
              tt=np.zeros(lmax+1); ee=np.zeros(lmax+1); te=np.zeros(lmax+1)
              bb=np.zeros(lmax+1); pp=np.zeros(lmax+1)
              tp=np.zeros(lmax+1); ep=np.zeros(lmax+1)
              tt[ell]=a[:,1]*conv
              ee[ell]=a[:,2]*conv
              te[ell]=a[:,3]*conv
              bb[ell]=a[:,4]*conv
              ll=ell*(ell+1.0)
              # CLASS file phiphi is one L(L+1) below Cobaya's ell_factor=True pp.
              pp[ell]=a[:,5]*ll
              tp[ell]=a[:,6]*np.sqrt(ll)*(TCMB*1e6)
              ep[ell]=a[:,7]*np.sqrt(ll)*(TCMB*1e6)
              harr=np.column_stack([ell,tt[ell],te[ell],ee[ell]])
              dls={'tt':tt,'ee':ee,'te':te,'bb':bb,'pp':pp,'tp':tp,'ep':ep}
              return harr,dls

          def score(path):
              harr,dls=load(path)
              def pieces(A):
                  A=float(A)
                  ch=float(high.chi_squared(harr,A_planck=A))
                  ct=float(-2*lowt.log_likelihood(dls['tt'],calib=A))
                  ce=float(-2*lowe.log_likelihood(dls['ee'],calib=A))
                  cl=float(-2*lens.log_likelihood(dls,A_planck=A))
                  cp=((A-1.0)/CAL_SIGMA)**2
                  return ch,ct,ce,cl,cp
              def total(A):
                  vals=pieces(A)
                  if not all(np.isfinite(vals)): return np.inf
                  return sum(vals)
              opt=minimize_scalar(total,bounds=(0.97,1.03),method='bounded',
                                  options={'xatol':1e-10})
              A=float(opt.x); ch,ct,ce,cl,cp=pieces(A)
              return A,ch,ct,ce,cl,cp,ch+ct+ce+cl+cp

          def parse_bg(path):
              lines=Path(path).read_text().splitlines()
              hdr=[x for x in lines if x.startswith('#') and '1:z' in x][-1].lstrip('#').strip()
              marks=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(marks):
                  end=marks[i+1].start() if i+1<len(marks) else len(hdr)
                  names.append(hdr[m.end():end].strip())
              arr=np.loadtxt(path)
              return [dict(zip(names,row)) for row in arr]

          fields=['A_F','z_c','width','status','A_planck',
                  'chi2_highl','chi2_lowT','chi2_lowE','chi2_lensing',
                  'chi2_cal_prior','chi2_total','min_cs2num_z100',
                  'min_D_z100','F0','alphaM0','max_abs_noslip_z100','error']
          rows=[]; best=None; counter=0
          for A in AMPS:
              for zc in ZCS:
                  for w in WIDTHS:
                      counter+=1
                      stem=f'j_{counter:03d}'
                      root=str(OUT/(stem+'_'))
                      ini=OUT/(stem+'.ini')
                      ini.write_text(ini_text(A,zc,w,BASE_AS,BASE_NS,root,False))
                      cp=subprocess.run(['./class',str(ini)],stdout=subprocess.PIPE,
                                        stderr=subprocess.STDOUT,text=True,timeout=180)
                      cl=Path(root+'00_cl_lensed.dat')
                      bg=Path(root+'00_background.dat')
                      rec={'A_F':A,'z_c':zc,'width':w,'status':'FAIL',
                           'A_planck':'','chi2_highl':'','chi2_lowT':'',
                           'chi2_lowE':'','chi2_lensing':'','chi2_cal_prior':'',
                           'chi2_total':'','min_cs2num_z100':'','min_D_z100':'',
                           'F0':'','alphaM0':'','max_abs_noslip_z100':'',
                           'error':cp.stdout[-1000:] if cp.returncode else ''}
                      if cp.returncode==0 and cl.exists() and bg.exists():
                          Acal,ch,ct,ce,clens,cprior,ctot=score(cl)
                          rr=parse_bg(bg)
                          sub=[r for r in rr if r['z']<=100]
                          r0=min(rr,key=lambda r:abs(r['z']))
                          rec.update({
                              'status':'OK','A_planck':Acal,
                              'chi2_highl':ch,'chi2_lowT':ct,'chi2_lowE':ce,
                              'chi2_lensing':clens,'chi2_cal_prior':cprior,
                              'chi2_total':ctot,
                              'min_cs2num_z100':min(r['cs2num'] for r in sub),
                              'min_D_z100':min(r['kin (D)'] for r in sub),
                              'F0':r0['M*^2_smg'],
                              'alphaM0':r0['M2_running_smg'],
                              'max_abs_noslip_z100':max(abs(r['braiding_smg']+2*r['M2_running_smg']) for r in sub),
                              'error':''
                          })
                          print(f'JOINT A={A:.3f} zc={zc:g} w={w:.2f} '
                                f'total={ctot:.6f} high={ch:.3f} lowT={ct:.3f} '
                                f'lens={clens:.3f}',flush=True)
                          if best is None or ctot<best['chi2_total']:
                              best=dict(rec)
                              (OUT/'best_grid_cl_lensed.dat').write_bytes(cl.read_bytes())
                      else:
                          print(f'JOINT_FAIL A={A:.3f} zc={zc:g} w={w:.2f}',flush=True)
                      rows.append(rec)
                      for p in glob.glob(root+'*'):
                          try: os.remove(p)
                          except OSError: pass
                      try: ini.unlink()
                      except OSError: pass

          with (OUT/'sdmc_v3_joint_planck_scan.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          if best is None:
              raise SystemExit('No native-stable joint-Planck point survived')
          with (OUT/'sdmc_v3_joint_planck_best_fixedprim.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerow(best)
          print('BEST_JOINT_FIXED_PRIM',best,flush=True)

          # Local primordial profile around the best joint late-sector point.
          LNAS=[3.070,3.073,3.076,3.079,3.082]
          NSS=[0.960,0.961,0.962,0.963,0.964,0.965,0.966]
          pfields=['ln10As','A_s','n_s','status','A_planck',
                   'chi2_highl','chi2_lowT','chi2_lowE','chi2_lensing',
                   'chi2_cal_prior','chi2_total']
          prows=[]; pbest=None; pc=0
          for lnAs in LNAS:
              As=math.exp(lnAs)/1e10
              for ns in NSS:
                  pc+=1
                  stem=f'p_{pc:03d}'
                  root=str(OUT/(stem+'_'))
                  ini=OUT/(stem+'.ini')
                  ini.write_text(ini_text(best['A_F'],best['z_c'],best['width'],
                                          As,ns,root,False))
                  cp=subprocess.run(['./class',str(ini)],stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT,text=True,timeout=180)
                  cl=Path(root+'00_cl_lensed.dat')
                  if cp.returncode==0 and cl.exists():
                      Acal,ch,ct,ce,clens,cprior,ctot=score(cl)
                      rec={'ln10As':lnAs,'A_s':As,'n_s':ns,'status':'OK',
                           'A_planck':Acal,'chi2_highl':ch,'chi2_lowT':ct,
                           'chi2_lowE':ce,'chi2_lensing':clens,
                           'chi2_cal_prior':cprior,'chi2_total':ctot}
                      prows.append(rec)
                      print(f'JOINT_PRIM ln10As={lnAs:.3f} ns={ns:.3f} '
                            f'total={ctot:.6f}',flush=True)
                      if pbest is None or ctot<pbest['chi2_total']:
                          pbest=dict(rec)
                  else:
                      prows.append({'ln10As':lnAs,'A_s':As,'n_s':ns,'status':'FAIL',
                                    'A_planck':'','chi2_highl':'','chi2_lowT':'',
                                    'chi2_lowE':'','chi2_lensing':'',
                                    'chi2_cal_prior':'','chi2_total':''})
                  for p in glob.glob(root+'*'):
                      try: os.remove(p)
                      except OSError: pass
                  try: ini.unlink()
                  except OSError: pass

          with (OUT/'sdmc_v3_joint_planck_primordial_scan.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=pfields); w.writeheader(); w.writerows(prows)
          with (OUT/'sdmc_v3_joint_planck_primordial_best.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=pfields); w.writeheader(); w.writerow(pbest)
          print('BEST_JOINT_PRIM',pbest,flush=True)

          # Final full observable product at joint best.
          root='output/sdmc_v3_joint_planck_best_'
          Path('output/sdmc_v3_joint_planck_best.ini').write_text(
              ini_text(best['A_F'],best['z_c'],best['width'],
                       float(pbest['A_s']),float(pbest['n_s']),root,True))
          cp=subprocess.run(['./class','output/sdmc_v3_joint_planck_best.ini'],
                            stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                            text=True,timeout=300)
          Path('output/sdmc_v3_joint_planck_best.log').write_text(cp.stdout)
          print('JOINT_FULL_RETURNCODE',cp.returncode,flush=True)
          if cp.returncode:
              raise SystemExit(cp.returncode)
          PY

      - name: Generate and score matched LCDM reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          p=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {math.exp(3.044)/1e10:.14e}',p)
          p=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',p)
          p=re.sub(r'(?m)^\s*root\s*=.*$','root = output/lcdm_joint_planck_',p)
          p=re.sub(r'(?m)^\s*output\s*=.*$','output = tCl,pCl,lCl',p)
          if not re.search(r'(?m)^\s*lensing\s*=',p): p += '\nlensing = yes\n'
          Path('output/lcdm_joint_planck.ini').write_text(p)
          PY
          ./class output/lcdm_joint_planck.ini

          python3 - <<'PY'
          from pathlib import Path
          import csv, numpy as np
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          TCMB=2.7255; CAL_SIGMA=0.0025
          high=TTTEEE_lite_native(packages_path='planck_packages')
          lowt=TT(packages_path='planck_packages')
          lowe=EE(packages_path='planck_packages')
          lens=LensingNative(packages_path='planck_packages')

          def load(path):
              a=np.loadtxt(path); ell=a[:,0].astype(int); lmax=int(ell.max())
              conv=(TCMB*1e6)**2
              tt=np.zeros(lmax+1); ee=np.zeros(lmax+1); te=np.zeros(lmax+1)
              bb=np.zeros(lmax+1); pp=np.zeros(lmax+1); tp=np.zeros(lmax+1); ep=np.zeros(lmax+1)
              tt[ell]=a[:,1]*conv; ee[ell]=a[:,2]*conv; te[ell]=a[:,3]*conv; bb[ell]=a[:,4]*conv
              ll=ell*(ell+1.0); pp[ell]=a[:,5]*ll
              tp[ell]=a[:,6]*np.sqrt(ll)*(TCMB*1e6); ep[ell]=a[:,7]*np.sqrt(ll)*(TCMB*1e6)
              return np.column_stack([ell,tt[ell],te[ell],ee[ell]]), {'tt':tt,'ee':ee,'te':te,'bb':bb,'pp':pp,'tp':tp,'ep':ep}

          def eval_one(path):
              h,d=load(path)
              def pieces(A):
                  A=float(A)
                  return (
                    float(high.chi_squared(h,A_planck=A)),
                    float(-2*lowt.log_likelihood(d['tt'],calib=A)),
                    float(-2*lowe.log_likelihood(d['ee'],calib=A)),
                    float(-2*lens.log_likelihood(d,A_planck=A)),
                    ((A-1.0)/CAL_SIGMA)**2
                  )
              def total(A): return sum(pieces(A))
              opt=minimize_scalar(total,bounds=(0.97,1.03),method='bounded',options={'xatol':1e-10})
              A=float(opt.x); vals=pieces(A)
              return A,*vals,sum(vals)

          rows=[]
          for label,path in [
              ('LCDM','output/lcdm_joint_planck_00_cl_lensed.dat'),
              ('NKp_v3_joint_best','output/sdmc_v3_joint_planck_best_00_cl_lensed.dat')]:
              A,ch,ct,ce,cl,cp,tot=eval_one(path)
              rows.append({'case':label,'A_planck':A,'chi2_highl':ch,'chi2_lowT':ct,
                           'chi2_lowE':ce,'chi2_lensing':cl,'chi2_cal_prior':cp,'chi2_total':tot})
              print(label,rows[-1],flush=True)
          ref=rows[0]['chi2_total']
          for r in rows: r['delta_chi2_vs_LCDM']=r['chi2_total']-ref
          with Path('output/sdmc_v3_joint_planck_final.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)
          PY

      - name: Preserve joint Planck optimization outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-nkp-v3-joint-planck-optimization
          path: |
            output/v3_joint_planck/sdmc_v3_joint_planck_scan.csv
            output/v3_joint_planck/sdmc_v3_joint_planck_best_fixedprim.csv
            output/v3_joint_planck/sdmc_v3_joint_planck_primordial_scan.csv
            output/v3_joint_planck/sdmc_v3_joint_planck_primordial_best.csv
            output/v3_joint_planck/best_grid_cl_lensed.dat
            output/sdmc_v3_joint_planck_best.ini
            output/sdmc_v3_joint_planck_best.log
            output/sdmc_v3_joint_planck_best_*
            output/lcdm_joint_planck_00_cl_lensed.dat
            output/sdmc_v3_joint_planck_final.csv
          if-no-files-found: warn
