name: SDMC fj028 calibrated SH0ES

on:
  push:
    branches:
      - sdmc-fj028-shoes-calibrated
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read

jobs:
  shoes-calibrated:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas

      - name: Download fj028 exact-covariant background artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf input_fj028
          mkdir -p input_fj028
          gh run download 37474538760 \
            --repo "${{ github.repository }}" \
            --name sdmc-r032-late266-autoparams-covariant-desi \
            --dir input_fj028
          test -f input_fj028/desi_cov_00_background.dat
          test -f input_fj028/desi_lcdm_00_background.dat
          echo "S117_SHOES_BACKGROUNDS_READY"

      - name: Install Pantheon+SH0ES data
        run: |
          rm -rf sn_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data
          test -f sn_data/PantheonPlus/Pantheon+SH0ES.dat
          test -f sn_data/PantheonPlus/Pantheon+SH0ES_STAT+SYS.cov

      - name: Run calibrated local-distance-ladder likelihood
        run: |
          python3 sdmc/run_partx_shoes_calibrated_hubble.py \
            FJ028=input_fj028/desi_cov_00_background.dat \
            LCDM_CONTROL=input_fj028/desi_lcdm_00_background.dat

      - name: Print summary
        if: always()
        run: |
          test ! -f output/partx_shoes_calibrated/partx_shoes_calibrated_summary.json || cat output/partx_shoes_calibrated/partx_shoes_calibrated_summary.json
          test ! -f output/partx_shoes_calibrated/partx_shoes_calibrated_summary.csv || cat output/partx_shoes_calibrated/partx_shoes_calibrated_summary.csv

      - name: Preserve Part X SH0ES verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-fj028-shoes-calibrated
          path: output/partx_shoes_calibrated/*
          if-no-files-found: warn

# fj028 validation trigger
