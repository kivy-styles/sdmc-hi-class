name: SDMC DES-Y3 official linear multistart robustness
on:
  push:
    branches: [sdmc-late300-react-exact]
    paths:
      - 'sdmc/run_late300_desy3_linear_multistart.py'
      - '.github/workflows/sdmc_late300_desy3_linear_multistart.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  robust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy
      - name: Recover exact linear Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}"             --name late300-desy3-native-weyl-tomography --dir output
          test -d output/weyl_spectra
      - name: Recover corrected ReACT bracket for imported module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/react_dense
          gh run download 37604828408 --repo "${{ github.repository }}"             --name late300-react-exact-bracket --dir output/react_dense
      - name: Download public DES-Y3 data
        run: |
          rm -rf des_y3_data
          git clone --depth 1 https://github.com/handley-lab/des_y3_data.git
          cd des_y3_data && git lfs pull || true
          cd ..
      - name: Run multistart robustness
        run: |
          python3 sdmc/run_late300_desy3_linear_multistart.py | tee output/desy3_linear_multistart.log
          cat output/desy3_linear_robust/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desy3-linear-multistart-robust
          path: |
            output/desy3_linear_robust/*
            output/desy3_linear_multistart.log
          if-no-files-found: warn
