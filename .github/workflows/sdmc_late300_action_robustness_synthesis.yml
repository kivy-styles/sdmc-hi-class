name: SDMC late300 accepted-action robustness synthesis

on:
  push:
    branches: [sdmc-late300-action-robustness-synthesis]
    paths:
      - '.github/workflows/sdmc_late300_action_robustness_synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recover accepted-action evidence layers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p synthesis/replay synthesis/basin synthesis/boltz synthesis/domain synthesis/wideboltz synthesis/fine synthesis/micro synthesis/extstab output
          gh run download 37581925240 --repo "${{ github.repository }}" --name late300-linear-g3-covariant-audit --dir synthesis/replay
          gh run download 37642049222 --repo "${{ github.repository }}" --name late300-action-basin-audit --dir synthesis/basin
          gh run download 37642609079 --repo "${{ github.repository }}" --name late300-action-basin-boltzmann --dir synthesis/boltz
          gh run download 37643563040 --repo "${{ github.repository }}" --name action-table-domain --dir synthesis/domain
          gh run download 37644463703 --repo "${{ github.repository }}" --name late300-action-basin-boltzmann-wide --dir synthesis/wideboltz
          gh run download 37644428724 --repo "${{ github.repository }}" --name late300-action-basin-fine-refine --dir synthesis/fine
          gh run download 37644771657 --repo "${{ github.repository }}" --name late300-action-basin-micro-refine --dir synthesis/micro
          gh run download 37644071818 --repo "${{ github.repository }}" --name late300-action-basin-extended-stability --dir synthesis/extstab
      - name: Build robustness synthesis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,math
          def find(name):
              h=list(Path("synthesis").rglob(name))
              if len(h)!=1: raise RuntimeError((name,h))
              return json.loads(h[0].read_text())
          replay=find("linear_cov_replay_comparison.json")
          basin=find("late300_action_basin_audit.json")
          boltz=find("late300_action_basin_boltzmann.json")
          domain=find("action_table_domain.json")
          wideboltz=find("late300_action_basin_boltzmann_wide.json")
          fine=find("late300_action_basin_fine_refine.json")
          micro=find("late300_action_basin_micro_refine.json")
          extstab=find("late300_action_basin_extended_stability.json")
          vals=list(boltz["variants"].values())
          widevals=list(wideboltz["variants"].values())
          out={
            "status":"accepted-action dynamical robustness synthesis",
            "canonical_replay":replay,
            "initial_condition_basin":{
              "n_variants":basin["n_variants"],
              "n_recovery_gate":basin["n_recovery_gate"],
              "all_recovery_gate":basin["all_recovery_gate"],
              "tested_clean_directions":"velocity perturbations and positive-phi perturbations remain inside the reconstructed action domain at the initial boundary; negative-phi perturbations begin outside it and are extrapolation tests"
            },
            "boltzmann_basin":{
              "n_perturbed_variants":len(vals),
              "max_TT_norm_abs":max(v["Cl_TT_max_norm_abs"] for v in vals),
              "max_EE_norm_abs":max(v["Cl_EE_max_norm_abs"] for v in vals),
              "max_PP_norm_abs":max(v["Cl_PP_max_norm_abs"] for v in vals),
              "max_Pk_frac_all_z":max(v["Pk_max_frac_all_z"] for v in vals),
              "pk_redshift_files_each":sorted(set(v["pk_files"] for v in vals))
            },
            "wide_boltzmann_basin":{
              "n_extreme_variants":len(widevals),
              "max_TT_norm_abs":max(v["Cl_TT_max_norm_abs"] for v in widevals),
              "max_EE_norm_abs":max(v["Cl_EE_max_norm_abs"] for v in widevals),
              "max_PP_norm_abs":max(v["Cl_PP_max_norm_abs"] for v in widevals),
              "max_Pk_frac_all_z":max(v["Pk_max_frac_all_z"] for v in widevals),
              "variants":wideboltz["variants"]
            },
            "physical_negative_phi_boundary":{
              "most_negative_stable":micro["most_negative_success"],
              "least_negative_unstable":micro["least_negative_failure"],
              "interpolated_zero_crossing_estimate":-0.78658,
              "instability_type":"scalar gradient instability",
              "micro_scan":micro,
              "fine_scan":fine,
              "coarse_extended_domain_scan":extstab
            },
            "action_table_domain":domain,
            "verdict":{
              "supported":"The frozen reconstructed accepted action reproduces the canonical late300 trajectory and returns percent-level initial-condition perturbations to essentially the same late-time background and Boltzmann observables.",
              "strengthened":"The accepted action carries a broad observable basin: even order-unity positive-field/velocity perturbations and a -90% velocity perturbation remain close to the late300 CMB and matter spectra.",
              "finite_basin":"After reconstructing the same action over an earlier field domain, the measured negative-field basin ends between delta_phi=-0.786 and -0.787 through a scalar gradient instability near z=1.38; interpolation places the zero crossing near -0.78658 but is not itself the measured threshold.",
              "not_claimed":"This demonstrates a broad finite basin in the tested directions, not a global-attractor theorem in the full phase space."
            }
          }
          Path("output/late300_action_robustness_synthesis.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("LATE300_ACTION_ROBUSTNESS_SYNTHESIS",json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: late300-action-robustness-synthesis
          path: |
            output/late300_action_robustness_synthesis.json
