name: SDMC structural clock attractor audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - sdmc-structural-clock-attractor-audit
  workflow_dispatch:

jobs:
  structural-clock-attractor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy

      - name: Syntax-check structural audit scripts
        run: |
          python3 -m py_compile \
            sdmc/run_future_homogeneous_covariant_stitch_audit.py \
            sdmc/run_future_noslip_fixedpoint_refinement.py \
            sdmc/run_future_perturbation_envelope_audit.py \
            sdmc/install_future_logstruct_tail.py \
            sdmc/patch_future_background_endpoint.py \
            sdmc/patch_future_today_bookkeeping.py \
            sdmc/patch_future_shooting_today.py \
            sdmc/patch_future_perturbation_endpoint.py \
            sdmc/patch_future_thermodynamics_extrapolation.py \
            sdmc/run_native_future_health_summary.py

      - name: Build parameterized late266 target
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean && make -j2 class
          mkdir -p output
          cat > output/target.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.023604633340554453, 3.4328776987879466, 0.36879721635160295, 0.34231919445927034, 1.0, 0.050275813910968366
          expansion_model = sdmc_full
          expansion_smg = 0.6991577808065268, 18.40625, 16.173189924377947, 0.5, 0.013036667098291217, 0.25, 0.010544837576337158, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = mPk
          P_k_max_h/Mpc = 0.2
          z_pk = 0
          write background = yes
          root = output/linear_cov_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/target.ini

      - name: Reconstruct accepted linear-G3 action
        run: |
          cp output/target.ini output/linear_cov_target.ini
          python3 sdmc/run_r032_late266_linear_covariant.py
          make clean && make -j2 class

      - name: Free evolve accepted linear-G3 action for structural input
        run: |
          cat > output/free.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_covariant_linear_audit
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = mPk
          P_k_max_h/Mpc = 0.2
          z_pk = 0
          write background = yes
          root = output/linear_cov_free_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/free.ini

      - name: Run epoch-dependent matter/baryon mapper audit
        run: |
          python3 sdmc/run_structural_epoch_mapper_audit.py

      - name: Run reduced structural-clock linear stability audit
        run: |
          python3 sdmc/run_structural_clock_linear_stability_audit.py

      - name: Run structural scaling-exponent audit
        run: |
          python3 sdmc/run_structural_scaling_exponent_audit.py

      - name: Run analytic future scaling-flow candidate
        run: |
          python3 sdmc/run_future_scaling_flow_candidate.py

      - name: Run C2 future action stitch design
        run: |
          python3 sdmc/run_future_action_stitch_design.py

      - name: Run exact homogeneous future covariant stitch audit
        run: |
          python3 sdmc/run_future_homogeneous_covariant_stitch_audit.py

      - name: Run bounded-activation future stress test
        run: |
          python3 sdmc/run_future_activation_bound_stress_test.py

      - name: Run future No-Slip fixed-point refinement
        run: |
          python3 sdmc/run_future_noslip_fixedpoint_refinement.py

      - name: Run future scalar perturbation envelope audit
        run: |
          python3 sdmc/run_future_perturbation_envelope_audit.py

      - name: Run structural current-root audit
        run: |
          python3 sdmc/run_structural_current_root_audit.py

      - name: Run mature coasting normal-form audit
        run: |
          python3 sdmc/run_mature_coasting_normal_form_audit.py

      - name: Run matter-loaded mature coasting bridge
        run: |
          python3 sdmc/run_matter_loaded_coasting_bridge.py

      - name: Run action-level matter-forced mature asymptotics
        run: |
          python3 sdmc/run_mature_matter_forced_asymptotics.py

      - name: Run mature fixed-point basin audit
        run: |
          python3 sdmc/run_mature_fixed_point_basin.py

      - name: Install structural-clock field form
        run: |
          python3 sdmc/install_late266_logstruct_covariant.py
          python3 sdmc/install_logstruct_attractor_ic_patch.py
          make clean && make -j2 class

      - name: Run perturbed structural-clock basin audit
        run: |
          python3 sdmc/run_structural_clock_attractor_audit.py

      - name: Print concise attractor verdict inputs
        run: |
          python3 - <<'PY'
          import json
          p='output/structural_clock_attractor/structural_clock_attractor_audit.json'
          d=json.load(open(p))
          print('STRUCTURAL_CLOCK_ATTRACTOR_SUMMARY')
          for k,v in d['cases'].items():
              if v.get('status')!='ok':
                  print(k,'FAILED',v.get('returncode'))
                  continue
              print(k,
                    'psi0=',v.get('psi0'),
                    'q0=',v.get('q0'),
                    'decay=',v.get('phase_space_decay_ratio'),
                    'max_dH_z100=',v.get('max_abs_deltaH_H_z100'))
          PY

      - name: Prepare isolated future-capable hi_class background
        run: |
          python3 sdmc/patch_future_background_endpoint.py --loga-final 5
          python3 sdmc/patch_future_today_bookkeeping.py
          python3 sdmc/patch_future_shooting_today.py

          cat > output/native_future.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_covariant_logstruct_audit
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 2.e-8
          a_ini_test_qs_smg = 2.e-8
          pert_ic_ini_z_ref_smg = 5.e7
          a_min_stability_test_smg = 2.e-8
          output_background_smg = 3
          write background = yes
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF

      - name: Native future hi_class matched-F endpoint
        continue-on-error: true
        run: |
          python3 sdmc/install_future_logstruct_tail.py --candidate matched_chi_F --psi-max 8
          make clean && make -j2 class
          cp output/native_future.ini output/native_future_matched.ini
          echo 'root = output/native_future_matched_' >> output/native_future_matched.ini
          set +e
          ./class output/native_future_matched.ini > output/native_future_matched.log 2>&1
          rc=$?
          echo "$rc" > output/native_future_matched.rc
          cat output/native_future_matched.log
          exit $rc

      - name: Native future hi_class bounded-activation endpoint
        continue-on-error: true
        run: |
          python3 sdmc/install_future_logstruct_tail.py --candidate bounded_chi --psi-max 8
          make clean && make -j2 class
          cp output/native_future.ini output/native_future_bounded.ini
          echo 'root = output/native_future_bounded_' >> output/native_future_bounded.ini
          set +e
          ./class output/native_future_bounded.ini > output/native_future_bounded.log 2>&1
          rc=$?
          echo "$rc" > output/native_future_bounded.rc
          cat output/native_future_bounded.log
          exit $rc

      - name: Summarize native future health
        if: always()
        run: |
          python3 sdmc/run_native_future_health_summary.py || true
          test -f output/native_future_health_summary.json && cat output/native_future_health_summary.json || true

      - name: Prepare isolated future perturbation propagation
        if: always()
        run: |
          python3 sdmc/patch_future_perturbation_endpoint.py
          python3 sdmc/patch_future_thermodynamics_extrapolation.py

      - name: Native future scalar perturbations matched-F endpoint
        id: future_pert_matched
        continue-on-error: true
        run: |
          python3 sdmc/install_future_logstruct_tail.py --candidate matched_chi_F --psi-max 8
          make clean && make -j2 class
          cp output/native_future.ini output/native_future_perturb_matched.ini
          cat >> output/native_future_perturb_matched.ini <<'EOF'
          modes = s
          output = mPk
          P_k_max_h/Mpc = 0.02
          z_pk = 0
          k_output_values = 0.0001, 0.001, 0.01
          root = output/native_future_perturb_matched_
          EOF
          set +e
          ./class output/native_future_perturb_matched.ini > output/native_future_perturb_matched.log 2>&1
          rc=$?
          echo "$rc" > output/native_future_perturb_matched.rc
          cat output/native_future_perturb_matched.log
          exit $rc

      - name: Native future scalar perturbations bounded endpoint
        id: future_pert_bounded
        if: always()
        continue-on-error: true
        run: |
          python3 sdmc/install_future_logstruct_tail.py --candidate bounded_chi --psi-max 8
          make clean && make -j2 class
          cp output/native_future.ini output/native_future_perturb_bounded.ini
          cat >> output/native_future_perturb_bounded.ini <<'EOF'
          modes = s
          output = mPk
          P_k_max_h/Mpc = 0.02
          z_pk = 0
          k_output_values = 0.0001, 0.001, 0.01
          root = output/native_future_perturb_bounded_
          EOF
          set +e
          ./class output/native_future_perturb_bounded.ini > output/native_future_perturb_bounded.log 2>&1
          rc=$?
          echo "$rc" > output/native_future_perturb_bounded.rc
          cat output/native_future_perturb_bounded.log
          exit $rc

      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-structural-clock-attractor-audit
          path: |
            output/linear_cov_reconstruction_summary.txt
            output/logstruct_redefinition_summary.txt
            output/structural_epoch_mappers.json
            output/structural_clock_linear_stability_audit.json
            output/structural_scaling_exponent_audit.json
            output/future_scaling_flow_candidate.json
            output/future_action_stitch_design.json
            output/future_homogeneous_covariant_stitch_audit.json
            output/future_activation_bound_stress_test.json
            output/future_noslip_fixedpoint_refinement.json
            output/future_perturbation_envelope_audit.json
            output/structural_current_root_audit.json
            output/mature_coasting_normal_form_audit.json
            output/matter_loaded_coasting_bridge.json
            output/mature_matter_forced_asymptotics.json
            output/mature_fixed_point_basin.json
            output/future_logstruct_tail_install.json
            output/native_future_health_summary.json
            output/native_future_matched.log
            output/native_future_matched.rc
            output/native_future_matched_00_background.dat
            output/native_future_bounded.log
            output/native_future_bounded.rc
            output/native_future_bounded_00_background.dat
            output/structural_clock_attractor/structural_clock_attractor_audit.json
            output/structural_clock_attractor/*.log
            output/structural_clock_attractor/*_00_background.dat
