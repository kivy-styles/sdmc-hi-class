# Planck-likelihood pipeline sanity control.
# Standard flat LCDM coordinates close to the Planck 2018 best-fit region.
# Keep the same massless-neutrino convention currently used by the SDMC CMB
# controls, so this is a pipeline check rather than a replacement for a fully
# matched Planck baseline with massive neutrinos.

H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
N_ncdm = 0
N_ur = 3.046
T_cmb = 2.7255
YHe = 0.2453

A_s = 2.10e-9
n_s = 0.9649
tau_reio = 0.0544

output = tCl,pCl,lCl
modes = s
lensing = yes
l_max_scalars = 3000

root = output/sdmc_planck_lcdm_control_
format = class
write parameters = yes
input_verbose = 0
background_verbose = 0
thermodynamics_verbose = 0
perturbations_verbose = 0
spectra_verbose = 0
lensing_verbose = 0
output_verbose = 1
