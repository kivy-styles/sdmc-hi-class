            257.,47.,40.,104.,
            .130,.130,.46,.207,.69,1.938
          ],float)
          # Best nuisance point from the independently parameterized L18_Z19.5
          # full-Plik profile. Since the covariant replay spectra agree at
          # ~1e-5 or better, this is a physically justified deterministic seed.
          param_best=np.array([
            1.0045213554451686,0.9998424064177515,0.9982224709218035,
            45.72423851559507,0.7248916197434251,6.976523105384968,5.500029149071257e-06,
            8.535071574604354,10.780908169898211,20.060917984547913,96.15277043474971,
            254.14725387485439,53.74852187444169,57.054180993875775,125.69753555422906,
            0.11540298701803288,0.13448306014088762,0.48055099721034644,
            0.2266942865821831,0.66858903191407,2.1183252356550293
          ],float)
          bounds=[
            (.97,1.03),
            (.9946,1.0058),(.99285,1.00325),
            (0,200),(0,1),(0,10),(0,10),
            (0,24.6),(0,26.6),(0,91.5),(0,251.9),
            (0,400),(0,400),(0,400),(0,400),
            (0,0.466),(0,0.418),(0,1.18),(0,0.783),(0,1.41),(0,6.258)
          ]
          gauss={
            'A_planck':(1.,.0025),
            'calib_100T':(1.0002,.0007),'calib_217T':(.99805,.00065),
            'gal545_A_100':(8.6,2.),'gal545_A_143':(10.6,2.),
            'gal545_A_143_217':(23.5,8.5),'gal545_A_217':(91.9,20.),
            'galf_TE_A_100':(.130,.042),'galf_TE_A_100_143':(.130,.036),
            'galf_TE_A_100_217':(.46,.09),'galf_TE_A_143':(.207,.072),
            'galf_TE_A_143_217':(.69,.09),'galf_TE_A_217':(1.938,.54),
          }
          expected=set(high.expected_params)
          supplied=set(fixed)|set(names)
          if expected!=supplied:
              raise RuntimeError(f'param mismatch missing={sorted(expected-supplied)} extra={sorted(supplied-expected)}')

          def load(path):
              a=np.loadtxt(path); ell=a[:,0].astype(int); n=int(ell.max())+1
              conv=(TCMB*1e6)**2
              dl={k:np.zeros(n) for k in ['tt','ee','bb','te','pp','tp','ep']}
              dl['tt'][ell]=a[:,1]*conv
              dl['ee'][ell]=a[:,2]*conv
              dl['te'][ell]=a[:,3]*conv
              dl['bb'][ell]=a[:,4]*conv
              ll=ell.astype(float)*(ell.astype(float)+1.)
              dl['pp'][ell]=a[:,5]*ll
              dl['tp'][ell]=a[:,6]*np.sqrt(ll)*(TCMB*1e6)
              dl['ep'][ell]=a[:,7]*np.sqrt(ll)*(TCMB*1e6)
              cl={k:np.zeros(n) for k in ['tt','ee','bb','te']}
              fac=np.zeros(n); q=ell>=2; fac[ell[q]]=2*np.pi/ll[q]
              for k in cl: cl[k][ell]=dl[k][ell]*fac[ell]
              return cl,dl

          def prior_chi2(p):
              c=0.
              for n,(mu,sig) in gauss.items():
                  c+=((p[n]-mu)/sig)**2
              c+=((p['ksz_norm']+1.6*p['A_sz']-9.5)/3.0)**2
              return float(c)

          def make_objective(path):
              cl,dl=load(path)
              def objective(*x):
                  p=dict(fixed); p.update(dict(zip(names,map(float,x))))
                  lh=float(high.log_likelihood(cl,**p)); A=p['A_planck']
                  lt=float(lowT.log_likelihood(dl['tt'],calib=A))
                  le=float(lowE.log_likelihood(dl['ee'],calib=A))
                  lp={lens.calibration_param:A} if getattr(lens,'calibration_param',None) else {}
                  ll=float(lens.log_likelihood(dl,**lp))
                  if not all(np.isfinite([lh,lt,le,ll])): return 1e100
                  return float(-2*(lh+lt+le+ll)+prior_chi2(p))
              def pieces(x):
                  p=dict(fixed); p.update(dict(zip(names,map(float,x))))
                  lh=float(high.log_likelihood(cl,**p)); A=p['A_planck']
                  lt=float(lowT.log_likelihood(dl['tt'],calib=A))
                  le=float(lowE.log_likelihood(dl['ee'],calib=A))
                  lp={lens.calibration_param:A} if getattr(lens,'calibration_param',None) else {}
                  ll=float(lens.log_likelihood(dl,**lp))
                  return p,lh,lt,le,ll
              return objective,pieces

          def run_one(label,path,seeds):
              fun,pieces=make_objective(path)
              best=None
              for iseed,seed in enumerate(seeds):
                  m=Minuit(fun,*seed,name=names)
                  m.errordef=1.0; m.strategy=1; m.tol=0.1
                  for n,b in zip(names,bounds): m.limits[n]=b
                  for n in names: m.errors[n]=max(1e-5,0.02*max(abs(m.values[n]),1.0))
                  m.migrad(ncall=6000)
                  if not m.fmin.is_valid:
                      m.simplex(ncall=3000); m.migrad(ncall=6000)
                  row=(float(m.fval),np.array([m.values[n] for n in names],float),bool(m.fmin.is_valid),int(m.nfcn))
                  print('COV_MINUIT_SEED',label,iseed,row[0],row[2],row[3],flush=True)
                  if best is None or row[0]<best[0]: best=row
              fval,x,valid,nfcn=best
              p,lh,lt,le,ll=pieces(x)
              row={'model':label,'chi2_profile_total':fval,'chi2_high_full':-2*lh,
                   'chi2_lowT':-2*lt,'chi2_lowE':-2*le,'chi2_lensing':-2*ll,
                   'chi2_nuisance_priors':prior_chi2(p),'A_planck':p['A_planck'],
                   'valid':valid,'nfcn':nfcn}
              row.update({n:p[n] for n in names if n!='A_planck'})
              print('COV_MINUIT_RESULT',json.dumps(row,sort_keys=True),flush=True)
              return row,x

          displaced=x0.copy(); displaced[3]=80.; displaced[5]=5.; displaced[6]=2.
          cov,cx=run_one('COVARIANT',OUT/'covariant_observable_00_cl_lensed.dat',[param_best,x0,displaced])
          lcdm,lx=run_one('LCDM',OUT/'fullplik_lcdm_00_cl_lensed.dat',[x0,param_best,cx])
          delta=cov['chi2_profile_total']-lcdm['chi2_profile_total']
          print('PROFILE_L1870_Z17775_FLOOR045_COV_MINUIT_DELTA_CHI2_COV_MINUS_LCDM',delta,flush=True)
          fields=list(cov.keys())
          with (OUT/'fullplik_profile.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows([cov,lcdm])
          (OUT/'fullplik_delta.txt').write_text(f'{delta:.12g}\n')
          PY

