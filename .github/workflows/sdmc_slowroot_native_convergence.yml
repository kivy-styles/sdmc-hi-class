name: SDMC slow-root native convergence

on:
  push:
    branches:
      - sdmc-structural-clock-attractor-audit
    paths:
      - ".github/workflows/sdmc_slowroot_native_convergence.yml"
      - "sdmc/install_future_logstruct_tail.py"
      - "sdmc/patch_future_background_endpoint.py"
      - "sdmc/patch_future_today_bookkeeping.py"
      - "sdmc/patch_future_shooting_today.py"
      - "sdmc/install_late266_logstruct_covariant.py"
      - "sdmc/install_logstruct_attractor_ic_patch.py"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: "n6_r2600", endpoint: 6.0, points: 2600, psimax: 12.0 }
          - { tag: "n7_r2600", endpoint: 7.0, points: 2600, psimax: 12.0 }
          - { tag: "n8_r2600", endpoint: 8.0, points: 2600, psimax: 12.0 }
          - { tag: "n9_r2600", endpoint: 9.0, points: 2600, psimax: 12.0 }
          - { tag: "n10_r2600", endpoint: 10.0, points: 2600, psimax: 12.0 }
          - { tag: "n10_r5200", endpoint: 10.0, points: 5200, psimax: 12.0 }

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential >/dev/null
          python3 -m pip install -q numpy scipy

      - name: Build accepted target background
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean >/dev/null && make -j2 class >/dev/null
          mkdir -p output
          cat > output/target.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.023604633340554453, 3.4328776987879466, 0.36879721635160295, 0.34231919445927034, 1.0, 0.050275813910968366
          expansion_model = sdmc_full
          expansion_smg = 0.6991577808065268, 18.40625, 16.173189924377947, 0.5, 0.013036667098291217, 0.25, 0.010544837576337158, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = mPk
          P_k_max_h/Mpc = 0.2
          z_pk = 0
          write background = yes
          root = output/linear_cov_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/target.ini >/dev/null
          cp output/target.ini output/linear_cov_target.ini
          python3 sdmc/run_r032_late266_linear_covariant.py
          make clean >/dev/null && make -j2 class >/dev/null

      - name: Install accepted structural-clock action and future patches
        run: |
          python3 sdmc/install_late266_logstruct_covariant.py
          python3 sdmc/install_logstruct_attractor_ic_patch.py
          python3 sdmc/patch_future_background_endpoint.py --loga-final \${{ matrix.endpoint }}
          python3 sdmc/patch_future_today_bookkeeping.py
          python3 sdmc/patch_future_shooting_today.py
          cat > output/native_future.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_covariant_logstruct_audit
          parameters_smg = 0.0, 0.0, 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 2.e-8
          a_ini_test_qs_smg = 2.e-8
          pert_ic_ini_z_ref_smg = 5.e7
          a_min_stability_test_smg = 2.e-8
          output_background_smg = 3
          write background = yes
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF

      - name: Run slow-root native endpoint
        run: |
          python3 sdmc/install_future_logstruct_tail.py \
            --candidate legacy_canonical_slowroot \
            --psi-max \${{ matrix.psimax }} \
            --future-points \${{ matrix.points }}
          make clean >/dev/null && make -j2 class >/dev/null
          cp output/native_future.ini output/scan.ini
          echo 'root = output/scan_' >> output/scan.ini
          set +e
          ./class output/scan.ini > output/scan.log 2>&1
          rc=$?
          set -e
          echo "$rc" > output/scan.rc
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          tag="\${{ matrix.tag }}"
          endpoint=float("\${{ matrix.endpoint }}")
          points=int("\${{ matrix.points }}")
          rc=int(Path("output/scan.rc").read_text().strip())
          log=Path("output/scan.log").read_text(errors="replace")
          m=re.findall(r"rho_crit = ([-+0-9.eE]+)",log)
          rho=float(m[-1]) if m else None
          err=[x for x in log.splitlines() if "error" in x.lower() or "failed" in x.lower()]
          bg=Path("output/scan_00_background.dat")
          out={
            "tag":tag,"endpoint":endpoint,"future_points":points,
            "returncode":rc,"success":rc==0 and bg.exists(),
            "rho_crit_failure":rho,
            "error_tail":err[-8:],
            "background_exists":bg.exists(),
          }
          Path("output/convergence.json").write_text(json.dumps(out,indent=2)+"\n")
          print("SLOWROOT_CONVERGENCE",json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slowroot-\${{ matrix.tag }}
          path: |
            output/convergence.json
            output/scan.log
            output/scan.rc
            output/future_logstruct_tail_install.json
          if-no-files-found: ignore
