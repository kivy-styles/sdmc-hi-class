name: SDMC current late300 canonical native ln10

on:
  push:
    branches: [sdmc-late300-current-canonical-native]
    paths:
      - 'sdmc/install_current_late300_logstruct_covariant.py'
      - 'sdmc/install_current_late300_future_logstruct_tail.py'
      - 'sdmc/install_logstruct_attractor_ic_patch.py'
      - 'sdmc/patch_future_background_endpoint.py'
      - 'sdmc/patch_future_today_bookkeeping.py'
      - 'sdmc/patch_future_shooting_today.py'
      - 'sdmc/patch_future_perturbation_endpoint.py'
      - 'sdmc/patch_future_thermodynamics_extrapolation.py'
      - '.github/workflows/sdmc_current_late300_canonical_native_ln10.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: fast, candidate: legacy_canonical }
          - { tag: slow, candidate: legacy_canonical_slowroot }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential >/dev/null
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install numpy scipy >/dev/null

      - name: Recover current accepted late300 products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovered output
          gh run download 37581925240 --repo "${{ github.repository }}" --name late300-linear-g3-covariant-audit --dir recovered
          cp "$(find recovered -name linear_cov_target.ini -print -quit)" output/linear_cov_target.ini
          cp "$(find recovered -name linear_cov_target_00_background.dat -print -quit)" output/linear_cov_target_00_background.dat
          cp "$(find recovered -name linear_cov_free_00_background.dat -print -quit)" output/linear_cov_free_00_background.dat
          test -s output/linear_cov_target_00_background.dat
          test -s output/linear_cov_free_00_background.dat

      - name: Install current SDMC and reconstructed covariant action
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          python3 sdmc/run_late300_linear_covariant.py
          python3 sdmc/install_current_late300_logstruct_covariant.py
          python3 sdmc/install_logstruct_attractor_ic_patch.py

      - name: Install future-capable CLASS bookkeeping
        run: |
          python3 sdmc/patch_future_background_endpoint.py --loga-final 10
          python3 sdmc/patch_future_today_bookkeeping.py
          python3 sdmc/patch_future_shooting_today.py
          python3 sdmc/patch_future_perturbation_endpoint.py
          python3 sdmc/patch_future_thermodynamics_extrapolation.py

      - name: Prepare current late300 native input
        run: |
          cat > output/native_future.ini <<'EOF'
          H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1047019076951746e-09
          n_s = 0.9628416801318527
          tau_reio = 0.053167105823755265
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_covariant_logstruct_audit
          parameters_smg = 0.0, 0.0, 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 2.e-8
          a_ini_test_qs_smg = 2.e-8
          pert_ic_ini_z_ref_smg = 5.e7
          a_min_stability_test_smg = 2.e-8
          output_background_smg = 3
          modes = s
          output = mPk
          P_k_max_h/Mpc = 0.02
          z_pk = 0
          k_output_values = 0.0001, 0.001, 0.01
          write background = yes
          write parameters = yes
          write warnings = yes
          format = class
          input_verbose = 1
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 1
          output_verbose = 0
          EOF

      - name: Install rebased canonical tail and run native perturbations
        run: |
          python3 sdmc/install_current_late300_future_logstruct_tail.py             --candidate "${{ matrix.candidate }}"             --psi-max 12             --future-points 2600
          make clean >/dev/null
          make -j2 class >/dev/null
          cp output/native_future.ini "output/current_${{ matrix.tag }}.ini"
          echo "root = output/current_${{ matrix.tag }}_" >> "output/current_${{ matrix.tag }}.ini"
          set +e
          ./class "output/current_${{ matrix.tag }}.ini" > "output/current_${{ matrix.tag }}.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "output/current_${{ matrix.tag }}.rc"
          if [ "$rc" -ne 0 ]; then
            tail -100 "output/current_${{ matrix.tag }}.log"
            exit "$rc"
          fi

      - name: Summarize native background and perturbation gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,numpy as np
          from scipy.interpolate import CubicSpline
          tag="${{ matrix.tag }}"
          bg=Path(f"output/current_{tag}_00_background.dat")
          rc=int(Path(f"output/current_{tag}.rc").read_text())
          def read_table(path):
              ls=path.read_text(errors="replace").splitlines()
              hdr=[x for x in ls if x.startswith("#") and re.search(r"(?:^|\s)1\s*:",x)][-1].lstrip("#").strip()
              ms=list(re.finditer(r"(\d+)\s*:\s*",hdr)); ns=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  ns.append(hdr[m.end():e].strip())
              a=np.loadtxt(path)
              if a.ndim==1:a=a[None,:]
              return ns,a
          names,a=read_table(bg)
          def col(*opts):
              for q in opts:
                  if q in names:return np.asarray(a[:,names.index(q)],float)
              return None
          z=col("z"); H=col("H [1/Mpc]"); D=col("kin (D)"); cs=col("c_s^2")
          F=col("M*^2_smg"); ab=col("braiding_smg"); am=col("M2_running_smg")
          N=-np.log1p(z); o=np.argsort(N); N=N[o]; H=H[o]
          q=-1.0-CubicSpline(N,np.log(H))(N,1)
          pfiles=sorted(Path("output").glob(f"current_{tag}_*perturbations_k*_s.dat"))
          finite=True; maxabs=0.0
          for p in pfiles:
              x=np.loadtxt(p)
              finite=finite and bool(np.all(np.isfinite(x)))
              if x.size:maxabs=max(maxabs,float(np.nanmax(np.abs(x))))
          noslip=None
          if ab is not None and am is not None:
              noslip=float(np.nanmax(np.abs(ab+2*am)))
          out={
            "status":"current late300 native canonical ln10 background+scalar perturbation gate",
            "branch":tag,"returncode":rc,
            "background_exists":bg.exists(),
            "ln_a_final":float(np.max(N)),
            "final":{
              "q":float(q[-1]),
              "D":float(D[o][-1]) if D is not None else None,
              "cs2":float(cs[o][-1]) if cs is not None else None,
              "F":float(F[o][-1]) if F is not None else None
            },
            "health":{
              "min_D":float(np.min(D)) if D is not None else None,
              "min_cs2":float(np.min(cs)) if cs is not None else None,
              "max_cs2":float(np.max(cs)) if cs is not None else None,
              "max_abs_alphaB_plus_2alphaM":noslip
            },
            "perturbations":{
              "n_files":len(pfiles),"all_finite":finite,"max_abs_raw":maxabs
            }
          }
          out["gate_pass"]=bool(rc==0 and bg.exists() and len(pfiles)>=3 and finite
                                and out["health"]["min_D"]>0 and out["health"]["min_cs2"]>0
                                and abs(out["final"]["q"])<5e-3
                                and abs(out["final"]["D"]-2)<5e-3
                                and abs(out["final"]["cs2"]-1)<5e-3)
          Path(f"output/current_{tag}_native_summary.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("CURRENT_LATE300_NATIVE_CANONICAL",json.dumps(out,sort_keys=True))
          if not out["gate_pass"]: raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-late300-native-${{ matrix.tag }}
          path: |
            output/current_${{ matrix.tag }}_native_summary.json
            output/current_${{ matrix.tag }}.log
            output/current_${{ matrix.tag }}.rc
            output/current_${{ matrix.tag }}_00_background.dat
            output/current_${{ matrix.tag }}_*perturbations_k*_s.dat
            output/future_logstruct_tail_install.json
          if-no-files-found: warn
