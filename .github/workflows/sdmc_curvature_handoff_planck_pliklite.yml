name: SDMC curvature-handoff Planck Plik-lite gate

on:
  push:
    branches: [sdmc-late300-activation-min-handoff-test]
    paths:
      - '.github/workflows/sdmc_curvature_handoff_planck_pliklite.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  planck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy cobaya
      - name: Apply SDMC patches and build
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean && make -j2 class
      - name: Recover accepted late300 spectrum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p accepted output
          gh run download 37581925240 --repo "${{ github.repository }}" --name late300-linear-g3-covariant-audit --dir accepted
      - name: Run curvature-handoff candidate
        run: |
          cat > output/curvature_handoff.ini <<'EOF'
          H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1047019076951746e-09
          n_s = 0.9628416801318527
          tau_reio = 0.053167105823755265
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.02048146490100771, 3.927876388467848, 0.33114133956842123, 0.34231919445927034, 1.0, 0.05181542627513409
          expansion_model = sdmc_full
          expansion_smg = 0.7014079815036496, 18.40625, 16.78177310642457, 0.5, 0.024822032167576252, 0.25, 0.01264704344701022, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = tCl,pCl,lCl
          lensing = yes
          l_max_scalars = 3000
          write background = yes
          root = output/curvature_handoff_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          lensing_verbose = 0
          output_verbose = 0
          EOF
          ./class output/curvature_handoff.ini
      - name: Install Planck Plik-lite
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          ok=TTTEEE_lite_native.install(path='planck_packages',no_progress_bars=True)
          if not ok: raise SystemExit('Plik-lite install failed')
          PY
      - name: Compare Plik-lite
        run: |
          ACC=$(find accepted -name linear_cov_target_00_cl_lensed.dat | head -1)
          python3 sdmc/evaluate_planck_pliklite.py             --packages planck_packages             --output output/curvature_handoff_pliklite.csv             "ACCEPTED_LATE300=$ACC"             "CURVATURE_HANDOFF=output/curvature_handoff_00_cl_lensed.dat"
          python3 - <<'PY'
          import pandas as pd,json
          d=pd.read_csv('output/curvature_handoff_pliklite.csv')
          print(d.to_string(index=False))
          print("CURVATURE_HANDOFF_PLANCK_TABLE",json.dumps(d.to_dict(orient='records')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curvature-handoff-planck-pliklite
          path: |
            output/curvature_handoff_pliklite.csv
            output/curvature_handoff_00_cl_lensed.dat
            output/curvature_handoff_00_background.dat
