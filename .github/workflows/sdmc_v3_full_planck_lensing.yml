name: SDMC NKp-v3 full Planck plus lensing

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  full-planck-lensing:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy numpy pandas getdist

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py

      - name: Expose exact native cs2 diagnostics
        run: python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build hi_class
        run: make -j2 class

      - name: Install native Planck likelihood data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          classes=[TTTEEE_lite_native,TT,EE,LensingNative]
          for cls in classes:
              ok=cls.install(path='planck_packages',no_progress_bars=True)
              if not ok:
                  raise SystemExit(f'Planck likelihood install failed for {cls.__name__}')
          PY

      - name: Generate common CMB-only branch configurations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re,textwrap

          Path('output').mkdir(exist_ok=True)
          AS_V3=math.exp(3.076)/1e10

          def v3_ini(root):
              return textwrap.dedent(f'''\
              H0 = 70.8514
              omega_b = 0.02239952
              omega_cdm = 0.12444227328918850
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = {AS_V3:.14e}
              n_s = 0.962
              tau_reio = 0.0544
              Omega_Lambda = 0
              Omega_fld = 3.1443554e-8
              fluid_equation_of_state = SDMC_TRACKER
              cs2_fld = 0.003
              use_ppf = no
              Omega_smg = -1
              gravity_model = sdmc_v3_native_noslip
              parameters_smg = 0.0736, 4.25, 1.43, 0.1, 0.0001
              expansion_model = sdmc_full
              expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
              pert_initial_conditions_smg = zero
              method_qs_smg = fully_dynamic
              output_background_smg = 3
              output = tCl,pCl,lCl
              modes = s
              lensing = yes
              l_max_scalars = 3000
              write thermodynamics = yes
              write background = yes
              write parameters = yes
              root = {root}
              format = class
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          def rewrite(path,root,skip_stability=False):
              p=Path(path).read_text()
              p=re.sub(r'(?m)^\s*root\s*=.*$',f'root = {root}',p)
              p=re.sub(r'(?m)^\s*output\s*=.*$','output = tCl,pCl,lCl',p)
              p=re.sub(r'(?m)^\s*l_max_scalars\s*=.*$','l_max_scalars = 3000',p)
              if skip_stability and not re.search(r'(?m)^\s*skip_stability_tests_smg\s*=',p):
                  p += '\nskip_stability_tests_smg = yes\n'
              return p

          Path('output/nkp_v3_best.ini').write_text(v3_ini('output/nkp_v3_best_'))

          lcdm=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          lcdm=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {math.exp(3.044)/1e10:.14e}',lcdm)
          lcdm=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',lcdm)
          lcdm=re.sub(r'(?m)^\s*root\s*=.*$','root = output/lcdm_profile_',lcdm)
          lcdm=re.sub(r'(?m)^\s*output\s*=.*$','output = tCl,pCl,lCl',lcdm)
          Path('output/lcdm_profile.ini').write_text(lcdm)

          Path('output/kp_fullbg.ini').write_text(
              rewrite('sdmc/config/kp_fullbg_clustered_cs0003.ini','output/kp_fullbg_',True))
          Path('output/kp_tracker.ini').write_text(
              rewrite('sdmc/config/kp_tracker_clustered_cs0003.ini','output/kp_tracker_',True))
          PY

      - name: Run mandatory NKp-v3 and LCDM CMB spectra
        run: |
          ./class output/nkp_v3_best.ini
          ./class output/lcdm_profile.ini

      - name: Run frozen Kp CMB references
        continue-on-error: true
        run: |
          ./class output/kp_fullbg.ini || echo "Kp full-background CMB reference unavailable"
          ./class output/kp_tracker.ini || echo "Kp tracker CMB reference unavailable"

      - name: Evaluate high-l plus low-l plus lensing with one calibration profile
        run: |
          cat > output/evaluate_full_planck_lensing.py <<'PY'
          from pathlib import Path
          import csv, math
          import numpy as np
          from scipy.optimize import minimize_scalar

          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          TCMB=2.7255
          CAL_SIGMA=0.0025
          PACKAGES='planck_packages'

          high=TTTEEE_lite_native(packages_path=PACKAGES)
          lowt=TT(packages_path=PACKAGES)
          lowe=EE(packages_path=PACKAGES)
          lens=LensingNative(packages_path=PACKAGES)

          def load(path):
              a=np.loadtxt(path)
              ell=a[:,0].astype(int)
              lmax=int(ell.max())
              conv=(TCMB*1e6)**2

              tt=np.zeros(lmax+1); ee=np.zeros(lmax+1); te=np.zeros(lmax+1)
              bb=np.zeros(lmax+1); pp=np.zeros(lmax+1)
              tp=np.zeros(lmax+1); ep=np.zeros(lmax+1)

              tt[ell]=a[:,1]*conv
              ee[ell]=a[:,2]*conv
              te[ell]=a[:,3]*conv
              bb[ell]=a[:,4]*conv

              # hi_class class-format output stores l(l+1)/(2pi) C_l for phi.
              # Cobaya ell_factor=True expects [l(l+1)]^2/(2pi) C_l^{phi phi}.
              ll=ell*(ell+1.0)
              pp[ell]=a[:,5]*ll
              tp[ell]=a[:,6]*np.sqrt(ll)*(TCMB*1e6)
              ep[ell]=a[:,7]*np.sqrt(ll)*(TCMB*1e6)

              high_array=np.column_stack([ell,tt[ell],te[ell],ee[ell]])
              dls={'tt':tt,'ee':ee,'te':te,'bb':bb,'pp':pp,'tp':tp,'ep':ep}
              return high_array,dls

          def evaluate(path):
              high_array,dls=load(path)

              def pieces(A):
                  A=float(A)
                  chi_high=float(high.chi_squared(high_array,A_planck=A))
                  chi_lowt=float(-2*lowt.log_likelihood(dls['tt'],calib=A))
                  chi_lowe=float(-2*lowe.log_likelihood(dls['ee'],calib=A))
                  chi_lens=float(-2*lens.log_likelihood(dls,A_planck=A))
                  prior=((A-1.0)/CAL_SIGMA)**2
                  return chi_high,chi_lowt,chi_lowe,chi_lens,prior

              def total(A):
                  vals=pieces(A)
                  if not all(np.isfinite(vals)):
                      return np.inf
                  return sum(vals)

              opt=minimize_scalar(total,bounds=(0.97,1.03),method='bounded',
                                  options={'xatol':1e-10})
              A=float(opt.x)
              ch,ct,ce,cl,cp=pieces(A)
              return {
                  'A_planck':A,
                  'chi2_highl_pliklite':ch,
                  'chi2_lowl_TT':ct,
                  'chi2_lowl_EE':ce,
                  'chi2_lensing':cl,
                  'chi2_cal_prior':cp,
                  'chi2_total_planck_plus_lensing':ch+ct+ce+cl+cp
              }

          cases={
              'LCDM_profile':'output/lcdm_profile_00_cl_lensed.dat',
              'NKp_v3_ultrafine':'output/nkp_v3_best_00_cl_lensed.dat',
              'Kp_fullbg_frozen':'output/kp_fullbg_00_cl_lensed.dat',
              'Kp_tracker_frozen':'output/kp_tracker_00_cl_lensed.dat',
          }

          rows=[]
          for label,path in cases.items():
              if not Path(path).exists():
                  print('SKIP',label,path,flush=True)
                  continue
              r={'case':label,'file':path}
              r.update(evaluate(path))
              rows.append(r)
              print(label,r,flush=True)

          if not any(r['case']=='LCDM_profile' for r in rows):
              raise SystemExit('mandatory LCDM result missing')
          if not any(r['case']=='NKp_v3_ultrafine' for r in rows):
              raise SystemExit('mandatory NKp-v3 result missing')

          out=Path('output/sdmc_v3_full_planck_lensing.csv')
          with out.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys()))
              w.writeheader(); w.writerows(rows)
          print(out)
          PY
          python3 output/evaluate_full_planck_lensing.py

      - name: Preserve full Planck plus lensing outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-nkp-v3-full-planck-lensing
          path: |
            output/sdmc_v3_full_planck_lensing.csv
            output/evaluate_full_planck_lensing.py
            output/nkp_v3_best.ini
            output/nkp_v3_best_00_*
            output/lcdm_profile_00_*
            output/kp_fullbg_00_*
            output/kp_tracker_00_*
          if-no-files-found: warn
