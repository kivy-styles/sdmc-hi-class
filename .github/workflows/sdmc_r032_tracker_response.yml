name: SDMC r032 lambda-zt boundary fine scan

on:
  push:
    branches:
      - sdmc-r032-lzt-boundary-fine
  workflow_dispatch:

jobs:
  lambda-zt-boundary-fine:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy numpy pandas

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Add corrected independent kinetic model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path,old,new):
              p=Path(path); s=p.read_text()
              if new in s:
                  return
              if s.count(old)!=1:
                  raise RuntimeError(f'{path}: anchor count {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          rep('include/background.h',
              '    constant_alphas, sdmc_early_cs, sdmc_v2_noslip, sdmc_v2_late_noslip, sdmc_kp_late_noslip, sdmc_v3_native_noslip,\n',
              '    constant_alphas, sdmc_early_cs, sdmc_v2_noslip, sdmc_v2_late_noslip, sdmc_kp_late_noslip, sdmc_v3_native_noslip, sdmc_v3_independent_kinetic,\n')

          anchor='''  if (strcmp(string1,"eft_alphas_power_law") == 0) {'''
          parser='''  if (strcmp(string1,"sdmc_v3_independent_kinetic") == 0) {
             pba->gravity_model_smg = sdmc_v3_independent_kinetic;
             pba->field_evolution_smg = _FALSE_;
             pba->M2_evolution_smg = _FALSE_;
             flag2=_TRUE_;
             pba->parameters_2_size_smg = 6;
             class_read_list_of_doubles("parameters_smg",pba->parameters_2_smg,pba->parameters_2_size_smg);
             class_test(pba->parameters_2_smg[0] <= 0. || pba->parameters_2_smg[1] <= 0. ||
                        pba->parameters_2_smg[2] <= 0. || pba->parameters_2_smg[3] <= 0. ||
                        pba->parameters_2_smg[4] < 0. || pba->parameters_2_smg[5] <= 0., errmsg,
                        "sdmc_v3_independent_kinetic requires positive AF,zc,width,D0,Dfloor and non-negative p");
           }

          if (strcmp(string1,"eft_alphas_power_law") == 0) {'''
          rep('gravity_smg/gravity_models_smg.c',anchor,parser)

          canchor='''  else if (pba->gravity_model_smg == eft_alphas_power_law) {'''
          closure=r'''  else if (pba->gravity_model_smg == sdmc_v3_independent_kinetic) {
            double AF=pba->parameters_2_smg[0];
            double zc=pba->parameters_2_smg[1];
            double width=pba->parameters_2_smg[2];
            double D0=pba->parameters_2_smg[3];
            double power=pba->parameters_2_smg[4];
            double Dfloor=pba->parameters_2_smg[5];
            double N=log(a);
            double Nc=-log(1.+zc);
            double x=(N-Nc)/(2.*width);
            double th=tanh(x);
            double ch=cosh(x);
            double sech2=1./(ch*ch);
            double S=.5*(1.+th);
            double F=exp(AF*S);
            double am=AF/(4.*width)*sech2;
            double bra=-2.*am;
            /* Independently prescribed closure:
             * D = 1e-4 + 0.40 S for this joint scan.
             * No target c_s^2 or cs2num enters the definition. */
            double D=Dfloor + D0*pow(S,power);
            double ak=D-1.5*bra*bra;
            pvecback[pba->index_bg_kineticity_smg]=ak;
            pvecback[pba->index_bg_braiding_smg]=bra;
            pvecback[pba->index_bg_tensor_excess_smg]=0.;
            pvecback[pba->index_bg_M2_running_smg]=am;
            pvecback[pba->index_bg_beyond_horndeski_smg]=0.;
            pvecback[pba->index_bg_delta_M2_smg]=F-1.;
            pvecback[pba->index_bg_M2_smg]=F;
          }

          else if (pba->gravity_model_smg == eft_alphas_power_law) {'''
          rep('gravity_smg/gravity_models_smg.c',canchor,closure)
          print('INDEPENDENT_D_MODEL_INSTALLED')
          PY

      - name: Build hi_class
        run: make -j2 class

      - name: Install Planck likelihood data and SN data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              ok=cls.install(path='planck_packages',no_progress_bars=True)
              if not ok: raise SystemExit(f'Planck install failed: {cls}')
          PY
          rm -rf sn_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data

      - name: Run independent-D Planck SN joint screen
        run: |
          mkdir -p output/joint_screen
          python3 - <<'PY'
          from pathlib import Path
          import csv,math,re,subprocess,textwrap,json
          import numpy as np
          import pandas as pd
          from scipy.optimize import minimize_scalar
          from scipy.linalg import cho_factor,cho_solve
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          OUT=Path('output/joint_screen')
          TCMB=2.7255
          CAL_SIGMA=0.0025
          high=TTTEEE_lite_native(packages_path='planck_packages')
          lowT=TT(packages_path='planck_packages')
          lowE=EE(packages_path='planck_packages')
          lens=LensingNative(packages_path='planck_packages')

          # Corrected independent kinetic closure held fixed.
          D0=0.40
          POWER=1.0
          DFLOOR=1e-4

          # One-at-a-time response map of the remaining untuned sdmc_full
          # tracker / handoff parameters. Omega_X0 is index 0 and is the
          # default hi_class shooting parameter, so it is intentionally not
          # treated as an independent scan direction here.
          LAMBDAS=[17.0,17.25,17.5,17.75,18.0,18.25,18.5]
          ZTS=[18.6,18.8,19.0,19.2,19.4,19.6,19.8,20.0,20.2,20.4]
          candidates=[(f'L{lam:g}_Z{zt:g}',lam,zt,0.50) for lam in LAMBDAS for zt in ZTS]

          # ---------- shared table helpers ----------
          def table(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              return pd.DataFrame(np.loadtxt(path),columns=names).sort_values('z')

          def load_cls(path):
              a=np.loadtxt(path); ell=a[:,0].astype(int); n=int(ell.max())+1
              conv=(TCMB*1e6)**2
              tt=np.zeros(n); ee=np.zeros(n); te=np.zeros(n); pp=np.zeros(n)
              tt[ell]=a[:,1]*conv; ee[ell]=a[:,2]*conv; te[ell]=a[:,3]*conv
              L=ell.astype(float); pp[ell]=a[:,5]*L*(L+1.)
              return np.column_stack([ell,tt[ell],te[ell],ee[ell]]),{
                  'tt':tt,'te':te,'ee':ee,'pp':pp}

          def planck_score(path):
              harr,dls=load_cls(path)
              def pieces(A):
                  A=float(A)
                  ch=float(high.chi_squared(harr,A_planck=A))
                  ct=float(-2*lowT.log_likelihood(dls['tt'],calib=A))
                  ce=float(-2*lowE.log_likelihood(dls['ee'],calib=A))
                  lp={lens.calibration_param:A} if getattr(lens,'calibration_param',None) else {}
                  cl=float(-2*lens.log_likelihood(dls,**lp))
                  cp=((A-1.)/CAL_SIGMA)**2
                  return ch,ct,ce,cl,cp,ch+ct+ce+cl+cp
              opt=minimize_scalar(lambda A:pieces(A)[-1],bounds=(0.97,1.03),
                                  method='bounded',options={'xatol':1e-10})
              A=float(opt.x)
              return (A,)+pieces(A)

          # ---------- SN data read once ----------
          DATA=Path('sn_data')
          def read_cov(path,n):
              a=np.asarray(np.loadtxt(path),float).reshape(-1)
              if len(a)==n*n+1 and int(round(a[0]))==n: a=a[1:]
              if len(a)!=n*n:
                  raise RuntimeError(f'covariance size mismatch {path}: {len(a)} vs {n*n}')
              return a.reshape(n,n)

          def project_setup(C):
              cf=cho_factor(C,lower=True,check_finite=False)
              one=np.ones(C.shape[0])
              u=cho_solve(cf,one,check_finite=False)
              denom=float(one.dot(u))
              return cf,one,denom

          def projected_chi2(pack,resid):
              cf,one,denom=pack
              y=cho_solve(cf,resid,check_finite=False)
              return float(resid.dot(y)-(one.dot(y))**2/denom)

          # Pantheon+
          p=DATA/'PantheonPlus/Pantheon+SH0ES.dat'
          pp=pd.read_csv(p,sep=r'\s+',header=0,engine='python')
          pp_mag=pp['m_b_corr'].to_numpy(float)
          pp_z=pp['zHD'].to_numpy(float)
          pp_zh=pp['zHEL'].to_numpy(float)
          pp_C=read_cov(DATA/'PantheonPlus/Pantheon+SH0ES_STAT+SYS.cov',len(pp_mag))
          mask=pp_z>0.01
          pp_mag,pp_z,pp_zh=pp_mag[mask],pp_z[mask],pp_zh[mask]
          pp_C=pp_C[np.ix_(mask,mask)]
          pp_pack=project_setup(pp_C)

          # Union3
          p=DATA/'Union3/lcparam_full.txt'
          lines=p.read_text().splitlines(); cols=lines[0].removeprefix('#').split()
          un=pd.read_csv(p,sep=r'\s+',comment='#',names=cols,engine='python')
          cmap={c.lower():c for c in un.columns}
          un_mag=un[cmap['mb']].to_numpy(float)
          un_z=un[cmap['zcmb']].to_numpy(float)
          un_zh=un_z.copy()
          un_C=read_cov(DATA/'Union3/mag_covmat.txt',len(un_mag))
          un_pack=project_setup(un_C)

          # DES-Y5
          de=pd.read_csv(DATA/'DESY5/DES-SN5YR_HD.csv')
          cmap={c.lower():c for c in de.columns}
          de_mag=de[cmap['mu']].to_numpy(float)
          de_z=de[cmap['zhd']].to_numpy(float)
          de_zh=de[cmap['zhel']].to_numpy(float)
          de_err=de[cmap['muerr_final']].to_numpy(float)
          de_C=read_cov(DATA/'DESY5/covsys_000.txt',len(de_mag))+np.diag(de_err*de_err)
          de_pack=project_setup(de_C)

          def sn_mu(bg,z,zh):
              DM=np.interp(z,bg.z,bg['comov. dist.'])
              DA=DM/(1.+z)
              return 5.*np.log10((1.+zh)*(1.+z)*DA)

          def sn_scores(bg):
              return (
                projected_chi2(pp_pack,pp_mag-sn_mu(bg,pp_z,pp_zh)),
                projected_chi2(un_pack,un_mag-sn_mu(bg,un_z,un_zh)),
                projected_chi2(de_pack,de_mag-sn_mu(bg,de_z,de_zh)),
              )

          # ---------- INI generators ----------
          def sdmc_ini(lambda_e,z_t,dN_bg,root):
              As=math.exp(3.076)/1e10
              return textwrap.dedent(f'''\
              H0 = 70.8514
              omega_b = 0.02239952
              omega_cdm = 0.12444227328918850
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = {As:.16e}
              n_s = 0.964
              tau_reio = 0.0544
              Omega_Lambda = 0
              Omega_fld = 3.1443554e-8
              fluid_equation_of_state = SDMC_TRACKER
              cs2_fld = 0.003
              use_ppf = no
              Omega_smg = -1
              gravity_model = sdmc_v3_independent_kinetic
              parameters_smg = 0.0715, 5.00, 1.426, {D0}, {POWER}, {DFLOOR}
              expansion_model = sdmc_full
              expansion_smg = 0.7073985893,{lambda_e:.12g},{z_t:.12g},{dN_bg:.12g},0.01105624999,0.25,0.01951933685,1.5
              pert_initial_conditions_smg = zero
              method_qs_smg = fully_dynamic
              output_background_smg = 3
              modes = s
              output = tCl,pCl,lCl
              lensing = yes
              l_max_scalars = 3000
              write background = yes
              write thermodynamics = no
              root = {root}
              format = class
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          def lcdm_ini(root):
              return textwrap.dedent(f'''\
              H0 = 67.36
              omega_b = 0.02237
              omega_cdm = 0.1200
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = 2.10e-9
              n_s = 0.9649
              tau_reio = 0.0544
              modes = s
              output = tCl,pCl,lCl
              lensing = yes
              l_max_scalars = 3000
              write background = yes
              root = {root}
              format = class
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          # ---------- fixed LCDM baseline ----------
          lroot=str(OUT/'lcdm_')
          lip=OUT/'lcdm.ini'; lip.write_text(lcdm_ini(lroot))
          cp=subprocess.run(['./class',str(lip)],stdout=subprocess.PIPE,
                            stderr=subprocess.STDOUT,text=True,timeout=240)
          if cp.returncode!=0:
              raise RuntimeError('LCDM control failed\n'+cp.stdout[-2000:])
          lp=planck_score(Path(lroot+'00_cl_lensed.dat'))
          lbg=table(Path(lroot+'00_background.dat'))
          lsn=sn_scores(lbg)
          lcdm={
            'A_planck':lp[0],'planck':lp[-1],
            'pantheonplus':lsn[0],'union3':lsn[1],'desy5':lsn[2]
          }
          print('JOINT_LCDM_BASELINE',lcdm,flush=True)

          # ---------- candidate screen ----------
          rows=[]
          for ic,(label,lambda_e,z_t,dN_bg) in enumerate(candidates,1):
              tag=label
              root=str(OUT/(tag+'_'))
              ip=OUT/(tag+'.ini'); ip.write_text(sdmc_ini(lambda_e,z_t,dN_bg,root))
              cp=subprocess.run(['./class',str(ip)],stdout=subprocess.PIPE,
                                stderr=subprocess.STDOUT,text=True,timeout=240)
              rec={'id':tag,'AF':0.0715,'zc':5.00,'width':1.426,'lambda_e':lambda_e,'z_t':z_t,'DeltaN_bg':dN_bg,'returncode':cp.returncode,'status':'FAIL'}
              bgp=Path(root+'00_background.dat'); clp=Path(root+'00_cl_lensed.dat')
              if bgp.exists():
                  bg=table(bgp)
                  m=bg.z<=100
                  rec.update({
                    'min_D_z100':float(bg.loc[m,'kin (D)'].min()),
                    'min_cs2_z100':float(bg.loc[m,'c_s^2'].min()),
                    'max_cs2_z100':float(bg.loc[m,'c_s^2'].max()),
                    'min_D_all':float(bg['kin (D)'].min()),
                    'min_cs2_all':float(bg['c_s^2'].min()),
                    'max_abs_noslip_z100':float(np.max(np.abs(
                        bg.loc[m,'braiding_smg']+2*bg.loc[m,'M2_running_smg']))),
                  })
              if cp.returncode==0 and bgp.exists() and clp.exists():
                  bg=table(bgp)
                  ppv=planck_score(clp); sn=sn_scores(bg)
                  rec.update({
                    'status':'OK','A_planck':ppv[0],
                    'chi2_high':ppv[1],'chi2_lowT':ppv[2],'chi2_lowE':ppv[3],
                    'chi2_lensing':ppv[4],'chi2_cal':ppv[5],'chi2_planck':ppv[6],
                    'chi2_pantheonplus':sn[0],'chi2_union3':sn[1],'chi2_desy5':sn[2],
                    'delta_planck':ppv[6]-lcdm['planck'],
                    'delta_pantheonplus':sn[0]-lcdm['pantheonplus'],
                    'delta_union3':sn[1]-lcdm['union3'],
                    'delta_desy5':sn[2]-lcdm['desy5'],
                  })
                  rec['joint_pp']=rec['delta_planck']+rec['delta_pantheonplus']
                  rec['joint_union3']=rec['delta_planck']+rec['delta_union3']
                  rec['joint_desy5']=rec['delta_planck']+rec['delta_desy5']
                  stable=(rec['min_D_z100']>0 and rec['min_cs2_z100']>0 and rec['max_cs2_z100']<=1.0)
                  rec['stable_subluminal']=bool(stable)
                  print('LZT_GRID_OK',rec,flush=True)
              else:
                  rec['error']=cp.stdout[-1000:]
                  print('LZT_GRID_FAIL',rec,flush=True)
              rows.append(rec)

          df=pd.DataFrame(rows)
          df.to_csv(OUT/'r032_lambda_zt_grid.csv',index=False)
          ok=df[(df.status=='OK') & (df.stable_subluminal==True)].copy()
          if ok.empty:
              raise SystemExit('No stable subluminal candidates in joint screen')

          # Keep union of top candidates under each alternative SN compilation,
          # plus the exact validated current point.
          keep=set()
          for col in ['joint_pp','joint_union3','joint_desy5','delta_planck']:
              for x in ok.nsmallest(4,col)['id']: keep.add(x)
          current=ok[(np.isclose(ok.lambda_e,20.0))&(np.isclose(ok.z_t,20.5))]
          for x in current.id: keep.add(x)
          shortlist=ok[ok.id.isin(sorted(keep))].copy().sort_values('joint_pp')
          shortlist.to_csv(OUT/'r032_lambda_zt_grid_shortlist.csv',index=False)
          print('LZT_GRID_BEST_PP',ok.nsmallest(6,'joint_pp').to_dict('records'),flush=True)
          print('LZT_GRID_BEST_UNION3',ok.nsmallest(6,'joint_union3').to_dict('records'),flush=True)
          print('LZT_GRID_BEST_DESY5',ok.nsmallest(6,'joint_desy5').to_dict('records'),flush=True)
          print('LZT_GRID_SHORTLIST',shortlist[['id','AF','zc','width','lambda_e','z_t','DeltaN_bg','delta_planck',
                                                   'delta_pantheonplus','delta_union3','delta_desy5',
                                                   'joint_pp','joint_union3','joint_desy5']].to_dict('records'),flush=True)
          PY

      - name: Preserve joint screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-lzt-boundary-fine
          path: |
            output/joint_screen/r032_lambda_zt_grid.csv
            output/joint_screen/r032_lambda_zt_grid_shortlist.csv
          if-no-files-found: warn
