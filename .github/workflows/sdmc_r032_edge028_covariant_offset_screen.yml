name: SDMC r032 edge028 covariant offset screen

on:
  push:
    branches:
      - sdmc-r032-edge028-covariant-offset-screen
  workflow_dispatch:

jobs:
  offset-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya

      - name: Apply SDMC patches and build independent target
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make -j2 class
          mkdir -p output

      - name: Generate edge028 target and reconstruct covariant action
        run: |
          cat > output/cov_exact_target.ini <<'EOF'
          H0 = 70.79120830851635
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1218418557926507e-9
          n_s = 0.9625227132590487
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.03773318954370916, 3.6879637566395105, 0.4136390263400972, 0.34231919445927034, 1.0, 0.04570108858030289
          expansion_model = sdmc_full
          expansion_smg = 0.7104191921362599, 18.40625, 16.12245249159634, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          write background = yes
          write thermodynamics = yes
          root = output/cov_exact_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          output_verbose = 0
          EOF
          ./class output/cov_exact_target.ini
          python3 sdmc/run_r032_partial_zeq_ztbest_covariant.py

      - name: Freeze edge028 tracker helper and rebuild exact action
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('source/background.c'); s=p.read_text()
          pat=re.compile(
              r'double Ox\s*=\s*pba->parameters_smg\[0\];\s*'
              r'double lambda_e\s*=\s*pba->parameters_smg\[1\];\s*'
              r'double zt\s*=\s*pba->parameters_smg\[2\];\s*'
              r'double dNt\s*=\s*pba->parameters_smg\[3\];\s*'
              r'double A\s*=\s*pba->parameters_smg\[4\];\s*'
              r'double tauA\s*=\s*pba->parameters_smg\[5\];\s*'
              r'double B\s*=\s*pba->parameters_smg\[6\];\s*'
              r'double tauB\s*=\s*pba->parameters_smg\[7\];'
          )
          repl='''double Ox = 0.7104191921362599;
            double lambda_e = 18.40625;
            double zt = 16.12245249159634;
            double dNt = 0.5;
            double A = 0.01105624999;
            double tauA = 0.25;
            double B = 0.01951933685;
            double tauB = 1.5;'''
          s2,n=pat.subn(repl,s,count=1)
          if n != 1: raise RuntimeError(f'tracker helper replacement count={n}')
          p.write_text(s2)
          PY
          make clean && make -j2 class

      - name: Install Planck native-lite likelihoods
        run: |
          ok=0
          for attempt in 1 2 3 4
          do
            rm -rf planck_packages
            if python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(2)
          PY
            then
              ok=1
              break
            fi
            sleep $((attempt*6))
          done
          test "$ok" -eq 1

      - name: Scan covariant potential offset
        run: python3 sdmc/run_r032_edge028_covariant_offset_screen.py

      - name: Print summary
        if: always()
        run: |
          test ! -f output/edge028_covariant_offset_screen/edge028_covariant_offset_screen_summary.json || cat output/edge028_covariant_offset_screen/edge028_covariant_offset_screen_summary.json
          test ! -f output/edge028_covariant_offset_screen/edge028_covariant_offset_screen.csv || cat output/edge028_covariant_offset_screen/edge028_covariant_offset_screen.csv

      - name: Preserve offset screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-edge028-covariant-offset-screen
          path: |
            output/edge028_covariant_offset_screen/*.csv
            output/edge028_covariant_offset_screen/*.json
            output/cov_exact_reconstruction_summary.txt
          if-no-files-found: warn
