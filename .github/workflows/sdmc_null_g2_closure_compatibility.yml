name: SDMC null-G2 closure compatibility

on:
  push:
    branches: [sdmc-late300-null-g2-closure-compatibility]
    paths:
      - 'sdmc/run_null_g2_closure_compatibility.py'
      - '.github/workflows/sdmc_null_g2_closure_compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit closure compatibility
        run: |
          python3 sdmc/run_null_g2_closure_compatibility.py
          cat output/null_g2_closure_compatibility.json
      - uses: actions/upload-artifact@v4
        with:
          name: null-g2-closure-compatibility
          path: output/null_g2_closure_compatibility.json
