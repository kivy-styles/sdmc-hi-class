name: SDMC NKp-v3 Planck low-l gate

on:
  push:
    branches:
      - sdmc-planck-macos-test
  workflow_dispatch:

jobs:
  planck-lowell-gate:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy numpy pandas

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py

      - name: Expose exact native cs2 diagnostics
        run: python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build hi_class
        run: make -j2 class

      - name: Install Planck native high-l and low-l data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          for cls in (TTTEEE_lite_native, TT, EE):
              ok=cls.install(path='planck_packages',no_progress_bars=True)
              if not ok:
                  raise SystemExit(f'Planck native install failed: {cls.__name__}')
          PY

      - name: Generate formal NKp-v3 candidates and matched LCDM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re,textwrap
          out=Path('output'); out.mkdir(exist_ok=True)
          AS=math.exp(3.076)/1e10

          def v3_ini(A,zc,w,ns,root):
              return textwrap.dedent(f'''\
              H0 = 70.8514
              omega_b = 0.02239952
              omega_cdm = 0.12444227328918850
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = {AS:.14e}
              n_s = {ns:.9f}
              tau_reio = 0.0544
              Omega_Lambda = 0
              Omega_fld = 3.1443554e-8
              fluid_equation_of_state = SDMC_TRACKER
              cs2_fld = 0.003
              use_ppf = no
              Omega_smg = -1
              gravity_model = sdmc_v3_native_noslip
              parameters_smg = {A:.12g}, {zc:.12g}, {w:.12g}, 0.1, 0.0001
              expansion_model = sdmc_full
              expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
              pert_initial_conditions_smg = zero
              method_qs_smg = fully_dynamic
              output_background_smg = 3
              output = tCl,pCl,lCl
              modes = s
              lensing = yes
              l_max_scalars = 3000
              write background = yes
              write thermodynamics = yes
              root = {root}
              format = class
              write parameters = yes
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          cases=[
              ('edge_671',0.0720,5.00,1.450,0.964),
              ('fine_669890',0.0724,4.70,1.430,0.962),
              ('ridge_669376',0.0736,4.25,1.430,0.962),
          ]
          for label,A,zc,w,ns in cases:
              Path(f'output/{label}.ini').write_text(v3_ini(A,zc,w,ns,f'output/{label}_'))

          p=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          p=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {math.exp(3.044)/1e10:.14e}',p)
          p=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',p)
          p=re.sub(r'(?m)^\s*root\s*=.*$','root = output/lcdm_lowell_',p)
          Path('output/lcdm_lowell.ini').write_text(p)
          PY

          ./class output/edge_671.ini
          ./class output/fine_669890.ini
          ./class output/ridge_669376.ini
          ./class output/lcdm_lowell.ini

      - name: Evaluate joint Planck high-l plus low-T plus low-E
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, math
          import numpy as np
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE

          TCMB=2.7255
          CAL_SIGMA=0.0025
          high=TTTEEE_lite_native(packages_path='planck_packages')
          lowT=TT(packages_path='planck_packages')
          lowE=EE(packages_path='planck_packages')

          def load(path):
              a=np.loadtxt(path)
              conv=(TCMB*1e6)**2
              ell=a[:,0].astype(int)
              n=int(ell.max())+1
              tt=np.zeros(n); ee=np.zeros(n); te=np.zeros(n)
              tt[ell]=a[:,1]*conv
              ee[ell]=a[:,2]*conv
              te[ell]=a[:,3]*conv
              high_arr=np.column_stack([ell,tt[ell],te[ell],ee[ell]])
              return tt,ee,high_arr

          def components(spec,A):
              tt,ee,h=spec
              ch=float(high.chi_squared(h,A_planck=float(A)))
              lt=-2.0*float(lowT.log_likelihood(tt,calib=float(A)))
              le=-2.0*float(lowE.log_likelihood(ee,calib=float(A)))
              cp=((float(A)-1.0)/CAL_SIGMA)**2
              return ch,lt,le,cp

          def evaluate(label,path):
              spec=load(path)
              def total(A):
                  vals=components(spec,A)
                  if not np.all(np.isfinite(vals)):
                      return 1e100
                  return sum(vals)
              opt=minimize_scalar(total,bounds=(0.97,1.03),method='bounded',
                                  options={'xatol':1e-10})
              A=float(opt.x)
              ch,lt,le,cp=components(spec,A)
              ch1,lt1,le1,_=components(spec,1.0)
              return {
                  'case':label,
                  'A_planck_joint':A,
                  'chi2_high_jointA':ch,
                  'chi2_lowT_jointA':lt,
                  'chi2_lowE_jointA':le,
                  'chi2_cal_prior':cp,
                  'chi2_joint_high_low':ch+lt+le+cp,
                  'chi2_high_A1':ch1,
                  'chi2_lowT_A1':lt1,
                  'chi2_lowE_A1':le1,
                  'chi2_joint_A1':ch1+lt1+le1,
              }

          cases={
              'LCDM':'output/lcdm_lowell_00_cl_lensed.dat',
              'NKp_v3_edge_671':'output/edge_671_00_cl_lensed.dat',
              'NKp_v3_fine_669890':'output/fine_669890_00_cl_lensed.dat',
              'NKp_v3_ridge_669376':'output/ridge_669376_00_cl_lensed.dat',
          }
          rows=[evaluate(k,v) for k,v in cases.items()]
          out=Path('output/nkp_v3_planck_lowell_gate.csv')
          with out.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys()))
              w.writeheader(); w.writerows(rows)
          ref=rows[0]['chi2_joint_high_low']
          print('Planck native high-l + low-T + low-E, one shared A_planck')
          for r in rows:
              print(
                  f"{r['case']:22s} A={r['A_planck_joint']:.8f} "
                  f"high={r['chi2_high_jointA']:.6f} "
                  f"lowT={r['chi2_lowT_jointA']:.6f} "
                  f"lowE={r['chi2_lowE_jointA']:.6f} "
                  f"cal={r['chi2_cal_prior']:.6f} "
                  f"joint={r['chi2_joint_high_low']:.6f} "
                  f"Delta={r['chi2_joint_high_low']-ref:+.6f}"
              )
          print(out)
          PY

      - name: Preserve Planck low-l gate outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-nkp-v3-planck-lowell-gate
          path: |
            output/nkp_v3_planck_lowell_gate.csv
            output/edge_671_00_cl_lensed.dat
            output/fine_669890_00_cl_lensed.dat
            output/ridge_669376_00_cl_lensed.dat
            output/lcdm_lowell_00_cl_lensed.dat
          if-no-files-found: warn
