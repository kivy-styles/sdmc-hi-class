name: LCDM Sobol054 local hypercube

on:
  push:
    branches:
      - lcdm-sobol054-local-hypercube
  workflow_dispatch:

jobs:
  lcdm-local:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya

      - name: Build CLASS
        run: make -j2 class

      - name: Install Planck and SN likelihood data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(f'Planck install failed: {cls}')
          PY
          rm -rf sn_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data

      - name: Run local LCDM Sobol054 screen
        run: python3 sdmc/run_lcdm_sobol054_local_hypercube.py

      - name: Preserve local LCDM screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcdm-sobol054-local-hypercube
          path: |
            output/lcdm_sobol054_local/lcdm_sobol054_local_design.json
            output/lcdm_sobol054_local/lcdm_sobol054_local_screen.csv
            output/lcdm_sobol054_local/lcdm_sobol054_local_shortlist.csv
          if-no-files-found: warn
