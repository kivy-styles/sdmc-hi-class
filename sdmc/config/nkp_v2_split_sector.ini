# SDMC NKp-v2 split-sector Boltzmann test
#
# Early sector: exact frozen lambda_e=20 tracker carried by a separate
# conserved fluid with rest-frame c_phi^2=0.003.
# Late sector: endpoint-clean B0 No-Slip Planck-mass history carried by a
# separate spectator Horndeski scalar, with zero primordial perturbation.
# Expansion: unchanged frozen sdmc_full NKp-v2 background.
#
# This configuration tests the manuscript's statement that the early tracker
# and late No-Slip release are conceptually distinct.  It is not a unique
# microscopic two-field Lagrangian.

H0 = 70.8514
omega_b = 0.02239952
omega_cdm = 0.12444227328918850
N_ncdm = 0
N_ur = 3.046
T_cmb = 2.7255
YHe = 0.2453

A_s = 2.10e-9
n_s = 0.965
tau_reio = 0.0544

Omega_Lambda = 0
# Exact present tracker carrier fraction for the frozen handoff is ~3.14e-8.
Omega_fld = 3.1443554e-8
fluid_equation_of_state = SDMC_TRACKER
cs2_fld = 0.003
use_ppf = no

Omega_smg = -1

gravity_model = sdmc_v2_late_noslip
# N_s(late), c_s^2(late), z_activation_center, DeltaN_activation, D spectator floor
parameters_smg = 0.001, 0.1, 21.45883112, 0.5, 1.0e-4
expansion_model = sdmc_full
# Omega_X0, lambda_e, z_t, DeltaN, A, tau_A, B, tau_B
expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5

pert_initial_conditions_smg = zero
method_qs_smg = fully_dynamic
output_background_smg = 1

output = tCl,pCl,lCl,mPk
modes = s
lensing = yes
l_max_scalars = 3000
P_k_max_h/Mpc = 2.0
z_pk = 0,0.5,1,2,3,5,10

root = output/sdmc_nkp_v2_split_sector_
format = class
write parameters = yes
write background = yes
write thermodynamics = yes
input_verbose = 1
background_verbose = 4
thermodynamics_verbose = 1
perturbations_verbose = 1
spectra_verbose = 0
lensing_verbose = 0
output_verbose = 1
