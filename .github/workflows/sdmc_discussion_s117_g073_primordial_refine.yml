name: SDMC S117 g073 primordial-response refine

on:
  push:
    branches:
      - sdmc-discussion-s117-g073-primordial-refine
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "a208n960", As: "2.080e-9", ns: "0.9600" }
          - { label: "a208n963", As: "2.080e-9", ns: "0.9630" }
          - { label: "a208n966", As: "2.080e-9", ns: "0.9660" }
          - { label: "a208n969", As: "2.080e-9", ns: "0.9690" }
          - { label: "a210n960", As: "2.100e-9", ns: "0.9600" }
          - { label: "a210n963", As: "2.100e-9", ns: "0.9630" }
          - { label: "a210n966", As: "2.100e-9", ns: "0.9660" }
          - { label: "a210n969", As: "2.100e-9", ns: "0.9690" }
          - { label: "a212n960", As: "2.120e-9", ns: "0.9600" }
          - { label: "a212n963", As: "2.120e-9", ns: "0.9630" }
          - { label: "a212n966", As: "2.120e-9", ns: "0.9660" }
          - { label: "a212n969", As: "2.120e-9", ns: "0.9690" }
          - { label: "a214n960", As: "2.140e-9", ns: "0.9600" }
          - { label: "a214n963", As: "2.140e-9", ns: "0.9630" }
          - { label: "a214n966", As: "2.140e-9", ns: "0.9660" }
          - { label: "a214n969", As: "2.140e-9", ns: "0.9690" }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential >/dev/null
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q numpy scipy pandas cobaya

      - name: Install Planck native likelihoods
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path="planck_packages",no_progress_bars=True):
                  raise SystemExit(2)
          PY

      - name: Build Lagrangian-guided NKp kinetic candidate
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean >/dev/null && make -j2 class >/dev/null
          mkdir -p output
          cat > output/candidate.ini <<EOF
          H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = ${{ matrix.As }}
          n_s = ${{ matrix.ns }}
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.020284758737310768, 3.6509963892400266, 0.35059972247108817, 0.34231919445927034, 0.45, 0.05064729745686054
          expansion_model = sdmc_full
          expansion_smg = 0.7014079815036496, 18.40625, 16.19317622240633, 0.5, 0.024822032167576252, 0.25, 0.01264704344701022, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 2.0
          z_pk = 0
          write background = yes
          write thermodynamics = yes
          root = output/s117g073_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          lensing_verbose = 0
          output_verbose = 0
          EOF
          set +e
          ./class output/candidate.ini > output/s117g073.log 2>&1
          rc=$?
          set -e
          echo "$rc" > output/s117g073.rc
          if [ "$rc" -ne 0 ]; then tail -100 output/s117g073.log; exit "$rc"; fi

      - name: Score Planck and perturbation health
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          import numpy as np
          import pandas as pd
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          root="output/s117g073_"; T=2.7255; sig=.0025
          high=TTTEEE_lite_native(packages_path="planck_packages")
          lowT=TT(packages_path="planck_packages"); lowE=EE(packages_path="planck_packages")
          lens=LensingNative(packages_path="planck_packages")
          a=np.loadtxt(root+"00_cl_lensed.dat"); ell=a[:,0].astype(int); n=int(ell.max())+1; conv=(T*1e6)**2
          tt=np.zeros(n); ee=np.zeros(n); te=np.zeros(n); pp=np.zeros(n)
          tt[ell]=a[:,1]*conv; ee[ell]=a[:,2]*conv; te[ell]=a[:,3]*conv
          L=ell.astype(float); pp[ell]=a[:,5]*L*(L+1)
          ha=np.column_stack([ell,tt[ell],te[ell],ee[ell]])
          spectra={"tt":tt,"te":te,"ee":ee,"pp":pp}
          def f(A):
              v=float(high.chi_squared(ha,A_planck=A))
              v+=float(-2*lowT.log_likelihood(tt,calib=A))
              v+=float(-2*lowE.log_likelihood(ee,calib=A))
              lp={lens.calibration_param:A} if getattr(lens,"calibration_param",None) else {}
              v+=float(-2*lens.log_likelihood(spectra,**lp))
              v+=((A-1)/sig)**2
              return v
          op=minimize_scalar(f,bounds=(.97,1.03),method="bounded",options={"xatol":1e-9})
          lines=Path(root+"00_background.dat").read_text().splitlines()
          hdr=[x for x in lines if x.startswith("#") and re.search(r"1\s*:",x)][-1].lstrip("#").strip()
          ms=list(re.finditer(r"(\d+)\s*:\s*",hdr)); names=[]
          for i,m in enumerate(ms):
              e=ms[i+1].start() if i+1<len(ms) else len(hdr)
              names.append(hdr[m.end():e].strip())
          bg=pd.DataFrame(np.loadtxt(root+"00_background.dat"),columns=names)
          cs=bg["c_s^2"].to_numpy(); D=bg["kin (D)"].to_numpy()
          rcone=.5*(1/np.maximum(cs,1e-300)-1)
          out={
            "label":"${{ matrix.label }}","A_s":float("${{ matrix.As }}"),"n_s":float("${{ matrix.ns }}"),"power":0.45,"Dfloor":0.05064729745686054,
            "chi2_planck_native_lite":float(op.fun),"A_planck":float(op.x),
            "D_min":float(np.min(D)),"D_max":float(np.max(D)),
            "cs2_min":float(np.min(cs)),"cs2_max":float(np.max(cs)),
            "rcone_min":float(np.min(rcone)),"rcone_max":float(np.max(rcone)),
            "noslip_max":float(np.max(np.abs(bg["braiding_smg"]+2*bg["M2_running_smg"])))
          }
          Path("output/score.json").write_text(json.dumps(out,indent=2)+"\n")
          print("S117_G073_PRIMORDIAL_SCORE",json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s117-g073-primordial-${{ matrix.label }}
          path: |
            output/score.json
            output/s117g073.log
            output/s117g073.rc
            output/s117g073_00_background.dat
            output/s117g073_00_thermodynamics.dat
            output/s117g073_00_cl_lensed.dat
            output/s117g073_00_z1_pk.dat
          if-no-files-found: ignore
