name: SDMC r032 SN-closure Bayesian raw-DESI search

on:
  push:
    branches:
      - sdmc-r032-snclosure-bo-rawdesi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bo-search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git curl
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya scikit-optimize h5py requests beautifulsoup4 pyyaml camb pyfftw

      - name: Apply SDMC patches and build
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean && make -j2 class
          mkdir -p output

      - name: Install Planck native-lite likelihood data
        run: |
          ok=0
          for attempt in 1 2 3 4
          do
            rm -rf planck_packages
            if python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(2)
          print('PLANCK_LITE_READY')
          PY
            then ok=1; break; fi
            sleep $((attempt*6))
          done
          test "$ok" -eq 1

      - name: Install official DESI DR1 full-shape dependencies
        env:
          PIP_DEFAULT_TIMEOUT: "45"
        run: |
          for PKG in             git+https://github.com/cosmodesi/cosmoprimo.git             git+https://github.com/adematti/lsstypes.git             git+https://github.com/sfschen/velocileptors.git
          do
            ok=0
            for attempt in 1 2 3
            do
              if timeout 180 python3 -m pip install --retries 2 "$PKG"; then ok=1; break; fi
              sleep $((attempt*5))
            done
            test "$ok" -eq 1
          done
          rm -rf desi-kp-cosmological-likelihoods
          git clone --depth 1 https://github.com/cosmodesi/desi-kp-cosmological-likelihoods.git
          mkdir -p desi_likelihood
          BASE_PRIMARY=https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          BASE_MIRROR=https://webdav-hdfs.pic.es/data/public/DESI/DR1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          for FN in             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_BGS_BRIGHT-21.5_GCcomb_z0.1-0.4_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.4-0.6_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.6-0.8_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.8-1.1_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_ELG_LOPnotqso_GCcomb_z1.1-1.6_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_QSO_GCcomb_z0.8-2.1_thetacut0.05.h5
          do
            ok=0
            for attempt in 1 2 3 4 5
            do
              for BASE in "$BASE_PRIMARY" "$BASE_MIRROR"
              do
                if curl -L --fail --retry 4 --retry-all-errors --retry-delay 4                      --connect-timeout 30 --max-time 300 -C -                      -o "desi_likelihood/$FN" "$BASE/$FN"; then
                  ok=1
                  break 2
                fi
              done
              sleep $((attempt*8))
            done
            test "$ok" -eq 1
          done

      - name: Read official DESI effective redshifts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys,json
          sys.path.insert(0,'desi-kp-cosmological-likelihoods/dr1/cobaya')
          import lsstypes as types
          from desi_fs_bao_all import list_zrange,dataset_fn,get_tracer_label
          records=[]
          for tracer,iz,zrange in list_zrange:
              if 'lya' in tracer.lower(): continue
              fn=dataset_fn('desi_likelihood',tracer,zrange,observable_name='spectrum-poles-rotated')
              d=types.read(fn); sp=d.observable.get('spectrum')
              records.append(dict(tracer=tracer,iz=iz,zrange=list(zrange),
                                  namespace=f"{get_tracer_label(tracer)}_z{iz}",
                                  zeff=float(sp.attrs['zeff']),file=str(fn)))
          Path('output/desi_zeff.json').write_text(json.dumps(records,indent=2))
          zs=[0.0]+sorted({r['zeff'] for r in records})
          Path('output/desi_zpk.txt').write_text(','.join(f'{z:.10g}' for z in zs))
          print('DESI_ZPK',zs)
          PY

      - name: Install SN covariance products
        run: |
          rm -rf sn_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data
          test -f sn_data/PantheonPlus/Pantheon+SH0ES.dat
          test -f sn_data/Union3/lcparam_full.txt
          test -f sn_data/DESY5/DES-SN5YR_HD.csv

      - name: Check BO scripts
        run: |
          python3 -m py_compile sdmc/desi_fullshape_profile_utils.py
          python3 -m py_compile sdmc/run_r032_snclosure_bo_rawdesi.py

      - name: Run Bayesian raw-DESI SN closure search
        run: python3 sdmc/run_r032_snclosure_bo_rawdesi.py

      - name: Print BO summary
        if: always()
        run: |
          cat output/snclosure_bo_rawdesi/bo_summary.json || true
          echo "--- TOP HISTORY ---"
          python3 - <<'PY'
          import pandas as pd
          p='output/snclosure_bo_rawdesi/bo_history.csv'
          try:
              d=pd.read_csv(p)
              print(d[d.status=='OK'].sort_values(['objective','second_joint_est','pd_fair_est']).head(12).to_string(index=False))
          except Exception as e:
              print(e)
          PY

      - name: Preserve BO search
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-snclosure-bo-rawdesi
          path: |
            output/snclosure_bo_rawdesi/*.csv
            output/snclosure_bo_rawdesi/*.json
          if-no-files-found: warn
