name: SDMC late300 HSC-Y3 native-Weyl pilot
on:
  push:
    branches: [sdmc-late300-hscy3-weyl]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  hsc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy sacc
      - name: Download validated native-Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}" --name late300-desy3-native-weyl-tomography --dir output
          test -d output/weyl_spectra
      - name: Download CosmoSIS HSC-Y3 products
        run: |
          rm -rf cosmosis-standard-library
          git clone --depth 1 https://github.com/cosmosis-developers/cosmosis-standard-library.git
          cd cosmosis-standard-library
          git lfs pull || true
          cd ..
          test -s cosmosis-standard-library/likelihood/hsc_cosmic_shear/hsc_y3_fourier_shear.sacc
      - name: Run HSC-Y3 native-Weyl nuisance pilot
        run: |
          python3 sdmc/run_late300_hscy3_weyl.py | tee output/hsc_weyl.log
          cat output/hsc_weyl/hsc_weyl_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late300-hscy3-native-weyl
          path: |
            output/hsc_weyl/*
            output/hsc_weyl.log
