name: SDMC r032 combined candidate covariant G3 reconstruction

on:
  push:
    branches:
      - sdmc-r032-combined-best-covariant-g3
  workflow_dispatch:

jobs:
  covariant-g3:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas

      - name: Apply SDMC parameterized patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          python3 sdmc/install_sdmc_v3_lens_braiding.py

      - name: Build parameterized target hi_class
        run: make -j2 class

      - name: Generate combined target background
        run: |
          mkdir -p output
          cat > output/combined_cov_target.ini <<'EOF'
          H0 = 69.7095092787552
          omega_b = 0.02211778594478965
          omega_cdm = 0.1258596659367904
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453

          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_lens_braiding
          parameters_smg = 0.0715,5.0,1.426,0.34231919445927034,1.0,0.045,0.024,1.5,0.8
          expansion_model = sdmc_full
          expansion_smg = 0.6953970160452582,17.925,17.775,0.5,0.01105624999,0.25,0.01951933685,1.5
          output_background_smg = 3
          skip_stability_tests_smg = yes
          write background = yes
          write thermodynamics = no
          root = output/combined_cov_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          output_verbose = 0
          EOF
          ./class output/combined_cov_target.ini

      - name: Reconstruct covariant G3 and G2
        run: python3 sdmc/reconstruct_r032_combined_covariant_g3.py

      - name: Install covariant replay model
        run: python3 sdmc/install_r032_combined_covariant_g3.py

      - name: Rebuild with covariant model
        run: make clean && make -j2 class

      - name: Run native covariant background replay
        run: |
          cat > output/combined_cov_replay.ini <<'EOF'
          H0 = 69.7095092787552
          omega_b = 0.02211778594478965
          omega_cdm = 0.1258596659367904
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453

          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1

          gravity_model = sdmc_combined_covariant_replay
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic

          a_ini_over_a_today_default = 1.e-10
          a_ini_test_qs_smg = 1.e-10
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-10

          output_background_smg = 3
          write background = yes
          write thermodynamics = no
          root = output/combined_cov_replay_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/combined_cov_replay.ini

      - name: Compare covariant replay to EFT target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np,re,pandas as pd,json

          def tab(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              return pd.DataFrame(np.loadtxt(path),columns=names).sort_values('z')

          t=tab('output/combined_cov_target_00_background.dat')
          c=tab('output/combined_cov_replay_00_background.dat')
          z=c.z.to_numpy()
          def ti(col): return np.interp(z,t.z,t[col])

          m100=z<=100
          Hrel=np.abs(c['H [1/Mpc]'].to_numpy()/ti('H [1/Mpc]')-1.)
          Frel=np.abs(c['M*^2_smg'].to_numpy()/ti('M*^2_smg')-1.)
          dB=np.abs(c['braiding_smg'].to_numpy()-ti('braiding_smg'))
          dM=np.abs(c['M2_running_smg'].to_numpy()-ti('M2_running_smg'))
          dD=np.abs(c['kin (D)'].to_numpy()-ti('kin (D)'))
          dcs=np.abs(c['c_s^2'].to_numpy()-ti('c_s^2'))
          out={
            'max_abs_dH_H_z100':float(Hrel[m100].max()),
            'max_abs_dF_F_z100':float(Frel[m100].max()),
            'max_abs_dalphaB_z100':float(dB[m100].max()),
            'max_abs_dalphaM_z100':float(dM[m100].max()),
            'max_abs_dD_z100':float(dD[m100].max()),
            'max_abs_dcs2_z100':float(dcs[m100].max()),
            'min_D_all':float(c['kin (D)'].min()),
            'min_cs2_all':float(c['c_s^2'].min()),
            'max_cs2_all':float(c['c_s^2'].max()),
            'max_abs_slip_driver':float(np.max(np.abs(c['braiding_smg']+2*c['M2_running_smg']))),
            'F0':float(c.iloc[np.argmin(np.abs(z))]['M*^2_smg'])
          }
          print('COMBINED_COVARIANT_REPLAY_COMPARISON',json.dumps(out,sort_keys=True),flush=True)
          pd.DataFrame([out]).to_csv('output/combined_covariant_replay_comparison.csv',index=False)
          if not (out['min_D_all']>0 and out['min_cs2_all']>0 and out['max_cs2_all']<=1):
              raise SystemExit('COMBINED_COVARIANT_STABILITY_FAIL')
          print('COMBINED_COVARIANT_STABILITY_PASS',flush=True)
          PY

      - name: Run covariant and EFT observables
        run: |
          cat > output/combined_cov_observable.ini <<'EOF'
          H0 = 69.7095092787552
          omega_b = 0.02211778594478965
          omega_cdm = 0.1258596659367904
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1700512487766515e-9
          n_s = 0.9637720508351921
          tau_reio = 0.06456347454525531
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_combined_covariant_replay
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 2.0
          z_pk = 0,0.5,1,2,3,5,10
          write background = yes
          write thermodynamics = yes
          root = output/combined_cov_observable_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          lensing_verbose = 0
          output_verbose = 0
          EOF

          cat > output/combined_eft_observable.ini <<'EOF'
          H0 = 69.7095092787552
          omega_b = 0.02211778594478965
          omega_cdm = 0.1258596659367904
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1700512487766515e-9
          n_s = 0.9637720508351921
          tau_reio = 0.06456347454525531
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_lens_braiding
          parameters_smg = 0.0715,5.0,1.426,0.34231919445927034,1.0,0.045,0.024,1.5,0.8
          expansion_model = sdmc_full
          expansion_smg = 0.6953970160452582,17.925,17.775,0.5,0.01105624999,0.25,0.01951933685,1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          output_background_smg = 3
          modes = s
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 2.0
          z_pk = 0,0.5,1,2,3,5,10
          write background = yes
          write thermodynamics = yes
          root = output/combined_eft_observable_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          lensing_verbose = 0
          output_verbose = 0
          EOF

          ./class output/combined_cov_observable.ini
          ./class output/combined_eft_observable.ini

      - name: Compare covariant and EFT spectra
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np,pandas as pd,json,math

          c=np.loadtxt('output/combined_cov_observable_00_cl_lensed.dat')
          e=np.loadtxt('output/combined_eft_observable_00_cl_lensed.dat')
          ell=e[:,0]
          rows=[]
          for j,name in [(1,'TT'),(2,'EE'),(3,'TE'),(5,'PP')]:
              ref=e[:,j]; val=np.interp(ell,c[:,0],c[:,j])
              mask=(ell>=2)&(ell<=2500)&(np.abs(ref)>1e-30)
              rr=(val[mask]-ref[mask])/ref[mask]
              rows.append(dict(observable=name,max_abs_rel=float(np.max(np.abs(rr))),
                               rms_rel=float(np.sqrt(np.mean(rr*rr)))))
          pkrows=[]
          for i,z in enumerate([0,0.5,1,2,3,5,10],1):
              pc=np.loadtxt(f'output/combined_cov_observable_00_z{i}_pk.dat')
              pe=np.loadtxt(f'output/combined_eft_observable_00_z{i}_pk.dat')
              k=pe[:,0]; pv=np.interp(k,pc[:,0],pc[:,1]); pr=pe[:,1]
              m=(k>=1e-3)&(k<=1.)&(pr>0)
              rr=pv[m]/pr[m]-1
              pkrows.append(dict(z=z,max_abs_rel=float(np.max(np.abs(rr))),
                                 rms_rel=float(np.sqrt(np.mean(rr*rr)))))
          pd.DataFrame(rows).to_csv('output/combined_covariant_vs_eft_cls.csv',index=False)
          pd.DataFrame(pkrows).to_csv('output/combined_covariant_vs_eft_pk.csv',index=False)
          print('COMBINED_COV_VS_EFT_CLS',json.dumps(rows),flush=True)
          print('COMBINED_COV_VS_EFT_PK',json.dumps(pkrows),flush=True)
          PY

      - name: Preserve covariant reconstruction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-combined-best-covariant-g3
          path: |
            output/combined_cov_target_00_background.dat
            output/combined_cov_replay.ini
            output/combined_cov_replay_00_background.dat
            output/combined_covariant_replay_comparison.csv
            output/combined_cov_observable.ini
            output/combined_cov_observable_00_*
            output/combined_eft_observable.ini
            output/combined_eft_observable_00_*
            output/combined_covariant_vs_eft_cls.csv
            output/combined_covariant_vs_eft_pk.csv
          if-no-files-found: warn
