name: SDMC full Plik refinement

on:
  push:
    branches:
      - sdmc-planck-fullplik-refine
  workflow_dispatch:

concurrency:
  group: sdmc-planck-fullplik-refine
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install optimizer and official Planck likelihoods
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy cobaya iminuit
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE import TTTEEE
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          if not TTTEEE.install(path='planck_full',no_progress_bars=True):
              raise SystemExit('full Plik install failed')
          for cls in (TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(f'Planck component install failed: {cls}')
          PY

      - name: Recover completed covariant and LCDM spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          curl -L --fail --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/kivy-styles/sdmc-hi-class/actions/artifacts/10584845266/zip" \
            -o /tmp/planck_cov_artifact.zip
          unzip -q /tmp/planck_cov_artifact.zip -d /tmp/planck_cov_artifact
          cp /tmp/planck_cov_artifact/covariant_observable_00_cl_lensed.dat output/
          cp /tmp/planck_cov_artifact/fullplik_lcdm_00_cl_lensed.dat output/
          ls -lh output/*cl_lensed.dat

      - name: Refine nuisance profiles with Minuit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,csv
          import numpy as np
          from scipy.optimize import minimize
          from iminuit import Minuit
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE import TTTEEE
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          TCMB=2.7255
          high=TTTEEE(packages_path='planck_full')
          lowT=TT(packages_path='planck_packages')
          lowE=EE(packages_path='planck_packages')
          lens=LensingNative(packages_path='planck_packages')

          fixed={
            'cib_index':-1.3,'galf_TE_index':-2.4,'galf_EE_index':-2.4,
            'A_sbpx_100_100_TT':1.0,'A_sbpx_143_143_TT':1.0,
            'A_sbpx_143_217_TT':1.0,'A_sbpx_217_217_TT':1.0,
            'galf_EE_A_100':0.055,'galf_EE_A_100_143':0.040,
            'galf_EE_A_100_217':0.094,'galf_EE_A_143':0.086,
            'galf_EE_A_143_217':0.21,'galf_EE_A_217':0.70,
            'A_cnoise_e2e_100_100_EE':1.0,'A_cnoise_e2e_143_143_EE':1.0,
            'A_cnoise_e2e_217_217_EE':1.0,
            'A_sbpx_100_100_EE':1.0,'A_sbpx_100_143_EE':1.0,
            'A_sbpx_100_217_EE':1.0,'A_sbpx_143_143_EE':1.0,
            'A_sbpx_143_217_EE':1.0,'A_sbpx_217_217_EE':1.0,
            'A_pol':1.0,'calib_100P':1.021,'calib_143P':0.966,'calib_217P':1.040,
          }
          names=[
            'A_planck','calib_100T','calib_217T',
            'A_cib_217','xi_sz_cib','A_sz','ksz_norm',
            'gal545_A_100','gal545_A_143','gal545_A_143_217','gal545_A_217',
            'ps_A_100_100','ps_A_143_143','ps_A_143_217','ps_A_217_217',
            'galf_TE_A_100','galf_TE_A_100_143','galf_TE_A_100_217',
            'galf_TE_A_143','galf_TE_A_143_217','galf_TE_A_217']
          bounds=[
            (.97,1.03),(0.9946,1.0058),(0.99285,1.00325),
            (0,200),(0,1),(0,10),(0,10),
            (-7.4,24.6),(-5.4,26.6),(-44.5,91.5),(-68.1,251.9),
            (0,400),(0,400),(0,400),(0,400),
            (-.206,.466),(-.158,.418),(-.26,1.18),(-.369,.783),(-.03,1.41),(-2.382,6.258)]
          steps=[.0008,.0004,.0004,5,.05,.5,.5,1,1,3,5,5,5,5,5,.02,.02,.04,.03,.04,.1]
          gauss={
            'A_planck':(1.,.0025),'calib_100T':(1.0002,.0007),'calib_217T':(.99805,.00065),
            'gal545_A_100':(8.6,2.),'gal545_A_143':(10.6,2.),
            'gal545_A_143_217':(23.5,8.5),'gal545_A_217':(91.9,20.),
            'galf_TE_A_100':(.130,.042),'galf_TE_A_100_143':(.130,.036),
            'galf_TE_A_100_217':(.46,.09),'galf_TE_A_143':(.207,.072),
            'galf_TE_A_143_217':(.69,.09),'galf_TE_A_217':(1.938,.54)}
          starts={
            'COVARIANT':[1.002885394509131,0.9996169949951494,0.9985271337353555,
              55.15926149321927,0.3990347409187824,6.348726420000983,3.0934133575565226,
              8.550997552376268,11.089836345175975,20.778675702231304,92.92510936264192,
              256.98152657815405,46.72184284628795,39.21325033465839,104.1683132868178,
              0.11358342097637864,0.13557472736123888,0.48810130199364776,
              0.22677757579265076,0.6997804163841542,2.355086019992442],
            'LCDM':[1.001912465266634,0.9995478396690833,0.998514275759999,
              54.58236306391155,0.41471800051075713,6.145191396148233,1.8336966188016084,
              8.746757908703032,11.173730170312053,20.38162690974441,92.83087728762612,
              256.99481807436666,46.55842768362336,39.18992008566538,103.98363316226482,
              0.12097540171674007,0.13561336058136947,0.4701567477829549,
              0.21277918537321738,0.6525052287932164,2.002872357739206]
          }

          def load(path):
              a=np.loadtxt(path); ell=a[:,0].astype(int); n=int(ell.max())+1
              conv=(TCMB*1e6)**2
              dl={k:np.zeros(n) for k in ['tt','ee','bb','te','pp','tp','ep']}
              dl['tt'][ell]=a[:,1]*conv; dl['ee'][ell]=a[:,2]*conv
              dl['te'][ell]=a[:,3]*conv; dl['bb'][ell]=a[:,4]*conv
              ll=ell.astype(float)*(ell.astype(float)+1.)
              dl['pp'][ell]=a[:,5]*ll
              dl['tp'][ell]=a[:,6]*np.sqrt(ll)*(TCMB*1e6)
              dl['ep'][ell]=a[:,7]*np.sqrt(ll)*(TCMB*1e6)
              cl={k:np.zeros(n) for k in ['tt','ee','bb','te']}
              q=ell>=2; fac=np.zeros_like(ll); fac[q]=2*np.pi/ll[q]
              for k in cl: cl[k][ell]=dl[k][ell]*fac
              return cl,dl

          def prior_chi2(p):
              c=sum(((p[n]-mu)/sig)**2 for n,(mu,sig) in gauss.items())
              return c+((p['ksz_norm']+1.6*p['A_sz']-9.5)/3.)**2

          def build_objective(path):
              cl,dl=load(path)
              def unpack(x):
                  p=dict(fixed); p.update({n:float(v) for n,v in zip(names,x)}); return p
              def pieces(x):
                  p=unpack(x); A=p['A_planck']
                  lh=float(high.log_likelihood(cl,**p))
                  lt=float(lowT.log_likelihood(dl['tt'],calib=A))
                  le=float(lowE.log_likelihood(dl['ee'],calib=A))
                  lp={lens.calibration_param:A} if getattr(lens,'calibration_param',None) else {}
                  ll=float(lens.log_likelihood(dl,**lp))
                  return lh,lt,le,ll,prior_chi2(p)
              def objective(*args):
                  x=np.asarray(args if len(args)>1 else args[0],float)
                  try:
                      lh,lt,le,ll,pr=pieces(x)
                      val=-2*(lh+lt+le+ll)+pr
                      return float(val) if np.isfinite(val) else 1e100
                  except Exception:
                      return 1e100
              return objective,pieces,unpack

          rows=[]
          for label,path in [('COVARIANT','output/covariant_observable_00_cl_lensed.dat'),
                             ('LCDM','output/fullplik_lcdm_00_cl_lensed.dat')]:
              obj,pieces,unpack=build_objective(path)
              x0=np.asarray(starts[label],float)
              print('PLIK_REFINE_START',label,obj(*x0),flush=True)
              m=Minuit(obj,*x0,name=names)
              m.errordef=1.0; m.strategy=1; m.tol=1e-4
              for n,lim,err in zip(names,bounds,steps):
                  m.limits[n]=lim; m.errors[n]=err
              m.migrad(ncall=30000)
              if not m.valid:
                  print('PLIK_REFINE_MIGRAD_RETRY',label,'fval',m.fval,'edm',m.fmin.edm,flush=True)
                  m.simplex(ncall=10000)
                  m.migrad(ncall=30000)
              xm=np.array([m.values[n] for n in names])
              fm=float(m.fval)
              # Independent bounded polish from the Minuit point.
              pol=minimize(lambda x:obj(*x),xm,method='L-BFGS-B',bounds=bounds,
                           options={'maxiter':1200,'ftol':1e-12,'gtol':1e-7,'maxls':60})
              if pol.fun < fm:
                  xbest=np.asarray(pol.x); fbest=float(pol.fun); polish=True
              else:
                  xbest=xm; fbest=fm; polish=False
              lh,lt,le,ll,pr=pieces(xbest); p=unpack(xbest)
              row={'model':label,'chi2_profile_total':fbest,
                   'minuit_valid':bool(m.valid),'minuit_edm':float(m.fmin.edm),
                   'minuit_nfcn':int(m.nfcn),'polish_used':polish,
                   'polish_success':bool(pol.success),'polish_nfev':int(pol.nfev),
                   'chi2_high_full':-2*lh,'chi2_lowT':-2*lt,'chi2_lowE':-2*le,
                   'chi2_lensing':-2*ll,'chi2_nuisance_priors':pr}
              row.update({n:p[n] for n in names})
              print('PLIK_REFINE_RESULT',row,flush=True)
              rows.append(row)
          delta=rows[0]['chi2_profile_total']-rows[1]['chi2_profile_total']
          print('PLIK_REFINE_DELTA_CHI2_COV_MINUS_LCDM',delta,flush=True)
          with open('output/fullplik_refined.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          Path('output/fullplik_refined_delta.txt').write_text(f'{delta:.12g}\n')
          PY

      - name: Preserve refinement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-fullplik-refined
          path: |
            output/fullplik_refined.csv
            output/fullplik_refined_delta.txt
          if-no-files-found: warn
