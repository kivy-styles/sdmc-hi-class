name: SDMC r032 S117 closure validation battery

on:
  push:
    branches:
      - sdmc-r032-snclosure029-s117-validation-battery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas

      - name: Build exact S117 covariant model
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean && make -j2 class
          mkdir -p output

          cat > output/cov_exact_target.ini <<'EOF'
          H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.117602412937069e-9
          n_s = 0.9625227132590487
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.02114389337040484, 3.715736017236486, 0.35696151830255984, 0.34231919445927034, 1.0, 0.052829781055450435
          expansion_model = sdmc_full
          expansion_smg = 0.7014079815036496, 18.40625, 16.19317622240633, 0.5, 0.024822032167576252, 0.25, 0.01264704344701022, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          write background = yes
          root = output/cov_exact_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          output_verbose = 0
          EOF
          ./class output/cov_exact_target.ini

          python3 sdmc/run_r032_partial_zeq_ztbest_covariant.py

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('source/background.c'); s=p.read_text()
          pat=re.compile(
              r'double Ox\s*=\s*pba->parameters_smg\[0\];\s*'
              r'double lambda_e\s*=\s*pba->parameters_smg\[1\];\s*'
              r'double zt\s*=\s*pba->parameters_smg\[2\];\s*'
              r'double dNt\s*=\s*pba->parameters_smg\[3\];\s*'
              r'double A\s*=\s*pba->parameters_smg\[4\];\s*'
              r'double tauA\s*=\s*pba->parameters_smg\[5\];\s*'
              r'double B\s*=\s*pba->parameters_smg\[6\];\s*'
              r'double tauB\s*=\s*pba->parameters_smg\[7\];'
          )
          repl='''double Ox = 0.7014079815036496;
            double lambda_e = 18.40625;
            double zt = 16.19317622240633;
            double dNt = 0.5;
            double A = 0.024822032167576252;
            double tauA = 0.25;
            double B = 0.01264704344701022;
            double tauB = 1.5;'''
          s2,n=pat.subn(repl,s,count=1)
          if n != 1: raise RuntimeError(f'tracker helper replacement count={n}')
          p.write_text(s2)
          PY
          make clean && make -j2 class

      - name: Run S117, same-ordinary GR, and local021 backgrounds
        run: |
          cat > output/s117_validation.ini <<'EOF'
          H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.117602412937069e-9
          n_s = 0.9625227132590487
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_covariant_exact
          parameters_smg = 0.0
          expansion_model = sdmc_full
          expansion_smg = 0.7014079815036496, 18.40625, 16.19317622240633, 0.5, 0.024822032167576252, 0.25, 0.01264704344701022, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = mPk
          P_k_max_h/Mpc = 20.
          z_pk = 0
          write background = yes
          write thermodynamics = yes
          root = output/s117_validation_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          output_verbose = 0
          EOF
          ./class output/s117_validation.ini

          cat > output/s117_gr_baseline.ini <<'EOF'
          H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.117602412937069e-9
          n_s = 0.9625227132590487
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0.7014079815036496
          modes = s
          output = mPk
          P_k_max_h/Mpc = 20.
          z_pk = 0
          write background = yes
          write thermodynamics = yes
          root = output/s117_gr_baseline_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          output_verbose = 0
          EOF
          ./class output/s117_gr_baseline.ini

          cat > output/local021_validation.ini <<'EOF'
          H0 = 68.56858744695782
          omega_b = 0.022406369378007947
          omega_cdm = 0.11824151052483357
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.05109266435559e-9
          n_s = 0.9649593164240942
          tau_reio = 0.044985382026527077
          Omega_Lambda = 0.7007653816499192
          modes = s
          output = mPk
          P_k_max_h/Mpc = 20.
          z_pk = 0
          write background = yes
          write thermodynamics = yes
          root = output/local021_validation_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          output_verbose = 0
          EOF
          ./class output/local021_validation.ini

          test -f output/s117_validation_00_background.dat
          test -f output/s117_validation_00_thermodynamics.dat
          test -f output/local021_validation_00_background.dat
          ls -lh output/*pk.dat

      - name: Install DESI BAO covariance
        run: |
          rm -rf bao_data
          git clone --depth 1 https://github.com/CobayaSampler/bao_data.git bao_data
          test -f bao_data/desi_2024_gaussian_bao_ALL_GCcomb_mean.txt

      - name: Compute validation ledger
        run: |
          python3 sdmc/run_r032_s117_validation_battery.py

      - name: Print validation ledger
        if: always()
        run: |
          cat output/s117_validation/s117_validation_ledger.json || true
          cat output/s117_validation/s117_validation_summary.csv || true

      - name: Preserve S117 validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-snclosure029-s117-validation-battery
          path: |
            output/s117_validation/*
            output/s117_validation_00_background.dat
            output/s117_validation_00_thermodynamics.dat
            output/s117_validation_00_pk.dat
            output/local021_validation_00_background.dat
            output/local021_validation_00_thermodynamics.dat
            output/local021_validation_00_pk.dat
            output/s117_gr_baseline_00_background.dat
            output/s117_gr_baseline_00_thermodynamics.dat
            output/s117_gr_baseline_00_pk.dat
          if-no-files-found: warn
