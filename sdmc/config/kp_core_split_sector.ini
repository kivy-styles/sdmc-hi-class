# Frozen SDMC Kp CORE split-sector Boltzmann test
#
# This is the Kp cosmological core BEFORE the terminal reciprocal-acoustic
# operator C(eta) is added to the photon-baryon hierarchy.
#
# Early sector: exact lambda_e=20 tracker as a separate conserved fluid with
# c_phi^2=0.003.
# Late sector: frozen optimized analytic exact-No-Slip release
# A_M=0.02586, z_c=4.38, width=0.4467, carried by a separate late scalar.
# Expansion: frozen Kp late delta_H plus exact tracker background.

H0 = 70.8514
omega_b = 0.02239952
omega_cdm = 0.12000047526014168
N_ncdm = 0
N_ur = 3.046
T_cmb = 2.7255
YHe = 0.2453

A_s = 2.10e-9
n_s = 0.965
tau_reio = 0.0544

Omega_Lambda = 0
Omega_fld = 3.0549311e-8
fluid_equation_of_state = SDMC_TRACKER
cs2_fld = 0.003
use_ppf = no

Omega_smg = -1

gravity_model = sdmc_kp_late_noslip
# c_s^2(late), D spectator floor.  The frozen manuscript fixes the F/alpha_M
# release but not a unique alpha_K(a); this is therefore a transparent
# designer kinetic closure whose native hi_class stability is checked.
parameters_smg = 0.1, 1.0e-4
expansion_model = sdmc_full
# Omega_X0, lambda_e, z_t, DeltaN, A_late, tau_A, B_late, tau_B
expansion_smg = 0.716246932, 20.0, 21.26, 0.5, 0.021223342, 0.25, 0.0116038358, 1.5

pert_initial_conditions_smg = zero
method_qs_smg = fully_dynamic
output_background_smg = 1

output = tCl,pCl,lCl,mPk
modes = s
lensing = yes
l_max_scalars = 3000
P_k_max_h/Mpc = 2.0
z_pk = 0,0.5,1,2,3,5,10

root = output/sdmc_kp_core_split_sector_
format = class
write parameters = yes
write background = yes
write thermodynamics = yes
input_verbose = 1
background_verbose = 4
thermodynamics_verbose = 1
perturbations_verbose = 1
spectra_verbose = 0
lensing_verbose = 0
output_verbose = 1
