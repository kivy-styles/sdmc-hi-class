name: SDMC NKp-v3 joint Planck ridge scan

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  joint-planck-ridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy numpy pandas

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py

      - name: Expose exact native cs2 diagnostics
        run: python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build hi_class
        run: make -j2 class

      - name: Install native Planck high-l and low-l likelihoods
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          for cls in (TTTEEE_lite_native, TT, EE):
              ok=cls.install(path='planck_packages',no_progress_bars=True)
              if not ok:
                  raise SystemExit(f'Planck install failed: {cls.__name__}')
          PY

      - name: Scan edge-to-mild NKp-v3 corridor with joint Planck high plus low
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, glob, math, os, re, subprocess, textwrap
          import numpy as np
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE

          TCMB=2.7255
          CAL_SIGMA=0.0025
          BASE_LNAS=3.076
          BASE_AS=math.exp(BASE_LNAS)/1e10
          OUT=Path('output/v3_joint_planck_ridge')
          OUT.mkdir(parents=True,exist_ok=True)

          high=TTTEEE_lite_native(packages_path='planck_packages')
          lowT=TT(packages_path='planck_packages')
          lowE=EE(packages_path='planck_packages')

          # Corridor joining the confirmed edge (z_c~5) to the milder
          # original native point (z_c~10).  Small transverse offsets let
          # the data move off the hand-drawn centre line.
          ZCS=[5.0,6.0,7.0,8.0,9.0,10.0]
          A_OFF=[-0.0004,0.0,0.0004]
          W_OFF=[-0.03,0.0,0.03]
          NS_FIXED=[0.962,0.964]

          candidates=[]
          for zc in ZCS:
              Abase=0.0760-0.0008*zc
              wbase=1.30+0.03*zc
              for da in A_OFF:
                  for dw in W_OFF:
                      for ns in NS_FIXED:
                          candidates.append((Abase+da,zc,wbase+dw,ns))

          def ini_text(A,zc,w,As,ns,root,full=False):
              outputs=(
                  'output = tCl,pCl,lCl,mPk\n'
                  'P_k_max_h/Mpc = 6.0\n'
                  'z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10\n'
                  'write thermodynamics = yes\nwrite parameters = yes\n'
                  if full else
                  'output = tCl,pCl,lCl\nwrite thermodynamics = no\nwrite parameters = no\n'
              )
              return textwrap.dedent(f'''\
              H0 = 70.8514
              omega_b = 0.02239952
              omega_cdm = 0.12444227328918850
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = {As:.14e}
              n_s = {ns:.9f}
              tau_reio = 0.0544
              Omega_Lambda = 0
              Omega_fld = 3.1443554e-8
              fluid_equation_of_state = SDMC_TRACKER
              cs2_fld = 0.003
              use_ppf = no
              Omega_smg = -1
              gravity_model = sdmc_v3_native_noslip
              parameters_smg = {A:.12g}, {zc:.12g}, {w:.12g}, 0.1, 0.0001
              expansion_model = sdmc_full
              expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
              pert_initial_conditions_smg = zero
              method_qs_smg = fully_dynamic
              output_background_smg = 3
              modes = s
              lensing = yes
              l_max_scalars = 3000
              {outputs}write background = yes
              root = {root}
              format = class
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          def load(path):
              a=np.loadtxt(path)
              ell=a[:,0].astype(int)
              conv=(TCMB*1e6)**2
              n=int(ell.max())+1
              tt=np.zeros(n); ee=np.zeros(n); te=np.zeros(n)
              tt[ell]=a[:,1]*conv; ee[ell]=a[:,2]*conv; te[ell]=a[:,3]*conv
              harr=np.column_stack([ell,tt[ell],te[ell],ee[ell]])
              return tt,ee,harr

          def score(path):
              tt,ee,harr=load(path)
              def components(A):
                  A=float(A)
                  ch=float(high.chi_squared(harr,A_planck=A))
                  ct=float(-2.0*lowT.log_likelihood(tt,calib=A))
                  ce=float(-2.0*lowE.log_likelihood(ee,calib=A))
                  cp=((A-1.0)/CAL_SIGMA)**2
                  return ch,ct,ce,cp,ch+ct+ce+cp
              opt=minimize_scalar(lambda A: components(A)[-1],
                                  bounds=(0.97,1.03),method='bounded',
                                  options={'xatol':1e-10})
              A=float(opt.x)
              return A,*components(A)

          def bg_diag(path):
              lines=Path(path).read_text().splitlines()
              hdr=[x for x in lines if x.startswith('#') and re.search(r'1\s*:',x)][-1].lstrip('#').strip()
              marks=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(marks):
                  end=marks[i+1].start() if i+1<len(marks) else len(hdr)
                  names.append(hdr[m.end():end].strip())
              a=np.loadtxt(path)
              d={name:a[:,i] for i,name in enumerate(names)}
              z=d['z']; sub=z<=100
              return (
                  float(np.min(d['cs2num'][sub])),
                  float(np.min(d['kin (D)'][sub])),
                  float(np.max(np.abs(d['braiding_smg'][sub]+2*d['M2_running_smg'][sub]))),
              )

          fields=['A_F','z_c','width','ln10As','n_s','status','A_planck',
                  'chi2_high','chi2_lowT','chi2_lowE','chi2_cal_prior',
                  'chi2_joint','min_cs2num_z100','min_D_z100',
                  'max_abs_noslip_z100','error']
          rows=[]; best=None
          for i,(A,zc,w,ns) in enumerate(candidates,1):
              stem=f'j_{i:03d}'; root=str(OUT/(stem+'_')); ini=OUT/(stem+'.ini')
              ini.write_text(ini_text(A,zc,w,BASE_AS,ns,root,False))
              cp=subprocess.run(['./class',str(ini)],stdout=subprocess.PIPE,
                                stderr=subprocess.STDOUT,text=True,timeout=180)
              cl=Path(root+'00_cl_lensed.dat'); bg=Path(root+'00_background.dat')
              row={'A_F':A,'z_c':zc,'width':w,'ln10As':BASE_LNAS,'n_s':ns,
                   'status':'FAIL','A_planck':'','chi2_high':'','chi2_lowT':'',
                   'chi2_lowE':'','chi2_cal_prior':'','chi2_joint':'',
                   'min_cs2num_z100':'','min_D_z100':'',
                   'max_abs_noslip_z100':'','error':cp.stdout[-1000:]}
              if cp.returncode==0 and cl.exists() and bg.exists():
                  Acal,ch,ct,ce,cpr,total=score(cl)
                  nmin,dmin,nos=bg_diag(bg)
                  row.update({'status':'OK','A_planck':Acal,'chi2_high':ch,
                              'chi2_lowT':ct,'chi2_lowE':ce,
                              'chi2_cal_prior':cpr,'chi2_joint':total,
                              'min_cs2num_z100':nmin,'min_D_z100':dmin,
                              'max_abs_noslip_z100':nos,'error':''})
                  print(f'JOINT A={A:.4f} zc={zc:g} w={w:.3f} ns={ns:.3f} '
                        f'joint={total:.6f} high={ch:.3f} lowT={ct:.3f}',flush=True)
                  if best is None or total<best['chi2_joint']:
                      best=dict(row)
              else:
                  print(f'JOINT_FAIL A={A:.4f} zc={zc:g} w={w:.3f} ns={ns:.3f}',flush=True)
              rows.append(row)
              for p in glob.glob(root+'*'):
                  try: os.remove(p)
                  except OSError: pass
              try: ini.unlink()
              except OSError: pass

          with (OUT/'sdmc_v3_joint_planck_ridge_scan.csv').open('w',newline='') as f:
              wr=csv.DictWriter(f,fieldnames=fields); wr.writeheader(); wr.writerows(rows)
          if best is None:
              raise SystemExit('No stable joint-Planck candidate survived')
          with (OUT/'sdmc_v3_joint_planck_ridge_best_fixedprim.csv').open('w',newline='') as f:
              wr=csv.DictWriter(f,fieldnames=fields); wr.writeheader(); wr.writerow(best)
          print('BEST_JOINT_FIXED',best,flush=True)

          # Local primordial profile at the best late-sector point.
          LNAS=[3.070,3.073,3.076,3.079,3.082]
          NSS=[0.958,0.960,0.962,0.964,0.966]
          prows=[]; pbest=None; pc=0
          for lnAs in LNAS:
              As=math.exp(lnAs)/1e10
              for ns in NSS:
                  pc+=1; stem=f'p_{pc:03d}'; root=str(OUT/(stem+'_')); ini=OUT/(stem+'.ini')
                  ini.write_text(ini_text(best['A_F'],best['z_c'],best['width'],As,ns,root,False))
                  cp=subprocess.run(['./class',str(ini)],stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT,text=True,timeout=180)
                  cl=Path(root+'00_cl_lensed.dat')
                  if cp.returncode==0 and cl.exists():
                      Acal,ch,ct,ce,cpr,total=score(cl)
                      r={'ln10As':lnAs,'A_s':As,'n_s':ns,'status':'OK',
                         'A_planck':Acal,'chi2_high':ch,'chi2_lowT':ct,
                         'chi2_lowE':ce,'chi2_cal_prior':cpr,'chi2_joint':total}
                      prows.append(r)
                      print(f'JOINT_PRIM ln10As={lnAs:.3f} ns={ns:.3f} '
                            f'joint={total:.6f} high={ch:.3f} lowT={ct:.3f}',flush=True)
                      if pbest is None or total<pbest['chi2_joint']:
                          pbest=dict(r)
                  else:
                      prows.append({'ln10As':lnAs,'A_s':As,'n_s':ns,'status':'FAIL',
                                    'A_planck':'','chi2_high':'','chi2_lowT':'',
                                    'chi2_lowE':'','chi2_cal_prior':'','chi2_joint':''})
                  for p in glob.glob(root+'*'):
                      try: os.remove(p)
                      except OSError: pass
                  try: ini.unlink()
                  except OSError: pass

          pfields=['ln10As','A_s','n_s','status','A_planck','chi2_high',
                   'chi2_lowT','chi2_lowE','chi2_cal_prior','chi2_joint']
          with (OUT/'sdmc_v3_joint_planck_primordial_scan.csv').open('w',newline='') as f:
              wr=csv.DictWriter(f,fieldnames=pfields); wr.writeheader(); wr.writerows(prows)
          with (OUT/'sdmc_v3_joint_planck_primordial_best.csv').open('w',newline='') as f:
              wr=csv.DictWriter(f,fieldnames=pfields); wr.writeheader(); wr.writerow(pbest)
          print('BEST_JOINT_PRIM',pbest,flush=True)

          # Full observable rerun at the current joint optimum.
          root='output/sdmc_v3_joint_planck_best_'
          Path('output/sdmc_v3_joint_planck_best.ini').write_text(
              ini_text(best['A_F'],best['z_c'],best['width'],
                       float(pbest['A_s']),float(pbest['n_s']),root,True))
          cp=subprocess.run(['./class','output/sdmc_v3_joint_planck_best.ini'],
                            stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                            text=True,timeout=300)
          Path('output/sdmc_v3_joint_planck_best.log').write_text(cp.stdout)
          print('JOINT_FULL_RETURNCODE',cp.returncode,flush=True)
          if cp.returncode:
              raise SystemExit(cp.returncode)
          PY

      - name: Generate matched LCDM reference and evaluate joint optimum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          p=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {math.exp(3.044)/1e10:.14e}',p)
          p=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',p)
          p=re.sub(r'(?m)^\s*root\s*=.*$','root = output/lcdm_joint_planck_',p)
          Path('output/lcdm_joint_planck.ini').write_text(p)
          PY
          ./class output/lcdm_joint_planck.ini
          python3 - <<'PY'
          from pathlib import Path
          import csv, numpy as np
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          TCMB=2.7255; SIG=0.0025
          high=TTTEEE_lite_native(packages_path='planck_packages')
          lowT=TT(packages_path='planck_packages'); lowE=EE(packages_path='planck_packages')
          def load(path):
              a=np.loadtxt(path); ell=a[:,0].astype(int); conv=(TCMB*1e6)**2
              n=int(ell.max())+1; tt=np.zeros(n); ee=np.zeros(n); te=np.zeros(n)
              tt[ell]=a[:,1]*conv; ee[ell]=a[:,2]*conv; te[ell]=a[:,3]*conv
              return tt,ee,np.column_stack([ell,tt[ell],te[ell],ee[ell]])
          def eval(path):
              tt,ee,h=load(path)
              def pcs(A):
                  ch=float(high.chi_squared(h,A_planck=float(A)))
                  ct=float(-2*lowT.log_likelihood(tt,calib=float(A)))
                  ce=float(-2*lowE.log_likelihood(ee,calib=float(A)))
                  cp=((float(A)-1)/SIG)**2
                  return ch,ct,ce,cp,ch+ct+ce+cp
              opt=minimize_scalar(lambda A:pcs(A)[-1],bounds=(0.97,1.03),method='bounded')
              A=float(opt.x); return A,*pcs(A)
          rows=[]
          for label,path in [
              ('LCDM','output/lcdm_joint_planck_00_cl_lensed.dat'),
              ('NKp_v3_joint_best','output/sdmc_v3_joint_planck_best_00_cl_lensed.dat')]:
              A,ch,ct,ce,cp,total=eval(path)
              rows.append({'case':label,'A_planck':A,'chi2_high':ch,'chi2_lowT':ct,
                           'chi2_lowE':ce,'chi2_cal_prior':cp,'chi2_joint':total})
              print(label,rows[-1],flush=True)
          out=Path('output/sdmc_v3_joint_planck_final.csv')
          with out.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)
          PY

      - name: Preserve joint Planck ridge outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-nkp-v3-joint-planck-ridge
          path: |
            output/v3_joint_planck_ridge/sdmc_v3_joint_planck_ridge_scan.csv
            output/v3_joint_planck_ridge/sdmc_v3_joint_planck_ridge_best_fixedprim.csv
            output/v3_joint_planck_ridge/sdmc_v3_joint_planck_primordial_scan.csv
            output/v3_joint_planck_ridge/sdmc_v3_joint_planck_primordial_best.csv
            output/sdmc_v3_joint_planck_best.ini
            output/sdmc_v3_joint_planck_best.log
            output/sdmc_v3_joint_planck_best_*
            output/lcdm_joint_planck_00_cl_lensed.dat
            output/sdmc_v3_joint_planck_final.csv
          if-no-files-found: warn
