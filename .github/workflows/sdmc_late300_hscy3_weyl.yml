name: late300 HSCY3 native Weyl
on:
  push:
    branches: [sdmc-late300-hscy3-weyl-pilot]
  workflow_dispatch:
jobs:
  hsc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install numpy scipy astropy sacc
      - name: spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}" --name late300-desy3-native-weyl-tomography --dir output
      - name: HSC data
        run: |
          git clone --depth 1 https://github.com/cosmosis-developers/cosmosis-standard-library.git
          cd cosmosis-standard-library && git lfs pull || true
          cd ..
      - name: likelihood
        run: |
          python3 sdmc/run_late300_hscy3_weyl.py | tee output/hscy3_weyl.log
          cat output/hscy3_weyl/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late300-hscy3-native-weyl
          path: |
            output/hscy3_weyl/*
            output/hscy3_weyl.log
