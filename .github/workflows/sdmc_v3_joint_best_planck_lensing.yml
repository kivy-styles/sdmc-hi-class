name: SDMC NKp-v3 joint-best Planck lensing validation

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  validate-joint-best-lensing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy numpy

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build hi_class
        run: make -j2 class

      - name: Install Planck native likelihood data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              ok=cls.install(path='planck_packages',no_progress_bars=True)
              if not ok:
                  raise SystemExit(f'Planck install failed: {cls}')
          PY

      - name: Generate joint-best NKp-v3 and LCDM spectra
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re,textwrap
          As=math.exp(3.076)/1e10
          v3=textwrap.dedent(f'''\
          H0 = 70.8514
          omega_b = 0.02239952
          omega_cdm = 0.12444227328918850
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = {As:.14e}
          n_s = 0.964
          tau_reio = 0.0544
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_native_noslip
          parameters_smg = 0.0716, 6.0, 1.45, 0.1, 0.0001
          expansion_model = sdmc_full
          expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          output_background_smg = 3
          modes = s
          lensing = yes
          l_max_scalars = 3000
          output = tCl,pCl,lCl,mPk
          P_k_max_h/Mpc = 6.0
          z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10
          write background = yes
          write thermodynamics = yes
          write parameters = yes
          root = output/nkp_v3_joint_best_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          lensing_verbose = 0
          output_verbose = 0
          ''')
          Path('output').mkdir(exist_ok=True)
          Path('output/nkp_v3_joint_best.ini').write_text(v3)

          p=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          p=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {math.exp(3.044)/1e10:.14e}',p)
          p=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',p)
          p=re.sub(r'(?m)^\s*root\s*=.*$','root = output/lcdm_joint_best_',p)
          p=re.sub(r'(?m)^\s*output\s*=.*$','output = tCl,pCl,lCl',p)
          Path('output/lcdm_joint_best.ini').write_text(p)
          PY
          ./class output/nkp_v3_joint_best.ini
          ./class output/lcdm_joint_best.ini

      - name: Evaluate Planck baseline components including lensing
        run: |
          python3 sdmc/evaluate_planck_native_components.py \
            --packages planck_packages \
            --output output/nkp_v3_joint_best_planck_components.csv \
            LCDM_joint_best=output/lcdm_joint_best_00_cl_lensed.dat \
            NKp_v3_joint_best=output/nkp_v3_joint_best_00_cl_lensed.dat

      - name: Preserve joint-best validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-nkp-v3-joint-best-planck-lensing
          path: |
            output/nkp_v3_joint_best_planck_components.csv
            output/nkp_v3_joint_best.ini
            output/nkp_v3_joint_best_00_*
            output/lcdm_joint_best_00_cl_lensed.dat
          if-no-files-found: warn
