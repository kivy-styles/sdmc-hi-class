name: SDMC conserved material spectrum and structural selector response

on:
  push:
    branches: [sdmc-pg-redistribution-spectrum-20261102]
    paths:
      - 'sdmc/pg_redistribution_spectrum.py'
      - 'tests/test_pg_redistribution_spectrum.py'
      - 'docs/pg_redistribution_spectrum_and_selector_response.md'
      - '.github/workflows/sdmc_pg_redistribution_spectrum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-to-geometry-spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install scientific dependencies
        run: python3 -m pip install numpy scipy
      - name: Verify conserved mass stochastic spectrum and selector equilibrium
        run: |
          python3 -m py_compile sdmc/pg_redistribution_spectrum.py tests/test_pg_redistribution_spectrum.py
          python3 -m unittest discover -s tests -p 'test_pg_redistribution_spectrum.py' -v
      - name: Keep all prior structural and scalar-tensor regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_pg_full_spatial_stress.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_mapper_pressure_accounting.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_tensor_adm_constraints.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_nonlinear_conformal_stress.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_inhomogeneous_adm_source.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_adiabatic_dilution.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_coupled_rolling_g3_trace.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_rolling_g3_adm.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_retarded_jordan_response.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_jordan_qs_covariant.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_constraint_schur.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_energy_exchange*.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_quadratic_source*.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_linear_perturbations.py' -v
      - name: Save deterministic benchmark with no fitted CDM density
        run: |
          mkdir -p results/pg_redistribution
          python3 -m sdmc.pg_redistribution_spectrum | tee results/pg_redistribution/material_spectrum_and_selector.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/pg_redistribution/material_spectrum_and_selector.json').read_text())
          assert r['spectrum']['E_sum']>0
          assert r['selector_off']['E_sum']==0
          assert 15.8 < r['clustered_two_point']['enhancement_over_iid'] < 16
          assert not r['spectrum']['observational_gravity_proven']
          assert r['required_activation']['radiation']['required_power_slope_if_W_T_constant']==7
          print('SDMC_REDISTRIBUTION_SPECTRUM_STATIC_SELECTOR_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmc-redistribution-spectrum-and-selector
          path: results/pg_redistribution/
          if-no-files-found: warn
