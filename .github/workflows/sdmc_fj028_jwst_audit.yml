name: SDMC fj028 JWST likelihood-equivalent audit

on:
  push:
    branches:
      - sdmc-fj028-jwst-audit
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  jwst:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: python3 -m pip install -q numpy pandas
      - name: Download exact baseline and fj028 DESI transfer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/d044 inputs/fj028
          gh run download 36167249409 --repo "${{ github.repository }}"             --name sdmc-discussion-s117-g073-d044p045-exact-desi --dir inputs/d044
          gh run download 37474538760 --repo "${{ github.repository }}"             --name sdmc-r032-late266-autoparams-covariant-desi --dir inputs/fj028
          test -f inputs/d044/desi_cov_00_z1_pk.dat
          test -f inputs/fj028/desi_cov_00_z1_pk.dat
      - name: Run candidate-specific JWST stress test
        run: |
          python3 sdmc/run_fj028_jwst_likelihood_equivalent.py
          cat output/fj028_jwst/fj028_jwst_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: sdmc-fj028-jwst-likelihood-equivalent
          path: output/fj028_jwst/*
      - name: Commit compact result
        run: |
          mkdir -p sdmc/results/fj028_jwst
          cp output/fj028_jwst/fj028_jwst_summary.json sdmc/results/fj028_jwst/
          cp output/fj028_jwst/fj028_jwst_candidates.csv sdmc/results/fj028_jwst/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdmc/results/fj028_jwst
          git commit -m "Store fj028 JWST audit result [skip ci]" || exit 0
          git push origin HEAD:sdmc-fj028-jwst-audit
