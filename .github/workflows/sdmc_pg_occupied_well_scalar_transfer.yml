name: SDMC occupied structural well scalar-curvature modulation

on:
  push:
    branches: [sdmc-occupied-well-scalar-loading-20261101]
    paths:
      - 'sdmc/pg_occupied_scalar_curvature_transfer.py'
      - 'sdmc/pg_canonical_handoff_occupation.py'
      - 'tests/test_pg_occupied_scalar_curvature_transfer.py'
      - 'tests/test_pg_canonical_handoff_occupation.py'
      - 'docs/pg_occupied_scalar_curvature_transfer.md'
      - '.github/workflows/sdmc_pg_occupied_well_scalar_transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  occupied-geometric-scalar-response:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install scientific Python
        run: python3 -m pip install numpy scipy
      - name: Check occupied structural-scalar coupling and finite-difference controls
        run: |
          python3 -m py_compile sdmc/pg_occupied_scalar_curvature_transfer.py sdmc/pg_canonical_handoff_occupation.py tests/test_pg_occupied_scalar_curvature_transfer.py tests/test_pg_canonical_handoff_occupation.py
          python3 -m unittest discover -s tests -p 'test_pg_occupied_scalar_curvature_transfer.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_canonical_handoff_occupation.py' -v
      - name: Run prior source, geometric gravity and flatness regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_pg_primordial_source_action_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_primordial_well_retarded.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_flatness_handoff.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_full_spatial_stress.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_mapper_pressure_accounting.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_tensor_adm_constraints.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_nonlinear_conformal_stress.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_inhomogeneous_adm_source.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_adiabatic_dilution.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_coupled_rolling_g3_trace.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_rolling_g3_adm.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_retarded_jordan_response.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_jordan_qs_covariant.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_constraint_schur.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_energy_exchange*.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_quadratic_source*.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_linear_perturbations.py' -v
      - name: Export curvature driven preoccupied mode diagnostics
        run: |
          mkdir -p output/pg_occupied_scalar_curvature
          python3 -m sdmc.pg_occupied_scalar_curvature_transfer | tee output/pg_occupied_scalar_curvature/occupied_well_scalar_loading.json
          python3 -m sdmc.pg_canonical_handoff_occupation | tee output/pg_occupied_scalar_curvature/canonical_kinetic_handoff_occupation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('output/pg_occupied_scalar_curvature/occupied_well_scalar_loading.json').read_text())
          assert d['occupied']['max_perturbed_trace']>0
          assert d['empty']['max_perturbed_trace']==0
          assert d['beta_zero']['max_perturbed_trace']==0
          assert d['Ricci_zero']['max_perturbed_trace']==0
          assert d['Fsigma_zero']['max_perturbed_trace']==0
          assert d['finite_difference_crosscheck']['max_abs_strain_linearization_error']<4e-5
          assert d['finite_difference_crosscheck']['max_abs_energy_linearization_error']<4e-5
          assert abs(d['continuity_check']['balance_residual'])<5e-13
          assert d['finite_difference_crosscheck']['source_is_prescribed_not_physical_constraint']
          q=json.loads(Path('output/pg_occupied_scalar_curvature/canonical_kinetic_handoff_occupation.json').read_text())
          assert q['cases']['fast']['n_k']>.10
          assert q['cases']['slow']['n_k']<5e-5
          assert q['cases']['unchanged']['n_k']<1e-12
          assert all(abs(x['norm_check']-1)<2e-8 for x in q['cases'].values())
          assert not q['physically_fixed_spectrum']
          print('SDMC_OCCUPIED_WELL_SCALAR_LOADING_AND_CANONICAL_VACUUM_MIXING_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmc-occupied-well-scalar-response
          path: output/pg_occupied_scalar_curvature/
          if-no-files-found: warn
