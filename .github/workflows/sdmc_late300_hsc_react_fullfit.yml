name: SDMC HSC-Y3 corrected ReACT full nuisance refit
on:
  push:
    branches: [sdmc-late300-hscy3-weyl]
    paths:
      - 'sdmc/run_late300_hsc_react_fullfit.py'
      - '.github/workflows/sdmc_late300_hsc_react_fullfit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        model: [late300, local021]
        variant: [us_native, ss_native, us_screen03, ss_screen03]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy sacc
      - name: Recover exact linear Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}"             --name late300-desy3-native-weyl-tomography --dir output
          test -d output/weyl_spectra
      - name: Recover corrected ReACT bracket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/react_dense
          gh run download 37604828408 --repo "${{ github.repository }}"             --name late300-react-exact-bracket --dir output/react_dense
          test -s output/react_dense/react_late300/late300_react_target_spectrum.npz
      - name: Download HSC-Y3 public products
        run: |
          rm -rf cosmosis-standard-library
          git clone --depth 1 https://github.com/cosmosis-developers/cosmosis-standard-library.git
          cd cosmosis-standard-library && git lfs pull || true
          cd ..
      - name: Run corrected ReACT HSC full nuisance fit
        run: |
          python3 sdmc/run_late300_hsc_react_fullfit.py "${{ matrix.model }}" "${{ matrix.variant }}" |             tee "output/hsc_react_full_${{ matrix.model }}_${{ matrix.variant }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsc-react-full-${{ matrix.model }}-${{ matrix.variant }}
          path: |
            output/hsc_react_full/*
            output/hsc_react_full_${{ matrix.model }}_${{ matrix.variant }}.log
          if-no-files-found: warn
