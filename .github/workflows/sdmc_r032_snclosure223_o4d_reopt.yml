name: SDMC r032 SNclosure223 ordinary-parameter recovery

on:
  push:
    branches:
      - sdmc-r032-snclosure223-o4d-reopt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reopt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya

      - name: Apply SDMC patches and build
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make -j2 class

      - name: Install Planck native-lite likelihood data
        run: |
          ok=0
          for attempt in 1 2 3 4
          do
            rm -rf planck_packages
            if python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(2)
          print('PLANCK_LITE_READY')
          PY
            then ok=1; break; fi
            sleep $((attempt*6))
          done
          test "$ok" -eq 1

      - name: Install SN and BAO covariance products
        run: |
          rm -rf sn_data bao_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data
          git clone --depth 1 https://github.com/CobayaSampler/bao_data.git bao_data

      - name: Run ordinary-parameter recovery
        run: python3 sdmc/run_r032_snclosure223_o4d_reopt.py

      - name: Print summary
        if: always()
        run: |
          cat output/snclosure223_o4d/snclosure223_o4d_summary.json || true
          echo "--- TOP ---"
          python3 - <<'PY'
          import pandas as pd
          p='output/snclosure223_o4d/snclosure223_o4d.csv'
          try:
              d=pd.read_csv(p)
              print(d[d.status.eq('OK')].sort_values(['goal_score','second_joint_proxy','pd_proxy']).head(12).to_string(index=False))
          except Exception as e: print(e)
          PY

      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-snclosure223-o4d-reopt
          path: output/snclosure223_o4d/*.*
          if-no-files-found: warn
