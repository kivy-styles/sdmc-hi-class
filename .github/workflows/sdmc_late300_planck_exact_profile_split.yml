name: SDMC late300 exact-spectrum Planck profile split

on:
  push:
    branches: [sdmc-late300-planck-evidence-profile-split]
    paths:
      - '.github/workflows/sdmc_late300_planck_exact_profile_split.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy cobaya iminuit

      - name: Install official Planck likelihoods
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE import TTTEEE
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          if not TTTEEE.install(path='planck_full',no_progress_bars=True):
              raise SystemExit('full Plik install failed')
          for cls in (TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(f'Planck install failed: {cls}')
          print('PLANCK_EXACT_PROFILE_DATA_READY')
          PY

      - name: Recover exact evidence spectra and evidence result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/late300 inputs/local021 evidence output
          gh run download 37579409032 --repo "${{ github.repository }}"             --name late300-linear-g3-covariant-audit --dir inputs/late300
          gh run download 35585790426 --repo "${{ github.repository }}"             --name lcdm-local021-fullplik --dir inputs/local021
          gh run download 37637638799 --repo "${{ github.repository }}"             --name planck-conditional-bayes-factor-highprecision --dir evidence
          test -s inputs/late300/linear_cov_free_00_cl_lensed.dat
          test -s inputs/local021/lcdm_local021_00_cl_lensed.dat
          test -s evidence/planck_conditional_bayes_factor.json

      - name: Profile identical nuisance posterior integrand
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, numpy as np
          from iminuit import Minuit
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE import TTTEEE
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          TCMB=2.7255
          high=TTTEEE(packages_path='planck_full')
          lowT=TT(packages_path='planck_packages')
          lowE=EE(packages_path='planck_packages')
          lens=LensingNative(packages_path='planck_packages')

          fixed={
            'cib_index':-1.3,'galf_TE_index':-2.4,'galf_EE_index':-2.4,
            'A_sbpx_100_100_TT':1.0,'A_sbpx_143_143_TT':1.0,
            'A_sbpx_143_217_TT':1.0,'A_sbpx_217_217_TT':1.0,
            'galf_EE_A_100':0.055,'galf_EE_A_100_143':0.040,
            'galf_EE_A_100_217':0.094,'galf_EE_A_143':0.086,
            'galf_EE_A_143_217':0.21,'galf_EE_A_217':0.70,
            'A_cnoise_e2e_100_100_EE':1.0,'A_cnoise_e2e_143_143_EE':1.0,
            'A_cnoise_e2e_217_217_EE':1.0,
            'A_sbpx_100_100_EE':1.0,'A_sbpx_100_143_EE':1.0,
            'A_sbpx_100_217_EE':1.0,'A_sbpx_143_143_EE':1.0,
            'A_sbpx_143_217_EE':1.0,'A_sbpx_217_217_EE':1.0,
            'A_pol':1.0,'calib_100P':1.021,'calib_143P':0.966,'calib_217P':1.040,
          }
          names=[
            'A_planck','calib_100T','calib_217T','A_cib_217','xi_sz_cib','A_sz','ksz_norm',
            'gal545_A_100','gal545_A_143','gal545_A_143_217','gal545_A_217',
            'ps_A_100_100','ps_A_143_143','ps_A_143_217','ps_A_217_217',
            'galf_TE_A_100','galf_TE_A_100_143','galf_TE_A_100_217',
            'galf_TE_A_143','galf_TE_A_143_217','galf_TE_A_217'
          ]
          bounds=[
            (.97,1.03),(.9946,1.0058),(.99285,1.00325),
            (0,200),(0,1),(0,10),(0,10),(0,24.6),(0,26.6),(0,91.5),(0,251.9),
            (0,400),(0,400),(0,400),(0,400),
            (0,0.466),(0,0.418),(0,1.18),(0,0.783),(0,1.41),(0,6.258)
          ]
          gauss={
            'A_planck':(1.,.0025),'calib_100T':(1.0002,.0007),'calib_217T':(.99805,.00065),
            'gal545_A_100':(8.6,2.),'gal545_A_143':(10.6,2.),
            'gal545_A_143_217':(23.5,8.5),'gal545_A_217':(91.9,20.),
            'galf_TE_A_100':(.130,.042),'galf_TE_A_100_143':(.130,.036),
            'galf_TE_A_100_217':(.46,.09),'galf_TE_A_143':(.207,.072),
            'galf_TE_A_143_217':(.69,.09),'galf_TE_A_217':(1.938,.54),
          }
          expected=set(high.expected_params); supplied=set(fixed)|set(names)
          if expected!=supplied:
              raise RuntimeError(f'parameter mismatch missing={sorted(expected-supplied)} extra={sorted(supplied-expected)}')

          def load(path):
              a=np.loadtxt(path); ell=a[:,0].astype(int); n=int(ell.max())+1
              conv=(TCMB*1e6)**2
              dl={k:np.zeros(n) for k in ['tt','ee','bb','te','pp','tp','ep']}
              dl['tt'][ell]=a[:,1]*conv; dl['ee'][ell]=a[:,2]*conv
              dl['te'][ell]=a[:,3]*conv; dl['bb'][ell]=a[:,4]*conv
              ll=ell.astype(float)*(ell.astype(float)+1.)
              dl['pp'][ell]=a[:,5]*ll
              dl['tp'][ell]=a[:,6]*np.sqrt(ll)*(TCMB*1e6)
              dl['ep'][ell]=a[:,7]*np.sqrt(ll)*(TCMB*1e6)
              cl={k:np.zeros(n) for k in ['tt','ee','bb','te']}
              fac=np.zeros(n); q=ell>=2; fac[ell[q]]=2*np.pi/ll[q]
              for k in cl: cl[k][ell]=dl[k][ell]*fac[ell]
              return cl,dl

          def prior_chi2(p):
              c=sum(((p[n]-mu)/sig)**2 for n,(mu,sig) in gauss.items())
              c+=((p['ksz_norm']+1.6*p['A_sz']-9.5)/3.0)**2
              return float(c)

          def profile(label,path,seeds):
              cl,dl=load(path)
              def pieces(x):
                  p=dict(fixed); p.update(dict(zip(names,map(float,x))))
                  lh=float(high.log_likelihood(cl,**p)); A=p['A_planck']
                  lt=float(lowT.log_likelihood(dl['tt'],calib=A))
                  le=float(lowE.log_likelihood(dl['ee'],calib=A))
                  lp={lens.calibration_param:A} if getattr(lens,'calibration_param',None) else {}
                  ll=float(lens.log_likelihood(dl,**lp))
                  return p,lh,lt,le,ll
              def fun(*x):
                  try:
                      p,lh,lt,le,ll=pieces(x)
                      if not all(np.isfinite([lh,lt,le,ll])): return 1e100
                      return float(-2*(lh+lt+le+ll)+prior_chi2(p))
                  except Exception:
                      return 1e100
              best=None
              for i,seed in enumerate(seeds):
                  m=Minuit(fun,*seed,name=names); m.errordef=1.; m.strategy=1; m.tol=.05
                  for n,b in zip(names,bounds): m.limits[n]=b
                  for n in names: m.errors[n]=max(1e-5,.01*max(abs(m.values[n]),1.0))
                  m.migrad(ncall=7000)
                  if not m.fmin.is_valid:
                      m.simplex(ncall=3000); m.migrad(ncall=7000)
                  row=(float(m.fval),np.array([m.values[n] for n in names]),bool(m.fmin.is_valid),int(m.nfcn))
                  print('EXACT_PLANCK_PROFILE_SEED',label,i,row[0],row[2],row[3],flush=True)
                  if best is None or row[0]<best[0]: best=row
              fval,x,valid,nfcn=best
              p,lh,lt,le,ll=pieces(x)
              out={'model':label,'chi2_profile_total':fval,'valid':valid,'nfcn':nfcn,
                   'chi2_high_full':-2*lh,'chi2_lowT':-2*lt,'chi2_lowE':-2*le,
                   'chi2_lensing':-2*ll,'chi2_nuisance_priors':prior_chi2(p)}
              out.update({n:float(p[n]) for n in names})
              print('EXACT_PLANCK_PROFILE_RESULT',json.dumps(out,sort_keys=True),flush=True)
              return out

          default=np.array([1.0,1.0002,.99805,67.,.05,7.,3.,8.6,10.6,23.5,91.9,
                            257.,47.,40.,104.,.130,.130,.46,.207,.69,1.938])
          late_seed=np.array([.99985847635,.99968069484,.99824853032,51.5454058,6.93e-6,7.4437447,7.21e-6,
                              8.8404423,11.1509878,19.5945370,93.9866325,261.4705802,47.2278540,40.2734674,
                              116.7673587,.11514867,.13563380,.48262406,.22979460,.67387688,2.12712867])
          local_seed=np.array([1.00016286956,.99972575334,.99823351315,51.6990804,5.75e-7,7.43774467,.22480544,
                               8.79412578,11.14650323,19.50556393,93.64010833,260.98440035,44.85567421,37.78743459,
                               114.42831415,.11388678,.13462753,.48112098,.22416755,.66339304,2.07241872])
          late=profile('late300','inputs/late300/linear_cov_free_00_cl_lensed.dat',[late_seed,default])
          local=profile('local021','inputs/local021/lcdm_local021_00_cl_lensed.dat',[local_seed,default,late_seed])
          ev=json.loads(Path('evidence/planck_conditional_bayes_factor.json').read_text())
          dchi=late['chi2_profile_total']-local['chi2_profile_total']
          dlogprof=-.5*dchi
          dlogz=float(ev['delta_logZ_late300_minus_local021'])
          split={
            'status':'exact-spectrum conditional Planck evidence/profile decomposition',
            'late300_profile':late,'local021_profile':local,
            'delta_chi2_profile_late300_minus_local021':dchi,
            'delta_log_profile_integrand_late300_minus_local021':dlogprof,
            'delta_logZ_late300_minus_local021':dlogz,
            'delta_log_nuisance_volume_late300_minus_local021':dlogz-dlogprof,
            'BF_conditional':float(ev['BF_late300_over_local021']),
            'qualification':'Profile and evidence use the identical fixed spectra and identical 21 nuisance coordinates, likelihood stack, bounds and shared Gaussian-prior factors. The residual delta_logZ-delta_log_profile_integrand is therefore the conditional nuisance-volume contribution; this is still not full SDMC-vs-LCDM model-family evidence.'
          }
          Path('output/planck_exact_profile_split.json').write_text(json.dumps(split,indent=2,sort_keys=True)+'\n')
          print('PLANCK_EXACT_PROFILE_SPLIT',json.dumps(split,sort_keys=True),flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planck-exact-profile-split
          path: output/planck_exact_profile_split.json
          if-no-files-found: warn
