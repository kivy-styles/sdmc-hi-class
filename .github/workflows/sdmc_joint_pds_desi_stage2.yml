name: SDMC independent-D raw DESI joint stage 2

on:
  workflow_dispatch:

jobs:
  desi-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas h5py requests beautifulsoup4 pyyaml camb pyfftw cobaya
          python3 -m pip install git+https://github.com/cosmodesi/cosmoprimo.git
          python3 -m pip install git+https://github.com/adematti/lsstypes.git
          python3 -m pip install git+https://github.com/sfschen/velocileptors.git
          git clone --depth 1 https://github.com/cosmodesi/desi-kp-cosmological-likelihoods.git

      - name: Apply corrected independent-D model
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/apply_sdmc_v3_independent_kinetic_patch.py
          make -j2 class

      - name: Download stage-1 shortlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input_screen
          gh api -H "Accept: application/vnd.github+json" \
            /repos/$GITHUB_REPOSITORY/actions/artifacts/10584883487/zip \
            > input_screen/artifact.zip
          unzip -q input_screen/artifact.zip -d input_screen/unpacked
          test -f input_screen/unpacked/joint_stage2_shortlist.csv
          cat input_screen/unpacked/joint_stage2_shortlist.csv

      - name: Download official DESI DR1 likelihood blocks
        run: |
          mkdir -p desi_likelihood
          BASE=https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          for FN in \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_BGS_BRIGHT-21.5_GCcomb_z0.1-0.4_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.4-0.6_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.6-0.8_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.8-1.1_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_ELG_LOPnotqso_GCcomb_z1.1-1.6_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_QSO_GCcomb_z0.8-2.1_thetacut0.05.h5
          do
            curl -L --fail --retry 3 -o "desi_likelihood/$FN" "$BASE/$FN"
          done

      - name: Evaluate raw DESI shortlist
        run: |
          python3 sdmc/run_joint_desi_stage2.py \
            --screen input_screen/unpacked/joint_stage2_shortlist.csv \
            --data-dir desi_likelihood \
            --desi-repo desi-kp-cosmological-likelihoods \
            --out output/stage2

      - name: Preserve stage 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-independent-d-desi-stage2
          path: |
            output/stage2/stage2_joint_summary.csv
            output/stage2/stage2_desi_blocks.csv
            output/stage2/desi_zeff.json
          if-no-files-found: warn
