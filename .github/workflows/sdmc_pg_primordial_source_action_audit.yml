name: SDMC primordial well material source and L coupling action audit

on:
  push:
    branches: [sdmc-primordial-well-source-closure-20261101]
    paths:
      - 'sdmc/pg_primordial_source_action_audit.py'
      - 'tests/test_pg_primordial_source_action_audit.py'
      - 'docs/pg_primordial_source_action_closure.md'
      - '.github/workflows/sdmc_pg_primordial_source_action_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-source-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install scientific dependencies
        run: python3 -m pip install numpy scipy
      - name: Validate physical Jordan source and W-off coupling
        run: |
          python3 -m py_compile sdmc/pg_primordial_source_action_audit.py tests/test_pg_primordial_source_action_audit.py
          python3 -m unittest discover -s tests -p 'test_pg_primordial_source_action_audit.py' -v
      - name: Run geometric action and source response regression suite
        run: |
          python3 -m unittest discover -s tests -p 'test_pg_primordial_well_retarded.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_flatness_handoff.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_full_spatial_stress.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_mapper_pressure_accounting.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_tensor_adm_constraints.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_nonlinear_conformal_stress.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_inhomogeneous_adm_source.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_adiabatic_dilution.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_coupled_rolling_g3_trace.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_rolling_g3_adm.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_retarded_jordan_response.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_jordan_qs_covariant.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_constraint_schur.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_energy_exchange*.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_quadratic_source*.py' -v
          python3 -m unittest discover -s tests -p 'test_pg_linear_perturbations.py' -v
      - name: Export exact source-Hessian and physical-scope diagnostics
        run: |
          mkdir -p output/pg_primordial_source_audit
          python3 -m sdmc.pg_primordial_source_action_audit | tee output/pg_primordial_source_audit/source_coupling_closure.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/pg_primordial_source_audit/source_coupling_closure.json').read_text())
          off=r['cases']['W_exactly_zero']
          on=r['cases']['selector_on']
          assert off['minimal_material_direct_ell_source']==0
          assert off['linear_metric_trace_cross_Hessian']==0
          assert off['static_response']['ell']==0
          assert off['static_response']['extra_metric_stiffness']==0
          assert off['L_energy_at_nonzero_initial_state']>0
          assert on['linear_metric_trace_cross_Hessian']>0
          assert on['static_response']['extra_metric_stiffness']>0
          assert off['scalar_curvature_load']['nonzero_if_curvature_and_Fsigma']
          assert not off['static_response']['physical_mu_or_lensing_predicted']
          assert not r['cases']['selector_on']['physical_constrained_gravity_solved']
          assert 'NOT in the accepted' in r['conditional_new_operator_example']['extra_operator_not_in_accepted_action'] or r['conditional_new_operator_example']['extra_operator_not_in_accepted_action'].startswith('-g_new')
          print('SDMC_PRIMORDIAL_SOURCE_CHANNEL_AND_STATIC_NO_WELL_THEOREM_PASSED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmc-primordial-source-action-closure
          path: output/pg_primordial_source_audit/
          if-no-files-found: warn
