name: SDMC r032 acoustic physical-ridge063 raw DESI validation

on:
  push:
    branches:
      - sdmc-r032-acoustic-physridge063-desi
  workflow_dispatch:

jobs:
  desi-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git curl
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas h5py requests beautifulsoup4 pyyaml camb pyfftw cobaya

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py

      - name: Build hi_class
        run: make -j2 class

      - name: Install official DESI DR1 dependencies and likelihood files
        run: |
          python3 -m pip install git+https://github.com/cosmodesi/cosmoprimo.git
          python3 -m pip install git+https://github.com/adematti/lsstypes.git
          python3 -m pip install git+https://github.com/sfschen/velocileptors.git
          rm -rf desi-kp-cosmological-likelihoods
          git clone --depth 1 https://github.com/cosmodesi/desi-kp-cosmological-likelihoods.git
          mkdir -p desi_likelihood
          BASE_PRIMARY=https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          BASE_MIRROR=https://webdav-hdfs.pic.es/data/public/DESI/DR1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          for FN in             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_BGS_BRIGHT-21.5_GCcomb_z0.1-0.4_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.4-0.6_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.6-0.8_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.8-1.1_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_ELG_LOPnotqso_GCcomb_z1.1-1.6_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_QSO_GCcomb_z0.8-2.1_thetacut0.05.h5
          do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8
            do
              for BASE in "$BASE_PRIMARY" "$BASE_MIRROR"
              do
                if curl -L --fail --retry 5 --retry-all-errors --retry-delay 5                      --connect-timeout 30 --max-time 300 -C -                      -o "desi_likelihood/$FN" "$BASE/$FN"; then
                  ok=1
                  break 2
                fi
              done
              sleep $((attempt*10))
            done
            test "$ok" -eq 1
          done

      - name: Read official DESI effective redshifts
        run: |
          mkdir -p output
          python3 - <<'PY'
          from pathlib import Path
          import sys,json
          sys.path.insert(0,'desi-kp-cosmological-likelihoods/dr1/cobaya')
          import lsstypes as types
          from desi_fs_bao_all import list_zrange,dataset_fn,get_tracer_label
          records=[]
          for tracer,iz,zrange in list_zrange:
              if 'lya' in tracer.lower(): continue
              fn=dataset_fn('desi_likelihood',tracer,zrange,observable_name='spectrum-poles-rotated')
              d=types.read(fn); sp=d.observable.get('spectrum')
              records.append(dict(tracer=tracer,iz=iz,zrange=list(zrange),
                                  namespace=f"{get_tracer_label(tracer)}_z{iz}",
                                  zeff=float(sp.attrs['zeff']),file=str(fn)))
          Path('output/desi_zeff.json').write_text(json.dumps(records,indent=2))
          zs=[0.0]+sorted({r['zeff'] for r in records})
          Path('output/desi_zpk.txt').write_text(','.join(f'{z:.10g}' for z in zs))
          print('PHYSRIDGE_DESI_ZEFF',records,flush=True)
          print('PHYSRIDGE_DESI_ZPK',zs,flush=True)
          PY

      - name: Run physical-ridge and acoustic-control transfers
        run: |
          ZPK=$(cat output/desi_zpk.txt)
          cat > output/desi_physical.ini <<EOF
          H0 = 69.7095092787552
          omega_b = 0.02211778594478965
          omega_cdm = 0.1258596659367904
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.17005124877665152e-9
          n_s = 0.9637720508351921
          tau_reio = 0.06456347454525531
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.0573794336710125,3.0902165911160413,0.5979282500222326,0.34231919445927034,1.0,0.045
          expansion_model = sdmc_full
          expansion_smg = 0.6953970160452582,17.925,17.775,0.5,0.01105624999,0.25,0.01951933685,1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          gauge = synchronous
          modes = s
          output = mPk,dTk,vTk
          extra_metric_transfer_functions = yes
          matter_source_in_current_gauge = no
          P_k_max_h/Mpc = 2.0
          z_pk = $ZPK
          output_background_smg = 3
          write background = yes
          write thermodynamics = yes
          root = output/desi_physical_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          output_verbose = 0
          EOF

          sed 's/parameters_smg = 0.0573794336710125,3.0902165911160413,0.5979282500222326,0.34231919445927034,1.0,0.045/parameters_smg = 0.0715,5.0,1.426,0.34231919445927034,1.0,0.045/; s#root = output/desi_physical_#root = output/desi_acoustic_#'             output/desi_physical.ini > output/desi_acoustic.ini

          ./class output/desi_physical.ini
          ./class output/desi_acoustic.ini

      - name: Run LCDM transfers
        run: |
          ZPK=$(cat output/desi_zpk.txt)
          cat > output/desi_lcdm.ini <<EOF
          H0 = 67.36
          omega_b = 0.02237
          omega_cdm = 0.1200
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.10e-9
          n_s = 0.9649
          tau_reio = 0.0544
          gauge = synchronous
          modes = s
          output = mPk,dTk,vTk
          extra_metric_transfer_functions = yes
          matter_source_in_current_gauge = no
          P_k_max_h/Mpc = 2.0
          z_pk = $ZPK
          write background = yes
          write thermodynamics = yes
          root = output/desi_lcdm_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          output_verbose = 0
          EOF
          ./class output/desi_lcdm.ini

      - name: Evaluate official DESI DR1 full-shape likelihood
        run: python3 sdmc/run_r032_physridge_desi_profile.py

      - name: Preserve raw DESI validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-acoustic-physridge063-desi
          path: |
            output/desi_zeff.json
            output/desi_zpk.txt
            output/desi_physical.ini
            output/desi_physical_00_*
            output/desi_physical_z*_*
            output/desi_acoustic.ini
            output/desi_acoustic_00_*
            output/desi_acoustic_z*_*
            output/desi_lcdm.ini
            output/desi_lcdm_00_*
            output/desi_lcdm_z*_*
            output/physical_ridge_desi_dr1_fs_profile.csv
            output/physical_ridge_desi_dr1_fs_summary.csv
          if-no-files-found: warn
