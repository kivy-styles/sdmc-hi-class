name: SDMC r032 candidate DESI full-shape promotion

on:
  push:
    branches:
      - sdmc-r032-candidate-desi-promotion
  workflow_dispatch:

jobs:
  candidate-desi:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git curl
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas h5py requests beautifulsoup4 pyyaml camb pyfftw

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          python3 sdmc/install_sdmc_v3_lens_braiding.py

      - name: Build hi_class
        run: make -j2 class

      - name: Install official DESI DR1 full-shape dependencies
        run: |
          python3 -m pip install git+https://github.com/cosmodesi/cosmoprimo.git
          python3 -m pip install git+https://github.com/adematti/lsstypes.git
          python3 -m pip install git+https://github.com/sfschen/velocileptors.git
          rm -rf desi-kp-cosmological-likelihoods
          git clone --depth 1 https://github.com/cosmodesi/desi-kp-cosmological-likelihoods.git
          mkdir -p desi_likelihood
          BASE_PRIMARY=https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          BASE_MIRROR=https://webdav-hdfs.pic.es/data/public/DESI/DR1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          for FN in             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_BGS_BRIGHT-21.5_GCcomb_z0.1-0.4_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.4-0.6_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.6-0.8_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.8-1.1_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_ELG_LOPnotqso_GCcomb_z1.1-1.6_thetacut0.05.h5             likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_QSO_GCcomb_z0.8-2.1_thetacut0.05.h5
          do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8
            do
              for BASE in "$BASE_PRIMARY" "$BASE_MIRROR"
              do
                if curl -L --fail --retry 5 --retry-all-errors --retry-delay 5                      --connect-timeout 30 --max-time 300 -C -                      -o "desi_likelihood/$FN" "$BASE/$FN"; then
                  ok=1
                  break 2
                fi
              done
              sleep $((attempt*10))
            done
            test "$ok" -eq 1
          done

      - name: Run promoted candidate DESI likelihoods
        run: python3 sdmc/run_r032_candidate_desi_fullshape.py

      - name: Preserve DESI promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-candidate-desi-promotion
          path: |
            output/desi_candidates/candidate_desi_blocks.csv
            output/desi_candidates/candidate_desi_summary.csv
            output/desi_candidates/desi_zeff.json
          if-no-files-found: warn
