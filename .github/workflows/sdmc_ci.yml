name: SDMC Boltzmann CI

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip

      - name: Compile SDMC frozen-profile unit test
        run: gcc -std=c99 -O2 -Wall -Wextra sdmc/sdmc_profiles.c sdmc/test_sdmc_profiles.c -lm -o sdmc/test_sdmc_profiles

      - name: Run SDMC frozen-profile unit test
        run: ./sdmc/test_sdmc_profiles

      - name: Build hi_class executable
        run: make -j2 class

      - name: Baseline LCDM smoke test
        run: ./class explanatory.ini

      - name: Kp coordinate-control TT TE EE
        run: ./class sdmc/config/kp_coordinate_control.ini

      - name: NKp-v2 coordinate-control TT TE EE
        run: ./class sdmc/config/nkp_v2_coordinate_control.ini

      - name: Compare coordinate-control spectra
        run: python3 sdmc/compare_coordinate_cls.py

      - name: Preserve SDMC CMB coordinate-control outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-cmb-coordinate-control
          path: |
            output/sdmc_kp_coordinate_*
            output/sdmc_nkp_v2_coordinate_*
            output/sdmc_coordinate_cl_comparison.csv
          if-no-files-found: warn

      - name: Preserve baseline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-baseline-smoke-output
          path: |
            output/
            *.log
          if-no-files-found: ignore
