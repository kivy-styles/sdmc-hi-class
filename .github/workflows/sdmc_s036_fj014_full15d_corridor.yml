name: SDMC s036-fj014 full 15D corridor

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya
      - name: Planck and distance data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path="planck_packages",no_progress_bars=True):
                  raise SystemExit(2)
          PY
          rm -rf sn_data bao_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data
          git clone --depth 1 https://github.com/CobayaSampler/bao_data.git bao_data
      - name: Build full SDMC
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean >/dev/null
          make -j2 class >/dev/null
      - name: Run full corridor
        run: python3 sdmc/run_s036_fj014_full15d_corridor.py
      - name: Print
        if: always()
        run: |
          cat output/s036_fj014_full15d_corridor/full15d_corridor_summary.json || true
          cat output/s036_fj014_full15d_corridor/full15d_corridor_promote.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmc-s036-fj014-full15d-corridor
          path: |
            output/s036_fj014_full15d_corridor/full15d_corridor.csv
            output/s036_fj014_full15d_corridor/full15d_corridor_promote.csv
            output/s036_fj014_full15d_corridor/full15d_corridor_summary.json
          if-no-files-found: warn
