name: SDMC r032 SN-closure107 BO002 transition-width Bayesian refine

on:
  push:
    branches:
      - sdmc-r032-snclosure107-bo002-transitionwidth-bo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transitionwidth-bo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya scikit-learn

      - name: Apply SDMC patches and build
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make -j2 class

      - name: Install Planck and SN likelihood data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(f'Planck install failed: {cls}')
          PY
          rm -rf sn_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data

      - name: Run transition-width Bayesian refinement
        run: python3 sdmc/run_r032_snclosure107_bo002_transitionwidth_bo.py

      - name: Print best candidates
        if: always()
        run: |
          cat output/snclosure107_bo002_transitionwidth/snclosure107_bo002_transitionwidth_summary.json || true
          echo "--- TOP 12 ---"
          cat output/snclosure107_bo002_transitionwidth/snclosure107_bo002_transitionwidth_top15.csv || true

      - name: Preserve optimization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-snclosure107-bo002-transitionwidth-bo
          path: |
            output/snclosure107_bo002_transitionwidth/*.csv
            output/snclosure107_bo002_transitionwidth/*.json
          if-no-files-found: warn
