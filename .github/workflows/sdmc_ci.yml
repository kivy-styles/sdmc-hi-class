name: SDMC Boltzmann CI

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip

      - name: Compile SDMC frozen-profile unit test
        run: gcc -std=c99 -O2 -Wall -Wextra sdmc/sdmc_profiles.c sdmc/test_sdmc_profiles.c -lm -o sdmc/test_sdmc_profiles

      - name: Run SDMC frozen-profile unit test
        run: ./sdmc/test_sdmc_profiles

      - name: Apply exact SDMC tracker and clustering source patch
        run: python3 sdmc/apply_sdmc_tracker_patch.py

      - name: Build hi_class executable
        run: make -j2 class

      - name: Baseline LCDM smoke test
        run: ./class explanatory.ini

      - name: Kp coordinate-control TT TE EE
        run: ./class sdmc/config/kp_coordinate_control.ini

      - name: NKp-v2 coordinate-control TT TE EE
        run: ./class sdmc/config/nkp_v2_coordinate_control.ini

      - name: Compare coordinate-control spectra
        run: python3 sdmc/compare_coordinate_cls.py

      - name: Kp HyRec-aware tracker background proxy
        run: ./class sdmc/config/kp_tracker_background_proxy.ini

      - name: NKp-v2 HyRec-aware tracker background proxy
        run: ./class sdmc/config/nkp_v2_tracker_background_proxy.ini

      - name: Scan HyRec-aware tracker proxy strength
        run: python3 sdmc/run_tracker_proxy_scan.py ./class output/sdmc_tracker_proxy_scan.csv

      - name: Kp two-asymptote tracker background proxy
        run: ./class sdmc/config/kp_tracker_split_proxy.ini

      - name: NKp-v2 two-asymptote tracker background proxy
        run: ./class sdmc/config/nkp_v2_tracker_split_proxy.ini

      - name: Kp exact frozen tracker background
        run: ./class sdmc/config/kp_tracker_exact_background.ini

      - name: NKp-v2 exact frozen tracker background
        run: ./class sdmc/config/nkp_v2_tracker_exact_background.ini

      - name: Kp exact-tracker smooth CMB control
        run: ./class sdmc/config/kp_tracker_smooth_control.ini

      - name: NKp-v2 exact-tracker smooth CMB control
        run: ./class sdmc/config/nkp_v2_tracker_smooth_control.ini

      - name: Compare exact-tracker smooth CMB controls
        run: python3 sdmc/compare_tracker_smooth_cls.py

      - name: Kp clustered tracker c_s2=0.003 TT TE EE
        run: ./class sdmc/config/kp_tracker_clustered_cs0003.ini

      - name: NKp-v2 clustered tracker c_s2=0.003 TT TE EE
        run: ./class sdmc/config/nkp_v2_tracker_clustered_cs0003.ini

      - name: Audit clustered tracker sound speed and stability
        run: python3 sdmc/audit_clustered_tracker.py

      - name: Compare clustered tracker spectra
        run: python3 sdmc/compare_tracker_clustered_cls.py

      - name: Preserve SDMC CMB coordinate-control outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-cmb-coordinate-control
          path: |
            output/sdmc_kp_coordinate_*
            output/sdmc_nkp_v2_coordinate_*
            output/sdmc_coordinate_cl_comparison.csv
          if-no-files-found: warn

      - name: Preserve SDMC tracker CMB controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-tracker-cmb-controls
          path: |
            output/sdmc_kp_tracker_smooth_*
            output/sdmc_nkp_v2_tracker_smooth_*
            output/sdmc_tracker_smooth_cl_comparison.csv
            output/sdmc_kp_tracker_clustered_cs0003_*
            output/sdmc_nkp_v2_tracker_clustered_cs0003_*
            output/sdmc_tracker_clustered_cl_comparison.csv
          if-no-files-found: warn

      - name: Preserve SDMC tracker background diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-tracker-background-diagnostics
          path: |
            output/sdmc_kp_tracker_proxy_*
            output/sdmc_nkp_v2_tracker_proxy_*
            output/sdmc_kp_tracker_split_proxy_*
            output/sdmc_nkp_v2_tracker_split_proxy_*
            output/sdmc_kp_tracker_exact_*
            output/sdmc_nkp_v2_tracker_exact_*
            output/sdmc_tracker_proxy_scan.csv
          if-no-files-found: warn

      - name: Preserve baseline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-baseline-smoke-output
          path: |
            output/
            *.log
          if-no-files-found: ignore
