name: SDMC late300 structural kinetic no-fit test

on:
  push:
    branches: [sdmc-late300-kinetic-structural-hypothesis]
    paths:
      - '.github/workflows/sdmc_late300_structural_kinetic_test.yml'
      - 'sdmc/run_structural_kinetic_hypothesis.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build patched hi_class
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential >/dev/null
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install numpy >/dev/null
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean >/dev/null
          make -j2 class >/dev/null
          mkdir -p output
      - name: Prepare matched inputs
        run: python3 sdmc/run_structural_kinetic_hypothesis.py prepare
      - name: Run matched models
        run: |
          set +e
          for tag in accepted xiD0 canonFloor structural; do
            ./class "output/${tag}.ini" > "output/${tag}.log" 2>&1
            echo "$?" > "output/${tag}.rc"
          done
          set -e
      - name: Analyze
        run: python3 sdmc/run_structural_kinetic_hypothesis.py analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-kinetic-test
          path: |
            output/structural_kinetic_test.json
            output/structural_kinetic_inputs.json
            output/*.log
            output/*.rc
          if-no-files-found: warn
