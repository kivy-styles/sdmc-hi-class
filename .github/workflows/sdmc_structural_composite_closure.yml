name: SDMC structural composite closure audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - sdmc-structural-composite-closure
  workflow_dispatch:

jobs:
  structural-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy
      - name: Build parameterized late266 target
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean && make -j2 class
          mkdir -p output
          cat > output/target.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.023604633340554453, 3.4328776987879466, 0.36879721635160295, 0.34231919445927034, 1.0, 0.050275813910968366
          expansion_model = sdmc_full
          expansion_smg = 0.6991577808065268, 18.40625, 16.173189924377947, 0.5, 0.013036667098291217, 0.25, 0.010544837576337158, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 6.0
          z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10
          write background = yes
          write thermodynamics = yes
          root = output/linear_cov_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/target.ini
      - name: Reconstruct accepted linear-G3 action
        run: |
          cp output/target.ini output/linear_cov_target.ini
          python3 sdmc/run_r032_late266_linear_covariant.py
          make clean && make -j2 class
      - name: Free evolve action
        run: |
          cat > output/free.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_covariant_linear_audit
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 6.0
          z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10
          write background = yes
          write thermodynamics = yes
          root = output/linear_cov_free_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/free.ini
      - name: Structural clock field redefinition audit
        run: |
          python3 sdmc/run_structural_field_redefinition_audit.py

      - name: Install and free-evolve log-structural-clock action
        run: |
          python3 sdmc/install_late266_logstruct_covariant.py
          cat output/logstruct_redefinition_summary.txt
          make clean && make -j2 class
          cat > output/logstruct_free.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_covariant_logstruct_audit
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 6.0
          z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10
          write background = yes
          write thermodynamics = yes
          root = output/logstruct_free_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/logstruct_free.ini

      - name: Compare log-structural-clock free evolution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np,re,json
          def read(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              a=np.loadtxt(path)
              return {n:a[:,i] for i,n in enumerate(names)}
          t=read('output/linear_cov_target_00_background.dat')
          c=read('output/logstruct_free_00_background.dat')
          Nt=-np.log1p(t['z']); Nc=-np.log1p(c['z'])
          o=np.argsort(Nt); Nt=Nt[o]
          def ti(name): return np.interp(Nc,Nt,t[name][o])
          Hrel=np.abs(c['H [1/Mpc]']/ti('H [1/Mpc]')-1.)
          Frel=np.abs(c['M*^2_smg']/ti('M*^2_smg')-1.)
          z=c['z']; m=z<=100.
          slip=np.abs(c['braiding_smg']+2.*c['M2_running_smg'])
          psi_target=np.log(ti('proper time [Gyr]')/t['proper time [Gyr]'][np.argmin(np.abs(t['z']))])
          # Locate scalar field output.
          ph=None
          for k in c:
              if k.lower().startswith('phi') and 'prime' not in k.lower():
                  ph=c[k]; break
          out={
            'max_abs_dH_H_z100':float(Hrel[m].max()),
            'max_abs_dF_F_z100':float(Frel[m].max()),
            'min_D_z100':float(c['kin (D)'][m].min()),
            'min_cs2_z100':float(c['c_s^2'][m].min()),
            'max_cs2_z100':float(c['c_s^2'][m].max()),
            'max_abs_noslip_z100':float(slip[m].max()),
            'max_abs_psi_minus_lntt0':float(np.max(np.abs(ph-psi_target))) if ph is not None else None,
            'F0':float(c['M*^2_smg'][np.argmin(np.abs(z))]),
            'alphaM0':float(c['M2_running_smg'][np.argmin(np.abs(z))])
          }
          print('LOGSTRUCT_FREE_COMPARISON',json.dumps(out,sort_keys=True))
          Path('output/logstruct_free_comparison.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Compare log-structural full Boltzmann observables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np,json
          out={}
          a=np.loadtxt('output/linear_cov_target_00_cl_lensed.dat')
          b=np.loadtxt('output/logstruct_free_00_cl_lensed.dat')
          if a.shape != b.shape or not np.allclose(a[:,0],b[:,0]):
              raise RuntimeError(f'C_l grids differ {a.shape} {b.shape}')
          labels=['TT','EE','TE','BB','PP','TP','EP']
          for j in range(1,min(a.shape[1],8)):
              scale=max(float(np.max(np.abs(a[:,j]))),1e-300)
              out['Cl_'+labels[j-1]+'_max_norm_abs']=float(np.max(np.abs(b[:,j]-a[:,j]))/scale)
              mask=np.abs(a[:,j])>1e-8*scale
              if np.any(mask):
                  out['Cl_'+labels[j-1]+'_max_frac_masked']=float(np.max(np.abs((b[mask,j]-a[mask,j])/a[mask,j])))
          tp=sorted(Path('output').glob('linear_cov_target_*pk.dat'))
          cp=sorted(Path('output').glob('logstruct_free_*pk.dat'))
          out['pk_target_files']=len(tp); out['pk_logstruct_files']=len(cp)
          if len(tp)!=len(cp): raise RuntimeError('Pk file count mismatch')
          for i,(pt,pc) in enumerate(zip(tp,cp)):
              aa=np.loadtxt(pt); bb=np.loadtxt(pc)
              y=np.interp(aa[:,0],bb[:,0],bb[:,1]) if not np.allclose(aa[:,0],bb[:,0]) else bb[:,1]
              mask=np.abs(aa[:,1])>1e-30
              out[f'Pk_{i:02d}_max_frac']=float(np.max(np.abs((y[mask]-aa[mask,1])/aa[mask,1])))
              out[f'Pk_{i:02d}_rms_frac']=float(np.sqrt(np.mean(((y[mask]-aa[mask,1])/aa[mask,1])**2)))
          print('LOGSTRUCT_BOLTZMANN_COMPARISON',json.dumps(out,sort_keys=True))
          Path('output/logstruct_boltzmann_comparison.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Derive N Km Kp and activation
        run: |
          python3 sdmc/run_structural_composite_closure.py output/linear_cov_free_00_background.dat --out output/structural_composite_closure.json
          python3 - <<'PY'
          import json
          d=json.load(open('output/structural_composite_closure.json'))
          print('STRUCTURAL_CLOSURE_MINIMAL_PRESENT',json.dumps(d['minimal_activation']['present'],sort_keys=True))
          print('STRUCTURAL_CLOSURE_CHRONO_PRESENT',json.dumps(d['chronological']['present'],sort_keys=True))
          print('STRUCTURAL_CLOSURE_ANCHORS',json.dumps(d['anchors'],sort_keys=True))
          print('STRUCTURAL_CLOSURE_CROSSING',d['z_pX_equals_1'])
          for x in d['samples']:
              if min(abs(x['z']-q) for q in [1000000,1000,100,10,5,3,2,1,.5,.3,0])<1:
                  print('STRUCTURAL_CLOSURE_SAMPLE',json.dumps(x,sort_keys=True))
          PY
      - name: Preserve result
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-structural-composite-closure
          path: |
            output/linear_cov_reconstruction_summary.txt
            output/linear_cov_free_00_background.dat
            output/structural_composite_closure.json
            output/structural_field_redefinition_audit.json
            output/logstruct_redefinition_summary.txt
            output/logstruct_free_00_background.dat
            output/logstruct_free_comparison.json
            output/logstruct_boltzmann_comparison.json
            output/linear_cov_target_00_cl_lensed.dat
            output/logstruct_free_00_cl_lensed.dat
            output/linear_cov_target_*pk.dat
            output/logstruct_free_*pk.dat
