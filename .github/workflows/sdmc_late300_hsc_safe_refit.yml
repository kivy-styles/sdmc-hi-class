name: SDMC HSC-Y3 refitted safe-scale native-Weyl audit
on:
  push:
    branches: [sdmc-late300-hscy3-weyl]
    paths:
      - 'sdmc/run_late300_hsc_safe_refit.py'
      - '.github/workflows/sdmc_late300_hsc_safe_refit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safe:
    strategy:
      fail-fast: false
      matrix:
        model: [late300, local021]
        ellmax: [600, 800, 1000]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy sacc
      - name: Recover exact linear Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}"             --name late300-desy3-native-weyl-tomography --dir output
          test -d output/weyl_spectra
      - name: Download HSC-Y3 public products
        run: |
          rm -rf cosmosis-standard-library
          git clone --depth 1 https://github.com/cosmosis-developers/cosmosis-standard-library.git
          cd cosmosis-standard-library && git lfs pull || true
          cd ..
      - name: Run safe-scale refit
        run: |
          python3 sdmc/run_late300_hsc_safe_refit.py "${{ matrix.model }}" "${{ matrix.ellmax }}" |             tee "output/hsc_safe_${{ matrix.model }}_${{ matrix.ellmax }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsc-safe-${{ matrix.model }}-ell${{ matrix.ellmax }}
          path: |
            output/hsc_safe/*
            output/hsc_safe_${{ matrix.model }}_${{ matrix.ellmax }}.log
          if-no-files-found: warn
