name: SDMC late300 HSC stale closure retries

on:
  push:
    branches: [sdmc-late300-hsc-stale-closure-retries]
    paths:
      - '.github/workflows/sdmc_late300_hsc_stale_closure_retries.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  safe-late300-ell1000:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy sacc
      - name: Recover exact linear Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}" --name late300-desy3-native-weyl-tomography --dir output
          test -d output/weyl_spectra
      - name: Download HSC-Y3 public products
        run: |
          rm -rf cosmosis-standard-library
          git clone --depth 1 https://github.com/cosmosis-developers/cosmosis-standard-library.git
          cd cosmosis-standard-library && git lfs pull || true
          cd ..
      - name: Retry late300 safe-scale ell1000
        run: |
          python3 sdmc/run_late300_hsc_safe_refit.py late300 1000 | tee output/hsc_safe_late300_1000_stale_retry.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsc-safe-late300-ell1000-stale-retry
          path: |
            output/hsc_safe/*
            output/hsc_safe_late300_1000_stale_retry.log
          if-no-files-found: warn

  react-local021-us-screen03:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy sacc
      - name: Recover exact linear Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}" --name late300-desy3-native-weyl-tomography --dir output
          test -d output/weyl_spectra
      - name: Recover corrected ReACT bracket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/react_dense
          gh run download 37604828408 --repo "${{ github.repository }}" --name late300-react-exact-bracket --dir output/react_dense
          test -s output/react_dense/react_late300/late300_react_target_spectrum.npz
      - name: Download HSC-Y3 public products
        run: |
          rm -rf cosmosis-standard-library
          git clone --depth 1 https://github.com/cosmosis-developers/cosmosis-standard-library.git
          cd cosmosis-standard-library && git lfs pull || true
          cd ..
      - name: Retry local021 corrected ReACT us_screen03
        run: |
          python3 sdmc/run_late300_hsc_react_fullfit.py local021 us_screen03 | tee output/hsc_react_full_local021_us_screen03_stale_retry.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsc-react-full-local021-us_screen03-stale-retry
          path: |
            output/hsc_react_full/*
            output/hsc_react_full_local021_us_screen03_stale_retry.log
          if-no-files-found: warn
