name: SDMC late300 structural composite closure

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas

      - name: Build late300 parameterized target
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean >/dev/null
          make -j2 class >/dev/null
          mkdir -p output
          cat > output/linear_cov_target.ini <<'EOF'
          H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1047019076951746e-09
          n_s = 0.9628416801318527
          tau_reio = 0.053167105823755265
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.02048146490100771, 3.927876388467848, 0.33114133956842123, 0.34231919445927034, 1.0, 0.05181542627513409
          expansion_model = sdmc_full
          expansion_smg = 0.7014079815036496, 18.40625, 16.19317622240633, 0.5, 0.024822032167576252, 0.25, 0.01264704344701022, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 6.0
          z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10
          write background = yes
          write thermodynamics = yes
          root = output/linear_cov_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/linear_cov_target.ini

      - name: Reconstruct accepted linear-G3 action
        run: |
          python3 sdmc/run_late300_linear_covariant.py
          cat output/linear_cov_reconstruction_summary.txt
          make clean >/dev/null
          make -j2 class >/dev/null

      - name: Free evolve accepted action
        run: |
          cat > output/linear_cov_free.ini <<'EOF'
          H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1047019076951746e-09
          n_s = 0.9628416801318527
          tau_reio = 0.053167105823755265
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_covariant_linear_audit
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 6.0
          z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10
          write background = yes
          write thermodynamics = yes
          root = output/linear_cov_free_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/linear_cov_free.ini

      - name: Derive chronological and minimal structural closures
        run: |
          python3 sdmc/run_late300_structural_composite_closure.py \
            output/linear_cov_free_00_background.dat \
            --H0 69.71482083084993 \
            --omega-b 0.022083219194622913 \
            --omega-cdm 0.12299536722293603 \
            --out output/late300_structural_composite_closure.json
          python3 - <<'PY'
          import json
          d=json.load(open('output/late300_structural_composite_closure.json'))
          print('LATE300_STRUCTURAL_ANCHORS',json.dumps(d['anchors'],sort_keys=True))
          print('LATE300_CHRONO_PRESENT',json.dumps(d['chronological']['present'],sort_keys=True))
          print('LATE300_MINIMAL_PRESENT',json.dumps(d['minimal_activation']['present'],sort_keys=True))
          print('LATE300_RM_BRIDGE',json.dumps(d['radiation_matter_bridge'],sort_keys=True))
          print('LATE300_CHRONO_RANGE',json.dumps({
            'N_min':d['chronological']['N_lapse_min'],
            'N_max':d['chronological']['N_lapse_max'],
            'Achi_min':d['chronological']['Achi_min'],
            'Achi_max':d['chronological']['Achi_max'],
            'chi_min':d['chronological']['chi_min'],
            'chi_max':d['chronological']['chi_max'],
            'chi_bounded_0_1':d['chronological']['chi_bounded_0_1']
          },sort_keys=True))
          PY

      - name: Preserve closure audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmc-late300-structural-composite-closure
          path: |
            output/linear_cov_reconstruction_summary.txt
            output/linear_cov_target_00_background.dat
            output/linear_cov_free_00_background.dat
            output/late300_structural_composite_closure.json
          if-no-files-found: warn
