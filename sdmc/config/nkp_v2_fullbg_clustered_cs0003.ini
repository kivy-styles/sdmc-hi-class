# SDMC NKp-v2 full background + designer clustered early scalar
# Includes lambda_e=20 tracker and the derived late/intermediate delta_H(z).
# No late No-Slip sector is included here.

H0 = 70.8514
omega_b = 0.02239952
omega_cdm = 0.12444227328918850
N_ncdm = 0
N_ur = 3.046
T_cmb = 2.7255
YHe = 0.2453

A_s = 2.1714929079212768e-9
n_s = 0.974
tau_reio = 0.0544

Omega_Lambda = 0
Omega_fld = 0
Omega_smg = -1

gravity_model = sdmc_early_cs
parameters_smg = 0.003
expansion_model = sdmc_full
# Omega_X0, lambda_e, z_t, DeltaN, A_late, tau_A, B_late, tau_B
expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5

method_qs_smg = fully_dynamic
# The early scalar decouples at late time, so D should asymptote to zero.
# Allow only machine-level negative roundoff in that asymptotic limit.
D_safe_smg = 1e-12
output_background_smg = 1

output = tCl,pCl,lCl
modes = s
lensing = yes
l_max_scalars = 3000

root = output/sdmc_nkp_v2_fullbg_clustered_cs0003_
format = class
write parameters = yes
write background = yes
write thermodynamics = yes
input_verbose = 1
background_verbose = 2
thermodynamics_verbose = 1
perturbations_verbose = 1
spectra_verbose = 0
lensing_verbose = 0
output_verbose = 1
