name: SDMC g022-A034 JWST likelihood-equivalent audit

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jwst:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          python3 -m pip install -q numpy pandas
      - name: Download exact baseline and A034 transfer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/s117 inputs/a034
          gh run download 35795737921 --repo "${{ github.repository }}" \
            --name sdmc-discussion-s117-g073-s117p045-exact-desi --dir inputs/s117
          gh run download 37462886455 --repo "${{ github.repository }}" \
            --name sdmc-s117p045-a034-exact-desi --dir inputs/a034
          test -f inputs/s117/desi_cov_00_z1_pk.dat
          test -f inputs/a034/desi_cov_00_z1_pk.dat
      - name: Run candidate-specific JWST stress test
        run: |
          python3 sdmc/run_s117a034_jwst_likelihood_equivalent.py
          cat output/s117a034_jwst/s117a034_jwst_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmc-s117p045-a034-jwst-likelihood-equivalent
          path: output/s117a034_jwst/*
          if-no-files-found: warn
