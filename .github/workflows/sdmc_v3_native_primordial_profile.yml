name: SDMC NKp-v3 native primordial profile

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  profile-v3-native-primordial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy numpy pandas

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py

      - name: Expose exact native cs2 diagnostics
        run: python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build hi_class
        run: make -j2 class

      - name: Install native Planck 2018 Plik-lite data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          ok=TTTEEE_lite_native.install(path='planck_packages',no_progress_bars=True)
          if not ok:
              raise SystemExit('Planck Plik-lite install failed')
          PY

      - name: Profile primordial amplitude and tilt on frozen NKp-v3 native point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, math, subprocess, textwrap
          import numpy as np
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native

          TCMB=2.7255
          CAL_SIGMA=0.0025
          OUT=Path('output/v3_native_primordial')
          OUT.mkdir(parents=True,exist_ok=True)

          # The unprofiled v3 point is low in high-l TT/EE.  Scan both amplitude
          # and tilt around and above the standard starting values.
          LN_AS=[3.052,3.058,3.064,3.070,3.076,3.082,3.088,3.094,3.100,3.106]
          NS=[0.956,0.960,0.964,0.968,0.972,0.976,0.980,0.984]
          lik=TTTEEE_lite_native(packages_path='planck_packages')

          def ini_text(As,ns,root,full=False):
              outputs=(
                  'output = tCl,pCl,lCl,mPk\n'
                  'P_k_max_h/Mpc = 6.0\n'
                  'z_pk = 0,0.295,0.5,0.510,0.706,0.934,1,1.321,1.484,2,2.330,3,5,10\n'
                  'write background = yes\n'
                  'write thermodynamics = yes\n'
                  'write parameters = yes\n'
                  if full else
                  'output = tCl,pCl,lCl\n'
                  'write background = no\n'
                  'write thermodynamics = no\n'
                  'write parameters = no\n'
              )
              return textwrap.dedent(f'''\
              H0 = 70.8514
              omega_b = 0.02239952
              omega_cdm = 0.12444227328918850
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = {As:.14e}
              n_s = {ns:.9f}
              tau_reio = 0.0544
              Omega_Lambda = 0
              Omega_fld = 3.1443554e-8
              fluid_equation_of_state = SDMC_TRACKER
              cs2_fld = 0.003
              use_ppf = no
              Omega_smg = -1
              gravity_model = sdmc_v3_native_noslip
              parameters_smg = 0.068, 10.0, 1.6, 0.1, 0.0001
              expansion_model = sdmc_full
              expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
              pert_initial_conditions_smg = zero
              method_qs_smg = fully_dynamic
              output_background_smg = 3
              modes = s
              lensing = yes
              l_max_scalars = 3000
              {outputs}root = {root}
              format = class
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          def load_cl(path):
              a=np.loadtxt(path)
              conv=(TCMB*1e6)**2
              return np.column_stack([a[:,0],a[:,1]*conv,a[:,3]*conv,a[:,2]*conv])

          def score(cl):
              def like(A):
                  return float(lik.chi_squared(cl,A_planck=float(A)))
              def total(A):
                  A=float(A)
                  return like(A)+((A-1.0)/CAL_SIGMA)**2
              opt=minimize_scalar(total,bounds=(0.96,1.04),method='bounded',
                                  options={'xatol':1e-10})
              A=float(opt.x)
              c_like=like(A)
              c_prior=((A-1.0)/CAL_SIGMA)**2
              return A,c_like,c_prior,c_like+c_prior

          rows=[]
          best=None
          counter=0
          for lnAs in LN_AS:
              As=math.exp(lnAs)/1e10
              for ns in NS:
                  counter+=1
                  stem=f'v3p_{counter:03d}'
                  root=str(OUT/(stem+'_'))
                  ini=OUT/(stem+'.ini')
                  ini.write_text(ini_text(As,ns,root,False))
                  cp=subprocess.run(['./class',str(ini)],stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT,text=True,timeout=180)
                  cl=Path(root+'00_cl_lensed.dat')
                  if cp.returncode!=0 or not cl.exists():
                      row={'ln10As':lnAs,'A_s':As,'n_s':ns,'status':'FAIL',
                           'A_planck':'','chi2_like':'','chi2_cal_prior':'',
                           'chi2_total':'','error':cp.stdout[-1200:]}
                      rows.append(row)
                      print('FAIL',lnAs,ns,cp.returncode,flush=True)
                  else:
                      Acal,clike,cprior,ctot=score(load_cl(cl))
                      row={'ln10As':lnAs,'A_s':As,'n_s':ns,'status':'OK',
                           'A_planck':Acal,'chi2_like':clike,
                           'chi2_cal_prior':cprior,'chi2_total':ctot,'error':''}
                      rows.append(row)
                      print(f'V3_PRIM ln10As={lnAs:.3f} ns={ns:.3f} '
                            f'chi2={ctot:.6f} Acal={Acal:.8f}',flush=True)
                      if best is None or ctot<best['chi2_total']:
                          best=dict(row)
                          (OUT/'best_grid_cl_lensed.dat').write_bytes(cl.read_bytes())

                  for p in OUT.glob(stem+'_00_*'):
                      try: p.unlink()
                      except OSError: pass
                  try: ini.unlink()
                  except OSError: pass

          fields=['ln10As','A_s','n_s','status','A_planck',
                  'chi2_like','chi2_cal_prior','chi2_total','error']
          with (OUT/'sdmc_v3_native_primordial_grid.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          if best is None:
              raise SystemExit('No successful NKp-v3 primordial grid point')
          with (OUT/'sdmc_v3_native_primordial_best.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerow(best)

          # Re-run the best point with full observable output.  This does not
          # alter the frozen v3 late-sector/stability parameters.
          best_root='output/sdmc_v3_native_primordial_best_'
          Path('output/sdmc_v3_native_primordial_best.ini').write_text(
              ini_text(float(best['A_s']),float(best['n_s']),best_root,True))
          cp=subprocess.run(['./class','output/sdmc_v3_native_primordial_best.ini'],
                            stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                            text=True,timeout=300)
          Path('output/sdmc_v3_native_primordial_best.log').write_text(cp.stdout)
          print('BEST_V3_NATIVE_PRIMORDIAL',best,flush=True)
          print('BEST_V3_FULL_RETURNCODE',cp.returncode,flush=True)
          if cp.returncode:
              raise SystemExit(cp.returncode)
          PY

      - name: Generate matched LCDM primordial-profile reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          As=math.exp(3.044)/1e10
          p=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {As:.14e}',p)
          p=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',p)
          p=re.sub(r'(?m)^\s*root\s*=.*$',
                   'root = output/sdmc_planck_lcdm_v3_profile_reference_',p)
          Path('output/sdmc_planck_lcdm_v3_profile_reference.ini').write_text(p)
          PY
          ./class output/sdmc_planck_lcdm_v3_profile_reference.ini

      - name: Evaluate final high-l TTTEEE comparison
        run: |
          python3 sdmc/evaluate_planck_pliklite.py \
            --packages planck_packages \
            --output output/sdmc_v3_native_primordial_pliklite.csv \
            LCDM_profile_reference=output/sdmc_planck_lcdm_v3_profile_reference_00_cl_lensed.dat \
            NKp_v3_native_primordial_best=output/sdmc_v3_native_primordial_best_00_cl_lensed.dat

      - name: Preserve NKp-v3 primordial profile outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-nkp-v3-native-primordial-profile
          path: |
            output/v3_native_primordial/sdmc_v3_native_primordial_grid.csv
            output/v3_native_primordial/sdmc_v3_native_primordial_best.csv
            output/v3_native_primordial/best_grid_cl_lensed.dat
            output/sdmc_v3_native_primordial_best.ini
            output/sdmc_v3_native_primordial_best.log
            output/sdmc_v3_native_primordial_best_*
            output/sdmc_planck_lcdm_v3_profile_reference_00_cl_lensed.dat
            output/sdmc_v3_native_primordial_pliklite.csv
          if-no-files-found: warn
