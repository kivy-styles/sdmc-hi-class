name: SDMC late300 AF-D0 stability map

on:
  push:
    branches: [sdmc-late300-AF-D0-stability-map]
    paths:
      - '.github/workflows/sdmc_late300_AF_D0_stability_map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build derived structural branch
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential >/dev/null
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install numpy >/dev/null
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          python3 sdmc/patch_F_only_force_center.py
          make clean >/dev/null && make -j2 class >/dev/null
          mkdir -p output
      - name: Scan AF-D0 plane
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,re
          import numpy as np
          AFs=[0.02050,0.02052,0.02054,0.02058,0.02062]
          D0s=[0.30,0.32,0.335,0.34,0.342,0.345,0.36,0.38]
          common="""H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1047019076951746e-09
          n_s = 0.9628416801318527
          tau_reio = 0.053167105823755265
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          expansion_model = sdmc_full
          expansion_smg = 0.7014079815036496, 18.40625, 16.742289660253434, 0.5, 0.024822032167576252, 0.25, 0.01264704344701022, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output =
          write background = yes
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          """
          rows=[]
          for AF in AFs:
            for D0 in D0s:
              tag=f"af{AF:.5f}_d{D0:.3f}".replace(".","p")
              ini=Path("output")/(tag+".ini")
              root=f"output/{tag}_"
              ini.write_text(common+f"parameters_smg = {AF}, 4.034077502899133, 0.32925377073762596, {D0}, 1.0, 0.05181542627513409\nroot = {root}\n")
              p=subprocess.run(["./class",str(ini)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              rec={"AF":AF,"D0":D0,"returncode":p.returncode,"success":p.returncode==0}
              bg=Path(root+"00_background.dat")
              if bg.exists():
                ls=bg.read_text().splitlines()
                hdr=[x for x in ls if x.startswith("#") and re.search(r"(?:^|\\s)1\\s*:",x)][-1].lstrip("#").strip()
                ms=list(re.finditer(r"(\\d+)\\s*:\\s*",hdr)); names=[]
                for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr); names.append(hdr[m.end():e].strip())
                a=np.loadtxt(bg); d={n:a[:,i] for i,n in enumerate(names)}
                cs=np.asarray(d["c_s^2"],float); D=np.asarray(d["kin (D)"],float); z=np.asarray(d["z"],float)
                ii=int(np.argmin(cs))
                rec.update(min_cs2=float(cs[ii]),z_min_cs2=float(z[ii]),min_D=float(np.min(D)))
              else:
                g=re.search(r"minimum c_s\^2=([^ ]+) at a=([^\s]+)",p.stdout)
                if g:
                  aa=float(g.group(2)); rec.update(min_cs2_reported=float(g.group(1)),z_failure=1/aa-1)
              rows.append(rec)
              print("AF_D0_POINT",json.dumps(rec,sort_keys=True))
          # per-AF minimum successful D0 and simple boundary summary
          byAF={}
          for AF in AFs:
            r=[x for x in rows if x["AF"]==AF]
            good=[x for x in r if x["success"]]
            byAF[str(AF)]={"min_success_D0":min([x["D0"] for x in good]) if good else None,
                           "points":r}
          out={"status":"force-derived-window AF-D0 stability map",
               "fixed":{"z_c":4.034077502899133,"width":0.32925377073762596,
                        "D_floor":0.05181542627513409,"pD":1.0,"z_t":16.742289660253434},
               "rows":rows,"by_AF":byAF}
          Path("output/AF_D0_stability_map.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("AF_D0_STABILITY_MAP",json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AF-D0-stability-map
          path: output/AF_D0_stability_map.json
