name: SDMC late266 accepted linear-G3 covariant audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - sdmc-r032-late266-linear-covariant-audit
  workflow_dispatch:

jobs:
  linear-covariant-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy

      - name: Apply SDMC parameterized patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean && make -j2 class

      - name: Generate late266 parameterized target
        run: |
          mkdir -p output
          cat > output/linear_cov_target.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.023604633340554453, 3.4328776987879466, 0.36879721635160295, 0.34231919445927034, 1.0, 0.050275813910968366
          expansion_model = sdmc_full
          expansion_smg = 0.6991577808065268, 18.40625, 16.173189924377947, 0.5, 0.013036667098291217, 0.25, 0.010544837576337158, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          write background = yes
          write thermodynamics = no
          root = output/linear_cov_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          ./class output/linear_cov_target.ini

      - name: Reconstruct and install accepted linear-G3 action
        run: |
          python3 sdmc/run_r032_late266_linear_covariant.py
          cat output/linear_cov_reconstruction_summary.txt
          make clean && make -j2 class

      - name: Free evolve reconstructed linear-G3 action
        run: |
          cat > output/linear_cov_free.ini <<'EOF'
          H0 = 69.45160505326464
          omega_b = 0.02208511574370519
          omega_cdm = 0.12298509428428875
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1197359302086e-9
          n_s = 0.962555355281866
          tau_reio = 0.055202901571989066
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_covariant_linear_audit
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          write background = yes
          write thermodynamics = no
          root = output/linear_cov_free_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          set +e
          ./class output/linear_cov_free.ini > output/linear_cov_free.log 2>&1
          rc=$?
          set -e
          cat output/linear_cov_free.log
          echo "LINEAR_COV_FREE_RETURNCODE=$rc"
          echo "$rc" > output/linear_cov_free_returncode.txt
          test "$rc" -eq 0

      - name: Compare free evolution to target
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np,re,json

          def read(path):
              p=Path(path)
              if not p.exists(): return None
              lines=p.read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              a=np.loadtxt(p)
              return {n:a[:,i] for i,n in enumerate(names)}

          t=read('output/linear_cov_target_00_background.dat')
          c=read('output/linear_cov_free_00_background.dat')
          if c is None:
              print('LINEAR_COV_COMPARISON unavailable: free background missing')
              raise SystemExit(0)

          Nt=-np.log1p(t['z']); Nc=-np.log1p(c['z'])
          o=np.argsort(Nt); Nt=Nt[o]
          def ti(name):
              return np.interp(Nc,Nt,t[name][o])

          Ht=ti('H [1/Mpc]')
          Ft=ti('M*^2_smg')
          Hrel=np.abs(c['H [1/Mpc]']/Ht-1.)
          Frel=np.abs(c['M*^2_smg']/Ft-1.)
          z=c['z']
          m100=z<=100.
          m1e4=z<=1.e4
          slip=np.abs(c['braiding_smg']+2.*c['M2_running_smg'])

          phi=None
          for k in c:
              kl=k.lower()
              if kl.startswith('phi') and 'prime' not in kl:
                  phi=c[k]; break
          phierr=float(np.max(np.abs(phi-Nc))) if phi is not None else float('nan')

          i0=int(np.argmin(np.abs(z)))
          out={
            'max_abs_dH_H_z100':float(Hrel[m100].max()),
            'max_abs_dH_H_z1e4':float(Hrel[m1e4].max()),
            'max_abs_dF_F_z100':float(Frel[m100].max()),
            'min_D_z100':float(c['kin (D)'][m100].min()),
            'min_cs2_z100':float(c['c_s^2'][m100].min()),
            'max_cs2_z100':float(c['c_s^2'][m100].max()),
            'max_abs_noslip_z100':float(slip[m100].max()),
            'max_abs_phi_minus_lna':phierr,
            'F0':float(c['M*^2_smg'][i0]),
            'alphaM0':float(c['M2_running_smg'][i0]),
            'D0':float(c['kin (D)'][i0]),
            'cs2_0':float(c['c_s^2'][i0]),
          }
          print('LINEAR_COV_REPLAY_COMPARISON',json.dumps(out,sort_keys=True))
          Path('output/linear_cov_replay_comparison.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late266-linear-g3-covariant-audit
          path: |
            output/linear_cov_target.ini
            output/linear_cov_target_00_background.dat
            output/linear_cov_reconstruction_summary.txt
            output/linear_cov_free.ini
            output/linear_cov_free.log
            output/linear_cov_free_returncode.txt
            output/linear_cov_free_00_background.dat
            output/linear_cov_replay_comparison.json
          if-no-files-found: warn
