name: SDMC late300 conditional evidence synthesis

on:
  push:
    branches: [sdmc-late300-conditional-evidence-synthesis]
    paths:
      - 'sdmc/run_late300_conditional_evidence_synthesis.py'
      - '.github/workflows/sdmc_late300_conditional_evidence_synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recover completed Planck and HSC evidence inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/planck inputs/hsc_late inputs/hsc_local
          gh run download 37637638799 --repo "${{ github.repository }}" --name planck-conditional-bayes-factor-highprecision --dir inputs/planck
          gh run download 37657120112 --repo "${{ github.repository }}" --name hsc-laplace-late300 --dir inputs/hsc_late
          gh run download 37657120112 --repo "${{ github.repository }}" --name hsc-laplace-local021 --dir inputs/hsc_local
      - name: Synthesize conditional evidence
        run: |
          python3 sdmc/run_late300_conditional_evidence_synthesis.py
          cat output/late300_conditional_evidence_synthesis.json
      - uses: actions/upload-artifact@v4
        with:
          name: late300-conditional-evidence-synthesis
          path: output/late300_conditional_evidence_synthesis.json
