name: SDMC retired Kp terminal runtime audit

on:
  push:
    branches:
      - sdmc-kp-terminal-runtime-audit
  workflow_dispatch:

jobs:
  kp-terminal-runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy

      - name: Apply Kp tracker, terminal operator, and runtime instrumentation
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_kp_terminal_operator.py
          python3 sdmc/instrument_kp_terminal_runtime.py
          make -j2 class

      - name: Run runtime audit
        run: python3 sdmc/run_kp_terminal_runtime_audit.py

      - name: Preserve runtime audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-kp-terminal-runtime-audit
          path: output/kp_terminal_runtime_audit/*.json
          if-no-files-found: warn
