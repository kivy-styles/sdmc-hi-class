name: SDMC late300 parameter provenance audit

on:
  push:
    branches: [sdmc-late300-parameter-provenance]
    paths:
      - 'sdmc/run_late300_parameter_provenance.py'
      - '.github/workflows/sdmc_late300_parameter_provenance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Recover historical lineage files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p provenance_inputs
          fetch_ref () {
            local ref="$1"
            local path="$2"
            local out="$3"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" --jq .content | tr -d '\n' | base64 -d > "${out}"
            test -s "${out}"
          }
          fetch_ref sdmc-r032-s117-growth-pareto sdmc/run_r032_s117_growth_pareto.py provenance_inputs/growth_pareto.py
          fetch_ref sdmc-late300-benchmark .github/workflows/sdmc_g022_primordial_exact_fullplik_matrix.yml provenance_inputs/primordial_matrix.yml
          fetch_ref sdmc-r032-snclosure-lateab-screen sdmc/run_r032_snclosure_lateab_screen.py provenance_inputs/late_background_screen.py
          fetch_ref sdmc-r032-snclosure029-structure-refine sdmc/run_r032_snclosure029_structure_refine.py provenance_inputs/structural_refine.py
          fetch_ref sdmc-late300-linear-covariant-audit sdmc/run_late300_linear_covariant.py provenance_inputs/accepted_action.py
          ls -lh provenance_inputs

      - name: Run lineage and complexity audit
        run: |
          python3 sdmc/run_late300_parameter_provenance.py
          cat output/late300_parameter_provenance/late300_parameter_provenance.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late300-parameter-provenance
          path: output/late300_parameter_provenance/late300_parameter_provenance.json
          if-no-files-found: warn
