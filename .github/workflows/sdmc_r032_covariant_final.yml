name: SDMC r032 profile L18.70 Z17.775 floor045 covariant gate

on:
  push:
    branches:
      - sdmc-r032-profile-l1870-z17775-floor045-covariant
  workflow_dispatch:

jobs:
  covariant-independent-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya iminuit

      - name: Apply SDMC parameterized patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument

      - name: Build target parameterized hi_class
        run: make -j2 class

      - name: Generate the fixed NKp-v3 target background
        run: |
          mkdir -p output
          cat > output/covariant_target.ini <<'EOF'
          H0 = 70.8514
          omega_b = 0.02239952
          omega_cdm = 0.12444227328918850
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_native_noslip
          parameters_smg = 0.0715, 5.00, 1.426, 0.1, 0.0001
          expansion_model = sdmc_full
          expansion_smg = 0.7073985893, 18.70, 17.775, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
          output_background_smg = 3
          skip_stability_tests_smg = yes
          write background = yes
          write thermodynamics = no
          root = output/covariant_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          output_verbose = 0
          EOF
          ./class output/covariant_target.ini

      - name: Reconstruct regular covariant target table
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np, re
          from scipy.interpolate import CubicSpline

          src=Path('output/covariant_target_00_background.dat')
          lines=src.read_text().splitlines()
          hdr=[l for l in lines if l.startswith('#') and '1:z' in l][-1].lstrip('#').strip()
          marks=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
          for i,m in enumerate(marks):
              e=marks[i+1].start() if i+1<len(marks) else len(hdr)
              names.append(hdr[m.end():e].strip())
          a=np.loadtxt(src)
          d={n:a[:,i] for i,n in enumerate(names)}
          N=-np.log1p(d['z'])
          order=np.argsort(N)
          N=N[order]
          def vv(name): return np.asarray(d[name])[order]

          Hraw=vv('H [1/Mpc]')
          rhoraw=vv('(.)rho_smg')
          praw=vv('(.)p_smg')
          H2raw=Hraw*Hraw

          # Work with smooth dimensionless target ratios to avoid enormous
          # dynamic ranges in the radiation era.
          lnHsp=CubicSpline(N,np.log(Hraw))
          rrsp=CubicSpline(N,rhoraw/H2raw)
          ppsp=CubicSpline(N,praw/H2raw)

          ph=N.copy()
          H=np.exp(lnHsp(ph))
          h=lnHsp(ph,1)
          rho=rrsp(ph)*H*H
          pre=ppsp(ph)*H*H
          Hpa=H*H*h
          X=0.5*H*H

          AF=0.0715; zc=5.00; width=1.426
          Nc=-np.log1p(zc)
          xx=(ph-Nc)/(2.*width)
          S=.5*(1.+np.tanh(xx))
          F=np.exp(AF*S)
          Fsp=CubicSpline(ph,F)
          F1=Fsp(ph,1)
          F2=Fsp(ph,2)
          F3=Fsp(ph,3)

          # Exact No-Slip on the target trajectory:
          # X G3_X = -G4_phi = -F_phi/2.
          g=-F1/(H*H)
          gsp=CubicSpline(ph,g)
          g1=gsp(ph,1)

          # Independently prescribed, subluminal kinetic sector.
          # This is NOT obtained from cs2num or from a target c_s^2:
          # D(N)=0.045+0.34231919445927034*S(N), alpha_K=D-3/2 alpha_B^2.
          Dtarget=0.045+0.34231919445927034*S
          alphaM=F1/F
          alphaB=-2.*alphaM
          alphaK_target=Dtarget-1.5*alphaB*alphaB

          # Exact hi_class background identities specialized to
          # G4=F/2, G3=g(phi) X, G2=k1 X+k2 X^2-V, phi=N.
          R=3.*rho + 2.*g1*X*X + 6.*F1*H*H + 3.*(F-1.)*H*H
          P=3.*pre + 2.*g1*X*X - 2.*X*F2 \
             - 3.*(F-1.)*H*H - 2.*(F-1.)*Hpa \
             - 2.*F1*(H*H+Hpa)
          C=(R+P)/(2.*X)

          # Covariant alpha_K equation:
          # F alpha_K = k1 + 6 k2 X - 4 g_phi X + 6 g H^2,
          # together with C=k1+2 k2 X from the background equations.
          k2=(F*alphaK_target-C+4.*g1*X-6.*g*H*H)/(4.*X)
          k1=C-2.*k2*X
          V=.5*(R-P)-k2*X*X

          spl={}
          for name,y in [('g',g),('k1',k1),('k2',k2),('V',V)]:
              sp=CubicSpline(ph,y)
              spl[name]=(y,sp(ph,1),sp(ph,2),sp(ph,3))

          # On-background prediction of alpha_K and sound speed.
          alphaK=(k1+6.*k2*X-4.*spl['g'][1]*X+6.*g*H*H)/F
          D=alphaK+1.5*alphaB*alphaB

          # Interpolate the independently computed native numerator only for
          # the reconstruction audit; it does not enter G2/G3/G4.
          nssp=CubicSpline(N,vv('cs2num'))
          Ns=nssp(ph)
          cs2=Ns/D
          mask=ph>=-np.log(101.)
          print('COV_TARGET_AUDIT',
                'Dmin_z100=',float(D[mask].min()),
                'Dmax_z100=',float(D[mask].max()),
                'cs2min_z100=',float(cs2[mask].min()),
                'cs2max_z100=',float(cs2[mask].max()),
                'Dmin_all=',float(D.min()),
                'cs2min_all=',float(cs2.min()))

          splines={}
          for name,y in [('g',g),('k1',k1),('k2',k2),('V',V),('lnH',np.log(H))]:
              splines[name]=CubicSpline(ph,y)

          def carr(x):
              return ','.join(f'{v:.17e}' for v in np.asarray(x).ravel())

          hp=Path('gravity_smg/sdmc_covariant_replay_table.h')
          with hp.open('w') as f:
              f.write('#ifndef SDMC_COVARIANT_REPLAY_TABLE_H\n#define SDMC_COVARIANT_REPLAY_TABLE_H\n')
              f.write(f'#define SDMC_COV_N {len(ph)}\n')
              f.write('#define SDMC_COV_AF 0.0715\n')
              f.write('#define SDMC_COV_ZC 5.00\n')
              f.write('#define SDMC_COV_WIDTH 1.426\n')
              f.write('static const double sdmc_cov_x[SDMC_COV_N] = {'+carr(ph)+'};\n')
              for name,sp in splines.items():
                  coeff=np.asarray(sp.c.T).reshape(-1)
                  f.write(f'static const double sdmc_cov_{name}[4*(SDMC_COV_N-1)] = '+'{'+carr(coeff)+'};\n')
              f.write(r'''
          static int sdmc_cov_idx(double x){
            int lo=0,hi=SDMC_COV_N-1;
            if(x<=sdmc_cov_x[0]) return 0;
            if(x>=sdmc_cov_x[SDMC_COV_N-1]) return SDMC_COV_N-2;
            while(hi-lo>1){int m=(lo+hi)/2; if(sdmc_cov_x[m]<=x) lo=m; else hi=m;}
            return lo;
          }
          static void sdmc_cov_eval(const double *coef,double x,
                                    double *y,double *yp,double *ypp,double *yppp){
            int i=sdmc_cov_idx(x);
            double dx=x-sdmc_cov_x[i];
            const double *cc=coef+4*i;
            *y=((cc[0]*dx+cc[1])*dx+cc[2])*dx+cc[3];
            *yp=(3.*cc[0]*dx+2.*cc[1])*dx+cc[2];
            *ypp=6.*cc[0]*dx+2.*cc[1];
            *yppp=6.*cc[0];
          }
          #endif
          ''')
          print('WROTE',hp)
          PY

      - name: Install full covariant replay model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The split tracker helper normally reads expansion_smg parameters.
          # A real covariant model uses parameters_smg for the Lagrangian, so
          # freeze the already-established tracker/background constants here.
          p=Path('source/background.c'); s=p.read_text()
          old='''  double Ox = pba->parameters_smg[0];
            double lambda_e = pba->parameters_smg[1];
            double zt = pba->parameters_smg[2];
            double dNt = pba->parameters_smg[3];
            double A = pba->parameters_smg[4];
            double tauA = pba->parameters_smg[5];
            double B = pba->parameters_smg[6];
            double tauB = pba->parameters_smg[7];'''
          new='''  double Ox = 0.7073985893;
            double lambda_e = 18.70;
            double zt = 17.8;
            double dNt = 0.5;
            double A = 0.01105624999;
            double tauA = 0.25;
            double B = 0.01951933685;
            double tauB = 1.5;'''
          if old not in s: raise RuntimeError('split tracker constant anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('include/background.h'); s=p.read_text()
          old='    constant_alphas, sdmc_early_cs, sdmc_v2_noslip, sdmc_v2_late_noslip, sdmc_kp_late_noslip, sdmc_v3_native_noslip,\n'
          new='    constant_alphas, sdmc_early_cs, sdmc_v2_noslip, sdmc_v2_late_noslip, sdmc_kp_late_noslip, sdmc_v3_native_noslip, sdmc_covariant_replay,\n'
          if old not in s: raise RuntimeError('enum anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('gravity_smg/gravity_models_smg.c'); s=p.read_text()
          s=s.replace('#include "gravity_models_smg.h"\n',
                      '#include "gravity_models_smg.h"\n#include "sdmc_covariant_replay_table.h"\n',1)

          anchor='''  if (strcmp(string1,"eft_alphas_power_law") == 0) {'''
          parser='''  if (strcmp(string1,"sdmc_covariant_replay") == 0) {
             pba->gravity_model_smg = sdmc_covariant_replay;
             pba->field_evolution_smg = _TRUE_;
             pba->M2_evolution_smg = _FALSE_;
             flag2=_TRUE_;
             pba->parameters_size_smg = 1;
             class_read_list_of_doubles("parameters_smg",pba->parameters_smg,pba->parameters_size_smg);
             if (has_tuning_index_smg == _FALSE_) {
               pba->tuning_index_smg = 0;
               pba->tuning_dxdy_guess_smg = 1.;
             }
           }

          if (strcmp(string1,"eft_alphas_power_law") == 0) {'''
          if s.count(anchor)!=1: raise RuntimeError('parser anchor count '+str(s.count(anchor)))
          s=s.replace(anchor,parser,1)

          ganchor='''  else if(pba->gravity_model_smg == galileon){'''
          gcode=r'''  else if (pba->gravity_model_smg == sdmc_covariant_replay) {
            double Nc=-log(1.+SDMC_COV_ZC);
            double xx=(phi-Nc)/(2.*SDMC_COV_WIDTH);
            double tt=tanh(xx);
            double uu=1.-tt*tt;
            double w=SDMC_COV_WIDTH;
            double S=.5*(1.+tt);
            double S1=uu/(4.*w);
            double S2=-tt*uu/(4.*w*w);
            double S3=-uu*(1.-3.*tt*tt)/(8.*w*w*w);
            double A=SDMC_COV_AF;
            double F=exp(A*S);
            double F1=F*(A*S1);
            double F2=F*(A*A*S1*S1+A*S2);
            double F3=F*(A*A*A*S1*S1*S1+3.*A*A*S1*S2+A*S3);

            double g,g1,g2,g3;
            double k1,k1p,k1pp,k1ppp;
            double k2,k2p,k2pp,k2ppp;
            double V,Vp,Vpp,Vppp;
            sdmc_cov_eval(sdmc_cov_g,phi,&g,&g1,&g2,&g3);
            sdmc_cov_eval(sdmc_cov_k1,phi,&k1,&k1p,&k1pp,&k1ppp);
            sdmc_cov_eval(sdmc_cov_k2,phi,&k2,&k2p,&k2pp,&k2ppp);
            sdmc_cov_eval(sdmc_cov_V,phi,&V,&Vp,&Vpp,&Vppp);
            V += 3.*pba->H0*pba->H0*pba->parameters_smg[0];

            pgf->G2 = k1*X+k2*X*X-V;
            pgf->G2_X = k1+2.*k2*X;
            pgf->G2_XX = 2.*k2;
            pgf->G2_phi = k1p*X+k2p*X*X-Vp;
            pgf->G2_Xphi = k1p+2.*k2p*X;
            pgf->G2_XXphi = 2.*k2p;
            pgf->G2_phiphi = k1pp*X+k2pp*X*X-Vpp;
            pgf->G2_Xphiphi = k1pp+2.*k2pp*X;

            pgf->G3_X = g;
            pgf->G3_phi = g1*X;
            pgf->G3_Xphi = g1;
            pgf->G3_phiphi = g2*X;
            pgf->G3_Xphiphi = g2;
            pgf->G3_phiphiphi = g3*X;

            pgf->DG4 = (F-1.)/2.;
            pgf->G4 = F/2.;
            pgf->G4_phi = F1/2.;
            pgf->G4_phiphi = F2/2.;
            pgf->G4_phiphiphi = F3/2.;
          }

          else if(pba->gravity_model_smg == galileon){'''
          if s.count(ganchor)!=1: raise RuntimeError('G anchor count '+str(s.count(ganchor)))
          s=s.replace(ganchor,gcode,1)

          start=s.index('int gravity_models_initial_conditions_smg(')
          pos=s.index('case propto_omega:',start)
          ic='''case sdmc_covariant_replay:
            {
              double ph=log(a);
              double lnh,lnhp,lnhpp,lnhppp;
              sdmc_cov_eval(sdmc_cov_lnH,ph,&lnh,&lnhp,&lnhpp,&lnhppp);
              pvecback_integration[pba->index_bi_phi_smg]=ph;
              pvecback_integration[pba->index_bi_phi_prime_smg]=a*exp(lnh);
            }
            break;

          '''
          s=s[:pos]+ic+s[pos:]
          p.write_text(s)
          print('installed full covariant replay model')
          PY

      - name: Rebuild with covariant model
        run: make clean && make -j2 class

      - name: Run native covariant background evolution
        run: |
          cat > output/covariant_replay.ini <<'EOF'
          H0 = 70.8514
          omega_b = 0.02239952
          omega_cdm = 0.12444227328918850
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453

          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1

          gravity_model = sdmc_covariant_replay
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic

          a_ini_over_a_today_default = 1.e-12
          a_ini_test_qs_smg = 1.e-12
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-12

          output_background_smg = 3
          write background = yes
          write thermodynamics = no
          write parameters = yes
          root = output/covariant_replay_
          format = class
          input_verbose = 1
          background_verbose = 1
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          set +e
          ./class output/covariant_replay.ini > output/covariant_replay.log 2>&1
          rc=$?
          set -e
          echo "COVARIANT_REPLAY_RETURNCODE=$rc"
          tail -120 output/covariant_replay.log
          test "$rc" -eq 0

      - name: Compare evolved covariant solution to target
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np,re,csv

          def read(path):
              p=Path(path)
              if not p.exists(): return None
              lines=p.read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and '1:z' in l][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              a=np.loadtxt(p)
              return {n:a[:,i] for i,n in enumerate(names)}

          t=read('output/covariant_target_00_background.dat')
          c=read('output/covariant_replay_00_background.dat')
          if c is None:
              print('COVARIANT_COMPARISON unavailable: replay background missing')
              raise SystemExit(0)

          zc=c['z']; Nt=-np.log1p(t['z']); Nc=-np.log1p(zc)
          order=np.argsort(Nt); Nt=Nt[order]
          def ti(name):
              y=t[name][order]
              return np.interp(Nc,Nt,y)

          Ht=ti('H [1/Mpc]')
          Ft=ti('M*^2_smg')
          Hrel=np.abs(c['H [1/Mpc]']/Ht-1.)
          Frel=np.abs(c['M*^2_smg']/Ft-1.)
          mask100=zc<=100
          mask1e4=zc<=1.e4
          noslip=np.abs(c['braiding_smg']+2.*c['M2_running_smg'])

          # field columns exist only for the true covariant model
          phi=c.get('phi_smg',None)
          if phi is None:
              for k in c:
                  if k.lower().startswith('phi') and 'prime' not in k.lower():
                      phi=c[k]; break
          phierr=np.nan
          if phi is not None: phierr=float(np.max(np.abs(phi-Nc)))

          out={
            'max_abs_dH_H_z100':float(Hrel[mask100].max()),
            'max_abs_dH_H_z1e4':float(Hrel[mask1e4].max()),
            'max_abs_dF_F_z100':float(Frel[mask100].max()),
            'min_D_z100':float(c['kin (D)'][mask100].min()),
            'min_cs2_z100':float(c['c_s^2'][mask100].min()),
            'max_cs2_z100':float(c['c_s^2'][mask100].max()),
            'min_D_all':float(c['kin (D)'].min()),
            'min_cs2_all':float(c['c_s^2'].min()),
            'max_cs2_all':float(c['c_s^2'].max()),
            'z_at_max_cs2_all':float(zc[np.argmax(c['c_s^2'])]),
            'max_abs_noslip_z100':float(noslip[mask100].max()),
            'max_abs_phi_minus_lna':phierr,
            'F0':float(c['M*^2_smg'][np.argmin(np.abs(zc))]),
            'alphaM0':float(c['M2_running_smg'][np.argmin(np.abs(zc))]),
          }
          print('PROFILE_L1870_Z17775_FLOOR045_COVARIANT_REPLAY_COMPARISON',out)
          with open('output/covariant_replay_comparison.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=out.keys()); w.writeheader(); w.writerow(out)
          if not (out['min_D_all']>0 and out['min_cs2_all']>0 and out['max_cs2_all']<=1.0):
              raise SystemExit('GLOBAL_COVARIANT_STABILITY_GATE_FAIL '+repr(out))
          print('GLOBAL_COVARIANT_STABILITY_GATE_PASS',out,flush=True)
          PY

      - name: Install Planck native likelihood data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              ok=cls.install(path='planck_packages',no_progress_bars=True)
              if not ok:
                  raise SystemExit(f'Planck install failed: {cls}')
          PY

      - name: Run full covariant perturbation and observable gate
        run: |
          cat > output/covariant_observable.ini <<'EOF'
          H0 = 70.8514
          omega_b = 0.02239952
          omega_cdm = 0.12444227328918850
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453

          A_s = 2.16715426219737e-9
          n_s = 0.964
          tau_reio = 0.0544

          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1

          gravity_model = sdmc_covariant_replay
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic

          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8

          modes = s
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 3000
          P_k_max_h/Mpc = 6.0
          z_pk = 0,0.5,1,2,3,5,10

          output_background_smg = 3
          write background = yes
          write thermodynamics = yes
          write parameters = yes
          root = output/covariant_observable_
          format = class

          input_verbose = 1
          background_verbose = 1
          thermodynamics_verbose = 0
          perturbations_verbose = 1
          spectra_verbose = 0
          lensing_verbose = 0
          output_verbose = 0
          EOF
          set +e
          ./class output/covariant_observable.ini > output/covariant_observable.log 2>&1
          rc=$?
          set -e
          echo "COVARIANT_OBSERVABLE_RETURNCODE=$rc"
          tail -160 output/covariant_observable.log
          test "$rc" -eq 0

      - name: Evaluate Planck components and derived covariant observables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, math, re
          import numpy as np
          import pandas as pd
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative

          ROOT=Path('output')
          TCMB=2.7255
          CAL_SIGMA=0.0025
          PACKAGES='planck_packages'
          clpath=ROOT/'covariant_observable_00_cl_lensed.dat'

          high=TTTEEE_lite_native(packages_path=PACKAGES)
          lowt=TT(packages_path=PACKAGES)
          lowe=EE(packages_path=PACKAGES)
          lens=LensingNative(packages_path=PACKAGES)

          def load_cls(path):
              a=np.loadtxt(path)
              ell=a[:,0].astype(int)
              lmax=int(ell.max())
              conv=(TCMB*1e6)**2
              tt=np.zeros(lmax+1); ee=np.zeros(lmax+1); te=np.zeros(lmax+1)
              bb=np.zeros(lmax+1); pp=np.zeros(lmax+1)
              tp=np.zeros(lmax+1); ep=np.zeros(lmax+1)
              tt[ell]=a[:,1]*conv
              ee[ell]=a[:,2]*conv
              te[ell]=a[:,3]*conv
              bb[ell]=a[:,4]*conv
              ll=ell*(ell+1.0)
              pp[ell]=a[:,5]*ll
              tp[ell]=a[:,6]*np.sqrt(ll)*(TCMB*1e6)
              ep[ell]=a[:,7]*np.sqrt(ll)*(TCMB*1e6)
              return np.column_stack([ell,tt[ell],te[ell],ee[ell]]),{
                  'tt':tt,'ee':ee,'te':te,'bb':bb,'pp':pp,'tp':tp,'ep':ep}

          high_array,dls=load_cls(clpath)
          def pieces(A):
              A=float(A)
              ch=float(high.chi_squared(high_array,A_planck=A))
              ct=float(-2*lowt.log_likelihood(dls['tt'],calib=A))
              ce=float(-2*lowe.log_likelihood(dls['ee'],calib=A))
              cl=float(-2*lens.log_likelihood(dls,A_planck=A))
              cp=((A-1.0)/CAL_SIGMA)**2
              return ch,ct,ce,cl,cp
          def total(A):
              q=pieces(A)
              return sum(q) if all(np.isfinite(q)) else np.inf
          opt=minimize_scalar(total,bounds=(0.97,1.03),method='bounded',
                              options={'xatol':1e-10})
          A=float(opt.x)
          ch,ct,ce,cl,cp=pieces(A)
          chi=ch+ct+ce+cl+cp
          ref=1103.5661917539776
          like={
              'A_planck':A,
              'chi2_high':ch,
              'chi2_lowT':ct,
              'chi2_lowE':ce,
              'chi2_lensing':cl,
              'chi2_cal':cp,
              'chi2_total':chi,
              'delta_chi2_vs_parameterized_independent':chi-ref,
          }
          print('COVARIANT_PLANCK_COMPONENTS',like,flush=True)
          with (ROOT/'covariant_observable_planck.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=like.keys()); w.writeheader(); w.writerow(like)

          def parse_table(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              marks=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(marks):
                  end=marks[i+1].start() if i+1<len(marks) else len(hdr)
                  names.append(hdr[m.end():end].strip())
              return pd.DataFrame(np.loadtxt(path),columns=names)

          bg=parse_table(ROOT/'covariant_observable_00_background.dat').sort_values('z')
          th=parse_table(ROOT/'covariant_observable_00_thermodynamics.dat')
          def interp(col,z):
              return float(np.interp(z,bg['z'],bg[col]))

          zstar=float(th.loc[th['g [Mpc^-1]'].idxmax(),'z'])
          ts=th.sort_values('z'); zz=ts.z.to_numpy(); kb=ts.kappa_b.to_numpy()
          crosses=[]
          for i in range(len(zz)-1):
              if (kb[i]-1)*(kb[i+1]-1)<=0 and kb[i]!=kb[i+1]:
                  q=(1-kb[i])/(kb[i+1]-kb[i])
                  crosses.append(zz[i]+q*(zz[i+1]-zz[i]))
          zdrag=float(crosses[0]) if crosses else float('nan')
          rsstar=interp('comov.snd.hrz.',zstar)
          rd=interp('comov.snd.hrz.',zdrag) if np.isfinite(zdrag) else float('nan')
          ellA=math.pi*interp('comov. dist.',zstar)/rsstar
          nsres=float(np.max(np.abs(bg['braiding_smg']+2*bg['M2_running_smg'])))
          acoustic={
              'z_star':zstar,'z_drag':zdrag,'rs_star_Mpc':rsstar,'rd_Mpc':rd,
              'ell_A':ellA,
              'F0':interp('M*^2_smg',0.0),
              'alphaM0':interp('M2_running_smg',0.0),
              'min_D_all':float(bg['kin (D)'].min()),
              'min_cs2_all':float(bg['c_s^2'].min()),
              'max_cs2_all':float(bg['c_s^2'].max()),
              'max_abs_noslip':nsres,
          }
          print('COVARIANT_ACOUSTIC_STABILITY',acoustic,flush=True)
          with (ROOT/'covariant_observable_acoustic.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=acoustic.keys()); w.writeheader(); w.writerow(acoustic)

          def sigmaR(path,R=8.0):
              a=np.loadtxt(path); k=a[:,0]; P=a[:,1]; x=k*R
              W=np.ones_like(x); q=x!=0
              W[q]=3*(np.sin(x[q])-x[q]*np.cos(x[q]))/x[q]**3
              integ=k**3*P*W**2/(2*np.pi**2)
              return math.sqrt(np.trapezoid(integ,x=np.log(k)))

          zpk=[0,0.5,1,2,3,5,10]
          growth=[]
          for i,z in enumerate(zpk,1):
              fp=ROOT/f'covariant_observable_00_z{i}_pk.dat'
              if not fp.exists(): continue
              s8=sigmaR(fp)
              ff=interp('gr.fac. f',z) if 'gr.fac. f' in bg.columns else float('nan')
              DD=interp('gr.fac. D',z) if 'gr.fac. D' in bg.columns else float('nan')
              growth.append({'z':z,'sigma8':s8,'f':ff,'fsigma8':ff*s8,'growth_D':DD})
          pd.DataFrame(growth).to_csv(ROOT/'covariant_observable_growth.csv',index=False)
          print('COVARIANT_GROWTH')
          print(pd.DataFrame(growth).to_string(index=False),flush=True)

          bao=[]
          for z in [0.295,0.510,0.706,0.934,1.321,1.484,2.330]:
              if not np.isfinite(rd): break
              DM=interp('comov. dist.',z)
              DH=1.0/interp('H [1/Mpc]',z)
              DV=(z*DM*DM*DH)**(1/3)
              bao.append({'z':z,'rd_Mpc':rd,'DM_over_rd':DM/rd,'DH_over_rd':DH/rd,
                          'DV_over_rd':DV/rd,'DM_Mpc':DM,'DH_Mpc':DH,'DV_Mpc':DV})
          pd.DataFrame(bao).to_csv(ROOT/'covariant_observable_bao.csv',index=False)
          print('COVARIANT_BAO')
          print(pd.DataFrame(bao).to_string(index=False),flush=True)

          pkrows=[]
          fp=ROOT/'covariant_observable_00_z1_pk.dat'
          if fp.exists():
              a=np.loadtxt(fp); kk=a[:,0]; pp=a[:,1]
              for kval in [0.01,0.05,0.1,0.2,0.5,1.0,2.0,4.0,6.0]:
                  pkrows.append({'k_hMpc':kval,'P_Mpch3':float(np.interp(kval,kk,pp))})
          pd.DataFrame(pkrows).to_csv(ROOT/'covariant_observable_pk_z0_samples.csv',index=False)
          PY

      - name: Add parameterized independent-kinetic reference model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path,old,new):
              p=Path(path); s=p.read_text()
              if new in s: return
              if s.count(old)!=1: raise RuntimeError(f'{path}: anchor count {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          rep('include/background.h',
              '    constant_alphas, sdmc_early_cs, sdmc_v2_noslip, sdmc_v2_late_noslip, sdmc_kp_late_noslip, sdmc_v3_native_noslip, sdmc_covariant_replay,\n',
              '    constant_alphas, sdmc_early_cs, sdmc_v2_noslip, sdmc_v2_late_noslip, sdmc_kp_late_noslip, sdmc_v3_native_noslip, sdmc_covariant_replay, sdmc_v3_independent_kinetic,\n')

          p=Path('gravity_smg/gravity_models_smg.c'); s=p.read_text()
          needle='if (strcmp(string1,"eft_alphas_power_law") == 0) {'
          if s.count(needle)!=1: raise RuntimeError('parser token count '+str(s.count(needle)))
          parser='''  if (strcmp(string1,"sdmc_v3_independent_kinetic") == 0) {
             pba->gravity_model_smg = sdmc_v3_independent_kinetic;
             pba->field_evolution_smg = _FALSE_;
             pba->M2_evolution_smg = _FALSE_;
             flag2=_TRUE_;
             pba->parameters_2_size_smg = 6;
             class_read_list_of_doubles("parameters_smg",pba->parameters_2_smg,pba->parameters_2_size_smg);
             class_test(pba->parameters_2_smg[0] <= 0. || pba->parameters_2_smg[1] <= 0. ||
                        pba->parameters_2_smg[2] <= 0. || pba->parameters_2_smg[3] <= 0. ||
                        pba->parameters_2_smg[4] < 0. || pba->parameters_2_smg[5] <= 0., errmsg,
                        "sdmc_v3_independent_kinetic requires positive AF,zc,width,D0,Dfloor and non-negative p");
           }

          '''
          s=s.replace(needle,parser+needle,1)

          ctoken='else if (pba->gravity_model_smg == eft_alphas_power_law) {'
          if s.count(ctoken)!=1: raise RuntimeError('closure token count '+str(s.count(ctoken)))
          closure=r'''  else if (pba->gravity_model_smg == sdmc_v3_independent_kinetic) {
            double AF=pba->parameters_2_smg[0];
            double zc=pba->parameters_2_smg[1];
            double width=pba->parameters_2_smg[2];
            double D0=pba->parameters_2_smg[3];
            double power=pba->parameters_2_smg[4];
            double Dfloor=pba->parameters_2_smg[5];
            double N=log(a);
            double Nc=-log(1.+zc);
            double x=(N-Nc)/(2.*width);
            double th=tanh(x);
            double ch=cosh(x);
            double sech2=1./(ch*ch);
            double S=.5*(1.+th);
            double F=exp(AF*S);
            double am=AF/(4.*width)*sech2;
            double bra=-2.*am;
            double D=Dfloor + D0*pow(S,power);
            double ak=D-1.5*bra*bra;
            pvecback[pba->index_bg_kineticity_smg]=ak;
            pvecback[pba->index_bg_braiding_smg]=bra;
            pvecback[pba->index_bg_tensor_excess_smg]=0.;
            pvecback[pba->index_bg_M2_running_smg]=am;
            pvecback[pba->index_bg_beyond_horndeski_smg]=0.;
            pvecback[pba->index_bg_delta_M2_smg]=F-1.;
            pvecback[pba->index_bg_M2_smg]=F;
          }

          '''
          s=s.replace(ctoken,closure+ctoken,1)
          p.write_text(s)
          print('paired independent-kinetic reference installed')
          PY

