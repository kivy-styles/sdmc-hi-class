name: SDMC r032 SN107 bo002 joint local Bayesian closure

on:
  push:
    branches:
      - sdmc-r032-snclosure107-bo002-joint-local-bo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint-search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas scikit-learn cobaya

      - name: Apply SDMC patches and build
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make -j2 class

      - name: Install Planck native-lite likelihood data
        run: |
          ok=0
          for attempt in 1 2 3 4
          do
            rm -rf planck_packages
            if python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(2)
          print('PLANCK_LITE_READY')
          PY
            then ok=1; break; fi
            sleep $((attempt*6))
          done
          test "$ok" -eq 1

      - name: Install SN and DESI BAO covariance products
        run: |
          rm -rf sn_data bao_data
          git clone --depth 1 --branch v1.8 https://github.com/CobayaSampler/sn_data.git sn_data
          git clone --depth 1 https://github.com/CobayaSampler/bao_data.git bao_data
          test -f sn_data/PantheonPlus/Pantheon+SH0ES.dat
          test -f sn_data/Union3/lcparam_full.txt
          test -f sn_data/DESY5/DES-SN5YR_HD.csv
          test -f bao_data/desi_2024_gaussian_bao_ALL_GCcomb_mean.txt

      - name: Run joint Bayesian closure search
        run: python3 sdmc/run_r032_snclosure107_bo002_joint_local.py

      - name: Print joint-search summary
        if: always()
        run: |
          cat output/snclosure107_bo002_joint_local/snclosure107_bo002_joint_local_summary.json || true
          echo "--- TOP JOINT CANDIDATES ---"
          python3 - <<'PY'
          import pandas as pd
          p='output/snclosure107_bo002_joint_local/snclosure107_bo002_joint_local.csv'
          try:
              d=pd.read_csv(p)
              print(d[d.status.eq('OK')].sort_values(['goal_score','second_joint_proxy','pd_fair_proxy']).head(20).to_string(index=False))
          except Exception as e:
              print(e)
          PY

      - name: Preserve joint search
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-snclosure107-bo002-joint-local-bo
          path: |
            output/snclosure107_bo002_joint_local/*.csv
            output/snclosure107_bo002_joint_local/*.json
          if-no-files-found: warn
