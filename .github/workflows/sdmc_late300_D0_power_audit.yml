name: SDMC late300 D0 and kinetic-power structural audit

on:
  push:
    branches: [sdmc-late300-D0-power-audit]
    paths:
      - '.github/workflows/sdmc_late300_D0_power_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and patches
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential >/dev/null
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install numpy scipy >/dev/null
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make clean >/dev/null && make -j2 class >/dev/null
      - name: Prepare structural candidates
        run: |
          mkdir -p output
          python3 - <<'PY'
          from pathlib import Path
          import json,math
          c=json.loads(Path("sdmc/late300_candidate.json").read_text())["parameters"]
          Xi=math.sqrt(3/(8*math.pi))
          Nc=-math.log1p(c["z_c"])
          S0=0.5*(1+math.tanh((0-Nc)/(2*c["width"])))
          F0=math.exp(c["A_F"]*S0)
          vals={
            "accepted":(c["D0"],1.0),
            "Xi":(Xi,1.0),
            "XiFhalf":(Xi/math.sqrt(F0),1.0),
            "p075":(Xi,0.75),
            "p125":(Xi,1.25),
            "p150":(Xi,1.50),
            "p200":(Xi,2.00)
          }
          base=[
            f"H0 = {c['H0']}",f"omega_b = {c['omega_b']}",f"omega_cdm = {c['omega_cdm']}",
            "N_ncdm = 0","N_ur = 3.046","T_cmb = 2.7255","YHe = 0.2453",
            f"A_s = {c['A_s']}",f"n_s = {c['n_s']}",f"tau_reio = {c['tau_reio']}",
            "Omega_Lambda = 0","Omega_fld = 3.1443554e-8",
            "fluid_equation_of_state = SDMC_TRACKER","cs2_fld = 0.003","use_ppf = no",
            "Omega_smg = -1","gravity_model = sdmc_v3_independent_kinetic",
            "expansion_model = sdmc_full",
            f"expansion_smg = {c['Omega_x0']}, {c['lambda_e']}, {c['z_t']}, 0.5, {c['A_late']}, 0.25, {c['B_late']}, 1.5",
            "pert_initial_conditions_smg = zero","method_qs_smg = fully_dynamic",
            "a_ini_over_a_today_default = 1.e-8","a_ini_test_qs_smg = 1.e-8",
            "pert_ic_ini_z_ref_smg = 1.e7","a_min_stability_test_smg = 1.e-8",
            "output_background_smg = 3","modes = s","output = tCl,pCl,lCl,mPk",
            "lensing = yes","l_max_scalars = 2500","P_k_max_h/Mpc = 1.0","z_pk = 0",
            "write background = yes","write thermodynamics = no","format = class",
            "input_verbose = 0","background_verbose = 0","thermodynamics_verbose = 0",
            "perturbations_verbose = 0","transfer_verbose = 0","primordial_verbose = 0",
            "harmonic_verbose = 0","fourier_verbose = 0","lensing_verbose = 0","output_verbose = 0"
          ]
          meta={"Xi_inv":Xi,"S0":S0,"F0":F0,"Xi_over_sqrtF0":Xi/math.sqrt(F0),"accepted_D0":c["D0"],"cases":{}}
          for tag,(d0,p) in vals.items():
              s="\n".join(base)+f"\nparameters_smg = {c['A_F']}, {c['z_c']}, {c['width']}, {d0}, {p}, {c['D_floor']}\nroot = output/{tag}_\n"
              Path(f"output/{tag}.ini").write_text(s)
              meta["cases"][tag]={"D0":d0,"power":p}
          Path("output/meta.json").write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          print("D0_POWER_PREP",json.dumps(meta,sort_keys=True))
          PY
      - name: Run candidates
        run: |
          set +e
          for ini in output/*.ini; do
            tag=$(basename "$ini" .ini)
            ./class "$ini" > "output/$tag.log" 2>&1
            echo $? > "output/$tag.rc"
          done
          set -e
      - name: Analyze
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,numpy as np
          meta=json.loads(Path("output/meta.json").read_text())

          def bg(tag):
              p=Path(f"output/{tag}_00_background.dat")
              ls=p.read_text().splitlines()
              hdr=[x for x in ls if x.startswith("#") and re.search(r"(?:^|\s)1\s*:",x)][-1].lstrip("#").strip()
              ms=list(re.finditer(r"(\d+)\s*:\s*",hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr); names.append(hdr[m.end():e].strip())
              a=np.loadtxt(p)
              if a.ndim==1:a=a[None,:]
              return {n:a[:,i] for i,n in enumerate(names)}

          def compare(pa,pb):
              A=np.loadtxt(pa); B=np.loadtxt(pb)
              if A.ndim==1:A=A[None,:]
              if B.ndim==1:B=B[None,:]
              n=min(A.shape[1],B.shape[1]); x=A[:,0]; xb=B[:,0]
              o=np.argsort(xb); vals=[]
              for j in range(1,n):
                  bb=np.interp(x,xb[o],B[o,j]); aa=A[:,j]
                  peak=max(float(np.max(np.abs(aa))),float(np.max(np.abs(bb))),1e-300)
                  vals.append(float(np.max(np.abs(aa-bb))/peak))
              return max(vals) if vals else None

          out={"status":"D0 structural normalization and kinetic-power sensitivity audit","meta":meta,"cases":{}}
          for tag in meta["cases"]:
              rc=int(Path(f"output/{tag}.rc").read_text())
              rec={"returncode":rc}
              if rc==0:
                  d=bg(tag); z=d["z"]; m=z<=100
                  rec["stability"]={"min_D":float(np.min(d["kin (D)"][m])),
                                    "min_cs2":float(np.min(d["c_s^2"][m])),
                                    "max_cs2":float(np.max(d["c_s^2"][m]))}
                  if tag!="accepted":
                      rec["residuals"]={
                        "lensed_cl_peaknorm":compare(Path("output/accepted_00_cl_lensed.dat"),Path(f"output/{tag}_00_cl_lensed.dat")),
                        "unlensed_cl_peaknorm":compare(Path("output/accepted_00_cl.dat"),Path(f"output/{tag}_00_cl.dat")),
                        "pk_peaknorm":compare(Path("output/accepted_00_pk.dat"),Path(f"output/{tag}_00_pk.dat"))
                      }
              else:
                  log=Path(f"output/{tag}.log").read_text(errors="replace")
                  rec["error_tail"]=[x for x in log.splitlines() if "instability" in x.lower() or "error" in x.lower()][-8:]
              out["cases"][tag]=rec
          Path("output/D0_power_audit.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("D0_POWER_AUDIT",json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D0-power-audit
          path: |
            output/D0_power_audit.json
            output/meta.json
