name: SDMC combined covariant braiding reconstruction

on:
  push:
    branches:
      - sdmc-r032-combined-covariant-braiding-reconstruct
  workflow_dispatch:

jobs:
  covariant-braided:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas

      - name: Apply SDMC EFT patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          python3 sdmc/install_sdmc_v3_lens_braiding.py

      - name: Build target model
        run: make -j2 class

      - name: Generate combined EFT target
        run: |
          mkdir -p output
          cat > output/combined_cov_target.ini <<'EOF'
          H0 = 69.7095092787552
          omega_b = 0.02211778594478965
          omega_cdm = 0.1258596659367904
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1700512487766515e-9
          n_s = 0.9637720508351921
          tau_reio = 0.06456347454525531

          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_lens_braiding
          parameters_smg = 0.0715,5.0,1.426,0.34231919445927034,1.0,0.045,0.024,1.5,0.8
          expansion_model = sdmc_full
          expansion_smg = 0.6953970160452582,17.925,17.775,0.5,0.01105624999,0.25,0.01951933685,1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          write background = yes
          write thermodynamics = no
          root = output/combined_cov_target_
          format = class
          input_verbose = 0
          background_verbose = 0
          thermodynamics_verbose = 0
          output_verbose = 0
          EOF
          ./class output/combined_cov_target.ini
          echo "COMBINED_COV_TARGET_RETURNCODE=0"

      - name: Reconstruct and install covariant action
        run: python3 sdmc/install_r032_combined_covariant_braided.py

      - name: Rebuild covariant model
        run: make clean && make -j2 class

      - name: Evolve reconstructed covariant model
        run: |
          cat > output/combined_cov_replay.ini <<'EOF'
          H0 = 69.7095092787552
          omega_b = 0.02211778594478965
          omega_cdm = 0.1258596659367904
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1700512487766515e-9
          n_s = 0.9637720508351921
          tau_reio = 0.06456347454525531

          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_covariant_braided_replay
          parameters_smg = 0.0
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 1.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          write background = yes
          write thermodynamics = no
          write parameters = yes
          root = output/combined_cov_replay_
          format = class
          input_verbose = 0
          background_verbose = 1
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          set +e
          ./class output/combined_cov_replay.ini > output/combined_cov_replay.log 2>&1
          rc=$?
          set -e
          echo "COMBINED_COV_REPLAY_RETURNCODE=$rc"
          tail -100 output/combined_cov_replay.log
          test "$rc" -eq 0

      - name: Audit target versus covariant evolution
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np,re,json,pandas as pd

          def read(path):
              p=Path(path)
              if not p.exists(): return None
              lines=p.read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and '1:z' in l][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              a=np.loadtxt(p)
              return {n:a[:,i] for i,n in enumerate(names)}

          t=read('output/combined_cov_target_00_background.dat')
          c=read('output/combined_cov_replay_00_background.dat')
          if c is None:
              print('COMBINED_COV_AUDIT unavailable: replay missing')
              raise SystemExit(0)

          Nt=-np.log1p(t['z']); Nc=-np.log1p(c['z'])
          o=np.argsort(Nt); Nt=Nt[o]
          def ti(name):
              return np.interp(Nc,Nt,t[name][o])

          pairs=[
              ('H [1/Mpc]','H_rel'),
              ('M*^2_smg','F_rel'),
          ]
          rec={}
          for name,key in pairs:
              tv=ti(name); cv=c[name]
              rel=np.abs(cv/tv-1.)
              rec[key+'_max_all']=float(np.nanmax(rel))
              rec[key+'_max_z100']=float(np.nanmax(rel[c['z']<=100.]))

          for name,key in [
              ('M2_running_smg','alphaM'),
              ('braiding_smg','alphaB'),
              ('kin (D)','D'),
              ('c_s^2','cs2'),
          ]:
              dv=np.abs(c[name]-ti(name))
              rec[key+'_abs_max_all']=float(np.nanmax(dv))
              rec[key+'_abs_max_z100']=float(np.nanmax(dv[c['z']<=100.]))

          rec['cov_min_D_all']=float(np.nanmin(c['kin (D)']))
          rec['cov_min_cs2_all']=float(np.nanmin(c['c_s^2']))
          rec['cov_max_cs2_all']=float(np.nanmax(c['c_s^2']))
          rec['cov_max_abs_noslip_break']=float(np.nanmax(np.abs(c['braiding_smg']+2*c['M2_running_smg'])))
          rec['target_max_abs_noslip_break']=float(np.nanmax(np.abs(ti('braiding_smg')+2*ti('M2_running_smg'))))
          print('COMBINED_COV_REPLAY_AUDIT',json.dumps(rec,sort_keys=True),flush=True)
          pd.DataFrame([rec]).to_csv('output/combined_cov_replay_audit.csv',index=False)
          PY

      - name: Preserve reconstruction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-combined-covariant-braiding-reconstruction
          path: |
            output/combined_cov_target.ini
            output/combined_cov_target_00_background.dat
            output/combined_cov_replay.ini
            output/combined_cov_replay.log
            output/combined_cov_replay_00_background.dat
            output/combined_cov_replay_audit.csv
            gravity_smg/sdmc_covariant_braided_table.h
          if-no-files-found: warn
