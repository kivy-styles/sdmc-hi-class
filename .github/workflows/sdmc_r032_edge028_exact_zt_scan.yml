name: SDMC r032 edge028 exact zt scan

on:
  push:
    branches:
      - sdmc-r032-edge028-exact-zt-scan
  workflow_dispatch:

jobs:
  exact-zt-point:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: zt157
            zt: "15.70"
            h0: "70.78550183802813"
          - tag: zt158
            zt: "15.80"
            h0: "70.78687210602355"
          - tag: zt159
            zt: "15.90"
            h0: "70.78823016363572"
          - tag: zt160
            zt: "16.00"
            h0: "70.78957619113854"
          - tag: zt1608
            zt: "16.08"
            h0: "70.7906444700986"
          - tag: zt1612
            zt: "16.12"
            h0: "70.79117579261302"
          - tag: zt1616
            zt: "16.16"
            h0: "70.79170525194444"
          - tag: zt1620
            zt: "16.20"
            h0: "70.79223285843527"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya

      - name: Apply SDMC patches and build independent target model
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          make -j2 class

      - name: Install Planck lite data
        run: |
          ok=0
          for attempt in 1 2 3 4
          do
            rm -rf planck_packages
            if python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          for cls in (TTTEEE_lite_native,TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(2)
          PY
            then
              ok=1
              break
            fi
            sleep $((attempt*6))
          done
          test "$ok" -eq 1

      - name: Run exact zt point
        env:
          TAG_SCAN: ${{ matrix.tag }}
          ZT_SCAN: ${{ matrix.zt }}
          H0_SCAN: ${{ matrix.h0 }}
        run: python3 sdmc/run_r032_edge028_exact_zt_point.py

      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge028-exact-${{ matrix.tag }}
          path: output/edge028_exact_zt_${{ matrix.tag }}/result.json
          if-no-files-found: warn
