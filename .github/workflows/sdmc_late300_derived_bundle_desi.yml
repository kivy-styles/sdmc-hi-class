name: SDMC derived-coordinate bundle official DESI gate

on:
  push:
    branches: [sdmc-late300-derived-coordinate-bundle]
    paths:
      - '.github/workflows/sdmc_late300_derived_bundle_desi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desi:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replay accepted late300 DESI workflow with derived structural bundle
        run: |
          python3 -m pip install -q pyyaml
          git fetch --depth=1 origin sdmc-g022-a034-exact-desi
          git show FETCH_HEAD:.github/workflows/sdmc_r032_edge024_qbest_covariant_desi.yml > /tmp/late300_desi.yml
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,yaml
          p=Path("/tmp/late300_desi.yml")
          s=p.read_text()
          replacements={
            "16.19317622240633":"16.742289660253434",
            "0.02048146490100771":"0.02052",
            "3.927876388467848":"4.034077502899133",
            "0.33114133956842123":"0.32925377073762596",
            "0.34231919445927034":"0.3419932122356156"
          }
          for old,new in replacements.items():
              n=s.count(old)
              if n < 1:
                  raise RuntimeError(f"expected at least one occurrence of {old}, found {n}")
              s=s.replace(old,new)
          s=s.replace("COVARIANT_G022_A034_CLEAN","DERIVED_BUNDLE")
          data=yaml.safe_load(s)
          for step in data["jobs"]["acoustic-physical-desi"]["steps"]:
              script=step.get("run")
              if not script: continue
              env=os.environ.copy()
              for k,v in (step.get("env") or {}).items(): env[str(k)]=str(v)
              print(f"=== REPLAY STEP: {step.get('name','unnamed')} ===",flush=True)
              subprocess.run(["bash","-lc",script],check=True,env=env)
          PY
      - name: Print DESI result
        if: always()
        run: cat output/desi_dr1_fs_summary.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derived-bundle-exact-desi
          path: |
            output/desi_dr1_fs_profile.csv
            output/desi_dr1_fs_summary.csv
            output/desi_cov_00_background.dat
            output/desi_cov_00_thermodynamics.dat
            output/desi_cov_00_z*_pk.dat
            output/covariant_replay_comparison.csv
          if-no-files-found: warn
