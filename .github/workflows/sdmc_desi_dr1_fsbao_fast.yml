name: SDMC DESI DR1 FS+BAO joint gate

on:
  push:
    branches:
      - sdmc-desi-dr1-fsbao-fast
  workflow_dispatch:

jobs:
  desi-fsbao:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official DESI theory stack
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas h5py requests pyyaml camb pyfftw cobaya
          python3 -m pip install git+https://github.com/cosmodesi/cosmoprimo.git
          python3 -m pip install git+https://github.com/adematti/lsstypes.git
          python3 -m pip install git+https://github.com/sfschen/velocileptors.git
          rm -rf desi-kp-cosmological-likelihoods
          git clone --depth 1 https://github.com/cosmodesi/desi-kp-cosmological-likelihoods.git

      - name: Download minimal official DESI joint likelihood files
        run: |
          mkdir -p desi_likelihood
          BASE=https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          for FN in \
            likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_BGS_BRIGHT-21.5_GCcomb_z0.1-0.4_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_LRG_GCcomb_z0.4-0.6_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_LRG_GCcomb_z0.6-0.8_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_LRG_GCcomb_z0.8-1.1_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_ELG_LOPnotqso_GCcomb_z1.1-1.6_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_QSO_GCcomb_z0.8-2.1_thetacut0.05.h5 \
            likelihood_bao_syst_Lya_GCcomb_z1.8-4.2.h5
          do
            curl -L --fail --retry 3 -o "desi_likelihood/$FN" "$BASE/$FN"
          done
          ls -lh desi_likelihood

      - name: Download validated covariant and LCDM DESI transfer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input_artifact
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/$GITHUB_REPOSITORY/actions/artifacts/10585330670/zip \
            > input_artifact/artifact.zip
          unzip -q input_artifact/artifact.zip -d input_artifact/unpacked
          test -f input_artifact/unpacked/desi_cov_00_background.dat
          test -f input_artifact/unpacked/desi_lcdm_00_background.dat
          test -f input_artifact/unpacked/desi_cov_00_z1_pk.dat
          test -f input_artifact/unpacked/desi_cov_00_z1_tk.dat
          test -f input_artifact/unpacked/desi_zeff.json

      - name: Evaluate official DESI DR1 FS plus BAO joint likelihood
        run: |
          mkdir -p output
          python3 - <<'PY'
          from pathlib import Path
          import sys,re,json,math
          import numpy as np
          import pandas as pd
          from scipy.interpolate import interp1d
          from scipy.optimize import minimize

          sys.path.insert(0,'desi-kp-cosmological-likelihoods/dr1/cobaya')
          import lsstypes as types
          from cosmoprimo import PowerSpectrumInterpolator1D,PowerSpectrumBAOFilter,Cosmology
          from cosmoprimo.fiducial import DESI
          from velocileptors.EPT.ept_fullresum_varyDz_nu_fftw import REPT
          from desi_fs_bao_all import list_zrange,dataset_fn,get_tracer_label,get_physical_stochastic_settings

          ROOT=Path('input_artifact/unpacked')
          OUT=Path('output')
          C=299792.458

          raw_records=json.loads((ROOT/'desi_zeff.json').read_text())
          fs_zvals=sorted({float(r['zeff']) for r in raw_records})
          zvals=[0.0]+fs_zvals
          z_to_i={round(z,8):i+1 for i,z in enumerate(zvals)}

          def tab(path):
              lines=Path(path).read_text().splitlines()
              hdr=[l for l in lines if l.startswith('#') and re.search(r'1\s*:',l)][-1].lstrip('#').strip()
              ms=list(re.finditer(r'(\d+)\s*:\s*',hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              return pd.DataFrame(np.loadtxt(path),columns=names)

          def rd_from(prefix,bg):
              th=tab(ROOT/f'{prefix}_00_thermodynamics.dat').sort_values('z')
              zz=th.z.to_numpy(); kb=th.kappa_b.to_numpy(); cross=[]
              for i in range(len(zz)-1):
                  if (kb[i]-1.)*(kb[i+1]-1.)<=0 and kb[i]!=kb[i+1]:
                      q=(1.-kb[i])/(kb[i+1]-kb[i])
                      cross.append(zz[i]+q*(zz[i+1]-zz[i]))
              if not cross: raise RuntimeError(f'no drag crossing for {prefix}')
              zd=float(cross[0])
              return float(np.interp(zd,bg.z,bg['comov.snd.hrz.'])),zd

          def model_data(prefix,H0,ob,oc,ns):
              h=H0/100.; fb=ob/(ob+oc); fc=1.-fb
              bg=tab(ROOT/f'{prefix}_00_background.dat').sort_values('z')
              rd,zd=rd_from(prefix,bg)
              series={}
              for z in zvals:
                  ii=z_to_i[round(z,8)]
                  pk=np.loadtxt(ROOT/f'{prefix}_00_z{ii}_pk.dat')
                  tk=tab(ROOT/f'{prefix}_00_z{ii}_tk.dat')
                  kh=tk['k (h/Mpc)'].to_numpy()
                  dm=tk['d_m'].to_numpy()
                  tb=tk['t_b'].to_numpy()
                  hp=tk['h_prime'].to_numpy()
                  ep=tk['eta_prime'].to_numpy()
                  shift=.5*(hp+6.*ep)
                  a=1./(1.+z)
                  H=float(np.interp(z,bg.z,bg['H [1/Mpc]']))
                  Hc=a*H
                  vb=-(tb+shift)/Hc
                  vc=-shift/Hc
                  vcb=fb*vb+fc*vc
                  ratio=np.divide(vcb,dm,out=np.zeros_like(vcb),where=np.abs(dm)>1e-300)
                  kpk=pk[:,0]; Pdd=pk[:,1]
                  rv=np.interp(kpk,kh,ratio)
                  Ptt=Pdd*rv**2
                  series[z]=(kpk,Pdd,Ptt)
              return dict(prefix=prefix,H0=H0,h=h,ob=ob,oc=oc,fb=fb,fc=fc,ns=ns,bg=bg,rd=rd,zd=zd,series=series)

          cov=model_data('desi_cov',70.8514,0.02239952,0.12444227328918850,0.964)
          lcdm=model_data('desi_lcdm',67.36,0.02237,0.1200,0.9649)

          # Read the collaboration's joint FS+BAO blocks, including Ly-alpha BAO.
          blocks=[]
          for tracer,iz,zrange in list_zrange:
              has_no_fs='lya' in tracer.lower()
              fn=dataset_fn('desi_likelihood',tracer,zrange,
                            observable_name='bao-recon' if has_no_fs else 'spectrum-poles-rotated+bao-recon')
              d=types.read(fn)
              flat=[]
              block=dict(tracer=tracer,namespace=f'{get_tracer_label(tracer)}_z{iz}',
                         precision=np.linalg.inv(d.covariance.value()))
              if not has_no_fs:
                  sp=d.observable.get('spectrum'); flat.append(sp.value())
                  theory=d.window.theory.get('spectrum')
                  kin=np.asarray(theory.get(0).coords('k'),float)
                  win=d.window.at.observable.get('spectrum').at.theory.get('spectrum').value()
                  block.update(has_fs=True,zeff=float(sp.attrs['zeff']),kin=kin,window=win,
                               shotnoise=float(np.mean(sp.get(0).values('shotnoise'))))
              else:
                  block.update(has_fs=False)
              bao=d.observable.get('baorecon')
              flat.append(bao.value())
              block.update(data=np.concatenate(flat),bao_z=float(bao.attrs['zeff']),
                           bao_params=list(bao.parameters))
              blocks.append(block)

          fsblocks=[b for b in blocks if b['has_fs']]
          kobs=fsblocks[0]['kin']
          for b in fsblocks:
              if not np.allclose(b['kin'],kobs): raise RuntimeError('DESI theory k grids differ')

          starts={
            'BGS_z0':(1.11348,0.660148,-0.223088),
            'LRG_z0':(1.1351,-0.139101,-0.910397),
            'LRG_z1':(1.22446,-0.671727,-0.22624),
            'LRG_z2':(1.04564,-0.493139,-0.24021),
            'ELG_z1':(0.127936,-0.578801,-1.45356),
            'QSO_z0':(0.780983,0.353843,0.135725),
          }

          fid=DESI(engine='camb')
          all_marg=['alpha0p','alpha2p','alpha4p','alpha6p','sn0p','sn2p','sn4p']
          scales=np.array([12.5]*4+[2.]+[5.]*2)
          marg=['alpha0p','alpha2p','sn0p','sn2p']
          gi=np.array([all_marg.index(x) for x in marg])
          prior_hess=-np.diag(scales[gi]**-2)

          def prepare_basis(m):
              kin=np.geomspace(min(5e-4,kobs[0]/2),max(1.0,kobs[-1]*2),500)
              zs=np.array(zvals)
              Pdd=np.stack([np.interp(kin,*m['series'][z][:2]) for z in zs],axis=-1)
              Ptt=np.stack([np.interp(kin,m['series'][z][0],m['series'][z][2]) for z in zs],axis=-1)
              pki=PowerSpectrumInterpolator1D(kin,Pdd)
              cosmo=Cosmology(n_s=m['ns'],Omega_b=m['ob']/m['h']**2,
                              Omega_cdm=m['oc']/m['h']**2,Omega_ncdm=0.,H0=m['H0'])
              cosmo.rs_drag=m['rd']*m['h']
              filt=PowerSpectrumBAOFilter(pki,engine='peakaverage',cosmo=cosmo,cosmo_fid=fid)
              filt(pki,cosmo=cosmo)
              Pnw=filt.smooth_pk_interpolator()(kin)
              sig8=np.asarray(pki.sigma8())
              ptti=PowerSpectrumInterpolator1D(kin,Ptt)
              fs8=np.asarray(ptti.sigma8())
              pt=REPT(kin,Pdd[:,0],pnw=Pnw[:,0],kmin=kobs[0],kmax=kobs[-1],
                      nk=200,rbao=110,sbao=None,beyond_gauss=True,one_loop=True,
                      shear=True,cutoff=20,jn=5,N=4000,threads=2,
                      extrap_min=-4,extrap_max=3,import_wisdom=False)
              extk=np.append(pt.kv,1.)
              def loginterp(arr):
                  return 10**interp1d(np.log10(kin),np.log10(np.maximum(arr,1e-300)),
                                     kind='cubic',fill_value='extrapolate',axis=0,
                                     assume_sorted=True)(np.log10(extk))
              pcb=loginterp(Pdd); pnw=loginterp(Pnw); ptt=loginterp(Ptt)
              tables={}
              for b in fsblocks:
                  z=b['zeff']; iz=min(range(len(zvals)),key=lambda i:abs(zvals[i]-z))
                  Hkms=float(np.interp(z,m['bg'].z,m['bg']['H [1/Mpc]']))*C
                  DA=float(np.interp(z,m['bg'].z,m['bg']['comov. dist.']))/(1.+z)
                  qpar=float(fid.efunc(z)/(Hkms/(100.*m['h'])))
                  qper=float(DA*m['h']/fid.angular_diameter_distance(z))
                  Dz=float(np.sqrt(pcb[-1,iz]/pcb[-1,0]))
                  fk=np.sqrt(np.maximum(ptt[:-1,iz]/pcb[:-1,iz],0.))
                  pks=pt.compute_redshift_space_power_multipoles_tables(
                      fk,apar=qpar,aperp=qper,ngauss=4,
                      pcb=pcb[:-1,iz],pcb_nw=pnw[:-1,iz],Dz=Dz)[1:]
                  basis=np.stack([
                      interp1d(pt.kv,pks[j],kind='cubic',fill_value='extrapolate',
                               axis=0,assume_sorted=True)(kobs)
                      for j in range(3)],axis=0)
                  tables[b['namespace']]=dict(basis=basis,sigma8=float(sig8[iz]),
                                               fsigma8=float(fs8[iz]),qpar=qpar,qper=qper,Dz=Dz)
              return tables

          def bao_theory(m,z,params):
              Hkms=float(np.interp(z,m['bg'].z,m['bg']['H [1/Mpc]']))*C
              DA=float(np.interp(z,m['bg'].z,m['bg']['comov. dist.']))/(1.+z)
              apar=(1./(Hkms/100.)/m['rd'])/(1./fid.efunc(z)/fid.rs_drag)
              aper=(DA/m['rd'])/(fid.angular_diameter_distance(z)/fid.rs_drag)
              coeffmap={'iso':(1./3.,2./3.),'par':(1.,0.),'per':(0.,1.),'ap':(1.,-1.)}
              vals=[]
              for p in params:
                  key=str(p)[1:]
                  c=coeffmap[key]
                  vals.append(apar**c[0]*aper**c[1])
              return np.asarray(vals,float)

          def get_poles(info,pars,settings,sn,return_gradient=False):
              pktable=info['basis']; sigma8=info['sigma8']; f=info['fsigma8']/sigma8
              b1p,b2p,bsp=pars; b3p=0.
              b1L=b1p/sigma8-1.; b2L=b2p/sigma8**2
              bsL=bsp/sigma8**2; b3L=b3p/sigma8**3
              b1=1.+b1L; b2=8./21.*b1L+b2L; bs=bsL-(2./7.)*b1L; b3=3*b3L+b1L
              gradient=np.zeros((7,7))
              gradient[0,0]=b1*b1
              gradient[1,0]=gradient[1,1]=f*b1
              gradient[2,1]=f*f
              gradient[2,2]=f*b1
              gradient[3,2]=f*f
              fsat=settings['fsat']; sigv=settings['sigv']
              for jj,pole in enumerate([0,2,4]):
                  gradient[jj-3,jj-3]=sn*(fsat if pole>0 else 1.)*sigv**pole
              base=[1,b1,b1*b1,b2,b1*b2,b2*b2,bs,b1*bs,b2*bs,bs*bs,b3,b1*b3]
              mono=np.concatenate([np.asarray(base),gradient.dot(np.zeros(7))])
              poles=np.sum(pktable*mono,axis=-1)
              if return_gradient:
                  return poles,pktable[...,-7:].dot(gradient)
              return poles

          def profile_model(label,m):
              tables=prepare_basis(m)
              rows=[]; total=0.
              for b in blocks:
                  if not b['has_fs']:
                      bt=bao_theory(m,b['bao_z'],b['bao_params'])
                      diff=bt-b['data']
                      chi=float(diff.T.dot(b['precision']).dot(diff))
                      rows.append(dict(model=label,tracer=b['tracer'],namespace=b['namespace'],
                                       zeff=b['bao_z'],chi2_profile=chi,success=True,
                                       b1p=np.nan,b2p=np.nan,bsp=np.nan,
                                       sigma8=np.nan,fsigma8=np.nan,qpar=np.nan,qper=np.nan,Dz=np.nan))
                      total+=chi
                      print('DESI_FSBAO_BLOCK',rows[-1],flush=True)
                      continue

                  settings=get_physical_stochastic_settings(tracer=b['tracer'].upper()[:3])
                  bt=bao_theory(m,b['bao_z'],b['bao_params'])
                  def block_logp(x):
                      poles,grad=get_poles(tables[b['namespace']],x,settings,b['shotnoise'],True)
                      fst=b['window'].dot(poles.ravel())
                      theory=np.concatenate([fst,bt])
                      gfs=grad[...,gi].reshape(-1,len(gi))
                      gfs=b['window'].dot(gfs)
                      gradjoint=np.concatenate([gfs,np.zeros((len(bt),len(gi)))],axis=0)
                      diff=theory-b['data']
                      pgrad=b['precision'].dot(gradjoint)
                      postgrad=-pgrad.T.dot(diff)
                      likeh=-gradjoint.T.dot(pgrad)
                      posth=prior_hess+likeh
                      dx=-np.linalg.solve(posth,postgrad)
                      logl=-.5*diff.T.dot(b['precision']).dot(diff)
                      logl+=.5*dx.dot(likeh).dot(dx)+postgrad.dot(dx)
                      logprior=.5*dx.dot(prior_hess).dot(dx)
                      logl+=-.5*np.linalg.slogdet(-posth)[1]
                      logbias=-.5*(x[1]/5.)**2-.5*(x[2]/5.)**2
                      return float(logl+logprior+logbias)

                  x0=np.array(starts[b['namespace']],float)
                  opt=minimize(lambda x:-2*block_logp(x),x0,method='L-BFGS-B',
                               bounds=[(0.,3.),(-20.,20.),(-20.,20.)],
                               options={'maxiter':500,'ftol':1e-10,'gtol':1e-6})
                  chi=float(opt.fun); total+=chi
                  info=tables[b['namespace']]
                  row=dict(model=label,tracer=b['tracer'],namespace=b['namespace'],
                           zeff=b['zeff'],chi2_profile=chi,success=bool(opt.success),
                           b1p=float(opt.x[0]),b2p=float(opt.x[1]),bsp=float(opt.x[2]),
                           sigma8=info['sigma8'],fsigma8=info['fsigma8'],
                           qpar=info['qpar'],qper=info['qper'],Dz=info['Dz'])
                  rows.append(row)
                  print('DESI_FSBAO_BLOCK',row,flush=True)
              print('DESI_FSBAO_PROFILE_TOTAL',label,total,flush=True)
              return rows,total

          covrows,covchi=profile_model('COVARIANT',cov)
          lcdmrows,lcdmchi=profile_model('LCDM',lcdm)
          delta=covchi-lcdmchi
          print('DESI_FSBAO_DELTA_CHI2_COV_MINUS_LCDM',delta,flush=True)
          rows=covrows+lcdmrows
          pd.DataFrame(rows).to_csv(OUT/'desi_dr1_fsbao_profile.csv',index=False)
          pd.DataFrame([dict(covariant_score=covchi,lcdm_score=lcdmchi,
                             delta_score_cov_minus_lcdm=delta)]).to_csv(
                                 OUT/'desi_dr1_fsbao_summary.csv',index=False)
          PY

      - name: Preserve joint DESI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-desi-dr1-fsbao-fast
          path: output/*
          if-no-files-found: warn
