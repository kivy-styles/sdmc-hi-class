name: SDMC DESI 128-geometry nuisance null ensemble

on:
  push:
    branches:
      - sdmc-desi-strawman-null128-control
  workflow_dispatch:

jobs:
  null-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DESI theory stack
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas h5py requests beautifulsoup4 pyyaml camb pyfftw cobaya
          python3 -m pip install git+https://github.com/cosmodesi/cosmoprimo.git
          python3 -m pip install git+https://github.com/adematti/lsstypes.git
          python3 -m pip install git+https://github.com/sfschen/velocileptors.git
          git clone --depth 1 https://github.com/cosmodesi/desi-kp-cosmological-likelihoods.git

      - name: Download six official DESI likelihood blocks
        run: |
          mkdir -p desi_likelihood
          BASE_PRIMARY=https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          BASE_MIRROR=https://webdav-hdfs.pic.es/data/public/DESI/DR1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood
          for FN in \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_BGS_BRIGHT-21.5_GCcomb_z0.1-0.4_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.4-0.6_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.6-0.8_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_LRG_GCcomb_z0.8-1.1_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_ELG_LOPnotqso_GCcomb_z1.1-1.6_thetacut0.05.h5 \
            likelihood_spectrum-poles-rotated_syst-rotation-hod-photo_QSO_GCcomb_z0.8-2.1_thetacut0.05.h5
          do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "DESI strawman-control download $FN attempt $attempt"
              for BASE in "$BASE_PRIMARY" "$BASE_MIRROR"; do
                if curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 \
                     --connect-timeout 20 --max-time 240 \
                     -o "desi_likelihood/$FN" "$BASE/$FN"; then
                  ok=1
                  break 2
                fi
              done
              sleep 5
            done
            test "$ok" = 1
          done
          ls -lh desi_likelihood

      - name: Evaluate matched LCDM and deliberately wrong geometry controls
        run: |
          mkdir -p output
          python3 - <<'PY'
          from pathlib import Path
          import sys, math
          import numpy as np
          import pandas as pd
          from scipy.interpolate import interp1d
          from scipy.optimize import minimize
          import camb
          sys.path.insert(0,'desi-kp-cosmological-likelihoods/dr1/cobaya')
          import lsstypes as types
          from cosmoprimo import PowerSpectrumInterpolator1D, PowerSpectrumBAOFilter, Cosmology
          from cosmoprimo.fiducial import DESI
          from velocileptors.EPT.ept_fullresum_varyDz_nu_fftw import REPT
          from desi_fs_bao_all import list_zrange,dataset_fn,get_tracer_label,get_physical_stochastic_settings

          blocks=[]
          for tracer,iz,zrange in list_zrange:
              if 'lya' in tracer.lower(): continue
              fn=dataset_fn('desi_likelihood',tracer,zrange,observable_name='spectrum-poles-rotated')
              d=types.read(fn); sp=d.observable.get('spectrum')
              theory=d.window.theory.get('spectrum')
              kin=np.asarray(theory.get(0).coords('k'),float)
              win=d.window.at.observable.get('spectrum').at.theory.get('spectrum').value()
              blocks.append(dict(tracer=tracer,namespace=f'{get_tracer_label(tracer)}_z{iz}',
                                 zeff=float(sp.attrs['zeff']),data=sp.value(),
                                 precision=np.linalg.inv(d.covariance.value()),
                                 window=win,kin=kin,
                                 shotnoise=float(np.mean(sp.get(0).values('shotnoise')))))
          kobs=blocks[0]['kin']
          zvals=[0.0]+sorted({b['zeff'] for b in blocks})

          starts={'BGS_z0':(1.11348,0.660148,-0.223088),'LRG_z0':(1.1351,-0.139101,-0.910397),
                  'LRG_z1':(1.22446,-0.671727,-0.22624),'LRG_z2':(1.04564,-0.493139,-0.24021),
                  'ELG_z1':(0.127936,-0.578801,-1.45356),'QSO_z0':(0.780983,0.353843,0.135725)}
          fid=DESI(engine='camb')
          all_marg=['alpha0p','alpha2p','alpha4p','alpha6p','sn0p','sn2p','sn4p']
          scales=np.array([12.5]*4+[2.]+[5.]*2)
          marg=['alpha0p','alpha2p','sn0p','sn2p']
          gi=np.array([all_marg.index(x) for x in marg])
          prior_hess=-np.diag(scales[gi]**-2)

          # Same physical LCDM clustering spectrum in every case.
          H0=67.36; h=H0/100.; ob=0.02237; oc=0.1200; ns=0.9649; As=2.10e-9
          fb=ob/(ob+oc); fc=1.-fb
          pars=camb.CAMBparams()
          pars.set_cosmology(H0=H0,ombh2=ob,omch2=oc,mnu=0.,nnu=3.046,TCMB=2.7255,YHe=0.2453,tau=0.0544)
          pars.InitPower.set_params(As=As,ns=ns)
          pars.set_matter_power(redshifts=sorted(zvals,reverse=True),kmax=2.5)
          pars.NonLinear=camb.model.NonLinear_none
          res=camb.get_results(pars)

          def cpk(a,b):
              kh,zout,pk=res.get_linear_matter_power_spectrum(var1=a,var2=b,hubble_units=True,k_hunit=True,nonlinear=False)
              pk=np.asarray(pk)
              if pk.shape==(len(zout),len(kh)): pk=pk.T
              cols=[]
              for z in zvals:
                  j=int(np.argmin(np.abs(np.asarray(zout)-z)))
                  if abs(float(zout[j])-z)>1e-6: raise RuntimeError((z,zout))
                  cols.append(pk[:,j])
              return np.asarray(kh),np.stack(cols,axis=-1)

          kh,Pdd0=cpk('delta_nonu','delta_nonu')
          _,Pcc=cpk('v_newtonian_cdm','v_newtonian_cdm')
          _,Pbb=cpk('v_newtonian_baryon','v_newtonian_baryon')
          _,Pbc=cpk('v_newtonian_baryon','v_newtonian_cdm')
          Ptt0=fb*fb*Pbb+2*fb*fc*Pbc+fc*fc*Pcc
          kin=np.geomspace(min(5e-4,kobs[0]/2),max(1.0,kobs[-1]*2),500)
          def lg(pk):
              return 10**interp1d(np.log10(kh),np.log10(np.maximum(pk,1e-300)),kind='cubic',
                                  fill_value='extrapolate',axis=0,assume_sorted=True)(np.log10(kin))
          Pdd=lg(Pdd0); Ptt=lg(Ptt0)
          pki=PowerSpectrumInterpolator1D(kin,Pdd)
          cosmo=Cosmology(n_s=ns,Omega_b=ob/h**2,Omega_cdm=oc/h**2,Omega_ncdm=0.,H0=H0)
          cosmo.rs_drag=float(res.get_derived_params()['rdrag'])*h
          filt=PowerSpectrumBAOFilter(pki,engine='peakaverage',cosmo=cosmo,cosmo_fid=fid)
          filt(pki,cosmo=cosmo)
          Pnw=filt.smooth_pk_interpolator()(kin)
          sig8=np.asarray(pki.sigma8())
          ptti=PowerSpectrumInterpolator1D(kin,Ptt); fs8=np.asarray(ptti.sigma8())
          pt=REPT(kin,Pdd[:,0],pnw=Pnw[:,0],kmin=kobs[0],kmax=kobs[-1],nk=200,rbao=110,sbao=None,
                  beyond_gauss=True,one_loop=True,shear=True,cutoff=20,jn=5,N=4000,threads=2,
                  extrap_min=-4,extrap_max=3,import_wisdom=False)
          extk=np.append(pt.kv,1.)
          def rg(arr):
              return 10**interp1d(np.log10(kin),np.log10(np.maximum(arr,1e-300)),kind='cubic',
                                  fill_value='extrapolate',axis=0,assume_sorted=True)(np.log10(extk))
          pcb,pnw,ptt=rg(Pdd),rg(Pnw),rg(Ptt)

          # AP-offset amplitudes are copied only as a scale reference from the final SDMC-vs-LCDM
          # geometry difference. Their redshift ordering/sign is then deliberately scrambled.
          # This makes the controls non-SDMC and intentionally devoid of a physical background.
          dpar=np.array([0.00965072,0.01797025,0.02510890,0.03196861,0.04225963,0.04579289])
          dper=np.array([0.00427017,0.00792129,0.01115372,0.01437656,0.01950412,0.02138752])
          signs=np.array([1.,-1.,1.,-1.,1.,-1.])
          # Deterministic null ensemble fixed before this run:
          # 64 exhaustive paired sign patterns + 64 fixed-seed permutation/sign patterns.
          # Each control uses exactly the same multiset of SDMC-sized AP-offset amplitudes.
          controls={}
          for mask in range(64):
              sg=np.array([1. if (mask>>i)&1 else -1. for i in range(6)])
              controls[f'SIGN_{mask:02d}']=(sg*dpar.copy(),sg*dper.copy())
          rng=np.random.default_rng(20260920)
          for ii in range(64):
              perm=rng.permutation(6)
              sg=rng.choice(np.array([-1.,1.]),size=6)
              controls[f'PERM_{ii:02d}']=(sg*dpar[perm],sg*dper[perm])
          case_names=['LCDM_PHYSICAL']+list(controls.keys())

          # physical LCDM AP values for each block, in block order
          physical=[]
          for b in blocks:
              z=b['zeff']
              Hkms=float(res.hubble_parameter(z)); DA=float(res.angular_diameter_distance(z))
              qpar=float(fid.efunc(z)/(Hkms/(100*h)))
              qper=float(DA*h/fid.angular_diameter_distance(z))
              physical.append((qpar,qper))
          print('STRAW_GEOM_PHYSICAL',physical,flush=True)
          print('STRAW_GEOM_DPAR',dpar.tolist(),flush=True)
          print('STRAW_GEOM_DPER',dper.tolist(),flush=True)

          def geometry(case,ib):
              qp,qt=physical[ib]
              if case=='LCDM_PHYSICAL':
                  return qp,qt
              dp,dt=controls[case]
              return qp+float(dp[ib]),qt+float(dt[ib])

          def build_table(b,ib,case):
              z=b['zeff']; iz=zvals.index(z)
              qpar,qper=geometry(case,ib)
              Dz=float(np.sqrt(pcb[-1,iz]/pcb[-1,0]))
              fk=np.sqrt(np.maximum(ptt[:-1,iz]/pcb[:-1,iz],0.))
              pks=pt.compute_redshift_space_power_multipoles_tables(
                  fk,apar=qpar,aperp=qper,ngauss=4,
                  pcb=pcb[:-1,iz],pcb_nw=pnw[:-1,iz],Dz=Dz)[1:]
              basis=np.stack([interp1d(pt.kv,pks[j],kind='cubic',fill_value='extrapolate',
                                      axis=0,assume_sorted=True)(kobs) for j in range(3)],axis=0)
              return dict(basis=basis,sigma8=float(sig8[iz]),fsigma8=float(fs8[iz]),
                          qpar=qpar,qper=qper,Dz=Dz)

          def poles(info,x,settings,sn):
              pkt=info['basis']; sigma8=info['sigma8']; f=info['fsigma8']/sigma8
              b1p,b2p,bsp=x; b1L=b1p/sigma8-1.; b2L=b2p/sigma8**2; bsL=bsp/sigma8**2
              b1=1+b1L; b2=8/21*b1L+b2L; bs=bsL-2/7*b1L; b3=b1L
              G=np.zeros((7,7)); G[0,0]=b1*b1; G[1,0]=G[1,1]=f*b1
              G[2,1]=f*f; G[2,2]=f*b1; G[3,2]=f*f
              for jj,ell in enumerate([0,2,4]):
                  G[jj-3,jj-3]=sn*(settings['fsat'] if ell>0 else 1.)*settings['sigv']**ell
              base=[1,b1,b1*b1,b2,b1*b2,b2*b2,bs,b1*bs,b2*bs,bs*bs,b3,b1*b3]
              pp=np.sum(pkt*np.concatenate([np.asarray(base),G.dot(np.zeros(7))]),axis=-1)
              grad=pkt[...,-7:].dot(G)
              return pp,grad

          rows=[]; totals={}
          for case in case_names:
              total=0.
              print('STRAW_CASE_BEGIN',case,flush=True)
              for ib,b in enumerate(blocks):
                  info=build_table(b,ib,case)
                  settings=get_physical_stochastic_settings(tracer=b['tracer'].upper()[:3])
                  def logp(x):
                      pp,grad=poles(info,x,settings,b['shotnoise'])
                      theory=b['window'].dot(pp.ravel())
                      grad=b['window'].dot(grad[...,gi].reshape(-1,len(gi)))
                      diff=theory-b['data']; pgrad=b['precision'].dot(grad)
                      postgrad=-pgrad.T.dot(diff); likeh=-grad.T.dot(pgrad); posth=prior_hess+likeh
                      dx=-np.linalg.solve(posth,postgrad)
                      val=-.5*diff.T.dot(b['precision']).dot(diff)
                      val+=.5*dx.dot(likeh).dot(dx)+postgrad.dot(dx)+.5*dx.dot(prior_hess).dot(dx)
                      val+=-.5*np.linalg.slogdet(-posth)[1]
                      val+=-.5*(x[1]/5.)**2-.5*(x[2]/5.)**2
                      return float(val)
                  seeds=[
                      np.array(starts[b['namespace']],float),
                      np.array([1.0,0.0,0.0]),
                      np.array([0.55,4.0,-4.0]),
                      np.array([1.8,-4.0,4.0]),
                      np.array([2.6,8.0,-8.0]),
                      np.array([1.4,-10.0,-10.0]),
                  ]
                  trials=[]
                  for iseed,seed in enumerate(seeds):
                      opti=minimize(lambda x:-2*logp(x),seed,method='L-BFGS-B',
                                    bounds=[(0,3),(-20,20),(-20,20)],
                                    options={'maxiter':800,'ftol':1e-11,'gtol':3e-7,'maxls':50})
                      trials.append(opti)
                      print('STRAW_TRIAL',case,b['namespace'],iseed,float(opti.fun),
                            bool(opti.success),[float(v) for v in opti.x],flush=True)
                  finite=[o for o in trials if np.isfinite(o.fun)]
                  opt=min(finite,key=lambda o:o.fun)
                  vals=np.array([float(o.fun) for o in finite])
                  row={'case':case,'namespace':b['namespace'],'chi2_profile':float(opt.fun),
                       'success':bool(opt.success),'start_spread_chi2':float(vals.max()-vals.min()),
                       'b1p':float(opt.x[0]),'b2p':float(opt.x[1]),'bsp':float(opt.x[2]),
                       'sigma8':info['sigma8'],'fsigma8':info['fsigma8'],
                       'qpar':info['qpar'],'qper':info['qper']}
                  rows.append(row); total+=float(opt.fun)
                  print('STRAW_BLOCK',row,flush=True)
              totals[case]=total
              print('STRAW_TOTAL',case,total,flush=True)

          base=totals['LCDM_PHYSICAL']
          summary=[]
          for case in case_names:
              delta=totals[case]-base
              rec={'case':case,'chi2_total':totals[case],'delta_vs_physical_lcdm':delta}
              summary.append(rec)
              print('STRAW_DELTA',rec,flush=True)
          sdf=pd.DataFrame(summary)
          pd.DataFrame(rows).to_csv('output/desi_strawman_geometry_blocks.csv',index=False)
          sdf.to_csv('output/desi_strawman_geometry_summary.csv',index=False)
          null=sdf[sdf['case']!='LCDM_PHYSICAL']['delta_vs_physical_lcdm'].to_numpy(float)
          sdmc_delta=-12.98476687140419
          stats={
              'n_null':int(len(null)),
              'min_delta':float(np.min(null)),
              'p01':float(np.quantile(null,0.01)),
              'p05':float(np.quantile(null,0.05)),
              'median':float(np.median(null)),
              'p95':float(np.quantile(null,0.95)),
              'max_delta':float(np.max(null)),
              'n_better_than_sdmc':int(np.sum(null<=sdmc_delta)),
              'n_better_than_minus10':int(np.sum(null<=-10.0)),
              'n_better_than_minus7p5':int(np.sum(null<=-7.5)),
              'sdmc_reference_delta':sdmc_delta
          }
          print('STRAW_NULL128_SUMMARY',stats,flush=True)
          pd.DataFrame([stats]).to_csv('output/desi_strawman_null128_stats.csv',index=False)
          PY
      - name: Preserve strawman geometry control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-desi-strawman-null128-control
          path: output/*
          if-no-files-found: warn
