name: SDMC late300 DES-Y3 IA sensitivity
on:
  push:
    branches: [sdmc-late300-weyl-ia-sensitivity]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy
      - name: Download native-Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}" --name late300-desy3-native-weyl-tomography --dir output
          test -d output/weyl_spectra
      - name: Download DES-Y3 public data
        run: |
          rm -rf des_y3_data
          git clone --depth 1 https://github.com/handley-lab/des_y3_data.git
          cd des_y3_data && git lfs pull || true
          cd ..
      - name: Run IA sensitivity profile
        run: |
          python3 sdmc/run_late300_weyl_ia_sensitivity.py | tee output/weyl_ia_sensitivity.log
          cat output/weyl_ia_sensitivity/ia_sensitivity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late300-desy3-ia-sensitivity
          path: |
            output/weyl_ia_sensitivity/*
            output/weyl_ia_sensitivity.log
