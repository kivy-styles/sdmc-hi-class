name: SDMC r032 partial-equality local010 full Plik

on:
  push:
    branches:
      - sdmc-r032-partial-zeq-local010-fullplik
  workflow_dispatch:

jobs:
  negative-screen-fullplik:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy pandas cobaya iminuit

      - name: Apply SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py

      - name: Build hi_class
        run: make -j2 class

      - name: Install Planck likelihood data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE import TTTEEE
          from cobaya.likelihoods.planck_2018_lowl.TT import TT
          from cobaya.likelihoods.planck_2018_lowl.EE import EE
          from cobaya.likelihoods.planck_2018_lensing import native as LensingNative
          if not TTTEEE.install(path='planck_full',no_progress_bars=True):
              raise SystemExit('full Plik install failed')
          for cls in (TT,EE,LensingNative):
              if not cls.install(path='planck_packages',no_progress_bars=True):
                  raise SystemExit(f'Planck install failed: {cls}')
          print('APHYS_PLANCK_DATA_READY')
          PY

      - name: Run full Plik profiles
        run: python3 sdmc/run_r032_partial_zeq_local010_fullplik.py

      - name: Print summary
        if: always()
        run: |
          if [ -f output/partial_zeq_local010_fullplik/partial_zeq_local010_fullplik_summary.json ]; then
            cat output/partial_zeq_local010_fullplik/partial_zeq_local010_fullplik_summary.json
          fi
          if [ -f output/partial_zeq_local010_fullplik/partial_zeq_local010_fullplik.csv ]; then
            cat output/partial_zeq_local010_fullplik/partial_zeq_local010_fullplik.csv
          fi

      - name: Preserve outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-r032-partial-zeq-local010-fullplik
          path: |
            output/partial_zeq_local010_fullplik/partial_zeq_local010_fullplik_summary.json
            output/partial_zeq_local010_fullplik/partial_zeq_local010_fullplik.csv
            output/partial_zeq_local010_fullplik/*.ini
          if-no-files-found: warn
