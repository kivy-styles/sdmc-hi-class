name: SDMC late300 lambda non-circularity audit

on:
  push:
    branches: [sdmc-late300-lambda-noncircularity]
    paths:
      - '.github/workflows/sdmc_late300_lambda_noncircularity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        lambda_e: [14.0, 16.0, 18.0, 18.40625, 20.0, 22.0]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build derived structural bundle
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential >/dev/null
          python3 -m pip install numpy scipy >/dev/null
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py
          python3 sdmc/apply_sdmc_v3_native_noslip_patch.py
          python3 sdmc/run_sdmc_cs2_term_audit.py instrument
          python3 sdmc/install_sdmc_v3_independent_kinetic.py
          python3 sdmc/patch_F_only_force_center.py
          make clean >/dev/null && make -j2 class >/dev/null
      - name: Run lambda perturbation
        run: |
          mkdir -p output
          cat > output/test.ini <<EOF
          H0 = 69.71482083084993
          omega_b = 0.022083219194622913
          omega_cdm = 0.12299536722293603
          N_ncdm = 0
          N_ur = 3.046
          T_cmb = 2.7255
          YHe = 0.2453
          A_s = 2.1047019076951746e-09
          n_s = 0.9628416801318527
          tau_reio = 0.053167105823755265
          Omega_Lambda = 0
          Omega_fld = 3.1443554e-8
          fluid_equation_of_state = SDMC_TRACKER
          cs2_fld = 0.003
          use_ppf = no
          Omega_smg = -1
          gravity_model = sdmc_v3_independent_kinetic
          parameters_smg = 0.02052, 4.034077502899133, 0.32925377073762596, 0.3419932122356156, 1.0, 0.05181542627513409
          expansion_model = sdmc_full
          expansion_smg = 0.7014079815036496, ${{ matrix.lambda_e }}, 16.742289660253434, 0.5, 0.024822032167576252, 0.25, 0.01264704344701022, 1.5
          pert_initial_conditions_smg = zero
          method_qs_smg = fully_dynamic
          a_ini_over_a_today_default = 1.e-8
          a_ini_test_qs_smg = 1.e-8
          pert_ic_ini_z_ref_smg = 5.e7
          a_min_stability_test_smg = 1.e-8
          output_background_smg = 3
          modes = s
          output = mPk
          P_k_max_h/Mpc = 0.02
          z_pk = 0
          write background = yes
          root = output/test_
          format = class
          input_verbose = 0
          background_verbose = 0
          perturbations_verbose = 0
          output_verbose = 0
          EOF
          set +e
          ./class output/test.ini > output/test.log 2>&1
          rc=$?
          set -e
          echo "$rc" > output/test.rc
      - name: Infer asymptotic tracker slope
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,math,numpy as np
          rc=int(Path("output/test.rc").read_text())
          out={"input_lambda":float("${{ matrix.lambda_e }}"),"returncode":rc}
          p=Path("output/test_00_background.dat")
          if p.exists():
              ls=p.read_text().splitlines()
              hdr=[x for x in ls if x.startswith("#") and re.search(r"(?:^|\s)1\s*:",x)][-1].lstrip("#").strip()
              ms=list(re.finditer(r"(\d+)\s*:\s*",hdr)); names=[]
              for i,m in enumerate(ms):
                  e=ms[i+1].start() if i+1<len(ms) else len(hdr)
                  names.append(hdr[m.end():e].strip())
              a=np.loadtxt(p); d={n:a[:,i] for i,n in enumerate(names)}
              z=np.asarray(d["z"],float)
              rt=np.asarray(d["(.)rho_tot"],float)
              rs=np.asarray(d["(.)rho_smg"],float)
              rf=np.asarray(d["(.)rho_fld"],float)
              frac=(rs+rf)/rt
              m=(z>=1e7)&(z<=5e7)&np.isfinite(frac)&(frac>0)
              if np.sum(m):
                  om=float(np.median(frac[m]))
                  linf=math.sqrt(4/om)
                  out.update({"Omega_struct_median":om,"lambda_inferred":linf,
                              "fixed_point_residual":linf-out["input_lambda"],
                              "n":int(np.sum(m))})
          Path("output/lambda_noncircularity.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("LAMBDA_NONCIRCULARITY",json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lambda-noncircularity-${{ matrix.lambda_e }}
          path: |
            output/lambda_noncircularity.json
            output/test.log
          if-no-files-found: warn
