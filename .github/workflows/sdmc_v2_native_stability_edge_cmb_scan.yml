name: SDMC v2 native stability-edge CMB scan

on:
  push:
    branches:
      - sdmc-boltzmann
  workflow_dispatch:

jobs:
  stability-edge-cmb:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cobaya scipy

      - name: Apply frozen SDMC patches
        run: |
          python3 sdmc/apply_sdmc_tracker_patch.py
          python3 sdmc/apply_sdmc_full_background_patch.py
          python3 sdmc/apply_sdmc_v2_noslip_patch.py
          python3 sdmc/apply_sdmc_v2_smooth_noslip_patch.py
          python3 sdmc/apply_sdmc_split_sector_patch.py
          python3 sdmc/fix_sdmc_split_sector_background.py
          python3 sdmc/fix_parameterized_alphaM_refresh.py

      - name: Reuse native-exact No-Slip experimental patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          lines=Path('.github/workflows/sdmc_v2_native_noslip_scan.yml').read_text().splitlines()
          marker='- name: Add native-exact No-Slip profile family'
          i=next(i for i,x in enumerate(lines) if marker in x)
          h=next(i for i in range(i+1,len(lines)) if "python3 - <<'PY'" in lines[i])
          j=next(i for i in range(h+1,len(lines)) if lines[i].strip()=='PY')
          code=textwrap.dedent('\n'.join(lines[h+1:j]))
          exec(compile(code,'native_patch','exec'),{})
          PY

      - name: Build hi_class
        run: make -j2 class

      - name: Install native Planck 2018 Plik-lite data
        run: |
          python3 - <<'PY'
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native
          ok=TTTEEE_lite_native.install(path='planck_packages',no_progress_bars=True)
          if not ok:
              raise SystemExit('Planck Plik-lite install failed')
          PY

      - name: Scan the native-stable transition edge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, glob, math, os, subprocess, textwrap
          import numpy as np
          from scipy.optimize import minimize_scalar
          from cobaya.likelihoods.planck_2018_highl_plik.TTTEEE_lite_native import TTTEEE_lite_native

          TCMB=2.7255
          CAL_SIGMA=0.0025
          AS=math.exp(3.076)/1e10
          NS=0.964
          OUT=Path('output/v2_native_stability_edge_cmb')
          OUT.mkdir(parents=True,exist_ok=True)

          widths=[1.41,1.45,1.50,1.55,1.60]
          candidates=[]
          # Dense local block around the current best (0.074,5.5,1.6).
          for A in [0.072,0.073,0.074,0.075,0.076]:
              for zc in [5.0,5.5,6.0,6.5]:
                  for w in widths:
                      candidates.append((A,zc,w))
          # Preserve the two strongest shoulders from the previous coarse CMB ranking.
          for A,zc in [(0.071,7.0),(0.071,8.0),(0.077,7.0),(0.080,8.0)]:
              for w in widths:
                  candidates.append((A,zc,w))

          lik=TTTEEE_lite_native(packages_path='planck_packages')

          def ini_text(A,zc,w,root,full=False):
              extras=('output = tCl,pCl,lCl,mPk\nP_k_max_h/Mpc = 2.0\nz_pk = 0,0.5,1,2,3,5,10\nwrite thermodynamics = yes\nwrite parameters = yes\n' if full else 'output = tCl,pCl,lCl\nwrite thermodynamics = no\nwrite parameters = no\n')
              return textwrap.dedent(f'''\
              H0 = 70.8514
              omega_b = 0.02239952
              omega_cdm = 0.12444227328918850
              N_ncdm = 0
              N_ur = 3.046
              T_cmb = 2.7255
              YHe = 0.2453
              A_s = {AS:.14e}
              n_s = {NS:.9f}
              tau_reio = 0.0544
              Omega_Lambda = 0
              Omega_fld = 3.1443554e-8
              fluid_equation_of_state = SDMC_TRACKER
              cs2_fld = 0.003
              use_ppf = no
              Omega_smg = -1
              gravity_model = sdmc_v2_native_noslip
              parameters_smg = {A:.12g}, {zc:.12g}, {w:.12g}, 0.1, 0.0001
              expansion_model = sdmc_full
              expansion_smg = 0.7073985893, 20.0, 21.10, 0.5, 0.01105624999, 0.25, 0.01951933685, 1.5
              pert_initial_conditions_smg = zero
              method_qs_smg = fully_dynamic
              output_background_smg = 1
              {extras}modes = s
              lensing = yes
              l_max_scalars = 3000
              write background = yes
              root = {root}
              format = class
              input_verbose = 0
              background_verbose = 0
              thermodynamics_verbose = 0
              perturbations_verbose = 0
              spectra_verbose = 0
              lensing_verbose = 0
              output_verbose = 0
              ''')

          def load_cl(path):
              a=np.loadtxt(path)
              conv=(TCMB*1e6)**2
              return np.column_stack([a[:,0],a[:,1]*conv,a[:,3]*conv,a[:,2]*conv])

          def score(cl):
              def like(A): return float(lik.chi_squared(cl,A_planck=float(A)))
              def total(A):
                  A=float(A)
                  return like(A)+((A-1.0)/CAL_SIGMA)**2
              opt=minimize_scalar(total,bounds=(0.96,1.04),method='bounded',options={'xatol':1e-10})
              A=float(opt.x); c_like=like(A); c_prior=((A-1.0)/CAL_SIGMA)**2
              return A,c_like,c_prior,c_like+c_prior

          rows=[]; best=None
          for i,(A,zc,w) in enumerate(candidates,1):
              stem=f'edge_{i:03d}'
              root=str(OUT/(stem+'_'))
              ini=OUT/(stem+'.ini')
              ini.write_text(ini_text(A,zc,w,root,False))
              cp=subprocess.run(['./class',str(ini)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=240)
              cl=Path(root+'00_cl_lensed.dat')
              if cp.returncode!=0 or not cl.exists():
                  row={'A_F':A,'z_c':zc,'width':w,'status':'FAIL','A_planck':'','chi2_like':'','chi2_cal_prior':'','chi2_total':'','error':cp.stdout[-1500:]}
                  print('EDGE_FAIL',A,zc,w,cp.returncode,flush=True)
              else:
                  Acal,clike,cprior,ctot=score(load_cl(cl))
                  row={'A_F':A,'z_c':zc,'width':w,'status':'OK','A_planck':Acal,'chi2_like':clike,'chi2_cal_prior':cprior,'chi2_total':ctot,'error':''}
                  print(f'EDGE_CMB A={A:.3f} zc={zc:g} w={w:g} chi2={ctot:.6f} Acal={Acal:.8f}',flush=True)
                  if best is None or ctot<best['chi2_total']:
                      best=dict(row)
                      (OUT/'best_grid_cl_lensed.dat').write_bytes(cl.read_bytes())
              rows.append(row)
              for p in glob.glob(root+'*'):
                  try: os.remove(p)
                  except OSError: pass
              try: ini.unlink()
              except OSError: pass

          fields=['A_F','z_c','width','status','A_planck','chi2_like','chi2_cal_prior','chi2_total','error']
          with (OUT/'sdmc_v2_native_stability_edge_scan.csv').open('w',newline='') as f:
              wr=csv.DictWriter(f,fieldnames=fields); wr.writeheader(); wr.writerows(rows)
          if best is None:
              raise SystemExit('No full native-stable edge candidate survived')
          with (OUT/'sdmc_v2_native_stability_edge_best.csv').open('w',newline='') as f:
              wr=csv.DictWriter(f,fieldnames=fields); wr.writeheader(); wr.writerow(best)

          root='output/sdmc_v2_native_stability_edge_best_'
          Path('output/sdmc_v2_native_stability_edge_best.ini').write_text(ini_text(float(best['A_F']),float(best['z_c']),float(best['width']),root,True))
          cp=subprocess.run(['./class','output/sdmc_v2_native_stability_edge_best.ini'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=300)
          Path('output/sdmc_v2_native_stability_edge_best.log').write_text(cp.stdout)
          if cp.returncode:
              raise SystemExit(cp.returncode)
          print('BEST_NATIVE_V2_STABILITY_EDGE',best,flush=True)
          PY

      - name: Generate matched LCDM reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('sdmc/config/planck_lcdm_control.ini').read_text()
          p=re.sub(r'(?m)^\s*A_s\s*=.*$',f'A_s = {math.exp(3.044)/1e10:.14e}',p)
          p=re.sub(r'(?m)^\s*n_s\s*=.*$','n_s = 0.961',p)
          p=re.sub(r'(?m)^\s*root\s*=.*$','root = output/sdmc_planck_lcdm_stability_edge_reference_',p)
          Path('output/sdmc_planck_lcdm_stability_edge_reference.ini').write_text(p)
          PY
          ./class output/sdmc_planck_lcdm_stability_edge_reference.ini

      - name: Evaluate final high-l comparison
        run: |
          python3 sdmc/evaluate_planck_pliklite.py \
            --packages planck_packages \
            --output output/sdmc_v2_native_stability_edge_pliklite.csv \
            LCDM_profile_reference=output/sdmc_planck_lcdm_stability_edge_reference_00_cl_lensed.dat \
            V2_native_stability_edge_best=output/sdmc_v2_native_stability_edge_best_00_cl_lensed.dat

      - name: Preserve stability-edge CMB outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmc-v2-native-stability-edge-cmb
          path: |
            output/v2_native_stability_edge_cmb/sdmc_v2_native_stability_edge_scan.csv
            output/v2_native_stability_edge_cmb/sdmc_v2_native_stability_edge_best.csv
            output/v2_native_stability_edge_cmb/best_grid_cl_lensed.dat
            output/sdmc_v2_native_stability_edge_best.ini
            output/sdmc_v2_native_stability_edge_best.log
            output/sdmc_v2_native_stability_edge_best_*
            output/sdmc_planck_lcdm_stability_edge_reference_00_cl_lensed.dat
            output/sdmc_v2_native_stability_edge_pliklite.csv
          if-no-files-found: warn
