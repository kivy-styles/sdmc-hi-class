name: SDMC D044P045-A034 official DESI promotion

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desi:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replay audited D044 DESI workflow with A034 primordial coordinates
        run: |
          python3 -m pip install -q pyyaml
          git fetch --depth=1 origin sdmc-discussion-s117-g073-d044p045-exact-desi
          git show FETCH_HEAD:.github/workflows/sdmc_r032_edge024_qbest_covariant_desi.yml > /tmp/d044_desi.yml
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, yaml
          p=Path("/tmp/d044_desi.yml")
          s=p.read_text()
          s=s.replace("A_s = 2.117602412937069e-9","A_s = 2.1047019076951746e-9")
          s=s.replace("n_s = 0.9625227132590487","n_s = 0.9628416801318527")
          s=s.replace("tau_reio = 0.055202901571989066","tau_reio = 0.053167105823755265")
          data=yaml.safe_load(s)
          steps=data["jobs"]["acoustic-physical-desi"]["steps"]
          for step in steps:
              script=step.get("run")
              if not script:
                  continue
              env=os.environ.copy()
              for k,v in (step.get("env") or {}).items():
                  env[str(k)]=str(v)
              name=step.get("name","unnamed")
              print(f"=== REPLAY STEP: {name} ===",flush=True)
              subprocess.run(["bash","-lc",script],check=True,env=env)
          PY

      - name: Print DESI result
        if: always()
        run: |
          cat output/desi_dr1_fs_summary.csv || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmc-d044p045-a034-exact-desi
          path: |
            output/desi_dr1_fs_profile.csv
            output/desi_dr1_fs_summary.csv
            output/desi_cov_00_background.dat
            output/desi_cov_00_thermodynamics.dat
            output/desi_cov_00_z*_pk.dat
          if-no-files-found: warn
