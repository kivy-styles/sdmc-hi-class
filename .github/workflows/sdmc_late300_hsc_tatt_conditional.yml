name: SDMC HSC conditional TATT diagnostic

on:
  push:
    branches: [sdmc-late300-hsc-tatt-conditional]
    paths:
      - 'sdmc/run_late300_hsc_tatt_conditional.py'
      - '.github/workflows/sdmc_late300_hsc_tatt_conditional.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  conditional-tatt:
    strategy:
      fail-fast: false
      matrix:
        model: [late300, local021]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs
          git lfs install
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy astropy sacc
          python3 -m pip install "git+https://github.com/joezuntz/FAST-PT/"
      - name: Recover exact linear Weyl spectra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh run download 37587199009 --repo "${{ github.repository }}" --name late300-desy3-native-weyl-tomography --dir output
      - name: Recover corrected ReACT bracket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/react_dense
          gh run download 37604828408 --repo "${{ github.repository }}" --name late300-react-exact-bracket --dir output/react_dense
      - name: Recover completed NLA-z optimum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "output/nla_best/${{ matrix.model }}"
          if [ "${{ matrix.model }}" = "late300" ]; then
            gh run download 37631035746 --repo "${{ github.repository }}" --name hsc-react-full-late300-us_native-retry --dir "output/nla_best/late300"
          else
            gh run download 37615217739 --repo "${{ github.repository }}" --name hsc-react-full-local021-us_native --dir "output/nla_best/local021"
          fi
      - name: Download HSC-Y3 public products
        run: |
          rm -rf cosmosis-standard-library
          git clone --depth 1 https://github.com/cosmosis-developers/cosmosis-standard-library.git
          cd cosmosis-standard-library && git lfs pull || true
          cd ..
      - name: Optimize only new TATT coordinates
        run: |
          python3 sdmc/run_late300_hsc_tatt_conditional.py "${{ matrix.model }}" | tee "output/tatt_conditional_${{ matrix.model }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsc-tatt-conditional-${{ matrix.model }}
          path: |
            output/hsc_tatt_conditional/*
            output/tatt_conditional_${{ matrix.model }}.log
          if-no-files-found: warn
